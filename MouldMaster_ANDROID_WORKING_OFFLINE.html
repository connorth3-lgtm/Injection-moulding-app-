<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08101d">
  <meta name="description" content="A guided injection moulding learning platform from beginner to expert.">
  <title>MouldMaster Academy — Android Offline Edition</title>
  <style>

:root{
  --bg:#07101c;--bg2:#0a1423;--panel:#101c2f;--panel2:#14233a;--line:#283b59;
  --text:#edf5ff;--muted:#98acc9;--accent:#55d6be;--accent2:#69a8ff;
  --good:#7ce6a3;--warn:#ffd166;--bad:#ff7b7b;--ink:#07131b;--shadow:0 18px 46px rgba(0,0,0,.24)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 70% -10%,#172c48 0,transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(6,14,25,.96);border-right:1px solid var(--line);padding:18px 14px;z-index:4}
.brand{display:flex;gap:11px;align-items:center;padding:4px 7px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);display:grid;place-items:center;font-weight:900}
.brand strong{display:block;font-size:17px}.brand small{color:var(--muted)}
.profile-mini{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0c1829;margin-bottom:13px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#1c304d;color:#dbeaff;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tiny{font-size:12px}.muted{color:var(--muted)}
nav{display:grid;gap:3px}
nav button{border:0;background:transparent;color:#bfd0e6;border-radius:10px;padding:10px 11px;text-align:left;display:flex;gap:11px;align-items:center}
nav button:hover,nav button.active{background:#15243a;color:#fff}
.sidebar-foot{margin-top:18px;padding:12px 7px;color:var(--muted)}
.bar{height:7px;background:#21324a;border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.main{padding:25px clamp(16px,3vw,38px) 60px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}
.topbar h1{font-size:30px;margin:0}.topbar p{margin:5px 0 0;color:var(--muted)}
.top-actions{display:flex;gap:9px}
.primary,.secondary,.ghost,.danger{border-radius:10px;padding:10px 14px;border:1px solid transparent}
.primary{background:linear-gradient(135deg,var(--accent),#80e7cf);color:var(--ink);font-weight:800}
.secondary{background:#1a2b45;color:#f2f7ff;border-color:#314865}
.ghost{background:transparent;color:#bfd0e7;border-color:#314865}
.danger{background:#3a1d26;color:#ffc4c4;border-color:#653242}
.card{background:linear-gradient(180deg,rgba(19,33,54,.96),rgba(13,25,43,.96));border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:16px}
.hero-main{padding:28px;min-height:270px;position:relative;overflow:hidden}
.hero-main:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(85,214,190,.22),transparent 68%);right:-90px;top:-100px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.hero-main h2{font-size:34px;line-height:1.12;max-width:760px;margin:9px 0 11px}
.hero-main p{color:#b3c5dc;line-height:1.65;max-width:790px}
.hero-buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.statbox{padding:20px}.statline{padding:14px 0;border-bottom:1px solid #263954}.statline:last-child{border-bottom:0}
.statline b{display:block;font-size:28px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:24px;margin-top:6px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:27px 0 12px}.section-head h2,.section-head h3{margin:0}.section-head p{color:var(--muted);margin:5px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.course-card{padding:18px;min-height:245px;display:flex;flex-direction:column}
.course-card h3{font-size:18px;margin:8px 0}.course-card p{font-size:13px;color:var(--muted);line-height:1.55;flex:1}
.pill{display:inline-flex;width:max-content;align-items:center;padding:5px 8px;border-radius:999px;background:#172b47;color:#bad1ec;font-size:11px}
.course-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.mini-bar{height:6px;background:#22344d;border-radius:99px;overflow:hidden;margin-top:11px}.mini-bar span{display:block;height:100%;background:var(--accent)}
.learning-map{display:grid;gap:10px}
.track-row{padding:16px;display:grid;grid-template-columns:165px 1fr 160px;gap:16px;align-items:center}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.lesson-body{padding:26px}.lesson-body h2{font-size:30px;margin:7px 0 12px}.lesson-body h3{margin-top:27px}.lesson-body p,.lesson-body li{color:#c6d5e7;line-height:1.72}
.callout{background:#10263a;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:18px 0;color:#d5ece7}
.lesson-side{padding:18px;position:sticky;top:18px;height:max-content}
.lesson-list{display:grid;gap:6px;max-height:500px;overflow:auto;margin-top:12px}
.lesson-list button{border:1px solid transparent;background:#101f34;color:#bcd0e8;border-radius:9px;padding:9px;text-align:left;font-size:12px}
.lesson-list button.active{border-color:#4c6f98;background:#19304e;color:#fff}
.note-area{width:100%;min-height:90px;margin-top:8px;background:#0b1728;border:1px solid #304562;border-radius:9px;color:#fff;padding:10px;resize:vertical}
.visual-wrap{padding:22px}
.machine-scene{height:310px;position:relative;background:linear-gradient(180deg,#0b1728,#0f2035);border:1px solid #2c4465;border-radius:16px;overflow:hidden}
.barrel{position:absolute;left:8%;top:42%;width:48%;height:58px;background:#354965;border-radius:8px;border:4px solid #5a6f8e}
.screw{position:absolute;left:10%;top:49%;width:44%;height:20px;background:repeating-linear-gradient(135deg,#9db0c7 0 8px,#596d87 8px 15px);border-radius:10px;animation:screwSpin 1.2s linear infinite}
.nozzle{position:absolute;left:55%;top:49%;width:10%;height:22px;background:#6b7e96;clip-path:polygon(0 0,100% 30%,100% 70%,0 100%)}
.mould{position:absolute;left:66%;top:26%;width:25%;height:150px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mould>div{background:#38506e;border:4px solid #667e9f;border-radius:5px}
.cavity{position:absolute;left:74%;top:45%;width:9%;height:52px;border-radius:40% 40% 25% 25%;background:var(--accent);opacity:.85;transform:scale(.2);animation:fillCavity 5s ease-in-out infinite}
.flow-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffc857;top:51%;left:54%;animation:flow 5s linear infinite}
@keyframes screwSpin{50%{transform:translateX(-5px)}}
@keyframes fillCavity{0%,20%{transform:scale(.15);opacity:.3}45%,75%{transform:scale(1);opacity:.9}90%,100%{transform:scale(.85);opacity:.65}}
@keyframes flow{0%,20%{left:54%;opacity:0}30%{opacity:1}55%{left:78%;opacity:1}70%,100%{left:78%;opacity:0}}
.phase-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.phase-tabs button{padding:8px 10px;border-radius:999px;border:1px solid #34506f;background:#14243a;color:#c8d8ea}
.form-card{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
label{font-size:12px;color:#b5c6db} input,select,textarea{width:100%;margin-top:5px;background:#0c1728;border:1px solid #304562;color:#fff;border-radius:9px;padding:10px}
.range-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}
.range-row input[type=range]{padding:0}
.output-panel{padding:18px}.risk{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.riskbar{height:9px;background:#22344e;border-radius:99px;overflow:hidden}.riskbar span{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}
.part-visual{height:220px;border-radius:14px;background:#0c182a;display:grid;place-items:center;border:1px solid #2a4161;position:relative;overflow:hidden}
.part-shape{width:150px;height:110px;border-radius:20px 20px 30px 30px;background:#5bcfb8;box-shadow:inset 0 0 25px rgba(0,0,0,.25);position:relative}
.part-shape:before{content:"";position:absolute;width:52px;height:35px;border-radius:50%;background:#0c182a;left:49px;top:36px}
.defect-overlay{position:absolute;inset:0;pointer-events:none}
.defect-card{padding:17px}.defect-card h3{margin:8px 0}.defect-card p{font-size:13px;color:var(--muted);line-height:1.55}
.cause-list{display:grid;gap:7px}.cause{padding:9px;background:#102037;border-radius:8px;font-size:12px}
.scenario{padding:18px}.scenario p{color:#bfd0e4;line-height:1.6}.choice{display:block;width:100%;text-align:left;border:1px solid #34506f;background:#11223a;color:#e5effb;border-radius:9px;padding:10px;margin:8px 0}
.choice:hover{background:#19304d}.feedback{padding:11px;border-radius:9px;margin-top:10px;background:#0e2631}
.chat{padding:18px}.chat-log{height:390px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:78%;padding:11px 13px;border-radius:13px;line-height:1.5;font-size:14px}
.msg.user{align-self:flex-end;background:#21466a}.msg.bot{align-self:flex-start;background:#11233a;border:1px solid #29425f}
.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.exam-card{padding:18px}.question{padding:13px;background:#0f1e33;border-radius:10px;margin:12px 0}.option{display:block;padding:8px 9px;border:1px solid #2f4868;border-radius:8px;margin:7px 0}
.cert{padding:28px;text-align:center;min-height:300px}.cert h2{font-size:30px}.seal{width:82px;height:82px;border:5px double var(--accent);border-radius:50%;display:grid;place-items:center;margin:16px auto;color:var(--accent);font-weight:900}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #263a57;font-size:13px}.table th{color:#8fa8c8}
.glossary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.term{padding:14px}.term b{color:var(--accent)}.term p{font-size:13px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:grid;place-items:center;padding:18px}.modal-card{width:min(900px,96vw);max-height:88vh;overflow:auto;background:#0e1b2e;border:1px solid #34506f;border-radius:16px;padding:22px;position:relative}.modal-close{position:absolute;right:10px;top:8px;background:transparent;color:#fff;border:0;font-size:28px}
.toast{position:fixed;right:20px;bottom:20px;background:#102c2b;border:1px solid #285d58;color:#dcfff5;border-radius:10px;padding:11px 14px;z-index:30}
.search-results{display:grid;gap:8px}.search-item{padding:10px;border:1px solid #304764;border-radius:9px;background:#101f34}
@media(max-width:1100px){#app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.sidebar nav{grid-template-columns:repeat(3,1fr)}.hero,.lesson-layout{grid-template-columns:1fr}.lesson-side{position:static}.grid{grid-template-columns:repeat(2,1fr)}.kpis,.grid4{grid-template-columns:repeat(2,1fr)}.track-row{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.main{padding:16px}.sidebar nav{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.grid,.grid2,.kpis,.grid4,.glossary-grid,.form-grid{grid-template-columns:1fr}.hero-main h2{font-size:27px}.machine-scene{height:240px}.barrel{left:3%;width:50%}.mould{left:65%;width:30%}}
@media print{.sidebar,.topbar,.no-print{display:none!important}#app{display:block}.main{padding:0}.cert{border:8px double #333;color:#111;background:white;box-shadow:none}.cert *{color:#111!important}}


/* ---------- Friendly Edition UX ---------- */
:focus-visible{outline:3px solid #8fdccc;outline-offset:3px}
.skip-link{position:fixed;left:14px;top:-60px;z-index:100;background:#fff;color:#07131b;padding:10px 14px;border-radius:8px;font-weight:800}
.skip-link:focus{top:14px}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#6f87aa;padding:14px 11px 4px}
.more-nav{margin-top:8px;border-top:1px solid #21344e;padding-top:8px}
.more-nav summary{cursor:pointer;color:#91a8c5;font-size:12px;padding:10px 11px;border-radius:9px;user-select:none}
.more-nav summary:hover{background:#112038;color:#fff}
.more-nav button{width:100%}
.mobile-nav{display:none}
.friendly-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:16px}
.next-step{padding:26px;position:relative;overflow:hidden}
.next-step:after{content:"";position:absolute;right:-80px;top:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(85,214,190,.18),transparent 68%);pointer-events:none}
.next-step h2{font-size:31px;line-height:1.15;margin:9px 0 9px;max-width:760px}
.next-step p{max-width:760px;color:#b9cbe1;line-height:1.65}
.progress-card{padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.progress-ring{--p:0;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#233650 0);position:relative;margin:4px auto 12px}
.progress-ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:#0f1c2f}
.progress-ring strong{position:relative;font-size:28px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick-action{padding:17px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#14243a,#0f1c2e);color:var(--text);border-radius:15px;min-height:135px}
.quick-action:hover{transform:translateY(-2px);border-color:#46688e}
.quick-action .icon{font-size:24px;display:block;margin-bottom:14px}
.quick-action b{display:block;margin-bottom:5px}.quick-action small{color:var(--muted);line-height:1.45}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how-card{padding:18px}.step-num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#193854;color:#bff6e9;font-weight:900;margin-bottom:10px}
.track-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.status-dot{width:9px;height:9px;border-radius:50%;background:#425a78}.status-dot.done{background:var(--good)}.status-dot.active{background:var(--accent)}
.lesson-breadcrumb{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:13px;flex-wrap:wrap}
.lesson-breadcrumb button{border:0;background:transparent;color:#bad2ef;padding:0}
.lesson-header-card{padding:22px;margin-bottom:14px}
.lesson-header-card h2{font-size:31px;margin:7px 0 8px}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.content-block{padding:18px;border:1px solid #2a405f;border-radius:13px;background:#0e1c30;margin:12px 0}
.content-block h3{margin:0 0 9px;font-size:17px}.content-block p:last-child{margin-bottom:0}
.lesson-actions-sticky{position:sticky;bottom:12px;z-index:3;padding:10px;border:1px solid #315071;border-radius:13px;background:rgba(11,24,40,.94);backdrop-filter:blur(10px);display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.onboarding{padding:4px}
.onboarding h2{font-size:30px;margin:7px 0 8px}.onboarding p{color:var(--muted);line-height:1.6}
.choice-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.choice-card{border:1px solid #304966;border-radius:12px;background:#101f34;color:#dbe9f8;padding:14px;text-align:left}
.choice-card input{width:auto;margin:0 7px 0 0}
.choice-card:has(input:checked){border-color:var(--accent);background:#13302f}
.daily-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.daily-select label{border:1px solid #304966;border-radius:10px;padding:10px;background:#101f34;text-align:center}
.daily-select input{width:auto;margin:0 5px 0 0}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:#142337;border:1px solid #29425f;color:#bfd0e4;font-size:13px;line-height:1.5}
.empty-friendly{text-align:center;padding:30px}.empty-friendly .big-icon{font-size:40px;margin-bottom:8px}
@media(max-width:1100px){
  .friendly-hero{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
  body{padding-bottom:74px}
  .sidebar{display:none}
  #app{display:block}
  .mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(7,16,28,.97);border-top:1px solid var(--line);padding:7px 6px max(7px,env(safe-area-inset-bottom))}
  .mobile-nav button{border:0;background:transparent;color:#98acc9;padding:5px;border-radius:9px;display:grid;gap:2px;place-items:center;font-size:18px}
  .mobile-nav button span{font-size:10px}
  .mobile-nav button.active{color:#fff;background:#142740}
  .quick-grid,.how-grid,.choice-cards,.daily-select{grid-template-columns:1fr}
  .next-step{padding:20px}.next-step h2{font-size:25px}
  .lesson-header-card h2{font-size:25px}
  .lesson-actions-sticky{bottom:78px;display:grid;grid-template-columns:1fr 1fr}
  .lesson-actions-sticky .primary{grid-column:1/-1}
  .topbar{position:sticky;top:0;z-index:8;background:rgba(7,16,28,.94);backdrop-filter:blur(10px);padding:8px 0 10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- UK / US / NZ standards layer ---------- */
.region-switch{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.region-switch button{border:1px solid #34506f;background:#11223a;color:#c7d8ea;border-radius:999px;padding:8px 11px}
.region-switch button.active{background:#173c3a;border-color:var(--accent);color:#e9fffa}
.standard-card{padding:18px}.standard-card h3{margin:7px 0}.standard-card p{color:var(--muted);line-height:1.55}
.standard-link{display:inline-block;margin-top:7px;color:#a9d8ff;text-decoration:none}.standard-link:hover{text-decoration:underline}
.region-banner{padding:12px 14px;border:1px solid #315071;border-radius:11px;background:#102238;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.answer-review{display:grid;gap:9px;margin-top:14px}.answer-row{padding:11px;border:1px solid #2b4260;border-radius:9px;background:#0d1c30}.answer-row.correct{border-color:#326c5f}.answer-row.incorrect{border-color:#71414b}
.ref{font-size:11px;color:#86a8ca;margin-top:6px}.legal-note{padding:14px;border-radius:11px;background:#2a2412;border:1px solid #66592b;color:#f7e8ad;line-height:1.5}


/* =========================================================
   Engaging Edition — presentation only.
   Audited question/answer data remains unchanged.
   ========================================================= */
:root{
  --xp:#ffd166;
  --violet:#a88cff;
}
button,.card,.quick-action,.course-card,.choice,.option{
  transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.primary:hover,.secondary:hover,.ghost:hover{transform:translateY(-1px)}
.course-card:hover,.standard-card:hover{transform:translateY(-2px);border-color:#3f5c81}
.fun-hud{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fun-chip{display:inline-flex;gap:5px;align-items:center;padding:5px 8px;border-radius:999px;background:#162840;border:1px solid #29425f;font-size:10px;color:#bed0e8}
.fun-chip.xp{color:#ffe59c;border-color:#5b4c24;background:#2b2516}
.fun-chip.streak{color:#ffc3a6;border-color:#6d402c;background:#2c1c17}
.fun-chip.level{color:#d9d0ff;border-color:#51437d;background:#201b37}
.fun-dashboard{

      "<p>Try reopening the file in a current Chrome, Edge, Firefox or Safari browser.</p>";
    document.body.appendChild(box);
    box.querySelector("pre").textContent = message;

  window.addEventListener("error", function (e) {

      (e.message || "JavaScript error") +
      (e.filename ? "\nFile: " + e.filename : "") +

gineering: understand the mechanism, recognise useful evidence and apply a repeatable engineering check.","intro":"Expert process engineering combines technical depth with systems thinking, economics, documentation and coaching. The goal is to make robust performance reproducible across people, shifts and equipment.","objectives":["Explain the purpose of expert capstone in an injection moulding process.","Separate controllable inputs from measured process outputs.","Identify at least two pieces of evidence that would support a process decision."],"keypoints":["Treat expert capstone as part of a connected system: material, machine, mould, method and measurement.","Prefer measured actuals and repeatable observations over memory or cosmetic trial-and-error.","Change variables deliberately and record both the change and the response.","Confirm that the selected condition remains inside material, machine and tooling limits."],"exercise":"On a real or example process, write down the current condition related to expert capstone, one risk, one measurement you would verify, and one controlled test you could run."}],"defects":[{"name":"Short shot","symptom":"The cavity does not completely fill.","mechanisms":["Insufficient delivered volume","Excessive pressure loss or viscosity","Early V/P transfer","Restricted gate/runner","Poor venting or frozen flow front"],"checks":["Verify shot size and cushion","Compare fill time and peak pressure","Run controlled short-shot progression","Check melt/mould temperature actuals","Inspect vents, gates and flow restrictions"]},{"name":"Flash","symptom":"Thin unwanted polymer forms at the parting line, slides or inserts.","mechanisms":["Cavity pressure exceeds available mould closing resistance","Parting line/tool damage","Excessive pack pressure","Too-late transfer","Low melt viscosity"],"checks":["Inspect exact flash location","Compare clamp force and projected area","Check transfer and peak pressure","Inspect mould condition","Reduce only the parameter supported by evidence"]},{"name":"Sink","symptom":"Local surface depressions appear over thick sections or ribs.","mechanisms":["Volumetric shrinkage not adequately compensated","Gate freezes too early","Local section too thick","Insufficient hold effectiveness","Uneven cooling"],"checks":["Gate-seal study","Part mass vs hold time","Review rib/wall ratio","Check mould temperature balance","Review gate size/location"]},{"name":"Splay","symptom":"Silver or streak-like surface marks.","mechanisms":["Moisture or volatiles","Material degradation","Air entrainment","Excessive shear","Contamination"],"checks":["Verify dryer dew point/time/material moisture","Inspect purge for degradation","Review screw speed/back pressure","Check decompression and feed behaviour","Confirm material handling cleanliness"]},{"name":"Burn marks","symptom":"Dark or charred marks, often near end of fill.","mechanisms":["Trapped gas compression","Insufficient venting","Excessive fill speed locally","Degraded material","Dead spots"],"checks":["Map burn location to end-of-fill","Inspect/clean vents","Run speed sensitivity check","Review residence time","Inspect hot-runner/nozzle dead spots"]},{"name":"Weld line","symptom":"Visible or weak line where flow fronts meet.","mechanisms":["Low temperature at flow-front meeting","Poor venting","Unfavourable gate location","Low local pressure","Contamination or fibre orientation"],"checks":["Map flow pattern","Review mould and melt temperature","Inspect vent at weld location","Assess gate strategy","Test mechanical strength where critical"]},{"name":"Jetting","symptom":"Snake-like flow mark from the gate.","mechanisms":["High velocity through an open space","Gate orientation","Cold/stiff melt","Insufficient initial flow-front attachment"],"checks":["Use staged initial injection speed","Review gate location/style","Check melt and mould temperature","Inspect early short shots"]},{"name":"Warpage","symptom":"Part distorts after ejection or conditioning.","mechanisms":["Differential shrinkage","Non-uniform cooling","Molecular/fibre orientation","Packing imbalance","Geometry/tooling constraint"],"checks":["Measure mould surface temperatures","Check cavity balance","Review packing profile","Compare ejection temperature","Review flow orientation and geometry"]},{"name":"Brittleness","symptom":"Part cracks or fails below expected load.","mechanisms":["Material degradation","Moisture/hydrolysis history","Excessive regrind","Weld-line weakness","Residual stress"],"checks":["Verify material history","Check melt temperature/residence time","Review regrind ratio","Inspect fracture location","Condition and test to specification"]},{"name":"Dimensional drift","symptom":"Dimensions shift over time, lot, shift or machine.","mechanisms":["Thermal drift","Material lot/moisture change","Check-valve inconsistency","Mould temperature variation","Measurement variation"],"checks":["Trend part mass and process actuals","Verify water temperature/flow","Check cushion and transfer repeatability","Perform measurement-system check","Compare material and dryer records"]},{"name":"Voids","symptom":"Internal cavities form inside thick sections.","mechanisms":["Center shrinkage in thick section","Insufficient packing transmission","Gate freezes early","Cooling gradient"],"checks":["Section the part","Run gate-seal/part-mass study","Review gate size/location","Review wall design and cooling"]},{"name":"Delamination","symptom":"Surface layers peel or separate.","mechanisms":["Material incompatibility","Contamination","Excessive shear","Cold skin / weak interlayer bonding"],"checks":["Verify resin and regrind identity","Clean material system","Review speed/shear","Check melt temperature and contamination sources"]}],"scenarios":[{"title":"Cushion suddenly varies","situation":"A stable job begins showing cushion variation and part-mass variation, while the barrel setpoints have not changed.","choices":["Run a gate-seal study first","Check non-return-valve/shot-delivery behaviour, feed consistency, transfer and injection actuals","Focus first on mould-water balance","Change hold pressure and judge the result by part mass"],"correct":1,"why":"Cushion and part-mass variation together point first toward delivered-shot consistency. Check the shot-delivery mechanism and actuals before compensating with hold pressure.","feedback":["A gate-seal study answers a different question and does not first explain unstable cushion.","Correct: this directly tests the most relevant shot-delivery mechanisms and actuals.","Cooling balance can affect dimensions/warpage but is less directly connected to simultaneous cushion and part-mass variation.","Changing hold pressure could mask the symptom without explaining the delivery instability."]},{"title":"Burn at end of fill","situation":"A dark burn appears consistently at the last place to fill. The location is repeatable from cycle to cycle.","choices":["Inspect venting/end-of-fill gas escape and run a controlled fill-speed sensitivity check","Treat residence time as the only possible mechanism","Change mould temperature first without checking the burn location mechanism","Start with a gate-seal study"],"correct":0,"why":"A repeatable end-of-fill burn strongly supports trapped/compressed gas or a locally aggressive filling condition. Confirm with vent inspection and a controlled speed study.","feedback":["Correct: location and timing make gas compression/venting a high-priority hypothesis.","Residence-time degradation can cause dark material, but the repeatable end-of-fill location makes it a secondary hypothesis until evidence supports it.","Mould temperature may influence flow, but changing it first is less diagnostic than checking the end-of-fill gas mechanism.","Gate-seal studies address hold/packing transmission, not the primary mechanism suggested by an end-of-fill burn."]},{"title":"Flash after tool change","situation":"A mould that previously ran clean begins flashing on one local corner immediately after maintenance; the rest of the parting line is unchanged.","choices":["Verify the local parting line, insert seating and mould condition","Reduce pack/hold pressure and accept the first setting that removes visible flash","Change melt temperature first","Run a cooling-time study first"],"correct":0,"why":"The timing and localised location point first toward tooling/seating. Process changes could hide the symptom without fixing the cause.","feedback":["Correct: the evidence specifically points to the area disturbed during maintenance.","This can hide a tooling issue and may move other quality characteristics.","Melt temperature can influence flash tendency but does not explain the local post-maintenance change as directly.","Cooling-time optimisation is not the most relevant first diagnostic step for a local parting-line flash."]},{"title":"Long cycle, stable quality","situation":"Quality is stable, cooling occupies most of the cycle, and the part is being ejected well below the historical temperature/quality limit.","choices":["Study cooling time in controlled increments while tracking ejection condition, dimensions and warpage","Reduce hold time first regardless of gate-seal behaviour","Increase fill speed to reduce total cycle time","Change mould-water temperature and cooling time together"],"correct":0,"why":"Cooling is the dominant opportunity. A controlled cooling study links cycle reduction to the actual ejection-quality limit.","feedback":["Correct: this changes the suspected driver while monitoring the relevant quality boundary.","Hold time should be based on packing/gate behaviour; changing it is a different mechanism.","Fill-speed changes can alter flow, pressure and quality and do not directly target the dominant cooling portion.","Changing two thermal variables together makes cause-and-effect harder to interpret."]},{"title":"Splay after humid-air exposure","situation":"Silver streaks increase on a moisture-sensitive resin after the material-handling system was open to humid air.","choices":["Verify drying history, dryer performance and actual material moisture condition","Change fill speed first to see whether appearance improves","Change mould temperature first","Increase hold pressure and compare surface appearance"],"correct":0,"why":"The material-history change makes moisture the highest-priority hypothesis to verify before compensating with unrelated process settings.","feedback":["Correct: the evidence directly implicates material moisture history.","Fill speed can influence some streaking mechanisms, but it should not be the first response to a clear moisture-history event.","Mould temperature may affect appearance but does not directly verify the suspected moisture mechanism.","Hold pressure is not the first diagnostic control for a moisture-linked splay event."]},{"title":"Pressure rise after runner repair","situation":"A family mould shows one branch filling later and peak injection pressure increases immediately after a runner repair.","choices":["Run a controlled cavity-balance/partial-fill study and inspect the repaired runner geometry","Change cooling time first","Increase melt temperature until the pressure returns to its old value","Rebalance hold pressure between cavities"],"correct":0,"why":"The timing, pressure change and branch asymmetry point toward flow balance or a new restriction in the repaired runner.","feedback":["Correct: it directly tests the branch affected by the repair and the flow restriction hypothesis.","Cooling occurs later and does not first explain the changed branch fill/pressure behaviour.","This may mask a runner restriction and changes the material thermal condition.","Hold occurs after filling and cannot directly correct the underlying fill-path restriction."]},{"title":"Dimension drifts by shift","situation":"A critical dimension shifts between day and night shift, but the saved recipe values are identical.","choices":["Trend mould-water temperatures/flows, process actuals, material condition and the measurement method by shift","Assume the recipe proves the process is identical and investigate inspection only","Change shot size on the shift with the larger dimension","Change hold pressure until both shifts average the same dimension"],"correct":0,"why":"Identical setpoints do not prove identical thermal conditions, actual machine response, material state or measurement practice.","feedback":["Correct: this compares the main evidence categories that can differ despite identical recipe values.","Inspection may contribute, but the recipe alone does not prove the process is identical.","Changing shot size before identifying the driver can mask the shift effect.","Using hold pressure as compensation can create two different processes rather than identify the shift-related cause."]},{"title":"Sink remains after gate seal","situation":"During a controlled hold-time study, part mass reaches a repeatable plateau, but sink over a thick boss remains.","choices":["Continue extending hold time beyond the confirmed plateau","Investigate local geometry, gate effectiveness/location and cooling because additional hold time is no longer transmitting more material","Increase injection speed first","Change screw recovery settings first"],"correct":1,"why":"Once the part-mass plateau indicates effective gate seal under the tested condition, additional hold time will not transmit more material through that gate. The remaining mechanism needs to be sought in geometry, gate effectiveness and local thermal/packing behaviour.","feedback":["More hold time after the plateau is not expected to add packing through the sealed gate.","Correct: this follows the evidence from the gate-seal study.","Injection speed can affect filling/orientation but does not directly address a sink that remains after gate seal is established.","Screw recovery settings are not the first mechanism indicated by this result."]}],"exams":{"Beginner":[["During a normal thermoplastic injection moulding cycle, which phase is intended to compensate for volumetric shrinkage while the gate can still transmit pressure?",["Pack/hold","Velocity-controlled filling before V/P transfer","Screw recovery after the shot","Cooling after the gate has sealed"],0,"Pack/hold applies pressure after filling to compensate for material shrinkage while the gate can still transmit pressure. Once the gate is effectively sealed, extra hold time cannot add further material through that gate.","Common injection moulding process-engineering principle",null,["Pack/hold applies pressure after filling to compensate for material shrinkage while the gate can still transmit pressure. Once the gate is effectively sealed, extra hold time cannot add further material through that gate.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method."],false],["On a reciprocating-screw machine, what does 'cushion' normally refer to?",["The screw position at the start of injection","The screw position remaining at the end of hold","The screw movement used for decompression after recovery","The screw position used to trigger V/P transfer"],1,"Cushion is the remaining screw position/material reserve after injection and hold. It is commonly trended as one indicator of shot-delivery consistency; the appropriate value is machine- and process-specific.","Common injection moulding process-engineering principle",null,["This is an asses instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale."],false],["Which statement about barrel-zone set temperatures and actual melt temperature is most accurate?",["The mean of all barrel-zone set temperatures","The front-zone set temperature during injection","A condition determined mainly by mould-surface temperature and controller settings","A condition influenced by shear, residence time, throughput and heat transfer"],3,"Barrel settings influence the thermal process, but they do not by themselves prove the actual melt temperature. Screw work, residence time, throughput and material behaviour can shift melt condition.","Common injection moulding process-engineering principle",null,["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","Barrel settings influence the thermal process, but they do not by themselves prove the actual melt temperature. Screw work, residence time, throughput and material behaviour can shift melt condition."],false],["A hygroscopic resin is being prepared for production. What is the best general practice?",["Follow the actual resin grade's current supplier or validated site drying/moisture guidance","Use one generic drying profile for all hygroscopic resins in the same polymer family","Extend drying time whenever a surface defect appears, without first checking the defect mechanism","Raise barrel temperature instead of verifying material moisture"],0,"Drying requirements are material-specific. Use current supplier data or a validated site process, and prevent significant moisture reabsorption where that is relevant.","Material-specific processing requirements should be verified against current resin-supplier data",null,["Drying requirements are material-specific. Use current supplier data or a validated site process, and prevent significant moisture reabsorption where that is relevant.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method."],false],["What does V/P transfer mean in a conventional injection moulding process?",["The switch from injection to screw recovery","The switch from velocity-controlled fill to pressure-controlled pack/hold","The switch from back pressure to screw decompression","The switch from mould close to injection start"],1,"V/P transfer is the transition from velocity-controlled filling to pressure-controlled packing/holding. The transfer trigger may be position, pressure, time or another validated process signal depending on the machine and process.","Common injection moulding process-engineering principle",null,["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","V/P transfer is the transition from velocity-controlled filling to pressure-controlled packing/holding. The transfer trigger may be position, pressure, time or another validated process signal depending on the machine and process.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale."],false],["Why does projected area matter when evaluating clamp-force requirement?",["It is the main input for determining shot-volume capacity","It directly determines the required screw-recovery speed","It links cavity pressure to the mould-opening force","It directly determines cooling-water flow"],2,"Clamp requirement is related to the mould-opening force produced by cavity pressure acting over the projected area of the cavities and runner system on the parting plane. Actual cavity pressure is not uniform everywhere, so use the machine-, mould- and process-specific method approved by the site.","Common injection moulding process-engineering principle",null,["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","Clamp requirement is related to the mould-opening force produced by cavity pressure acting over the projected area of the cavities and runner system on the parting plane. Actual cavity pressure is not uniform everywhere, so use the machine-, mould- and process-specific method approved by the site.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale."],false],["What is the main process role of the gate in a conventional runner-and-gate system?",["Control heat removal from the mould during cooling","Provide a controlled vent path for displaced cavity gas","Maintain packing flow after the gate has frozen","Connect runner and cavity through a restricted flow path"],3,"The gate is the restricted connection through which melt enters the cavity. Gate type, size and location affect shear, pressure loss, filling pattern and gate-seal behaviour.","Common injection moulding process-engineering principle",null,["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","The gate is the restricted connection through which melt enters the cavity. Gate type, size and location affect shear, pressure loss, filling pattern and gate-seal behaviour."],false],["What is the primary purpose of the cooling portion of the moulding cycle?",["Remove enough heat for stable, acceptable ejection","To continue pressure compensation after the gate has sealed","To reduce resin moisture inside the barrel","To establish the machine clamp-force rating"],0,"Cooling removes heat through the mould until the part is sufficiently stable for ejection and required quality. Required cooling depends on material, geometry, mould temperature, cooling design and ejection criteria.","Autodesk Moldflow — cooling-stage definition","https://help.autodesk.com/cloudhelp/2023/ENU/MoldflowInsight-CLC-Ref-Materials/files/glossary-of-terminology/MoldflowInsight_CLC_Ref_Materials_glossary_of_terminology_Cooling_stage_html.html",["Cooling removes heat through the mould until the part is sufficiently stable for ejection and required quality. Required cooling depends on material, geometry, mould temperature, cooling design and ejection criteria.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method."],false],["A previously stable part begins failing a critical dimension. What is the strongest first troubleshooting step?",["Reload the saved recipe and assume the process has returned to the known-good condition","Define what changed and compare current evidence with the known-good condition","Adjust the process input most likely to move the dimension before checking what changed","Replace the measuring device before checking whether the measurement system has actually changed"],1,"Good troubleshooting starts by defining the symptom and comparing evidence with a known-good condition. Unverified setting changes can mask the mechanism and make the process harder to restore or transfer.","Common injection moulding troubleshooting principle",null,["This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","Good troubleshooting starts by defining the symptom and comparing evidence with a known-good condition. Unverified setting changes can mask the mechanism and make the process harder to restore or transfer.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method.","This option is not the best answer for the evidence in the question. Do not treat a distractor as a recommended process change; use the stated mechanism, measured evidence and approved site method."],false]],"Intermediate":[["During a controlled hold-time study, which result most directly supports the conclusion that a gate has effectively sealed?",["Cushion is identical on two consecutive cycles","Peak injection pressure remains unchanged as hold time is increased","A repeatable part-mass plateau as hold time increases","Screw recovery finishes before mould opening"],2,"Under otherwise consistent conditions, a repeatable plateau in part mass as hold time increases is evidence that additional hold time is no longer adding measurable material through that gate. Confirm the study method and process stability rather than treating a single cycle as proof.","Autodesk Moldflow — gate-freeze/packing guidance","https://help.autodesk.com/view/MOLDFLOW/2013/ENU/caas.html?url=caas%2Fvhelp%2Fhelp-dev-autodesk-com%2Fv%2FSimulation-Moldflow%2Fenu%2F2013%2FHelp%2F3Insight-360%2F3927-Process-3927%2F3933-Profiles3933%2F3945-Packing-3945.html",["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","Under otherwise consistent conditions, a repeatable plateau in part mass as hold time increases is ence before changing settings."],false],["Silver streaks increase on a moisture-sensitive resin after the material system was exposed to humid air. What should be checked first?",["Drying history, dryer performance and resin moisture","Whether fill speed is entraining air at the gate","Whether contamination entered during material handling","Whether mould-surface temperature changed"],0,"Because the symptom increased after a moisture-sensitive material system was exposed to humid air, moisture becomes a high-priority hypothesis. Check the material's documented drying history, dryer performance and approved moisture-verification method before compensating with unrelated machine changes.","Material-specific defect-analysis principle",null,["Because the symptom increased after a moisture-sensitive material system was exposed to humid air, moisture becomes a high-priority hypothesis. Check the material's documented drying history, dryer performance and approved moisture-verification method before compensating with unrelated machine changes.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale."],false],["A previously clean mould starts flashing at one corner immediately after mould maintenance, while the rest of the parting line is unchanged. What should be checked first?",["Review machine pressure and clamp actuals as the primary cause","Inspect the local parting line, inserts and mould seating","Reduce pack/hold pressure and judge whether e-loss study during moulding process development?",["To determine gate-seal time directly from part weight","To quantify pressure loss through the defined flow path","To calculate required clamp force without considering projected area","To determine material moisture from injection pressure alone"],1,"Pressure-loss studies help identify restrictive portions of the flow path and whether the process is approaching machine pressure capability. Relevant conditions must be controlled for the comparison to be meaningful.","Scientific-moulding study principle",null,["This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","Pressure-loss studies help identify restrictive portions of the flow path and whether the process is approaching machine pressure capability. Relevant conditions must be controlled for the comparison to be meaningful.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale.","This is an assessment distractor, not an instruction or authorised alternative. Use the mechanism, evidence, applicable safety requirements and approved site procedure described in the rationale."],false]]},"glossary":{"Back pressure":"Resistance applied during screw recovery; influences mixing, melt condition and recovery behaviour.","Cavity balance":"Study of how uniformly cavities or flow branches fill under comparable conditions.","Cavity pressure":"Pressure measured in the mould cavity during fill, pack and cooling.","Clamp force":"Force holding the mould closed against cavity pressure acting over projected area.","Cooling time":"Time allowed for the moulded part to reach an acceptable ejection condition.","Cp":"Potential process capability ratio based on process spread relative to specification width.","Cpk":"Capability ratio that considers both spread and process centring.","Cushion":"Remaining screw travel/material reserve after injection and hold.","Decompression":"Controlled screw movement used after recovery to reduce nozzle pressure.","DOE":"Design of Experiments; a structured method for estimating factor effects and interactions.","Dryer dew point":"Indicator of drying-air moisture content; relevant for many hygroscopic resins.","Fill time":"Time required to reach the defined transfer/fill condition.","Fountain flow":"Characteristic polymer filling pattern where hot material moves forward through the centre and folds toward the walls.","Gate seal":"Condition where the gate no longer effectively transmits packing pressure to the cavity.","Hold pressure":"Pressure applied after filling to compensate shrinkage while the gate remains effective.","Injection pressure":"Pressure generated by the injection system to move polymer through nozzle, runner, gate and cavity.","Melt temperature":"Actual temperature of the polymer melt after plasticising; not necessarily equal to barrel set temperatures.","Mould temperature":"Thermal condition of the mould surfaces/cooling system that affects filling, cooling and morphology.","Non-return valve":"Check-valve assembly at the screw tip intended to restrict backflow during injection.","Pack pressure":"Pressure following fill, often used together with hold pressure terminology.","Projected area":"Area of cavity and runner projected onto the mould parting plane; used in clamp-force reasoning.","Pp/Ppk":"Performance indices often calculated using overall long-term variation.","Residence time":"Approximate time material remains in heated machine/hot-runner volumes.","Shear rate":"Rate of deformation in flowing polymer; viscosity commonly changes with shear rate.","Short shot":"Incomplete mould cavity filling.","Sink mark":"Local surface depression associated with volumetric shrinkage and local geometry/packing.","Splay":"Streaking associated with mechanisms such as moisture, volatiles, degradation, air or shear.","Transfer position":"Screw position used to change from velocity-controlled fill to pressure-controlled pack/hold.","V/P transfer":"Velocity-to-pressure transfer.","Warpage":"Distortion caused by non-uniform shrinkage, cooling, orientation and packing.","Weld line":"Region where separate flow fronts meet; may affect appearance or strength."},"standards":{"verified":"20 August 2026","common":[{"name":"ISO 20430:2020","scope":"International safety requirements for the design and construction of injection moulding machines, and information for safe use.","url":"https://www.iso.org/standard/68000.html"}],"UK":[{"name":"PUWER 1998 — Great Britain","scope":"Provision and Use of Work Equipment Regulations 1998. Regulation 11 addresses dangerous parts of machinery; the regulations also cover suitability, maintenance, controls and other work-equipment duties.","url":"https://www.legislation.gov.uk/uksi/1998/2306"},{"name":"PUWER (Northern Ireland) 1999","scope":"Northern Ireland has separate Provision and Use of Work Equipment Regulations 1999.","url":"https://www.legislation.gov.uk/nisr/1999/305"},{"name":"HSE PPIS4(rev1) — Safety at injection moulding machines","scope":"UK HSE practical safeguards for reducing injury risk at injection moulding machines.","url":"https://www.hse.gov.uk/pubns/plasindx.htm"},{"name":"HSE PPIS13(rev1) — Controlling fume during plastics processing","scope":"HSE guidance on preventing or controlling respiratory and toxic hazards from plastics-processing fume.","url":"https://www.hse.gov.uk/pubns/ppis13.htm"},{"name":"BS EN ISO 20430:2020","scope":"UK adoption of the international injection-moulding-machine safety standard.","url":"https://knowledge.bsigroup.com/products/plastics-and-rubber-machines-injection-moulding-machines-safety-requirements-1"}],"US":[{"name":"OSHA 29 CFR 1910.212 — General machine guarding","scope":"Requires one or more guarding methods <script>
/* ===== content_patch.js ===== */
/* Fine-tooth-comb content improvements. Assessment banks are not changed here. */
(function(){
  const D=window.MM_DATA;
  const coursePractice={
    "Foundations": t=>`Observe or review a real moulding cycle with an authorised operator. For “${t}”, identify the relevant cycle phase or process signal, write down one measured actual you would use, and explain what would make that evidence trustworthy.`,
    "Machine & Controls": t=>`Using the machine manual, approved training machine, or a labelled diagram, locate the feature related to “${t}”. Record its purpose, one measured actual or status signal, and one limitation that would matter when transferring a process between machines.`,
    "Materials": t=>`Choose one resin you actually use or a supplier datasheet example. For “${t}”, identify the material-specific guidance you would verify, the evidence you would record, and one consequence of operating outside the validated material condition.`,
    "Mould Design": t=>`Trace “${t}” on a mould drawing, flow sketch, cooling diagram or approved training tool. Identify how it could influence filling, pressure, cooling, venting, ejection or dimensional behaviour, then state what evidence would confirm the effect.`,
    "Process Setup": t=>`Take a known-good setup sheet or training example. For “${t}”, separate the machine command from the process actual, identify the acceptance check, and write the smallest controlled change you would use if the actual moved outside the known-good range.`,
    "Defect Troubleshooting": t=>`For “${t}”, define the symptom precisely, rank at least three plausible mechanisms using Material–Machine–Mould–Method–Measurement, then choose one safe evidence-gathering check that would discriminate between the leading causes.`,
    "Scientific Moulding": t=>`Design a paper study for “${t}”: define the question, controlled variables, deliberate change, measured response and stop/acceptance criteria. Do not choose production settings from this exercise; the aim is to learn experimental structure.`,
    "Capability & Validation": t=>`For “${t}”, list the data prerequisites that must be true before drawing a conclusion: process stability, measurement adequacy, sampling, specification/acceptance criteria and any validation/change-control requirements.`,
    "DOE & Statistics": t=>`Turn “${t}” into a small experimental plan. Define factors, levels, response(s), nuisance variables, randomisation/blocking needs and the confirmation step you would require before changing a production standard.`,
    "Automation & Sensors": t=>`Map the sequence or signal related to “${t}” in an approved cell diagram. Identify what the signal proves, what it does not prove, and which safeguarding/authorised-access assumptions must remain true during operation and maintenance.`,
    "Advanced Tooling & Simulation": t=>`For “${t}”, write one prediction from a simulation or engineering model and one real-world measurement or moulding study you would use to challenge that prediction. Treat simulation as evidence to verify, not as a production instruction.`,
    "Expert Process Engineering": t=>`For “${t}”, build a one-page evidence plan: define the business/quality problem, known-good baseline, critical process outputs, possible interactions, safety/validation constraints, decision rule and how the learning will be standardised for other shifts or machines.`
  };
  const evidenceByCourse={
    "Foundations":"Cycle phase, setpoint vs actual, repeatability over several cycles, part observation.",
    "Machine & Controls":"Machine manual definition, set vs actual, alarm/status history, capability/limit information.",
    "Materials":"Supplier/validated material requirement, lot/handling history, drying or conditioning evidence where applicable.",
    "Mould Design":"Drawing/tool condition, short-shot or pressure evidence, temperature/flow observations, cavity-to-cavity comparison where relevant.",
    "Process Setup":"Known-good baseline, fill time, transfer, peak pressure, cushion, recovery, thermal condition and critical part response as applicable.",
    "Defect Troubleshooting":"Exact defect location/time, known-good comparison, material/machine/mould/method/measurement evidence.",
    "Scientific Moulding":"Controlled inputs, measured actuals, repeat runs, clear response definition and study assumptions.",
    "Capability & Validation":"Stable process evidence, measurement-system evidence, sampling plan, specifications and change-control context.",
    "DOE & Statistics":"Run order, factor settings, response data, nuisance-variable record, model diagnostics and confirmation runs.",
    "Automation & Sensors":"Sequence state, sensor location/function, interlock/safeguard status, trace data and maintenance/access condition.",
    "Advanced Tooling & Simulation":"Model assumptions, mesh/material/model inputs where relevant, physical measurements and correlation error.",
    "Expert Process Engineering":"Cross-functional evidence, economic impact, process actuals, maintenance/tooling condition, risk and verification plan."
  };
  const trapByCourse={
    "Foundations":"Treating a saved recipe value as proof that the material experienced the same process.",
    "Machine & Controls":"Assuming the same controller number means the same physical process on another machine.",
    "Materials":"Using a generic temperature or drying rule instead of current resin-specific/validated guidance.",
    "Mould Design":"Trying to process around a tooling restriction without first proving the physical mechanism.",
    "Process Setup":"Changing several variables together and losing cause-and-effect.",
    "Defect Troubleshooting":"Adjusting the setting most associated with the defect name before defining the actual mechanism.",
    "Scientific Moulding":"Running a “study” while uncontrolled variables move enough to explain the response.",
    "Capability & Validation":"Quoting capability from unstable data or an inadequate measurement system.",
    "DOE & Statistics":"Treating statistical significance, a fitted model or an optimum as self-validating without engineering confirmation.",
    "Automation & Sensors":"Assuming a sensor, interlock or robot state proves more than that device actually measures or controls.",
    "Advanced Tooling & Simulation":"Treating a simulation image as truth without checking assumptions against physical evidence.",
    "Expert Process Engineering":"Optimising a local metric while shifting risk, cost or instability somewhere else in the system."
  };
  D.lessons.forEach(l=>{
    const maker=coursePractice[l.courseName];
    if(maker) l.exercise=maker(l.title);
    l.evidencePrompt=evidenceByCourse[l.courseName]||"Record the evidence that would support or reject the engineering conclusion.";
    l.commonTrap=trapByCourse[l.courseName]||"Do not substitute an assumption for measured evidence.";
  });
  if(D.standards?.common?.[0]){
    D.standards.common[0].scope += " ISO states that ISO 20430:2020 is not applicable to injection moulding machines manufactured before the date of its publication; older machines still require appropriate legal/risk-control assessment and applicable safeguards.";
  }
})();

</script>
<script>

const defaultDB = {
  activeUser: "learner-1",

};
const PRISTINE_DB = JSON.parse(JSON.stringify(defaultDB));
let db;
try{ db = JSON.parse(localStorage.getItem("mouldmasterProDB")) || JSON.parse(JSON.stringify(PRISTINE_DB)) }catch(e){ db=JSON.parse(JSON.stringify(PRISTINE_DB)) }
if(!db.users || !db.activeUser){db=defaultDB}

let simulatorState = {speed:55,transfer:96,hold:55,holdTime:5,melt:235,mould:55,cooling:14,clamp:75,vent:70,moisture:25};

function persist(){
  user.lastSeen = new Date().toISOString();

  localStorage.setItem("mouldmasterProDB",JSON.stringify(db));
  updateGlobalProgress();
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg;t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"),2200);
}
function switchView(id){
  currentView=id;
  $$(".view").forEach(v=>v.classList.add("hidden"));
  $("#"+id).classList.remove("hidden");
  $$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
  const titles={
    dashboard:["Home","Your next step is always shown first."],
    path:["My learning path","Follow a clear route from beginner fundamentals to expert engineering."],
    lesson:["Lesson","One focused topic at a time, with practical takeaways."],
    visuals:["Animated visuals","See the moulding process instead of only reading about it."],
    simulator:["Process simulator","Move process variables and see how relative defect risk changes."],
    defects:["Defect finder","Start with the symptom, then work toward evidence and likely causes."],
    scenarios:["Practice scenarios","Build troubleshooting judgement with realistic shop-floor problems."],
    coach:["Troubleshooting coach","Get structured guidance for defects, process questions and study topics."],
    exams:["Knowledge checks","Check what you know and earn local learning certificates."],
    certificates:["Certificates","View and print certificates you have earned."],
    instructor:["Instructor dashboard","Review local learner progress on this device."],
    glossary:["Glossary","Find technical terms in plain language."],
    profile:["Profile & data","Personalise your learning and manage local progress data."],
    standards:["Standards & safety","UK, US and New Zealand machinery-safety references used by the learning platform."]
  };
  $("#pageTitle").textContent=titles[id][0];$("#pageSubtitle").textContent=titles[id][1];
  renderView(id);
  window.scrollTo({top:0,behavior:"smooth"});
}
$$("#nav button").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));
$("#continueBtn").onclick=()=>{switchView("lesson")};
$("#searchBtn").onclick=openSearch;

function completedPct(){
  return Math.round((user.completed?.length||0)/D.lessons.length*100);
}
function courseProgress(course){
  const done=course.lessonIds.filter(id=>user.completed.includes(id)).length;
  return {done,total:course.lessonIds.length,pct:Math.round(done/course.lessonIds.length*100)};
}
function currentLesson(){ return D.lessons.find(l=>l.id===user.currentLesson)||D.lessons[0] }
function updateGlobalProgress(){
  const pct=completedPct();
  $("#sideProgress").style.width=pct+"%";$("#sideProgressText").textContent=pct+"%";
  $("#profileMini").innerHTML=`<div class="row"><div class="row" style="justify-content:flex-start"><div class="avatar">${(user.name||"L").slice(0,1).toUpperCase()}</div><div><b>${esc(user.name)}</b><div class="tiny muted">${esc(user.role||"learner")}</div></div></div><span class="pill">${pct}%</span></div>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function renderView(id){
  if(id==="dashboard")renderDashboard();
  if(id==="path")renderPath();
  if(id==="lesson")renderLesson();
  if(id==="visuals")renderVisuals();
  if(id==="simulator")renderSimulator();
  if(id==="defects")renderDefects();
  if(id==="scenarios")renderScenarios();
  if(id==="coach")renderCoach();
  if(id==="exams")renderExams();
  if(id==="certificates")renderCertificates();
  if(id==="instructor")renderInstructor();
  if(id==="glossary")renderGlossary();
  if(id==="profile")renderProfile();
  if(id==="standards")renderStandards();
}
function renderDashboard(){
  const pct=completedPct(), c=currentLesson();
  const certs=user.certificates?.length||0;
  $("#dashboard").innerHTML=`
  <div class="hero">
    <div class="card hero-main">
      <span class="eyebrow">Personalised learning path</span>
      <h2>From first moulding cycle to advanced process engineering.</h2>
      <p>Train machine fundamentals, material behaviour, tooling, process development, scientific moulding, validation, DOE, automation, simulation and expert root-cause thinking.</p>
      <div class="hero-buttons">
        <button class="primary" onclick="switchView('lesson')">Continue: ${esc(c.title)}</button>

  <div class="grid">${D.courses.slice(0,6).map(courseCard).join("")}</div>`;
}
function courseCard(c){
  const p=courseProgress(c);
  return `<div class="card course-card">
    <span class="eyebrow">${esc(c.level)}</span><h3>${c.id}. ${esc(c.name)}</h3><p>${esc(c.description)}</p>

function openCourse(id){
  const c=D.courses.find(x=>x.id===id);
  const next=c.lessonIds.find(id=>!user.completed.includes(id))||c.lessonIds[0];

}
function renderPath(){
  $("#path").innerHTML=`<div class="section-head"><div><h2>Beginner → Expert pathway</h2><p>Each track contains 10 concise lessons plus practical exercises.</p></div><span class="pill">120 lessons</span></div>
  <div class="learning-map">${D.courses.map(c=>{const p=courseProgress(c);return `<div class="card track-row"><div><span class="eyebrow">${esc(c.level)}</span><h3 style="margin:6px 0">${c.id}. ${esc(c.name)}</h3></div><div><p class="muted">${esc(c.description)}</p><div class="mini-bar"><span style="width:${p.pct}%"></span></div></div><div><b>${p.pct}% complete</b><div style="margin-top:8px"><button class="secondary" onclick="openCourse(${c.id})">Open track</button></div></div></div>`}).join("")}</div>`;

      <div class="callout"><b>Lesson focus:</b> ${esc(l.summary)}</div>

        <button class="ghost" onclick="toggleBookmark(${l.id})">${bookmarked?"★ Bookmarked":"☆ Bookmark"}</button>
      </div>

    <aside class="card lesson-side">
      <span class="eyebrow">Track ${c.id}: ${esc(c.name)}</span>

      <div class="lesson-list">${c.lessonIds.map(id=>{const x=D.lessons.find(q=>q.id===id);return `<button class="${id===l.id?"active":""}" onclick="goLesson(${id})">${user.completed.includes(id)?"✓ ":""}${id}. ${esc(x.title)}</button>`}).join("")}</div>
      <button class="secondary" style="width:100%;margin-top:12px" onclick="nextLesson()">Next lesson →</button>
    </aside>
  </div>`;
}
function goLesson(id){user.currentLesson=id;persist();renderLesson();window.scrollTo({top:0,behavior:"smooth"})}
function nextLesson(){let id=user.currentLesson+1;if(id>D.lessons.length)id=1;goLesson(id)}
function completeLesson(id){if(!user.completed.includes(id))user.completed.push(id);persist();renderLesson();toast("Lesson completed")}
function saveLessonNote(id){user.notes=user.notes||{};user.notes[id]=$("#lessonNotes").value;persist();toast("Notes saved")}

function phaseExplain(p){
 const m={
  "Plasticising":"The screw rotates and moves backward as polymer is conveyed, melted and metered. Watch recovery time, screw speed, back pressure and melt condition.",
  "Filling":"The screw moves forward under velocity control. Fill time, transfer position and peak injection pressure are key actuals.",
  "Pack / hold":"Control changes from velocity to pressure. Packing compensates shrinkage until the gate stops transmitting pressure.",
  "Cooling":"Heat is removed through the mould and coolant system. Cooling balance strongly influences cycle, dimensions and warpage.",
  "Ejection":"The mould opens and the part is removed. Ejection should occur only when the part is sufficiently stable for the geometry and quality requirement."
 }[p];
 $("#phaseText").innerHTML=`<b>${p}:</b> ${m}`;
}

   ${slider("Melt temp","melt",180,320,simulatorState.melt,"°C")}
   ${slider("Mould temp","mould",20,120,simulatorState.mould,"°C")}
   ${slider("Cooling time","cooling",4,35,simulatorState.cooling,"s")}
   ${slider("Clamp margin","clamp",30,120,simulatorState.clamp,"%")}
   ${slider("Venting quality","vent",10,100,simulatorState.vent,"%")}
   ${slider("Moisture risk","moisture",0,100,simulatorState.moisture,"%")}
  </div>
  <div class="hero-buttons"><button class="secondary" onclick="resetSimulator()">Reset</button><button class="ghost" onclick="simPreset('robust')">Robust preset</button><button class="ghost" onclick="simPreset('trouble')">Trouble preset</button></div>
 </div>
 <div class="card output-panel">
   <span class="eyebrow">Predicted response</span><h2>Relative defect risk</h2>
   <div class="part-visual"><div class="part-shape"></div><div id="simOverlay" class="defect-overlay"></div></div>
   <div id="riskList"></div>
   <div class="callout" id="simAdvice"></div>
 </div></div>`;
 updateSimulator();
}
function slider(label,key,min,max,val,unit){
 return `<label>${label}<div class="range-row"><input type="range" min="${min}" max="${max}" value="${val}" oninput="simChange('${key}',this.value)"><input id="sim_${key}" value="${val}${unit}" readonly></div></label>`;
}
function simChange(k,v){simulatorState[k]=+v;const units={speed:"%",transfer:"%",hold:"%",holdTime:"s",melt:"°C",mould:"°C",cooling:"s",clamp:"%",vent:"%",moisture:"%"};$("#sim_"+k).value=v+units[k];updateSimulator()}
function clamp01(x){return Math.max(0,Math.min(100,x))}
function simRisks(){
 const s=simulatorState;
 return {
  "Short shot":clamp01((95-s.transfer)*9 + (45-s.speed)*.8 + (220-s.melt)*.22 + (50-s.hold)*.18),
  "Flash":clamp01((s.transfer-97)*12 + (s.hold-65)*.55 + (60-s.clamp)*1.1 + (s.melt-255)*.12),
  "Sink":clamp01((55-s.hold)*.8 + (5-s.holdTime)*8 + (12-s.cooling)*1.7),
  "Burn":clamp01((s.speed-70)*.8 + (55-s.vent)*1.1 + (s.melt-270)*.16),
  "Splay":clamp01(s.moisture*.75 + (s.melt-285)*.15 + (s.speed-85)*.3),
  "Warpage":clamp01((13-s.cooling)*3 + Math.abs(s.mould-60)*.28 + (s.hold-80)*.18)
 }
}
function updateSimulator(){
 const r=simRisks();
 $("#riskList").innerHTML=Object.entries(r).map(([k,v])=>`<div class="risk"><span>${k}</span><div class="riskbar"><span style="width:${v}%"></span></div><b>${Math.round(v)}</b></div>`).join("");
 const top=Object.entries(r).sort((a,b)=>b[1]-a[1])[0];
 let advice=top[1]<30?"The simulated process is in a relatively low-risk region. Now challenge one variable at a time to see which responses are most sensitive.":`Highest predicted risk: <b>${top[0]}</b>. Use the Defect Lab to inspect likely mechanisms, then make a controlled test rather than changing several settings.`;
 $("#simAdvice").innerHTML=advice;
 const ov=$("#simOverlay");let html="";
 if(r["Burn"]>55)html+=`<div style="position:absolute;width:28px;height:28px;border-radius:50%;background:#54200f;right:34%;top:32%;box-shadow:0 0 18px #ff7b00"></div>`;
 if(r["Flash"]>55)html+=`<div style="position:absolute;width:180px;height:8px;background:#55d6be;left:calc(50% - 90px);top:calc(50% + 56px);border-radius:50%"></div>`;
 if(r["Short shot"]>55)html+=`<div style="position:absolute;width:75px;height:125px;background:#0c182a;right:calc(50% - 80px);top:calc(50% - 62px);transform:rotate(12deg)"></div>`;
 if(r["Splay"]>55)html+=`<div style="position:absolute;width:95px;height:3px;background:#eef8ff;left:calc(50% - 45px);top:44%;transform:rotate(25deg);box-shadow:0 12px #eef8ff,0 24px #eef8ff"></div>`;
 ov.innerHTML=html;
}
function resetSimulator(){simulatorState={speed:55,transfer:96,hold:55,holdTime:5,melt:235,mould:55,cooling:14,clamp:75,vent:70,moisture:25};renderSimulator()}
function simPreset(p){
 simulatorState=p==="robust"?{speed:62,transfer:96,hold:62,holdTime:6,melt:240,mould:60,cooling:15,clamp:90,vent:90,moisture:5}:{speed:92,transfer:99,hold:85,holdTime:2,melt:290,mould:35,cooling:7,clamp:45,vent:25,moisture:80};renderSimulator()
}

function coachSend(){
 const inp=$("#coachInput");if(!inp||!inp.value.trim())return;const q=inp.value.trim();coachHistory.push({role:"user",text:esc(q)});inp.value="";
 coachHistory.push({role:"bot",text:coachReply(q)});drawChat();
}
function coachReply(q){
 const s=q.toLowerCase();
 const d=D.defects.find(x=>s.includes(x.name.toLowerCase()));
 if(d)return `<b>${esc(d.name)} — likely mechanisms to rank:</b><br>1) ${esc(d.mechanisms.slice(0,3).join("; "))}.<br><br><b>Next evidence:</b> ${esc(d.checks.slice(0,4).join("; "))}.<br><br>Change one variable at a time unless you are deliberately running a designed experiment.`;
 if(s.includes("cushion"))return "Cushion variation should be evaluated with part mass, transfer position, peak pressure and shot delivery. Check non-return valve repeatability, feed consistency, recovery and whether the process is pressure-limited before compensating with hold pressure.";
 if(s.includes("cpk")||s.includes("capability"))return "Before interpreting Cpk, confirm process stability, adequate sampling and a capable measurement system. Cpk reflects spread and centring relative to specification; it does not prove the process mechanism is understood.";
 if(s.includes("gate seal")||s.includes("hold time"))return "A gate-seal study typically increases hold time in steps while tracking part mass. When additional hold time no longer increases mass, the gate is effectively sealed for that condition.";
 if(s.includes("viscosity")||s.includes("fill speed"))return "For a scientific-moulding style speed study, keep the transfer condition consistent, vary fill speed deliberately, and compare fill time and peak pressure with a consistent relative-viscosity method. Look for a robust region, not a single magic speed.";
 return "Structure the problem as Material, Machine, Mould, Method and Measurement. Define exactly where and when the symptom occurs, compare current actuals with a known-good process, rank the mechanisms by evidence, then run one controlled confirmation test.";
}

function technicalExplanation(q){
  const correct=q[1][q[2]];
  return `Correct answer: ${esc(correct)}. This is a process-engineering principle rather than a country-specific legal requirement. Apply it within material-supplier guidance, machine/tool limits and your site's approved process.`;
}
function getExamQuestions(level, region){
  const base=(D.exams[level]||[]).slice(0,7).map(q=>({
    q:q[0], options:q[1], correct:q[2], explanation:technicalExplanation(q), reference:"Common injection moulding engineering principle"
  }));
  let regs=[];
  if(region==="ALL"){
    const order=["UK","US","NZ"];
    regs=order.map(r=>{
      const q=D.regionalQuestions[r][level][0];
      return {q:`[${r}] ${q[0]}`,options:q[1],correct:q[2],explanation:q[3],reference:q[4],region:r};
    });
  }else{
    regs=(D.regionalQuestions[region]?.[level]||[]).map(q=>({q:q[0],options:q[1],correct:q[2],explanation:q[3],reference:q[4],region}));
  }
  return base.concat(regs);
}
let activeExam=null;

function renderExams(){
  const region=user.region||"ALL";
  $("#exams").innerHTML=`${standardsBanner()}
