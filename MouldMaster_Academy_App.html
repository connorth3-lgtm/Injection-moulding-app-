<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101d">
<title>MouldMaster Academy</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08101d;color:#edf5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.boot{width:min(580px,92vw);padding:28px;border:1px solid #283b59;border-radius:18px;background:#101c2f;box-shadow:0 18px 46px rgba(0,0,0,.28)}.boot b{font-size:22px}.boot p{color:#a9bdd6;line-height:1.6}.bar{height:7px;background:#21324a;border-radius:99px;overflow:hidden}.bar i{display:block;width:45%;height:100%;background:#55d6be;border-radius:99px;animation:move 1.15s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}button{padding:10px 14px;border-radius:10px;border:1px solid #41658d;background:#1a2b45;color:#fff}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main class="boot" id="boot" aria-live="polite"><b>MouldMaster Academy</b><p>Loading verified training content…</p><div class="bar"><i></i></div></main>
<script>
(async function(){
"use strict";
const CONTENT="2026.08.23.4";
const CACHE_KEY="mouldmaster_windows_assembled_"+CONTENT.replace(/\./g,"_");
const BASE="https://raw.githubusercontent.com/connorth3-lgtm/Injection-moulding-app-/main/";
const FILES={
 core:{path:"MouldMaster_Core_App.html",sha256:"b30719d5d3ea946a01c72d0b8996b0375575ad910a5c8d9b22b4395d6b3c8098"},
 css:{path:"reading-patch.css",sha256:"d2c2f3dc99cf958d74e2de8c4489e0aad486de56638c05ad73ed61bd0bd7e213"},
 reading:{path:"reading-patch.js",sha256:"03ccb02cb4febd4e88ecabd6c1819f435f30e19096505bc0d9a5d8ae184cd89d"},
 training:{path:"training-upgrade.js",sha256:"ba5ed0c29a8236bc6b37324eb9d83447494b0bda2de5a08962e9d7798fe7a816"},
 qa:{path:"training-qa-fix.js",sha256:"60f437c7bdbce6fc05c893f5fd19791a9a0f63ceec0dc565e794aa624abad192"}
};
async function sha256(bytes){
 if(!crypto?.subtle)throw new Error("SHA-256 verification unavailable");
 const digest=await crypto.subtle.digest("SHA-256",bytes);
 return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function get(name){
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
 try{
  const expected=FILES[name];
  const r=await fetch(BASE+expected.path,{cache:"no-store",signal:ctl.signal});
  if(!r.ok)throw new Error(name+" HTTP "+r.status);
  const bytes=await r.arrayBuffer(),actual=await sha256(bytes);
  if(actual!==expected.sha256)throw new Error(name+" failed SHA-256 verification");
  return new TextDecoder().decode(bytes);
 }finally{clearTimeout(timer)}
}
function assemble(core,css,reading,training,qa){
 const style='<style id="mm-reading-patch">'+css+'</style><meta name="mm-content-release" content="'+CONTENT+'">';
 const scripts='<script>window.MM_PLATFORM="windows";window.MM_CONTENT_RELEASE="'+CONTENT+'";</scr'+'ipt>'+ '<script>'+reading+'</scr'+'ipt><script>'+training+'</scr'+'ipt><script>'+qa+'</scr'+'ipt>';
 let out=core.replace(/<\/head>/i,style+'</head>');
 out=out.replace(/<\/body>/i,scripts+'</body>');
 return out;
}
function launch(html){document.open();document.write(html);document.close()}
try{
 const [core,css,reading,training,qa]=await Promise.all([get("core"),get("css"),get("reading"),get("training"),get("qa")]);
 const html=assemble(core,css,reading,training,qa);
 try{localStorage.setItem(CACHE_KEY,html)}catch(_){}
 launch(html);
}catch(err){
 const saved=(()=>{try{return localStorage.getItem(CACHE_KEY)}catch(_){return null}})();
 if(saved){launch(saved);return}
 const b=document.getElementById("boot");
 if(b)b.innerHTML='<b>MouldMaster is offline</b><p>The new Windows training layer needs one successful online launch before it can be reused offline. Reconnect and open MouldMaster again. The Windows launcher verification/backup system remains unchanged.</p><button onclick="location.reload()">Try again</button>';
 console.error("MouldMaster Windows content loader:",err);
}
})();
</script>
</body>
</html>
