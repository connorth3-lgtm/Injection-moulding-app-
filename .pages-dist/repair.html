<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101d">
  <title>MouldMaster repair</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08101d;color:#edf5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(560px,92vw);padding:28px;border:1px solid #28415f;border-radius:18px;background:#101c2f}.card b{font-size:22px}.card p{color:#b7c9dc;line-height:1.55}.ok{color:#7ce8d2}.err{color:#ff9ca8}button{padding:10px 14px;border-radius:10px;border:1px solid #41658d;background:#1a2b45;color:#fff}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <b>MouldMaster browser repair</b>
    <p id="status">Removing only old MouldMaster offline app files…</p>
  </main>
  <script>
  (async function(){
    'use strict';
    const status=document.getElementById('status');
    if(!navigator.onLine){status.className='err';status.innerHTML='Connect to the internet, then reload this repair page.';return}
    try{
      if('serviceWorker' in navigator){
        const scope=new URL('./',location.href).href;
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r=>r.scope.startsWith(scope)).map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('mouldmaster-static-')).map(k=>caches.delete(k)));
      }
      try{localStorage.removeItem('mm_runtime_coherence_reset')}catch(_){ }
      try{sessionStorage.removeItem('mm_runtime_coherence_reset')}catch(_){ }
      status.className='ok';status.textContent='Old MouldMaster app files removed. Loading the current web version…';
      const target=new URL('./',location.href);target.searchParams.set('mmFresh','repair-20260825-'+Date.now());
      setTimeout(()=>location.replace(target.href),250);
    }catch(err){
      status.className='err';status.innerHTML='Automatic repair could not finish. <button type="button" id="retry">Try again</button>';
      document.getElementById('retry')?.addEventListener('click',()=>location.reload());
      console.error('[MouldMaster] Browser repair failed',err);
    }
  })();
  </script>
</body>
</html>
