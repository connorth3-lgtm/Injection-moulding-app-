<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <title>References · MouldMaster Academy</title>
  <style>
    :root{color-scheme:dark;background:#07101c}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07101c;color:#eef7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{padding:0 0 max(18px,env(safe-area-inset-bottom))}
    .mm-reference-page-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(7,16,28,.97);border-bottom:1px solid #253a54;backdrop-filter:blur(10px)}
    .mm-reference-page-top button{border:1px solid #49627e;background:#172941;color:#fff;border-radius:10px;padding:9px 12px;font:700 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
    .mm-reference-page-top strong{font-size:15px}.mm-reference-page-top span{color:#9fb5cf;font-size:12px}
    #mmrd-open{display:none!important}
    .mmrd{position:static!important;inset:auto!important;z-index:auto!important;background:transparent!important;display:block!important;align-items:stretch!important;justify-content:stretch!important;padding:12px!important;min-height:calc(100dvh - 56px)!important;color:#eef7ff!important}
    .mmrd[data-open="0"],.mmrd[data-open="1"]{display:block!important}
    .mmrd-panel{width:min(1100px,100%)!important;max-height:none!important;height:auto!important;min-height:0!important;margin:0 auto!important;overflow:visible!important;border-radius:16px!important;box-shadow:none!important}
    .mmrd-head{position:static!important;padding-top:16px!important}
    .mmrd-body{overflow:visible!important;padding-bottom:28px!important}
    .mmrd-close{display:none!important}
    .mm-ref-kind{margin:0 0 5px!important;color:#72e6cd!important;font-size:11px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.06em!important}
    .mmrd-card a{display:inline-flex;min-height:40px;align-items:center;color:#8ee8d7;font-weight:800;text-decoration:none}.mmrd-card a:hover{text-decoration:underline}
    @media(max-width:650px){
      .mmrd{padding:10px!important}
      .mmrd-panel{height:auto!important;max-height:none!important;border:1px solid #304866!important;border-radius:14px!important}
      .mmrd-head{padding-top:14px!important}
      .mmrd-body{padding-bottom:24px!important}
    }
  </style>
</head>
<body>
  <header class="mm-reference-page-top">
    <button id="mm-reference-back" type="button" aria-label="Back to MouldMaster">← Back</button>
    <div><strong>References</strong><br><span>Standards, materials, defects, process signals and troubleshooting evidence in one place.</span></div>
  </header>
  <script src="./source-library.js"></script>
  <script src="./reference-data.js"></script>
  <script src="./reference-deep-dive.js"></script>
  <script src="./reference-research-extension.js"></script>
  <script src="./reference-20x-extension.js"></script>
  <script src="./reference-2026-expansion.js"></script>
  <script>
  (function(){
    'use strict';
    const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
    const arr=v=>Array.isArray(v)?v:[];
    const first=(v,n=2)=>arr(v).slice(0,n).join(' · ');
    const lower=v=>String(v??'').toLowerCase();
    const groups=[['all','All'],['sources','Standards & sources'],['materials','Materials'],['defects','Defects'],['process','Process'],['equipment','Equipment'],['quality-safety','Quality & safety']];
    function sourceEntries(){
      const seen=new Set(),rows=[];
      for(const [category,items] of Object.entries(window.MM_SOURCE_LIBRARY||{}))for(const source of arr(items)){
        const title=source?.[0],description=source?.[1],url=source?.[2];
        if(!title||!url||seen.has(url))continue;
        seen.add(url);rows.push({kind:'source',group:'sources',category,title,description,url,search:[title,description,url,category].join(' ')});
      }
      return rows;
    }
    function practicalEntries(){
      const data=window.MM_REFERENCE_DATA||{},rows=[];
      const push=(group,category,items,titleOf,summaryOf)=>{for(const item of arr(items))rows.push({kind:'practical',group,category,title:titleOf(item),description:summaryOf(item),search:JSON.stringify(item)})};
      push('materials','Material',data.materials,x=>x.name,x=>`${x.family||''}${x.verify?` · Verify: ${x.verify}`:''}`);
      push('defects','Defect',data.defects,x=>x.name,x=>`${x.evidence||''}${x.check?.length?` · Check: ${first(x.check)}`:''}`);
      push('process','Process signal',data.signals,x=>x.name,x=>`${x.meaning||''}${x.use?` · Use: ${x.use}`:''}`);
      push('equipment','Tooling',data.tooling,x=>x.name,x=>`${x.purpose||''}${x.remember?` · ${x.remember}`:''}`);
      push('equipment','Machine',data.machine,x=>x.name,x=>`${x.role||''}${x.evidence?` · Evidence: ${x.evidence}`:''}`);
      push('quality-safety','Quality',data.quality,x=>x.name,x=>`${x.purpose||''}${x.risk?` · Risk: ${x.risk}`:''}`);
      push('quality-safety','Safety',data.safety,x=>x.name,x=>`${x.check||''}${x.never?` · Never: ${x.never}`:''}`);
      push('process','Troubleshooting',data.troubleshooting,x=>x.name,x=>`${x.pattern||''}${x.first?.length?` · Check first: ${first(x.first)}`:''}`);
      push('all','Glossary',data.glossary,x=>x?.[0]||'',x=>x?.[1]||'');
      return rows;
    }
    function card(row){
      const source=row.kind==='source';
      return `<article class="mmrd-card" data-mm-reference-kind="${esc(row.kind)}"><p class="mm-ref-kind">${esc(source?`Source · ${row.category}`:row.category)}</p><h3>${esc(row.title)}</h3><p>${esc(row.description)}</p>${source?`<p><a href="${esc(row.url)}" target="_blank" rel="noopener">Open source ↗</a></p>`:''}</article>`;
    }
    function enhance(){
      const modal=document.querySelector('.mmrd'),tabsBox=modal?.querySelector('.mmrd-tabs'),search=modal?.querySelector('.mmrd-search'),grid=modal?.querySelector('.mmrd-grid'),count=modal?.querySelector('.mmrd-count');
      if(!modal||!tabsBox||!search||!grid||!count||!window.MM_REFERENCE_DATA){setTimeout(enhance,35);return}
      if(modal.dataset.mmUnifiedReferences==='1')return;modal.dataset.mmUnifiedReferences='1';
      const title=modal.querySelector('.mmrd-title h2'),intro=modal.querySelector('.mmrd-title p');
      if(title)title.textContent='References';if(intro)intro.textContent='Search the complete practical and authoritative reference library from one place.';
      search.placeholder='Search all references…';search.setAttribute('aria-label','Search all references');modal.setAttribute('aria-label','MouldMaster references');
      const rows=[...sourceEntries(),...practicalEntries()];let active='all';tabsBox.replaceChildren();
      for(const [key,label] of groups){const button=document.createElement('button');button.type='button';button.textContent=label;button.dataset.key=key;button.setAttribute('role','tab');button.setAttribute('aria-selected',String(key===active));button.addEventListener('click',()=>{active=key;for(const child of tabsBox.children)child.setAttribute('aria-selected',String(child===button));render()});tabsBox.appendChild(button)}
      function render(){const q=lower(search.value.trim());const filtered=rows.filter(row=>(active==='all'||row.group===active)&&(!q||lower(`${row.title} ${row.description} ${row.search}`).includes(q)));count.textContent=`${filtered.length} reference${filtered.length===1?'':'s'}${active==='all'?'':` in ${groups.find(x=>x[0]===active)?.[1]||active}`}`;grid.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="mmrd-empty">No matching references.</div>'}
      search.addEventListener('input',()=>queueMicrotask(render));render();window.MM_REFERENCE_LIBRARY_MODE='unified-v1';window.MM_REFERENCE_LIBRARY_COUNTS={all:rows.length,sources:rows.filter(x=>x.group==='sources').length};
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhance,{once:true});else enhance();
  })();
  </script>
  <script>
  (function(){
    'use strict';
    function back(){
      if(document.referrer&&new URL(document.referrer,location.href).origin===location.origin){history.back();return}
      location.replace('./index.html');
    }
    function mount(){
      const modal=document.querySelector('.mmrd');
      if(!modal){setTimeout(mount,25);return}
      document.getElementById('mmrd-open')?.setAttribute('aria-hidden','true');
      modal.dataset.open='1';
      modal.setAttribute('role','main');
      modal.setAttribute('aria-modal','false');
      modal.setAttribute('aria-label','MouldMaster references');
      document.getElementById('mm-reference-back')?.addEventListener('click',back);
      document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();back()}},{capture:true});
      window.MM_REFERENCE_DATA_PAGE_MODE='standalone-document-unified-library';
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
  })();
  </script>
</body>
</html>
