<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08101d">
  <meta name="description" content="A guided injection moulding learning platform from beginner to expert.">
  <title>MouldMaster Academy — Working Standalone Edition</title>
  <style>

:root{
  --bg:#07101c;--bg2:#0a1423;--panel:#101c2f;--panel2:#14233a;--line:#283b59;
  --text:#edf5ff;--muted:#98acc9;--accent:#55d6be;--accent2:#69a8ff;
  --good:#7ce6a3;--warn:#ffd166;--bad:#ff7b7b;--ink:#07131b;--shadow:0 18px 46px rgba(0,0,0,.24)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 70% -10%,#172c48 0,transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(6,14,25,.96);border-right:1px solid var(--line);padding:18px 14px;z-index:4}
.brand{display:flex;gap:11px;align-items:center;padding:4px 7px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);display:grid;place-items:center;font-weight:900}
.brand strong{display:block;font-size:17px}.brand small{color:var(--muted)}
.profile-mini{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0c1829;margin-bottom:13px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#1c304d;color:#dbeaff;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tiny{font-size:12px}.muted{color:var(--muted)}
nav{display:grid;gap:3px}
nav button{border:0;background:transparent;color:#bfd0e6;border-radius:10px;padding:10px 11px;text-align:left;display:flex;gap:11px;align-items:center}
nav button:hover,nav button.active{background:#15243a;color:#fff}
.sidebar-foot{margin-top:18px;padding:12px 7px;color:var(--muted)}
.bar{height:7px;background:#21324a;border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.main{padding:25px clamp(16px,3vw,38px) 60px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}
.topbar h1{font-size:30px;margin:0}.topbar p{margin:5px 0 0;color:var(--muted)}
.top-actions{display:flex;gap:9px}
.primary,.secondary,.ghost,.danger{border-radius:10px;padding:10px 14px;border:1px solid transparent}
.primary{background:linear-gradient(135deg,var(--accent),#80e7cf);color:var(--ink);font-weight:800}
.secondary{background:#1a2b45;color:#f2f7ff;border-color:#314865}
.ghost{background:transparent;color:#bfd0e7;border-color:#314865}
.danger{background:#3a1d26;color:#ffc4c4;border-color:#653242}
.card{background:linear-gradient(180deg,rgba(19,33,54,.96),rgba(13,25,43,.96));border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:16px}
.hero-main{padding:28px;min-height:270px;position:relative;overflow:hidden}
.hero-main:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(85,214,190,.22),transparent 68%);right:-90px;top:-100px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.hero-main h2{font-size:34px;line-height:1.12;max-width:760px;margin:9px 0 11px}
.hero-main p{color:#b3c5dc;line-height:1.65;max-width:790px}
.hero-buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.statbox{padding:20px}.statline{padding:14px 0;border-bottom:1px solid #263954}.statline:last-child{border-bottom:0}
.statline b{display:block;font-size:28px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:24px;margin-top:6px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:27px 0 12px}.section-head h2,.section-head h3{margin:0}.section-head p{color:var(--muted);margin:5px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.course-card{padding:18px;min-height:245px;display:flex;flex-direction:column}
.course-card h3{font-size:18px;margin:8px 0}.course-card p{font-size:13px;color:var(--muted);line-height:1.55;flex:1}
.pill{display:inline-flex;width:max-content;align-items:center;padding:5px 8px;border-radius:999px;background:#172b47;color:#bad1ec;font-size:11px}
.course-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.mini-bar{height:6px;background:#22344d;border-radius:99px;overflow:hidden;margin-top:11px}.mini-bar span{display:block;height:100%;background:var(--accent)}
.learning-map{display:grid;gap:10px}
.track-row{padding:16px;display:grid;grid-template-columns:165px 1fr 160px;gap:16px;align-items:center}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.lesson-body{padding:26px}.lesson-body h2{font-size:30px;margin:7px 0 12px}.lesson-body h3{margin-top:27px}.lesson-body p,.lesson-body li{color:#c6d5e7;line-height:1.72}
.callout{background:#10263a;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:18px 0;color:#d5ece7}
.lesson-side{padding:18px;position:sticky;top:18px;height:max-content}
.lesson-list{display:grid;gap:6px;max-height:500px;overflow:auto;margin-top:12px}
.lesson-list button{border:1px solid transparent;background:#101f34;color:#bcd0e8;border-radius:9px;padding:9px;text-align:left;font-size:12px}
.lesson-list button.active{border-color:#4c6f98;background:#19304e;color:#fff}
.note-area{width:100%;min-height:90px;margin-top:8px;background:#0b1728;border:1px solid #304562;border-radius:9px;color:#fff;padding:10px;resize:vertical}
.visual-wrap{padding:22px}
.machine-scene{height:310px;position:relative;background:linear-gradient(180deg,#0b1728,#0f2035);border:1px solid #2c4465;border-radius:16px;overflow:hidden}
.barrel{position:absolute;left:8%;top:42%;width:48%;height:58px;background:#354965;border-radius:8px;border:4px solid #5a6f8e}
.screw{position:absolute;left:10%;top:49%;width:44%;height:20px;background:repeating-linear-gradient(135deg,#9db0c7 0 8px,#596d87 8px 15px);border-radius:10px;animation:screwSpin 1.2s linear infinite}
.nozzle{position:absolute;left:55%;top:49%;width:10%;height:22px;background:#6b7e96;clip-path:polygon(0 0,100% 30%,100% 70%,0 100%)}
.mould{position:absolute;left:66%;top:26%;width:25%;height:150px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mould>div{background:#38506e;border:4px solid #667e9f;border-radius:5px}
.cavity{position:absolute;left:74%;top:45%;width:9%;height:52px;border-radius:40% 40% 25% 25%;background:var(--accent);opacity:.85;transform:scale(.2);animation:fillCavity 5s ease-in-out infinite}
.flow-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffc857;top:51%;left:54%;animation:flow 5s linear infinite}
@keyframes screwSpin{50%{transform:translateX(-5px)}}
@keyframes fillCavity{0%,20%{transform:scale(.15);opacity:.3}45%,75%{transform:scale(1);opacity:.9}90%,100%{transform:scale(.85);opacity:.65}}
@keyframes flow{0%,20%{left:54%;opacity:0}30%{opacity:1}55%{left:78%;opacity:1}70%,100%{left:78%;opacity:0}}
.phase-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.phase-tabs button{padding:8px 10px;border-radius:999px;border:1px solid #34506f;background:#14243a;color:#c8d8ea}
.form-card{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
label{font-size:12px;color:#b5c6db} input,select,textarea{width:100%;margin-top:5px;background:#0c1728;border:1px solid #304562;color:#fff;border-radius:9px;padding:10px}
.range-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}
.range-row input[type=range]{padding:0}
.output-panel{padding:18px}.risk{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.riskbar{height:9px;background:#22344e;border-radius:99px;overflow:hidden}.riskbar span{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}
.part-visual{height:220px;border-radius:14px;background:#0c182a;display:grid;place-items:center;border:1px solid #2a4161;position:relative;overflow:hidden}
.part-shape{width:150px;height:110px;border-radius:20px 20px 30px 30px;background:#5bcfb8;box-shadow:inset 0 0 25px rgba(0,0,0,.25);position:relative}
.part-shape:before{content:"";position:absolute;width:52px;height:35px;border-radius:50%;background:#0c182a;left:49px;top:36px}
.defect-overlay{position:absolute;inset:0;pointer-events:none}
.defect-card{padding:17px}.defect-card h3{margin:8px 0}.defect-card p{font-size:13px;color:var(--muted);line-height:1.55}
.cause-list{display:grid;gap:7px}.cause{padding:9px;background:#102037;border-radius:8px;font-size:12px}
.scenario{padding:18px}.scenario p{color:#bfd0e4;line-height:1.6}.choice{display:block;width:100%;text-align:left;border:1px solid #34506f;background:#11223a;color:#e5effb;border-radius:9px;padding:10px;margin:8px 0}
.choice:hover{background:#19304d}.feedback{padding:11px;border-radius:9px;margin-top:10px;background:#0e2631}
.chat{padding:18px}.chat-log{height:390px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:78%;padding:11px 13px;border-radius:13px;line-height:1.5;font-size:14px}
.msg.user{align-self:flex-end;background:#21466a}.msg.bot{align-self:flex-start;background:#11233a;border:1px solid #29425f}
.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.exam-card{padding:18px}.question{padding:13px;background:#0f1e33;border-radius:10px;margin:12px 0}.option{display:block;padding:8px 9px;border:1px solid #2f4868;border-radius:8px;margin:7px 0}
.cert{padding:28px;text-align:center;min-height:300px}.cert h2{font-size:30px}.seal{width:82px;height:82px;border:5px double var(--accent);border-radius:50%;display:grid;place-items:center;margin:16px auto;color:var(--accent);font-weight:900}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #263a57;font-size:13px}.table th{color:#8fa8c8}
.glossary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.term{padding:14px}.term b{color:var(--accent)}.term p{font-size:13px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:grid;place-items:center;padding:18px}.modal-card{width:min(900px,96vw);max-height:88vh;overflow:auto;background:#0e1b2e;border:1px solid #34506f;border-radius:16px;padding:22px;position:relative}.modal-close{position:absolute;right:10px;top:8px;background:transparent;color:#fff;border:0;font-size:28px}
.toast{position:fixed;right:20px;bottom:20px;background:#102c2b;border:1px solid #285d58;color:#dcfff5;border-radius:10px;padding:11px 14px;z-index:30}
.search-results{display:grid;gap:8px}.search-item{padding:10px;border:1px solid #304764;border-radius:9px;background:#101f34}
@media(max-width:1100px){#app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.sidebar nav{grid-template-columns:repeat(3,1fr)}.hero,.lesson-layout{grid-template-columns:1fr}.lesson-side{position:static}.grid{grid-template-columns:repeat(2,1fr)}.kpis,.grid4{grid-template-columns:repeat(2,1fr)}.track-row{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.main{padding:16px}.sidebar nav{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.grid,.grid2,.kpis,.grid4,.glossary-grid,.form-grid{grid-template-columns:1fr}.hero-main h2{font-size:27px}.machine-scene{height:240px}.barrel{left:3%;width:50%}.mould{left:65%;width:30%}}
@media print{.sidebar,.topbar,.no-print{display:none!important}#app{display:block}.main{padding:0}.cert{border:8px double #333;color:#111;background:white;box-shadow:none}.cert *{color:#111!important}}


/* ---------- Friendly Edition UX ---------- */
:focus-visible{outline:3px solid #8fdccc;outline-offset:3px}
.skip-link{position:fixed;left:14px;top:-60px;z-index:100;background:#fff;color:#07131b;padding:10px 14px;border-radius:8px;font-weight:800}
.skip-link:focus{top:14px}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#6f87aa;padding:14px 11px 4px}
.more-nav{margin-top:8px;border-top:1px solid #21344e;padding-top:8px}
.more-nav summary{cursor:pointer;color:#91a8c5;font-size:12px;padding:10px 11px;border-radius:9px;user-select:none}
.more-nav summary:hover{background:#112038;color:#fff}
.more-nav button{width:100%}
.mobile-nav{display:none}
.friendly-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:16px}
.next-step{padding:26px;position:relative;overflow:hidden}
.next-step:after{content:"";position:absolute;right:-80px;top:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(85,214,190,.18),transparent 68%);pointer-events:none}
.next-step h2{font-size:31px;line-height:1.15;margin:9px 0 9px;max-width:760px}
.next-step p{max-width:760px;color:#b9cbe1;line-height:1.65}
.progress-card{padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.progress-ring{--p:0;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#233650 0);position:relative;margin:4px auto 12px}
.progress-ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:#0f1c2f}
.progress-ring strong{position:relative;font-size:28px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick-action{padding:17px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#14243a,#0f1c2e);color:var(--text);border-radius:15px;min-height:135px}
.quick-action:hover{transform:translateY(-2px);border-color:#46688e}
.quick-action .icon{font-size:24px;display:block;margin-bottom:14px}
.quick-action b{display:block;margin-bottom:5px}.quick-action small{color:var(--muted);line-height:1.45}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how-card{padding:18px}.step-num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#193854;color:#bff6e9;font-weight:900;margin-bottom:10px}
.track-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.status-dot{width:9px;height:9px;border-radius:50%;background:#425a78}.status-dot.done{background:var(--good)}.status-dot.active{background:var(--accent)}
.lesson-breadcrumb{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:13px;flex-wrap:wrap}
.lesson-breadcrumb button{border:0;background:transparent;color:#bad2ef;padding:0}
.lesson-header-card{padding:22px;margin-bottom:14px}
.lesson-header-card h2{font-size:31px;margin:7px 0 8px}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.content-block{padding:18px;border:1px solid #2a405f;border-radius:13px;background:#0e1c30;margin:12px 0}
.content-block h3{margin:0 0 9px;font-size:17px}.content-block p:last-child{margin-bottom:0}
.lesson-actions-sticky{position:sticky;bottom:12px;z-index:3;padding:10px;border:1px solid #315071;border-radius:13px;background:rgba(11,24,40,.94);backdrop-filter:blur(10px);display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.onboarding{padding:4px}
.onboarding h2{font-size:30px;margin:7px 0 8px}.onboarding p{color:var(--muted);line-height:1.6}
.choice-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.choice-card{border:1px solid #304966;border-radius:12px;background:#101f34;color:#dbe9f8;padding:14px;text-align:left}
.choice-card input{width:auto;margin:0 7px 0 0}
.choice-card:has(input:checked){border-color:var(--accent);background:#13302f}
.daily-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.daily-select label{border:1px solid #304966;border-radius:10px;padding:10px;background:#101f34;text-align:center}
.daily-select input{width:auto;margin:0 5px 0 0}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:#142337;border:1px solid #29425f;color:#bfd0e4;font-size:13px;line-height:1.5}
.empty-friendly{text-align:center;padding:30px}.empty-friendly .big-icon{font-size:40px;margin-bottom:8px}
@media(max-width:1100px){
  .friendly-hero{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
  body{padding-bottom:74px}
  .sidebar{display:none}
  #app{display:block}
  .mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(7,16,28,.97);border-top:1px solid var(--line);padding:7px 6px max(7px,env(safe-area-inset-bottom))}
  .mobile-nav button{border:0;background:transparent;color:#98acc9;padding:5px;border-radius:9px;display:grid;gap:2px;place-items:center;font-size:18px}
  .mobile-nav button span{font-size:10px}
  .mobile-nav button.active{color:#fff;background:#142740}
  .quick-grid,.how-grid,.choice-cards,.daily-select{grid-template-columns:1fr}
  .next-step{padding:20px}.next-step h2{font-size:25px}
  .lesson-header-card h2{font-size:25px}
  .lesson-actions-sticky{bottom:78px;display:grid;grid-template-columns:1fr 1fr}
  .lesson-actions-sticky .primary{grid-column:1/-1}
  .topbar{position:sticky;top:0;z-index:8;background:rgba(7,16,28,.94);backdrop-filter:blur(10px);padding:8px 0 10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- UK / US / NZ standards layer ---------- */
.region-switch{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.region-switch button{border:1px solid #34506f;background:#11223a;color:#c7d8ea;border-radius:999px;padding:8px 11px}
.region-switch button.active{background:#173c3a;border-color:var(--accent);color:#e9fffa}
.standard-card{padding:18px}.standard-card h3{margin:7px 0}.standard-card p{color:var(--muted);line-height:1.55}
.standard-link{display:inline-block;margin-top:7px;color:#a9d8ff;text-decoration:none}.standard-link:hover{text-decoration:underline}
.region-banner{padding:12px 14px;border:1px solid #315071;border-radius:11px;background:#102238;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.answer-review{display:grid;gap:9px;margin-top:14px}.answer-row{padding:11px;border:1px solid #2b4260;border-radius:9px;background:#0d1c30}.answer-row.correct{border-color:#326c5f}.answer-row.incorrect{border-color:#71414b}
.ref{font-size:11px;color:#86a8ca;margin-top:6px}.legal-note{padding:14px;border-radius:11px;background:#2a2412;border:1px solid #66592b;color:#f7e8ad;line-height:1.5}


/* =========================================================
   Engaging Edition — presentation only.
   Audited question/answer data remains unchanged.
   ========================================================= */
:root{
  --xp:#ffd166;
  --violet:#a88cff;
}
button,.card,.quick-action,.course-card,.choice,.option{
  transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.primary:hover,.secondary:hover,.ghost:hover{transform:translateY(-1px)}
.course-card:hover,.standard-card:hover{transform:translateY(-2px);border-color:#3f5c81}
.fun-hud{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fun-chip{display:inline-flex;gap:5px;align-items:center;padding:5px 8px;border-radius:999px;background:#162840;border:1px solid #29425f;font-size:10px;color:#bed0e8}
.fun-chip.xp{color:#ffe59c;border-color:#5b4c24;background:#2b2516}
.fun-chip.streak{color:#ffc3a6;border-color:#6d402c;background:#2c1c17}
.fun-chip.level{color:#d9d0ff;border-color:#51437d;background:#201b37}
.fun-dashboard{
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.65fr);gap:14px;margin-bottom:16px
}
.mission-card{
  padding:22px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 92% 12%,rgba(168,140,255,.18),transparent 30%),
  linear-gradient(135deg,rgba(20,38,61,.98),rgba(14,29,48,.98))
}
.mission-card:before{content:"";position:absolute;width:120px;height:120px;border:1px solid rgba(85,214,190,.18);border-radius:28px;right:-20px;bottom:-46px;transform:rotate(25deg)}
.mission-card h2{margin:7px 0 8px;font-size:26px}
.mission-card p{color:#b9cbe1;line-height:1.55;max-width:720px}
.mission-label{display:flex;align-items:center;gap:8px;color:#a9c2df;font-size:12px}
.mission-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(85,214,190,.7)}
.level-card{padding:20px}
.level-card h3{margin:6px 0}
.level-track{height:12px;border-radius:999px;background:#1d304a;overflow:hidden;margin:12px 0 7px}
.level-track span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--violet),var(--xp));border-radius:999px}
.level-next{font-size:11px;color:var(--muted)}
.daily-card{
  margin-top:14px;padding:16px;border:1px solid #4a426a;background:linear-gradient(135deg,#1d1d35,#13263a);border-radius:14px
}
.daily-card .daily-icon{font-size:28px;float:right;margin-left:12px}
.daily-card h3{margin:5px 0}.daily-card p{font-size:13px;color:#b8c7da;line-height:1.5}
.achievement-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.achievement{
  padding:14px;border-radius:13px;border:1px solid #2b4160;background:#101e32;min-height:115px;position:relative;overflow:hidden
}
.achievement.locked{opacity:.48;filter:saturate(.45)}
.achievement .medal{font-size:25px}.achievement b{display:block;margin:7px 0 4px}.achievement small{color:var(--muted);line-height:1.35}
.achievement.unlocked:after{content:"✓";position:absolute;right:8px;top:6px;color:var(--good);font-weight:900}
.xp-pop{
  position:fixed;right:22px;top:86px;z-index:45;padding:10px 14px;border-radius:999px;
  background:#2b2516;border:1px solid #79652c;color:#ffe59c;font-weight:900;
  box-shadow:0 14px 35px rgba(0,0,0,.35);animation:xpFloat 1.35s ease both
}
@keyframes xpFloat{0%{opacity:0;transform:translateY(16px) scale(.9)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1.05)}}
.celebration-layer{position:fixed;inset:0;pointer-events:none;z-index:44;overflow:hidden}
.confetti-bit{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:confettiDrop var(--dur,1.5s) ease-in forwards;transform:rotate(var(--rot,0deg))}
@keyframes confettiDrop{to{transform:translate3d(var(--drift,0px),105vh,0) rotate(720deg);opacity:.15}}
.fun-callout{padding:13px 15px;border:1px solid #3c5070;background:#111f34;border-radius:12px;margin:12px 0;display:flex;gap:11px;align-items:flex-start}
.fun-callout .fun-icon{font-size:22px}
.lesson-quest{padding:14px;border:1px solid #3a4e70;border-radius:12px;background:linear-gradient(135deg,#111f36,#14283d);margin-bottom:13px}
.lesson-quest b{display:block;margin-bottom:4px}.lesson-quest small{color:var(--muted);line-height:1.45}
.scenario-scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.scorebox{padding:13px;border:1px solid #2d4565;background:#0f1f34;border-radius:12px;text-align:center}
.scorebox strong{font-size:22px;display:block}.scorebox span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.arena-banner{padding:20px;border-radius:15px;border:1px solid #4b426f;background:radial-gradient(circle at 88% 20%,rgba(168,140,255,.2),transparent 30%),#111f35}
.arena-banner h2{margin:6px 0}.arena-banner p{color:#bbcbe0;line-height:1.55;max-width:800px}
.boss-progress{display:flex;gap:5px;margin:10px 0}.boss-progress span{height:7px;flex:1;border-radius:999px;background:#283c58}.boss-progress span.done{background:var(--accent)}
.answer-row.correct{box-shadow:inset 3px 0 0 var(--good)}
.answer-row.incorrect{box-shadow:inset 3px 0 0 var(--bad)}
.question{position:relative}
.question:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px;background:#304766}
.question:has(input:checked):before{background:var(--accent2)}
.option:hover{border-color:#55789d;background:#152840}
.option:has(input:checked){border-color:#68a7ff;background:#162e4a}
.exam-integrity{
  padding:11px 13px;border-radius:10px;border:1px solid #35526f;background:#0f2334;color:#c8d9ec;font-size:12px;line-height:1.5;margin-bottom:12px
}
.fun-settings{display:grid;gap:9px;margin-top:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border:1px solid #2d4565;border-radius:10px;background:#101e32}
.toggle-row input{width:auto;margin:0}
.sim-challenge{padding:15px;border:1px solid #4b426f;background:#161b35;border-radius:13px;margin-bottom:12px}
.sim-challenge h3{margin:5px 0}.sim-challenge p{font-size:13px;color:#b9c9dc;line-height:1.45}
.integrity-lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#a9d9c9}
@media(max-width:1100px){.fun-dashboard{grid-template-columns:1fr}.achievement-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .achievement-grid{grid-template-columns:1fr 1fr}
  .scenario-scoreboard{grid-template-columns:repeat(3,1fr)}

}
@media(prefers-reduced-motion:reduce){
  .confetti-bit,.xp-pop{animation:none!important}
}
