name: One-shot engineering release sync

on:
  push:
    branches: [engineering-simulator-accuracy-2026-09-11]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: engineering-simulator-accuracy-2026-09-11
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Advance governed browser release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old = '2026.09.10.9'
          new = '2026.09.11.1'
          version_path = Path('version.json')
          payload = json.loads(version_path.read_text(encoding='utf-8'))
          if payload.get('web_release') != old:
              raise SystemExit(f"Unexpected starting web_release: {payload.get('web_release')!r}")
          payload['web_release'] = new
          version_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          for name in ['qa_release.py', 'qa_release_docs.py', 'README.md', 'support.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{name} does not contain expected old web release')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/sync_web_release.py
      - name: Verify synchronized release contract
        run: |
          node --check src/domains/engineering/engineer-simulator-ui.js
          node qa_engineer_simulator_units.cjs
          python qa_web_release_identity.py
          python qa_release.py
          python qa_release_docs.py
      - name: Commit synchronized release and remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-engineering-release-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json service-worker.js index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html qa_engineer_simulator_units.cjs src/domains/engineering/engineer-simulator-ui.js
          git diff --cached --check
          git commit -m 'Bump web release for engineering simulator units'
          git push origin HEAD:engineering-simulator-accuracy-2026-09-11
