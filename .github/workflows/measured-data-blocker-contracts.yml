name: MouldMaster Measured Data Blocker Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/cross-process-upper-workpiece-dictionary-v1.json'
      - 'data/cross-process-upper-pressure-state-clarification-2026-08-30.json'
      - 'data/evidence-clearance-pass-2026-08-30.md'
      - 'data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json'
      - 'tools/profile_cross_process_upper_workpiece.py'
      - 'qa_cross_process_upper_contract.py'
      - 'qa_cross_process_upper_clarification.py'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/warwick-demoulding-source-contract-v1.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_warwick_origin_export_contract.py'
      - 'data/kamp-foxconn-origin-rights-review-2026-08-29.json'
      - 'qa_kamp_foxconn_rights.py'
      - 'data/inqcim-request-contract-2026-08-30.json'
      - 'data/inqcim-author-response-manifest-template-v1.json'
      - 'data/inqcim-author-response-promotion-contract-v1.json'
      - 'tools/validate_inqcim_author_response.py'
      - 'qa_inqcim_request_contract.py'
      - 'qa_inqcim_author_response_validator.py'
      - 'data/bottle-cap-confidential-access-contract-2026-08-30.json'
      - 'data/bottle-cap-owner-authorization-manifest-template-v1.json'
      - 'data/bottle-cap-confidential-promotion-contract-v1.json'
      - 'tools/validate_bottle_cap_authorized_profile.py'
      - 'qa_bottle_cap_confidential_contract.py'
      - 'qa_bottle_cap_authorized_profile.py'
      - 'qa_measured_data_blocker_contracts.py'
      - '.github/workflows/measured-data-blocker-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'data/cross-process-upper-workpiece-dictionary-v1.json'
      - 'data/cross-process-upper-pressure-state-clarification-2026-08-30.json'
      - 'data/evidence-clearance-pass-2026-08-30.md'
      - 'data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json'
      - 'tools/profile_cross_process_upper_workpiece.py'
      - 'qa_cross_process_upper_contract.py'
      - 'qa_cross_process_upper_clarification.py'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/warwick-demoulding-source-contract-v1.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_warwick_origin_export_contract.py'
      - 'data/kamp-foxconn-origin-rights-review-2026-08-29.json'
      - 'qa_kamp_foxconn_rights.py'
      - 'data/inqcim-request-contract-2026-08-30.json'
      - 'data/inqcim-author-response-manifest-template-v1.json'
      - 'data/inqcim-author-response-promotion-contract-v1.json'
      - 'tools/validate_inqcim_author_response.py'
      - 'qa_inqcim_request_contract.py'
      - 'qa_inqcim_author_response_validator.py'
      - 'data/bottle-cap-confidential-access-contract-2026-08-30.json'
      - 'data/bottle-cap-owner-authorization-manifest-template-v1.json'
      - 'data/bottle-cap-confidential-promotion-contract-v1.json'
      - 'tools/validate_bottle_cap_authorized_profile.py'
      - 'qa_bottle_cap_confidential_contract.py'
      - 'qa_bottle_cap_authorized_profile.py'
      - 'qa_measured_data_blocker_contracts.py'
      - '.github/workflows/measured-data-blocker-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocker-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile qa_measured_data_blocker_contracts.py
          python -m py_compile tools/profile_cross_process_upper_workpiece.py
          python -m py_compile qa_cross_process_upper_contract.py
          python -m py_compile qa_cross_process_upper_clarification.py
          python -m py_compile qa_kamp_foxconn_rights.py
          python -m py_compile qa_inqcim_request_contract.py
          python -m py_compile qa_inqcim_author_response_validator.py
          python -m py_compile tools/validate_inqcim_author_response.py
          python -m py_compile qa_bottle_cap_confidential_contract.py
          python -m py_compile tools/validate_bottle_cap_authorized_profile.py
          python -m py_compile qa_bottle_cap_authorized_profile.py
          python -m py_compile tools/validate_warwick_origin_export.py
          python -m py_compile qa_warwick_origin_export_contract.py
      - name: Validate upper specialist parser contract
        run: python qa_cross_process_upper_contract.py
      - name: Validate upper semantic clarification boundary
        run: python qa_cross_process_upper_clarification.py
      - name: Validate KAMP and Foxconn rights contracts
        run: python qa_kamp_foxconn_rights.py
      - name: Validate INQCIM request-only contract
        run: python qa_inqcim_request_contract.py
      - name: Validate INQCIM author-response promotion path
        run: python qa_inqcim_author_response_validator.py
      - name: Validate bottle-cap confidential access contract
        run: python qa_bottle_cap_confidential_contract.py
      - name: Validate bottle-cap authorized profiling paths
        run: python qa_bottle_cap_authorized_profile.py
      - name: Validate Warwick Origin export contract
        run: |
          python qa_warwick_origin_export_contract.py
          python tools/validate_warwick_origin_export.py --manifest data/warwick-origin-export-manifest-template-v1.json
      - name: Validate fail-closed source contracts
        run: python qa_measured_data_blocker_contracts.py
