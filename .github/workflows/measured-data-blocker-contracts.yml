name: MouldMaster Measured Data Blocker Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/cross-process-upper-workpiece-dictionary-v1.json'
      - 'data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json'
      - 'tools/profile_cross_process_upper_workpiece.py'
      - 'qa_cross_process_upper_contract.py'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/warwick-demoulding-source-contract-v1.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_warwick_origin_export_contract.py'
      - 'qa_measured_data_blocker_contracts.py'
      - '.github/workflows/measured-data-blocker-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'data/cross-process-upper-workpiece-dictionary-v1.json'
      - 'data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json'
      - 'tools/profile_cross_process_upper_workpiece.py'
      - 'qa_cross_process_upper_contract.py'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/warwick-demoulding-source-contract-v1.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_warwick_origin_export_contract.py'
      - 'qa_measured_data_blocker_contracts.py'
      - '.github/workflows/measured-data-blocker-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocker-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile qa_measured_data_blocker_contracts.py
          python -m py_compile tools/profile_cross_process_upper_workpiece.py
          python -m py_compile qa_cross_process_upper_contract.py
          python -m py_compile tools/validate_warwick_origin_export.py
          python -m py_compile qa_warwick_origin_export_contract.py
      - name: Validate upper specialist parser contract
        run: python qa_cross_process_upper_contract.py
      - name: Validate Warwick Origin export contract
        run: |
          python qa_warwick_origin_export_contract.py
          python tools/validate_warwick_origin_export.py --manifest data/warwick-origin-export-manifest-template-v1.json
      - name: Validate fail-closed source contracts
        run: python qa_measured_data_blocker_contracts.py
