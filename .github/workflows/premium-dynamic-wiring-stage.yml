name: Premium Dynamic Wiring Stage

on:
  push:
    branches: [design/premium-polish-20260916]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[premium-dynamic-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Wire premium dynamic CSS into every governed delivery surface
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: expected wiring anchor not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('index.html',
              "      ['premium-ui.css','<link rel=\"stylesheet\" href=\"./premium-ui.css\">'],",
              "      ['premium-ui.css','<link rel=\"stylesheet\" href=\"./premium-ui.css\">'],\n      ['premium-dynamic.css','<link rel=\"stylesheet\" href=\"./premium-dynamic.css\">'],")
          replace('service-worker.js',
              "  './premium-ui.css',",
              "  './premium-ui.css',\n  './premium-dynamic.css',")
          replace('desktop/electron/scripts/generate-integrity.cjs',
              "'reading-patch.css','ui-shell.css','premium-ui.css','mobile-lesson-fix.css'",
              "'reading-patch.css','ui-shell.css','premium-ui.css','premium-dynamic.css','mobile-lesson-fix.css'")
          replace('desktop/electron/scripts/qa.cjs',
              "'ui-shell.css','premium-ui.css','mobile-lesson-fix.css'",
              "'ui-shell.css','premium-ui.css','premium-dynamic.css','mobile-lesson-fix.css'")
          replace('desktop/electron/package.json',
              '''      {\n        "from": "../../premium-ui.css",\n        "to": "mouldmaster/premium-ui.css"\n      },''',
              '''      {\n        "from": "../../premium-ui.css",\n        "to": "mouldmaster/premium-ui.css"\n      },\n      {\n        "from": "../../premium-dynamic.css",\n        "to": "mouldmaster/premium-dynamic.css"\n      },''')
          replace('qa_release.py',
              '"learner-ux-repair.css", "premium-ui.css", "learner-ux-repair.js"',
              '"learner-ux-repair.css", "premium-ui.css", "premium-dynamic.css", "learner-ux-repair.js"')

          p=Path('qa_premium_ui.py')
          s=p.read_text(encoding='utf-8')
          if "dynamic=text('premium-dynamic.css')" not in s:
              s=s.replace("css=text('premium-ui.css')", "css=text('premium-ui.css')\ndynamic=text('premium-dynamic.css')")
              s=s.replace("need('@import' not in css.lower(),'premium UI must not import remote or implicit stylesheets')", "need('@import' not in css.lower(),'premium UI must not import remote or implicit stylesheets')\nneed('http://' not in dynamic and 'https://' not in dynamic,'premium dynamic UI must remain fully local/offline')\nneed('@import' not in dynamic.lower(),'premium dynamic UI must not import remote or implicit stylesheets')\nfor marker in ['.mm-today-focus','.mm-learning-progress','.mm-next-card','prefers-reduced-motion','forced-colors:active']:\n    need(marker in dynamic,f'premium dynamic stylesheet missing governed marker: {marker}')")
              s=s.replace("need(\"['premium-ui.css','<link rel=\\\"stylesheet\\\" href=\\\"./premium-ui.css\\\">']\" in index,'premium UI stylesheet must load in first-paint HEAD assets')", "need(\"['premium-ui.css','<link rel=\\\"stylesheet\\\" href=\\\"./premium-ui.css\\\">']\" in index,'premium UI stylesheet must load in first-paint HEAD assets')\nneed(\"['premium-dynamic.css','<link rel=\\\"stylesheet\\\" href=\\\"./premium-dynamic.css\\\">']\" in index,'premium dynamic stylesheet must load after the governed premium layer')\nneed(index.index(\"['premium-ui.css'\") < index.index(\"['premium-dynamic.css'\"),'premium dynamic stylesheet must load after premium-ui.css')")
              s=s.replace("need(\"'./premium-ui.css'\" in sw,'premium UI stylesheet missing from atomic offline cache')", "need(\"'./premium-ui.css'\" in sw,'premium UI stylesheet missing from atomic offline cache')\nneed(\"'./premium-dynamic.css'\" in sw,'premium dynamic stylesheet missing from atomic offline cache')")
              s=s.replace("need('premium-ui.css' in extra,'desktop package must include premium UI stylesheet')", "need('premium-ui.css' in extra,'desktop package must include premium UI stylesheet')\nneed('premium-dynamic.css' in extra,'desktop package must include premium dynamic stylesheet')")
              s=s.replace("need(\"'premium-ui.css'\" in integrity,'desktop integrity manifest must hash premium UI stylesheet')", "need(\"'premium-ui.css'\" in integrity,'desktop integrity manifest must hash premium UI stylesheet')\nneed(\"'premium-dynamic.css'\" in integrity,'desktop integrity manifest must hash premium dynamic stylesheet')")
              s=s.replace("need(\"'premium-ui.css'\" in desktop_qa,'desktop QA must require premium UI stylesheet')", "need(\"'premium-ui.css'\" in desktop_qa,'desktop QA must require premium UI stylesheet')\nneed(\"'premium-dynamic.css'\" in desktop_qa,'desktop QA must require premium dynamic stylesheet')")
              s=s.replace("need('\"premium-ui.css\"' in release_qa,'release QA must require premium UI offline governance')", "need('\"premium-ui.css\"' in release_qa,'release QA must require premium UI offline governance')\nneed('\"premium-dynamic.css\"' in release_qa,'release QA must require premium dynamic offline governance')")
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify static premium governance
        run: python qa_premium_ui.py
      - name: Commit coherent dynamic wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js desktop/electron/package.json desktop/electron/scripts/generate-integrity.cjs desktop/electron/scripts/qa.cjs qa_release.py qa_premium_ui.py premium-dynamic.css
          git diff --cached --quiet && exit 0
          git commit -m '[premium-dynamic-wired] Govern premium dynamic learner surfaces'
          git push
