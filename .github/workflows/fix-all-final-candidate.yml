name: Fix-all final physical candidate

on:
  push:
    branches: [ audit/fix-all-deep-dive-20260915 ]
    paths:
      - .github/workflows/fix-all-final-candidate.yml

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/fix-all-deep-dive-20260915
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and verify final candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_pages_artifact.py
          fingerprint="$(python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)"
          echo "candidate fingerprint=${fingerprint}"
          test "$fingerprint" = 'sha256:b6fca9536f77247e1e778639a7b24228e4fe43ef413fa6e6d025e8a788006f2e'
          rm -rf physical-pwa-candidate
          mkdir physical-pwa-candidate
          cp -a .pages-dist/. physical-pwa-candidate/
      - name: Upload exact physical candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-pwa-candidate-${{ github.sha }}
          path: physical-pwa-candidate
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: false
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-final-candidate.yml
          git commit -m 'Remove final audit candidate workflow'
          git push origin HEAD:audit/fix-all-deep-dive-20260915
