name: Natural Voice Chapter 1 Audition (offline neural TTS)

on:
  push:
    branches:
      - 'audiobook/natural-voice-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-voice-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Book text source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python voice runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install offline neural speech engine
        run: |
          python3 -m pip install --disable-pip-version-check 'piper-tts==1.3.0'
      - name: Download British English neural voice
        run: |
          mkdir -p "${RUNNER_TEMP}/mouldmaster-piper-voices"
          python3 -m piper.download_voices --data-dir "${RUNNER_TEMP}/mouldmaster-piper-voices" en_GB-cori-high
      - name: Generate and validate Chapter 1 sample MP3
        env:
          MM_AUDIO_ENGINE: piper
          MM_AUDIO_SAMPLE_ONLY: '1'
          MM_PIPER_VOICE: en_GB-cori-high
          MM_PIPER_DATA: ${{ runner.temp }}/mouldmaster-piper-voices
        run: |
          python3 tools/build_book_audio_bundle.py qa-artifacts/natural-voice-audition
          python3 - <<'PY'
          import pathlib, subprocess
          root=pathlib.Path('qa-artifacts/natural-voice-audition')
          audio=list(root.glob('01_*.mp3'))
          assert len(audio)==1, 'Exactly one natural-voice Chapter 1 sample is required'
          assert audio[0].stat().st_size > 250000, 'Natural voice sample unexpectedly small'
          print('Natural voice Chapter 1 sample verified:',audio[0],audio[0].stat().st_size)
          PY
      - name: Make Chapter 1 natural voice available for download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MouldMaster_Chapter_1_Natural_Voice_Sample
          path: |
            qa-artifacts/natural-voice-audition/01_*.mp3
            qa-artifacts/natural-voice-audition/01_*.txt
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
