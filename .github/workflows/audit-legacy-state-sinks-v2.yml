name: One-shot Legacy Persisted State Sink Hardening v2

on:
  push:
    branches:
      - audit/standalone-learner-id-hardening-clean
    paths:
      - .github/workflows/audit-legacy-state-sinks-v2.yml

permissions:
  contents: write

concurrency:
  group: audit-legacy-state-sinks-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.ref == 'refs/heads/audit/standalone-learner-id-hardening-clean' && github.actor == 'connorth3-lgtm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Apply corrected patch, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/apply_legacy_state_sink_hardening_temp.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_legacy_state_sink_hardening_temp.py')
          s=p.read_text(encoding='utf-8')
          old='value>36))return false;'
          new='value>36)))return false;'
          if s.count(old)!=1: raise SystemExit(f'Expected exactly one helper syntax target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 tools/apply_legacy_state_sink_hardening_temp.py
          python3 tools/sync_web_release.py
          python3 tools/externalize_core_scripts.py --check
          node qa_standalone_learner_ids.cjs
          node qa_final_audit_lifecycle.cjs
          python3 qa_runtime_release_bump.py
          python3 qa_runtime_hardening.py
          python3 qa_release.py
          python3 qa_release_docs.py
          python3 qa_app_wide_audit.py
          python3 qa_webkit_regression.py
          python3 tools/verify_release_external_validation.py
          python3 tools/build_pages_artifact.py
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          url=latest['app_url']
          if '/main/' in url or '/master/' in url: raise SystemExit('Frozen recovery URL is not commit-pinned')
          with urllib.request.urlopen(url,timeout=30) as r: data=r.read()
          actual=hashlib.sha256(data).hexdigest();expected=latest['sha256']
          if actual!=expected: raise SystemExit(f'Frozen recovery hash mismatch: {actual} != {expected}')
          print(f'Frozen recovery URL/hash verified: {actual}')
          PY
          git diff --check
          python3 - <<'PY'
          import re,subprocess
          fixed={'MouldMaster_Core_App.html','qa_standalone_learner_ids.cjs','version.json','README.md','support.html','data/release-external-validation-v1.json','qa_release.py','qa_release_docs.py','index.html','pwa-shell.js','service-worker.js'}
          temp={'tools/apply_legacy_state_sink_hardening_temp.py','.github/workflows/audit-legacy-state-sinks.yml','.github/workflows/audit-legacy-state-sinks-v2.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          generated={p for p in changed if re.fullmatch(r'src/core-runtime/core-inline-\d{3}\.js',p)}
          unexpected=changed-fixed-temp-generated
          if unexpected: raise SystemExit('Unexpected tracked changes: '+', '.join(sorted(unexpected)))
          missing=fixed-changed
          if missing: raise SystemExit('Expected permanent changes missing: '+', '.join(sorted(missing)))
          if not generated: raise SystemExit('Expected deterministic generated core runtime changes')
          print('Generated runtime slots: '+', '.join(sorted(generated)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MouldMaster_Core_App.html qa_standalone_learner_ids.cjs version.json README.md support.html data/release-external-validation-v1.json qa_release.py qa_release_docs.py index.html pwa-shell.js service-worker.js src/core-runtime/core-inline-*.js
          git diff --cached --check
          git commit -m 'Validate legacy persisted state before HTML rendering'
          git push origin HEAD:audit/standalone-learner-id-hardening-clean
