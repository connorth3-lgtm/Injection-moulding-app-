name: PR 306 temporary web release sync

on:
  push:
    branches:
      - fix/csv-structure-validation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/csv-structure-validation
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Synchronise governed web release identity
        run: python tools/sync_web_release.py
      - name: Remove temporary workflow and commit synchronized files
        shell: bash
        run: |
          rm .github/workflows/pr306-sync-web-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json service-worker.js index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html .github/workflows/pr306-sync-web-release.yml
          if git diff --cached --quiet; then
            echo 'No synchronization changes were needed.'
            exit 0
          fi
          git commit -m 'Synchronize web release identity for CSV hardening'
          git push origin HEAD:fix/csv-structure-validation
