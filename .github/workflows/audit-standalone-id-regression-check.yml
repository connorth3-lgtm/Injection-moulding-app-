name: One-shot Standalone ID Regression Check

on:
  push:
    branches:
      - 'audit/standalone-learner-id-hardening-clean'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Standalone learner-ID behavioral regression
        run: node qa_standalone_learner_ids.cjs
      - name: Extracted runtime coherence
        run: python tools/externalize_core_scripts.py --check
      - name: Release integrity
        run: python qa_release.py
      - name: External-validation boundary
        run: python tools/verify_release_external_validation.py
      - name: Diff hygiene
        run: git diff --check
