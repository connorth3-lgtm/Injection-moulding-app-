name: Assessment and Evidence Hardening QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-evidence-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: New runtime syntax
        run: |
          node --check assessment-discrimination-hardening.js
          node --check process-atlas-case-evidence.js
      - name: Assessment discrimination integrity
        run: python qa_assessment_discrimination.py
      - name: Canonical assessment manifest integrity
        run: |
          python tools/generate_assessment_manifest.py --check
          python qa_canonical_assessment_manifest.py
      - name: Case-level process-atlas evidence integrity
        run: |
          python qa_process_atlas_case_evidence.py
          python tools/generate_process_case_evidence.py --check
      - name: Legacy retirement state integrity
        run: python qa_legacy_retirement.py
      - name: Competing Pages branch must remain absent
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo 'A gh-pages branch exists. MouldMaster requires the hardened Actions Pages workflow to remain the sole supported repository publication lane.' >&2
            exit 1
          fi
          echo 'No gh-pages branch is present.'
