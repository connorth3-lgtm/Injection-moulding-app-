name: MouldMaster Public Measured Benchmark — HDPE GNP mechanical data

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_hdpe_gnp.py'
      - 'qa_public_benchmark_hdpe_gnp.py'
      - 'data/public-benchmark-contracts/hdpe-gnp-4h98rz9f92-v3.json'
      - '.github/workflows/public-benchmark-hdpe-gnp.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_hdpe_gnp.py'
      - 'qa_public_benchmark_hdpe_gnp.py'
      - 'data/public-benchmark-contracts/hdpe-gnp-4h98rz9f92-v3.json'
      - '.github/workflows/public-benchmark-hdpe-gnp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-measured-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl xlrd
      - name: Validate evidence boundary
        run: python qa_public_benchmark_hdpe_gnp.py
      - name: Retrieve and aggregate-profile exact publisher tables
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_hdpe_gnp.py \
            --output benchmark-results/hdpe-gnp-4h98rz9f92-v3.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/hdpe-gnp-4h98rz9f92-v3.json'))
          assert x['status'] in {'completed-public-open-measured-benchmark','retrieved-profile-needs-semantic-review'}
          assert x['source']['datasetDoi']=='10.17632/4h98rz9f92.3'
          assert x['source']['license']=='CC BY 4.0'
          assert x['manifest']['publisherFileCount'] >= 1
          assert x['profile']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['profile']['rawRowsOrCellValuesEmitted'] is False
          assert x['retrieval']['rawPublisherFileCommitted'] is False
          assert x['retrieval']['rawRowsOrCellValuesUploadedAsArtifact'] is False
          if x['status']=='completed-public-open-measured-benchmark':
              assert x['profile']['semanticLayoutRecognized'] is True
              assert x['profile']['recordLevelMeasuredOutcomeValues']==105
              assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is True
          else:
              assert x['profile']['recordLevelMeasuredOutcomeValues']==0
              assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          print(json.dumps({
            'status': x['status'],
            'publisherFileCount': x['manifest']['publisherFileCount'],
            'tabularFilesProfiled': x['manifest']['tabularFilesProfiled'],
            'selectedMeasuredTable': x['profile']['selectedMeasuredTable'],
            'recordLevelMeasuredOutcomeValues': x['profile']['recordLevelMeasuredOutcomeValues'],
          }, indent=2))
          PY
      - name: Upload aggregate HDPE GNP profile only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-public-measured-benchmark-hdpe-gnp
          path: benchmark-results/hdpe-gnp-4h98rz9f92-v3.json
          if-no-files-found: error
          retention-days: 30
