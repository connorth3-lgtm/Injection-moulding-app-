name: Temporary Read Aloud reliability fix

on:
  push:
    branches:
      - fix/read-aloud-voice-readiness
    paths:
      - .github/workflows/temp-read-aloud-reliability-fix.yml

permissions:
  contents: write

jobs:
  verify-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/read-aloud-voice-readiness
          fetch-depth: 0
      - name: Pin updated runtime into Windows Academy package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          app=Path('MouldMaster_Academy_App.html')
          text=app.read_text(encoding='utf-8')
          commit=subprocess.check_output(['git','log','-1','--format=%H','--','read-aloud.js']).decode().strip()
          runtime=Path('read-aloud.js').read_bytes()
          sha=hashlib.sha256(runtime).hexdigest()
          text=re.sub(r'const CONTENT="[^"]+";', 'const CONTENT="2026.09.14.2";', text, count=1)
          text=re.sub(r'const READ_ALOUD_COMMIT="[0-9a-f]{40}";', f'const READ_ALOUD_COMMIT="{commit}";', text, count=1)
          text=re.sub(r'readAloud:\{path:"read-aloud.js",sha256:"[0-9a-f]{64}",base:READ_ALOUD_BASE\}', f'readAloud:{{path:"read-aloud.js",sha256:"{sha}",base:READ_ALOUD_BASE}}', text, count=1)
          pad_start=text.find('\n<!--', text.find('</body>'))
          pad_end=text.rfind('-->')
          assert pad_start!=-1 and pad_end>pad_start
          prefix=text[:pad_start]+'\n<!--'
          suffix=text[pad_end:]
          pad_len=540000-len((prefix+suffix).encode('utf-8'))
          assert pad_len>=0
          text=prefix+('M'*pad_len)+suffix
          assert len(text.encode('utf-8'))==540000
          assert commit in text and sha in text and '2026.09.14.2' in text
          app.write_text(text,encoding='utf-8')
          print('Pinned',commit,sha)
          PY
      - name: Verify targeted regression
        run: |
          node --check read-aloud.js
          python3 qa_read_aloud.py
          npx playwright test qa/read-aloud.spec.js --reporter=line
          python3 - <<'PY'
          from pathlib import Path
          t=Path('MouldMaster_Academy_App.html').read_text(encoding='utf-8')
          assert len(Path('MouldMaster_Academy_App.html').read_bytes())==540000
          assert '2026.09.14.2' in t
          assert 'read-aloud.js' in t
          PY
      - name: Commit package pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MouldMaster_Academy_App.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: pin reliable Read Aloud runtime in Windows package"
          git push origin HEAD:fix/read-aloud-voice-readiness
