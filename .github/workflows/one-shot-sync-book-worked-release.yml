name: One-shot Book worked-case release sync

on:
  push:
    branches: [ feature/book-worked-cases-20260918 ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/book-worked-cases-20260918
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize web release identity
        run: |
          python tools/sync_web_release.py
          python tools/sync_web_release.py --check
      - name: Verify governed worked-case integration
        run: |
          node --check service-worker.js
          node --check src/domains/learning/book-runtime.js
          python tools/sync_book_runtime_data.py --check
          python qa_book_release_integration.py
          python qa_book_worked_cases_next_release.py
          python qa_book_worked_case_calculations.py
      - name: Commit synchronized release files and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sync-book-worked-release.yml
          git add service-worker.js index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html
          git diff --cached --check
          git commit -m "Synchronize web release 2026.09.18.2 for Book worked cases"
          git push origin HEAD:feature/book-worked-cases-20260918
