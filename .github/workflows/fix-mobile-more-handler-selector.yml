name: Fix Mobile More Handler Selector

on:
  push:
    branches:
      - refactor/csp-handler-attrs-v1
    paths:
      - .github/workflows/fix-mobile-more-handler-selector.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/csp-handler-attrs-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Migrate More-button selector contract
        run: |
          python - <<'PY'
          from pathlib import Path

          shell=Path('app-shell-registry.js')
          text=shell.read_text(encoding='utf-8')
          old='.mobile-nav>button:not([data-view]):not([onclick*="openMobileMenu"]){display:none!important}'
          new='.mobile-nav>button:not([data-view]):not([onclick*="openMobileMenu"]):not([data-mm-onclick*="openMobileMenu"]){display:none!important}'
          if old not in text:
              raise SystemExit('Legacy mobile More CSS selector not found exactly once')
          text=text.replace(old,new,1)
          old_fn="function canonicalMoreButton(button){return !button.dataset.view&&((button.getAttribute('onclick')||'').includes('openMobileMenu')||/\\bMore\\b/i.test(button.textContent||''))}"
          new_fn="function canonicalMoreButton(button){const handler=button.getAttribute('data-mm-onclick')||button.getAttribute('onclick')||'';return !button.dataset.view&&(handler.includes('openMobileMenu')||/\\bMore\\b/i.test(button.textContent||''))}"
          if old_fn not in text:
              raise SystemExit('Legacy canonicalMoreButton implementation not found exactly once')
          shell.write_text(text.replace(old_fn,new_fn,1),encoding='utf-8')

          qa=Path('qa_app_shell_registry.py')
          q=qa.read_text(encoding='utf-8')
          marker="    '--mm-mobile-content-clearance',\n"
          addition="    '--mm-mobile-content-clearance',\n    'data-mm-onclick*=\\\"openMobileMenu\\\"',\n    \"button.getAttribute('data-mm-onclick')\",\n"
          if marker not in q:
              raise SystemExit('App-shell QA insertion point missing')
          qa.write_text(q.replace(marker,addition,1),encoding='utf-8')
          PY
      - name: Validate shell and static contract
        run: |
          node --check app-shell-registry.js
          python qa_app_shell_registry.py
          python tools/audit_inline_handlers.py --check
          python qa_architecture_debt.py
      - name: Commit selector fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell-registry.js qa_app_shell_registry.py
          git commit -m "Keep mobile More visible after handler migration"
          git push origin HEAD:refactor/csp-handler-attrs-v1
