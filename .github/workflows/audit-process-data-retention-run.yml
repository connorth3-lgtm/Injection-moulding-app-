name: One-shot Process Data Retention Runner

on:
  push:
    branches:
      - 'audit/process-data-retention-hardening'

permissions:
  contents: write

concurrency:
  group: audit-process-data-retention-runner
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/process-data-retention-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply deterministic remediation
        run: |
          python tools/apply_process_data_retention_temp.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/domains/process/process-data-integrity.js')
          text=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global text
              if text.count(old)!=1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              text=text.replace(old,new,1)
          once(
              "async function get(storeName,key){\n  const db=await openDb();\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(storeName,'readonly'),req=tx.objectStore(storeName).get(key);\n    req.onsuccess=()=>{resolve(req.result||null);db.close()};\n    req.onerror=()=>{reject(req.error||new Error(`Could not read ${storeName}`));db.close()};\n  });\n}\n",
              "async function get(storeName,key){\n  const db=await openDb();\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(storeName,'readonly'),req=tx.objectStore(storeName).get(key);\n    req.onsuccess=()=>{resolve(req.result||null);db.close()};\n    req.onerror=()=>{reject(req.error||new Error(`Could not read ${storeName}`));db.close()};\n  });\n}\nasync function getAll(storeName){\n  const db=await openDb();\n  return new Promise((resolve,reject)=>{\n    const tx=db.transaction(storeName,'readonly'),req=tx.objectStore(storeName).getAll();\n    req.onsuccess=()=>{resolve(req.result||[]);db.close()};\n    req.onerror=()=>{reject(req.error||new Error(`Could not read ${storeName}`));db.close()};\n  });\n}\n",
              'compatibility getAll helper',
          )
          marker="async function guardedCompare(original,datasetId,baselineId,args,receiver){"
          clear_fn=(
              "async function clearAllProcessData(){\n"
              "  const db=await openDb();\n"
              "  try{\n"
              "    const tx=db.transaction(PROCESS_DATA_STORES,'readwrite');\n"
              "    for(const name of PROCESS_DATA_STORES)tx.objectStore(name).clear();\n"
              "    await txDone(tx);\n"
              "  }finally{db.close()}\n"
              "  const remaining={};\n"
              "  for(const name of PROCESS_DATA_STORES)remaining[name]=(await getAll(name)).length;\n"
              "  const total=Object.values(remaining).reduce((sum,n)=>sum+Number(n||0),0);\n"
              "  if(total)throw new Error(`Process-data cleanup could not be verified (${total} record${total===1?'':'s'} remain).`);\n"
              "  return {verified:true,remaining};\n"
              "}\n"
          )
          once(marker,clear_fn+marker,'compatibility clear-all insertion')
          once(
              "  if(api.__mmCanonicalProcessDataIntegrity){api.__mmProcessDataIntegrity=VERSION;return true}\n",
              "  if(api.__mmCanonicalProcessDataIntegrity){if(typeof api.storage.clearAllProcessData!=='function')api.storage.clearAllProcessData=clearAllProcessData;api.__mmProcessDataIntegrity=VERSION;return true}\n",
              'canonical compatibility clear-all handoff',
          )
          once(
              "  api.storage.deleteDataset=deleteDatasetCascade;\n  api.__mmProcessDataIntegrity=VERSION;\n",
              "  api.storage.deleteDataset=deleteDatasetCascade;\n  api.storage.clearAllProcessData=clearAllProcessData;\n  api.__mmProcessDataIntegrity=VERSION;\n",
              'legacy compatibility clear-all handoff',
          )
          p.write_text(text,encoding='utf-8')
          PY
          python tools/bump_web_release.py --release 2026.09.12.3 --published 2026-09-12
          python tools/sync_web_release.py --check
      - name: Validate remediation
        run: |
          set -euo pipefail
          node --check data-integration-runtime.js
          node --check src/domains/process/process-data-integrity.js
          node --check training-qa-fix.js
          node --check qa_process_data_integrity.cjs
          node qa_data_integration_statistics.cjs
          node qa_process_data_integrity.cjs
          node qa_process_data_followup.cjs
          python qa_process_data_local_intake.py
          python qa_data_integration.py
          python qa_release.py
          python qa_release_docs.py
          python tools/verify_release_external_validation.py
          git diff --check
      - name: Commit only validated generated changes
        run: |
          set -euo pipefail
          rm -rf tools/__pycache__
          git add -A
          git restore --staged .github/workflows/audit-process-data-retention-run.yml tools/apply_process_data_retention_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make local process-data retention controls truthful'
          git push origin HEAD:audit/process-data-retention-hardening
