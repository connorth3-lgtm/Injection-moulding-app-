name: MouldMaster Specialist Evidence Gaps

on:
  push:
    branches: [main, evidence-coverage-hardening]
    paths:
      - 'tools/validate_external_acquisitions.py'
      - 'qa_external_acquisition_validator.py'
      - 'qa_external_data_acquisition_readiness.py'
      - 'sources/REAL_PROCESS_DATA_CAPTURE_CONTRACT.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'data/black-speck-intervention-recovery-template.csv'
      - 'data/hot-runner-synchronised-trace-template.csv'
      - 'data/mould-maintenance-recovery-template.csv'
      - 'specialist-curriculum.js'
      - 'src/domains/learning/specialist-evidence-gap-extension.js'
      - 'src/domains/shell/app-shell-finalize.js'
      - 'qa_specialist_evidence_gaps.py'
      - 'qa_evidence_coverage.py'
      - 'qa_external_data_acquisition_readiness.py'
      - 'sources/REAL_PROCESS_DATA_CAPTURE_CONTRACT.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'data/black-speck-intervention-recovery-template.csv'
      - 'data/hot-runner-synchronised-trace-template.csv'
      - 'data/mould-maintenance-recovery-template.csv'
      - 'tools/validate_external_acquisitions.py'
      - 'qa_external_acquisition_validator.py'
      - 'data/evidence-coverage-v1.json'
      - 'data/evidence-promotion-overlay-v2.json'
      - 'index.html'
      - 'service-worker.js'
      - 'desktop/electron/package.json'
      - 'desktop/electron/scripts/generate-integrity.cjs'
      - '.github/workflows/specialist-evidence-gaps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'specialist-curriculum.js'
      - 'src/domains/learning/specialist-evidence-gap-extension.js'
      - 'src/domains/shell/app-shell-finalize.js'
      - 'qa_specialist_evidence_gaps.py'
      - 'qa_evidence_coverage.py'
      - 'data/evidence-coverage-v1.json'
      - 'data/evidence-promotion-overlay-v2.json'
      - 'index.html'
      - 'service-worker.js'
      - 'desktop/electron/package.json'
      - 'desktop/electron/scripts/generate-integrity.cjs'
      - '.github/workflows/specialist-evidence-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-specialist-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specialist-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Specialist evidence JavaScript syntax
        run: |
          node --check src/domains/learning/specialist-evidence-gap-extension.js
          node --check src/domains/shell/app-shell-finalize.js
      - name: Mechanism evidence coverage integrity
        run: python qa_evidence_coverage.py
      - name: Specialist evidence-gap curriculum integrity
        run: python qa_specialist_evidence_gaps.py
      - name: External measured-data acquisition readiness
        run: python qa_external_data_acquisition_readiness.py
      - name: Private measured-data structural validator self-test
        run: python qa_external_acquisition_validator.py