name: Android Play internal-test bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-internal-test-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Decode owner-provided upload keystore
        env:
          MM_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MM_PLAY_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MM_PLAY_UPLOAD_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Configure MM_PLAY_UPLOAD_KEYSTORE_BASE64 in repository Actions secrets."
            exit 1
          fi
          key_file="$RUNNER_TEMP/mouldmaster-play-upload.jks"
          printf '%s' "$MM_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          echo "MM_PLAY_UPLOAD_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed Play upload bundle
        env:
          MM_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.MM_PLAY_UPLOAD_STORE_PASSWORD }}
          MM_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.MM_PLAY_UPLOAD_KEY_ALIAS }}
          MM_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.MM_PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MM_PLAY_UPLOAD_STORE_PASSWORD MM_PLAY_UPLOAD_KEY_ALIAS MM_PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configure $name in repository Actions secrets."
              exit 1
            fi
          done
          gradle -p android bundleRelease --no-daemon

      - name: Retain signed bundle for manual Play Console upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouldmaster-play-internal-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
