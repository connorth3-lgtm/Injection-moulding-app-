name: Build 20-Chapter Book Audio (non-publishing)

on:
  push:
    branches:
      - 'audiobook/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audiobook:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact audio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install offline voice and MP3 encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
      - name: Generate 20 verified chapters from pinned governed Book text
        run: |
          python3 tools/build_book_audio_bundle.py qa-artifacts/book-audiobook
      - name: Upload the full Book as 20 phone-playable MP3 files
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MouldMaster_Book_20_Chapters_MP3
          path: qa-artifacts/book-audiobook/
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
