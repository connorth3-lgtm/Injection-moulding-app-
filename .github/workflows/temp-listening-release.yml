name: Temporary governed Listening release

on:
  push:
    branches:
      - feature/listening-tab
    paths:
      - .github/workflows/temp-listening-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/listening-tab
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply coherent release identity and Windows Listen pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          old='2026.09.14.1'
          new='2026.09.14.2'
          release_paths=[
            'README.md',
            'service-worker.js',
            'index.html',
            'qa_release.py',
            'pwa-shell.js',
            'qa_release_docs.py',
            'support.html',
            'version.json',
            'data/release-external-validation-v1.json',
          ]
          for name in release_paths:
            p=Path(name)
            text=p.read_text(encoding='utf-8')
            if old not in text:
              raise SystemExit(f'{name}: expected old release not found')
            p.write_text(text.replace(old,new),encoding='utf-8')
            print('release', name)

          app=Path('MouldMaster_Academy_App.html')
          payload=app.read_text(encoding='utf-8')
          before=len(app.read_bytes())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          digest=hashlib.sha256(Path('read-aloud.js').read_bytes()).hexdigest()
          payload,n1=re.subn(r'const READ_ALOUD_COMMIT="[0-9a-f]{40}";',f'const READ_ALOUD_COMMIT="{commit}";',payload,count=1)
          payload,n2=re.subn(r'(readAloud:\{path:"read-aloud\.js",sha256:")[0-9a-f]{64}("\s*,base:READ_ALOUD_BASE\})',rf'\g<1>{digest}\2',payload,count=1)
          if n1!=1 or n2!=1:
            raise SystemExit(f'Windows Listen pin patterns missing: commit={n1}, sha={n2}')
          app.write_text(payload,encoding='utf-8',newline='')
          after=len(app.read_bytes())
          if before!=540000 or after!=540000:
            raise SystemExit(f'Windows launcher payload size changed: {before} -> {after}')
          print('Windows Listen pin', commit, digest)
          PY
      - name: Validate governed Listening release
        run: |
          node --check read-aloud.js
          python qa_read_aloud.py
          python qa_release.py
          python qa_release_docs.py
          python tools/verify_release_external_validation.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          app=Path('MouldMaster_Academy_App.html')
          text=app.read_text(encoding='utf-8')
          assert len(app.read_bytes())==540000
          commit=re.search(r'const READ_ALOUD_COMMIT="([0-9a-f]{40})";',text)
          expected=re.search(r'readAloud:\{path:"read-aloud.js",sha256:"([0-9a-f]{64})",base:READ_ALOUD_BASE\}',text)
          assert commit and expected
          pinned=subprocess.check_output(['git','show',f'{commit.group(1)}:read-aloud.js'])
          assert hashlib.sha256(pinned).hexdigest()==expected.group(1)
          print('Windows Listen package pin verified')
          PY
      - name: Commit governed Listening release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md service-worker.js index.html qa_release.py pwa-shell.js qa_release_docs.py support.html version.json data/release-external-validation-v1.json MouldMaster_Academy_App.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump release for Listening tab"
          git push origin HEAD:feature/listening-tab
