name: One-shot Owned Learner Registry Hardening

on:
  push:
    branches:
      - 'audit/standalone-learner-id-hardening-clean'

permissions:
  contents: write

concurrency:
  group: audit-owned-learner-registry
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/standalone-learner-id-hardening-clean
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply deterministic hardening
        run: python tools/apply_owned_learner_registry_temp.py
      - name: Static and release validation
        run: |
          set -euo pipefail
          node --check qa_standalone_learner_ids.cjs
          node qa_standalone_learner_ids.cjs
          python tools/externalize_core_scripts.py --check
          python qa_release.py
          python qa_release_docs.py
          python qa_app_wide_audit.py
          python qa_webkit_regression.py
          python tools/build_pages_artifact.py
          python tools/verify_release_external_validation.py
          python - <<'PY'
          import hashlib,json,urllib.request
          latest=json.load(open('latest.json',encoding='utf-8'))
          with urllib.request.urlopen(latest['app_url'],timeout=30) as response:
              data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert actual==latest['sha256'],(actual,latest['sha256'])
          print('Frozen recovery URL/hash verified:',actual)
          PY
          rm -rf .pages-dist tools/__pycache__ __pycache__
          git diff --check
      - name: Targeted WebKit runtime validation
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps webkit
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/mm-owned-registry-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          npx playwright test qa/inline-handler-bridge.spec.js --config=playwright.webkit-full.config.cjs
      - name: Commit only validated product and regression changes
        run: |
          set -euo pipefail
          rm -rf node_modules test-results playwright-report qa-artifacts .pages-dist tools/__pycache__ __pycache__
          git add MouldMaster_Core_App.html src/core-runtime/core-inline-*.js qa_standalone_learner_ids.cjs qa_release.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Require owned learner registry membership'
          git push origin HEAD:audit/standalone-learner-id-hardening-clean
