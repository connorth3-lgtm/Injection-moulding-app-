name: MouldMaster Public Measured Benchmark — Injection operations stage 1

on:
  push:
    branches: [data/real-dataset-profiling-wave2-batch4]
    paths:
      - 'tools/run_public_benchmark_ypf95p4bs4_stage1.py'
      - 'qa_public_benchmark_ypf95p4bs4_stage1.py'
      - 'data/public-benchmark-contracts/ypf95p4bs4-v1.json'
      - '.github/workflows/public-benchmark-ypf95p4bs4-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence boundary
        run: python qa_public_benchmark_ypf95p4bs4_stage1.py
      - name: Enumerate publisher manifest only
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_ypf95p4bs4_stage1.py \
            --output benchmark-results/ypf95p4bs4-stage1.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate manifest
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/ypf95p4bs4-stage1.json'))
          assert x['status'] in {'publisher-file-manifest-profiled','publisher-record-no-files-exposed'}
          assert x['source']['datasetDoi']=='10.17632/ypf95p4bs4.1'
          assert x['source']['license']=='CC BY 4.0'
          assert x['manifest']['rawPayloadsDownloaded'] is False
          assert x['manifest']['rawRowsOrArraysEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          print(json.dumps({'status':x['status'],'manifest':x['manifest']},indent=2))
          PY
      - name: Upload aggregate manifest only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-public-measured-benchmark-ypf95p4bs4-stage1
          path: benchmark-results/ypf95p4bs4-stage1.json
          if-no-files-found: error
          retention-days: 30
