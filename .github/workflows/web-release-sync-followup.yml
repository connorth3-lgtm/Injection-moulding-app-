name: Follow-up web release sync

on:
  push:
    branches:
      - audit-followup-2026-09-10
    paths:
      - .github/workflows/web-release-sync-followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v7
        with:
          ref: audit-followup-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bump canonical web release
        shell: python
        run: |
          import json
          from pathlib import Path

          version_path = Path('version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if version.get('web_release') != '2026.09.10.1':
              raise SystemExit(f"Unexpected starting web_release: {version.get('web_release')!r}")
          version['web_release'] = '2026.09.10.2'
          version_path.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')

          qa_path = Path('qa_release.py')
          qa = qa_path.read_text(encoding='utf-8')
          old = 'WEB_RELEASE = "2026.09.10.1"'
          new = 'WEB_RELEASE = "2026.09.10.2"'
          if qa.count(old) != 1:
              raise SystemExit('qa_release.py web release constant did not match expected baseline')
          qa_path.write_text(qa.replace(old, new, 1), encoding='utf-8')

      - name: Synchronise browser and PWA release identity
        run: python tools/sync_web_release.py

      - name: Commit release identity locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html service-worker.js pwa-shell.js qa_release.py
          git diff --cached --check
          git commit -m "release: bump audited web runtime to 2026.09.10.2"

      - name: Verify release identity and runtime
        run: |
          python tools/sync_web_release.py --check
          python qa_web_release_identity.py
          python qa_release.py
          python qa_runtime_hardening.py
          python qa_runtime_release_bump.py

      - name: Push verified release identity
        run: git push origin HEAD:audit-followup-2026-09-10
