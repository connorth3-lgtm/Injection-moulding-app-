name: Desktop Dependency Lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/electron/package.json'
      - 'desktop/electron/package-lock.json'
      - '.github/workflows/desktop-dependency-lock.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/electron/package.json'
      - 'desktop/electron/package-lock.json'
      - '.github/workflows/desktop-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify exact npm dependency lock
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          if ! git diff --exit-code -- package-lock.json; then
            echo '::error::desktop/electron/package-lock.json is not synchronized with package.json. Regenerate it in the same pull request.'
            exit 1
          fi
          git ls-files --error-unmatch package-lock.json >/dev/null
          echo 'desktop/electron/package-lock.json is committed and synchronized.'
