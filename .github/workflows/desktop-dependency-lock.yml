name: Desktop Dependency Lock

on:
  push:
    branches: [main]
    paths:
      - 'desktop/electron/package.json'
      - '.github/workflows/desktop-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Generate exact npm dependency lock
        working-directory: desktop/electron
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Commit lock if changed
        shell: bash
        run: |
          if git diff --quiet -- desktop/electron/package-lock.json && git ls-files --error-unmatch desktop/electron/package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/electron/package-lock.json
          git commit -m 'Lock open desktop dependencies'
          git push origin HEAD:main
