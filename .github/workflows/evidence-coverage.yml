name: MouldMaster Evidence Coverage

on:
  push:
    branches: [main, evidence-coverage-hardening]
    paths:
      - 'sources/EVIDENCE_COVERAGE_POLICY.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'data/evidence-coverage-v1.json'
      - 'data/mechanism-promotion-evidence/**'
      - 'data/measured-evidence-50-pass.json'
      - 'sources/MEASURED_EVIDENCE_50_PASS.md'
      - 'sources/PROCESS_DATA_20_PASS_ATLAS.md'
      - 'qa_evidence_coverage.py'
      - 'qa_mechanism_promotion.py'
      - '.github/workflows/evidence-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sources/EVIDENCE_COVERAGE_POLICY.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'data/evidence-coverage-v1.json'
      - 'data/mechanism-promotion-evidence/**'
      - 'data/measured-evidence-50-pass.json'
      - 'sources/MEASURED_EVIDENCE_50_PASS.md'
      - 'sources/PROCESS_DATA_20_PASS_ATLAS.md'
      - 'qa_evidence_coverage.py'
      - 'qa_mechanism_promotion.py'
      - '.github/workflows/evidence-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Mechanism evidence coverage integrity
        run: python qa_evidence_coverage.py
      - name: Mechanism promotion dossier integrity
        run: python qa_mechanism_promotion.py
      - name: Upload evidence coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouldmaster-evidence-coverage
          path: |
            evidence-coverage-report.json
            mechanism-promotion-report.json
          if-no-files-found: error