name: MouldMaster Evidence Coverage

on:
  push:
    branches: [main, evidence-coverage-hardening, evidence-scale-execution-2026-08-28]
    paths:
      - 'sources/EVIDENCE_COVERAGE_POLICY.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'sources/EVIDENCE_PROMOTION_OVERLAY.md'
      - 'data/evidence-coverage-v1.json'
      - 'data/evidence-promotion-overlay-v2.json'
      - 'data/primary-measured-evidence-registry-v1.json'
      - 'data/primary-measured-evidence/**'
      - 'data/primary-measured-promotion-authors-v1.json'
      - 'data/mechanism-promotion-evidence/**'
      - 'data/measured-evidence-50-pass.json'
      - 'data/sensor-machine-health-registry-v1.json'
      - 'data/content-scale-targets.json'
      - 'sources/MEASURED_EVIDENCE_50_PASS.md'
      - 'sources/PROCESS_DATA_20_PASS_ATLAS.md'
      - 'qa_evidence_coverage.py'
      - 'qa_mechanism_promotion.py'
      - 'qa_primary_measured_evidence.py'
      - 'qa_sensor_machine_health.py'
      - '.github/workflows/evidence-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sources/EVIDENCE_COVERAGE_POLICY.md'
      - 'sources/MECHANISM_VALIDATION_QUEUE.md'
      - 'sources/EVIDENCE_PROMOTION_OVERLAY.md'
      - 'data/evidence-coverage-v1.json'
      - 'data/evidence-promotion-overlay-v2.json'
      - 'data/primary-measured-evidence-registry-v1.json'
      - 'data/primary-measured-evidence/**'
      - 'data/primary-measured-promotion-authors-v1.json'
      - 'data/mechanism-promotion-evidence/**'
      - 'data/measured-evidence-50-pass.json'
      - 'data/sensor-machine-health-registry-v1.json'
      - 'data/content-scale-targets.json'
      - 'sources/MEASURED_EVIDENCE_50_PASS.md'
      - 'sources/PROCESS_DATA_20_PASS_ATLAS.md'
      - 'qa_evidence_coverage.py'
      - 'qa_mechanism_promotion.py'
      - 'qa_primary_measured_evidence.py'
      - 'qa_sensor_machine_health.py'
      - '.github/workflows/evidence-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Primary measured evidence integrity
        run: python qa_primary_measured_evidence.py
      - name: Sensor and machine-health evidence integrity
        run: python qa_sensor_machine_health.py
      - name: Mechanism evidence coverage integrity
        run: python qa_evidence_coverage.py
      - name: Mechanism promotion dossier integrity
        run: python qa_mechanism_promotion.py
      - name: Upload evidence coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-evidence-coverage
          path: |
            primary-measured-evidence-report.json
            sensor-machine-health-report.json
            evidence-coverage-report.json
            mechanism-promotion-report.json
          if-no-files-found: error
