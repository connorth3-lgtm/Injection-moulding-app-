name: Premium UI QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'premium-ui.css'
      - 'ui-shell.css'
      - 'reading-patch.css'
      - 'learner-ux-repair.css'
      - 'index.html'
      - 'src/core-runtime/**'
      - 'qa_premium_ui.py'
      - 'qa/premium-ui.spec.js'
      - 'playwright.premium.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'qa_browser_dependency_lock.py'
      - '.github/workflows/premium-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Premium UI static release governance
        run: python qa_premium_ui.py
      - name: Install pinned premium browser matrix
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps chromium webkit
      - name: Start local candidate server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mouldmaster-premium-http.log 2>&1 &
          echo $! > /tmp/mouldmaster-premium-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mouldmaster-premium-http.log
          exit 1
      - name: Chromium premium UI contract
        run: npx playwright test --config=playwright.premium.config.cjs --project=chromium-premium
      - name: WebKit premium UI contract
        run: npx playwright test --config=playwright.premium.config.cjs --project=webkit-premium
      - name: Upload premium UI review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: premium-ui-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
