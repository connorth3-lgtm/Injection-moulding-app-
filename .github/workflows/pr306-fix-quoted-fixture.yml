name: PR 306 temporary quoted-fixture repair

on:
  push:
    branches:
      - fix/csv-structure-validation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/csv-structure-validation
          fetch-depth: 0
      - name: Repair escaped-quote regression fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa_process_data_local_intake.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacement = "const escapedQuote=api.parseCsv('a,b\\\\n" + chr(34) + "say " + chr(34)*2 + "hi" + chr(34)*2 + "'+String.fromCharCode(34)+',3\\\\n');"
          matches = 0
          for i, line in enumerate(lines):
              if line.startswith('const escapedQuote=api.parseCsv('):
                  lines[i] = replacement
                  matches += 1
          if matches != 1:
              raise SystemExit(f'Expected exactly one escapedQuote fixture, found {matches}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile qa_process_data_local_intake.py
      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/pr306-fix-quoted-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa_process_data_local_intake.py .github/workflows/pr306-fix-quoted-fixture.yml
          git commit -m 'Fix escaped-quote CSV regression fixture'
          git push origin HEAD:fix/csv-structure-validation
