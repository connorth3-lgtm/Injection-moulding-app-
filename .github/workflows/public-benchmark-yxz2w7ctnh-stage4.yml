name: MouldMaster Public Measured Benchmark — ABS PLA injection tests stage 4

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_yxz2w7ctnh_stage4.py'
      - 'qa_public_benchmark_yxz2w7ctnh_stage4.py'
      - 'data/public-benchmark-contracts/yxz2w7ctnh-v1.json'
      - '.github/workflows/public-benchmark-yxz2w7ctnh-stage4.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_yxz2w7ctnh_stage4.py'
      - 'qa_public_benchmark_yxz2w7ctnh_stage4.py'
      - 'data/public-benchmark-contracts/yxz2w7ctnh-v1.json'
      - '.github/workflows/public-benchmark-yxz2w7ctnh-stage4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injection-scalar-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate stage-four evidence boundary
        run: python qa_public_benchmark_yxz2w7ctnh_stage4.py
      - name: Count pinned injection material-test scalar cells
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_yxz2w7ctnh_stage4.py \
            --output benchmark-results/yxz2w7ctnh-stage4.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate accepted aggregate result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/yxz2w7ctnh-stage4.json'))
          assert x['status']=='completed-profiled-injection-material-test-scalars'
          assert x['source']['datasetDoi']=='10.17632/yxz2w7ctnh.1'
          assert x['source']['license']=='CC BY 4.0'
          assert x['retrieval']['allPublisherHashesMatched'] is True
          assert x['retrieval']['impactWorkbookRetrieved'] is False
          assert x['retrieval']['energyWorkbookRetrieved'] is False
          assert x['profile']['injectionRouteAnchorsMatched'] is True
          assert x['profile']['acceptedInjectionMaterialTestDirectPhysicalValues']==450
          assert x['profile']['impactSheetsExcludedRouteUnresolved'] is True
          assert x['profile']['rawNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is True
          assert x['acceptance']['acceptedInjectionSubsetFullyProfiled'] is True
          assert x['acceptance']['acceptedMaterialTestDirectPhysicalValues']==450
          assert x['acceptance']['acceptedMaterialTestTraceValues']==0
          assert x['acceptance']['acceptedInjectionProcessTimeSeriesSamples']==0
          print(json.dumps({'status':x['status'],'directPhysicalValues':x['acceptance']['acceptedMaterialTestDirectPhysicalValues'],'sheets':x['profile']['acceptedSheets']},indent=2))
          PY
      - name: Upload aggregate accepted profile only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-yxz2w7ctnh-stage4-profile
          path: benchmark-results/yxz2w7ctnh-stage4.json
          if-no-files-found: error
          retention-days: 30
