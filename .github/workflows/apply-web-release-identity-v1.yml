name: Apply Web Release Identity v1

on:
  push:
    branches:
      - release/web-identity-v1
    paths:
      - .github/workflows/apply-web-release-identity-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/web-identity-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Create canonical web-release sync
        run: |
          cat > tools/sync_web_release.py <<'PY'
          #!/usr/bin/env python3
          """Synchronise browser/PWA release identity from version.json."""
          from __future__ import annotations

          import argparse
          import json
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          VERSION_RE = re.compile(r"^\d{4}\.\d{2}\.\d{2}\.\d+$")

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Could not synchronise {label}: expected exactly one match, found {count}")
              return out

          def desired_files() -> dict[Path, str]:
              version = json.loads((ROOT / "version.json").read_text(encoding="utf-8"))
              web_release = str(version.get("web_release", ""))
              if not VERSION_RE.fullmatch(web_release):
                  raise SystemExit("version.json web_release must use YYYY.MM.DD.N")

              worker_path = ROOT / "service-worker.js"
              worker = worker_path.read_text(encoding="utf-8")
              revision_match = re.search(r"^const CACHE_REVISION='([^']+)';$", worker, flags=re.M)
              if not revision_match:
                  raise SystemExit("service-worker CACHE_REVISION is missing")
              cache_revision = revision_match.group(1)
              worker = replace_once(
                  worker,
                  r"^const CACHE_VERSION='[^']+';$",
                  f"const CACHE_VERSION='{web_release}';",
                  "service-worker CACHE_VERSION",
              )

              index_path = ROOT / "index.html"
              index = index_path.read_text(encoding="utf-8")
              index = replace_once(
                  index,
                  r'^    const SHELL_RELEASE="[^"]+";$',
                  f'    const SHELL_RELEASE="{web_release}";',
                  "index SHELL_RELEASE",
              )
              index = replace_once(
                  index,
                  r'^    const RUNTIME_ASSET_VERSION=(?:"[^"]+"|SHELL_RELEASE);$',
                  '    const RUNTIME_ASSET_VERSION=SHELL_RELEASE;',
                  "index RUNTIME_ASSET_VERSION",
              )
              expected_cache = f"mouldmaster-static-{web_release}-{cache_revision}"
              index = replace_once(
                  index,
                  r'^    const EXPECTED_STATIC_CACHE="[^"]+";$',
                  f'    const EXPECTED_STATIC_CACHE="{expected_cache}";',
                  "index EXPECTED_STATIC_CACHE",
              )

              shell_path = ROOT / "pwa-shell.js"
              shell = shell_path.read_text(encoding="utf-8")
              shell = replace_once(
                  shell,
                  r"^const RELEASE='[^']+';$",
                  f"const RELEASE='{web_release}';",
                  "pwa-shell RELEASE",
              )
              return {worker_path: worker, index_path: index, shell_path: shell}

          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--check", action="store_true")
              args = parser.parse_args()
              changed = []
              for path, desired in desired_files().items():
                  current = path.read_text(encoding="utf-8")
                  if current == desired:
                      continue
                  changed.append(path.relative_to(ROOT).as_posix())
                  if not args.check:
                      path.write_text(desired, encoding="utf-8")
              if args.check and changed:
                  raise SystemExit("Web release identity is out of sync: " + ", ".join(changed))
              if args.check:
                  print("Web release identity is synchronised")
              elif changed:
                  print("Synchronised web release identity: " + ", ".join(changed))
              else:
                  print("Web release identity already synchronised")

          if __name__ == "__main__":
              main()
          PY
          chmod +x tools/sync_web_release.py
      - name: Promote web_release authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('version.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['web_release']='2026.09.03.1'
          data['published']='2026-09-03'
          ordered={}
          for key in ['web_release','android_release','desktop_release','desktop_release_tag','desktop_release_url','windows_recovery_release','content_version','question_bank_version','legacy_review_id_version','assessment_quality_version','assessment_storage_scope_version','assessment_evidence_version','production_observability_version','read_aloud_version','published','repository','pages_url']:
              if key in data: ordered[key]=data[key]
          for key,value in data.items():
              if key not in ordered: ordered[key]=value
          p.write_text(json.dumps(ordered,indent=2)+"\n",encoding='utf-8')
          PY
          python tools/sync_web_release.py
      - name: Add web release to Pages provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_pages_artifact.py')
          text=p.read_text(encoding='utf-8')
          old='''    runtime_version, cache_version, cache_revision = extract_runtime_metadata()\n    source_sha = os.environ.get("GITHUB_SHA", "local")\n    deployment = {\n        "schema": 2,\n        "source_sha": source_sha,'''
          new='''    runtime_version, cache_version, cache_revision = extract_runtime_metadata()\n    version_metadata = json.loads((ROOT / "version.json").read_text(encoding="utf-8"))\n    web_release = str(version_metadata.get("web_release", ""))\n    if not re.fullmatch(r"\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d+", web_release):\n        raise SystemExit("version.json web_release is missing or invalid")\n    if cache_version != web_release:\n        raise SystemExit(f"Service-worker cache version {cache_version} does not match web_release {web_release}")\n    source_sha = os.environ.get("GITHUB_SHA", "local")\n    deployment = {\n        "schema": 3,\n        "web_release": web_release,\n        "source_sha": source_sha,'''
          if old not in text: raise SystemExit('Pages deployment insertion point missing')
          text=text.replace(old,new,1)
          old2='''    manifest = {\n        "schema": 2,\n        "source_sha": source_sha,'''
          new2='''    manifest = {\n        "schema": 3,\n        "web_release": web_release,\n        "source_sha": source_sha,'''
          if old2 not in text: raise SystemExit('Pages manifest insertion point missing')
          text=text.replace(old2,new2,1)
          text=text.replace('f"assessment runtime {runtime_version}, source {source_sha[:12]})."','f"web release {web_release}, assessment runtime {runtime_version}, source {source_sha[:12]})."',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Separate web and Android release QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace('ANDROID_RELEASE = "2026.08.26.2"\n','WEB_RELEASE = "2026.09.03.1"\nANDROID_RELEASE = "2026.08.26.2"\n',1)
          text=text.replace('assert version["android_release"] == ANDROID_RELEASE\n','assert version["web_release"] == WEB_RELEASE\nassert version["android_release"] == ANDROID_RELEASE\n',1)
          text=text.replace("assert f'const SHELL_RELEASE=\"{ANDROID_RELEASE}\"' in index","assert f'const SHELL_RELEASE=\"{WEB_RELEASE}\"' in index",1)
          text=text.replace("assert f\"CACHE_VERSION='{ANDROID_RELEASE}'\" in sw","assert f\"CACHE_VERSION='{WEB_RELEASE}'\" in sw",1)
          text=text.replace("assert f\"const RELEASE='{ANDROID_RELEASE}'\" in shell","assert f\"const RELEASE='{WEB_RELEASE}'\" in shell",1)
          anchor='assert f\'const SHELL_RELEASE="{WEB_RELEASE}"\' in index\n'
          if anchor not in text: raise SystemExit('qa_release web shell assertion migration failed')
          text=text.replace(anchor,anchor+'assert \'const RUNTIME_ASSET_VERSION=SHELL_RELEASE;\' in index\n',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Add web identity QA
        run: |
          cat > qa_web_release_identity.py <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import shutil
          import subprocess

          ROOT=Path(__file__).resolve().parent
          def text(name): return (ROOT/name).read_text(encoding='utf-8')
          def need(ok,msg):
              if not ok: raise AssertionError(msg)

          version=json.loads(text('version.json'))
          web=str(version.get('web_release',''))
          need(re.fullmatch(r'\d{4}\.\d{2}\.\d{2}\.\d+',web) is not None,'web_release must use YYYY.MM.DD.N')
          need(version.get('android_release'),'android_release must remain an independent platform release')

          sw=text('service-worker.js')
          rev=re.search(r"^const CACHE_REVISION='([^']+)';$",sw,re.M)
          need(rev is not None,'service-worker cache revision missing')
          need(f"const CACHE_VERSION='{web}';" in sw,'service-worker cache version is not web_release')
          expected=f'mouldmaster-static-{web}-{rev.group(1)}'

          idx=text('index.html')
          need(f'const SHELL_RELEASE="{web}";' in idx,'index shell release is not web_release')
          need('const RUNTIME_ASSET_VERSION=SHELL_RELEASE;' in idx,'runtime asset query identity is not derived from web_release')
          need(f'const EXPECTED_STATIC_CACHE="{expected}";' in idx,'index expected cache is not derived from web_release + cache revision')
          need(f"const RELEASE='{web}';" in text('pwa-shell.js'),'PWA display release is not web_release')

          subprocess.run(['python','tools/sync_web_release.py','--check'],cwd=ROOT,check=True)
          env=os.environ.copy();env['GITHUB_SHA']='0123456789abcdef0123456789abcdef01234567';env['GITHUB_REF_NAME']='qa-web-release'
          subprocess.run(['python','tools/build_pages_artifact.py'],cwd=ROOT,env=env,check=True)
          deployment=json.loads(text('.pages-dist/deployment.json'))
          manifest=json.loads(text('.pages-dist/pages-manifest.json'))
          for payload,label in [(deployment,'deployment'),(manifest,'pages manifest')]:
              need(payload.get('web_release')==web,f'{label} does not preserve canonical web_release')
              need(payload.get('source_sha')==env['GITHUB_SHA'],f'{label} does not preserve deployment source_sha provenance')
              need(payload.get('schema')==3,f'{label} schema was not advanced for web_release metadata')
          need(deployment.get('service_worker_cache_version')==web,'deployment cache version does not equal web_release')
          shutil.rmtree(ROOT/'.pages-dist',ignore_errors=True)
          print(f'MouldMaster web release identity QA passed ({web}; source_sha remains independent provenance)')
          PY
      - name: Validate canonical web identity
        run: |
          python tools/sync_web_release.py --check
          python qa_web_release_identity.py
          python qa_release.py
          python qa_architecture_debt.py
          node --check pwa-shell.js
          node --check service-worker.js
      - name: Commit web identity migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html service-worker.js pwa-shell.js tools/sync_web_release.py tools/build_pages_artifact.py qa_release.py qa_web_release_identity.py
          git commit -m "Unify canonical web release identity"
          git push origin HEAD:release/web-identity-v1
