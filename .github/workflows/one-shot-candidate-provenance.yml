name: One-shot candidate provenance

on:
  push:
    branches: [ fix/learner-backup-integrity-v3 ]

permissions:
  contents: write
  actions: read

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-backup-integrity-v3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild retained exact candidate and calculate governed fingerprint
        shell: bash
        env:
          CANDIDATE_SHA: 0100306094648cda214fed513365761cff9c4f25
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/mm-candidate "$CANDIDATE_SHA"
          cd /tmp/mm-candidate
          GITHUB_SHA="$CANDIDATE_SHA" python tools/build_pages_artifact.py
          python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint > /tmp/mm-fingerprint.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' /tmp/mm-fingerprint.txt
      - name: Read retained GitHub artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '35282006382'
          CANDIDATE_SHA: 0100306094648cda214fed513365761cff9c4f25
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > /tmp/mm-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=os.environ['CANDIDATE_SHA']
          run_id=int(os.environ['RUN_ID'])
          name=f'physical-pwa-candidate-{sha}'
          data=json.loads(Path('/tmp/mm-artifacts.json').read_text())
          rows=[x for x in data.get('artifacts',[]) if x.get('name')==name and not x.get('expired')]
          if len(rows)!=1:
              raise SystemExit(f'expected one retained candidate artifact {name}, got {len(rows)}')
          row=rows[0]
          fp=Path('/tmp/mm-fingerprint.txt').read_text().strip()
          record={
              'schemaVersion':1,
              'release':'2026.09.18.1',
              'sourceSha':sha,
              'runtimeFingerprint':fp,
              'candidateRunId':run_id,
              'candidateWorkflow':'Pre-merge Public Candidate',
              'artifactId':row['id'],
              'artifactName':row['name'],
              'artifactDigest':row['digest'],
              'artifactExpiresAt':row['expires_at'],
              'status':'technical-candidate-only',
              'boundary':'This is exact technical candidate provenance only; it is not physical-device, assistive-technology, SME, learner-outcome, signing, Store, accreditation or production evidence.'
          }
          Path('qa/PREMERGE_CANDIDATE_2026.09.18.1.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(record,sort_keys=True))
          PY
      - name: Commit provenance and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-candidate-provenance.yml
          git add qa/PREMERGE_CANDIDATE_2026.09.18.1.json
          git diff --cached --check
          git commit -m "Record exact 2026.09.18.1 candidate provenance"
          git push origin HEAD:fix/learner-backup-integrity-v3
