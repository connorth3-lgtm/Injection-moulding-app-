name: MouldMaster Public Measured Benchmark — Injection operations stage 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2-batch4]
    paths:
      - 'tools/run_public_benchmark_ypf95p4bs4_stage2.py'
      - 'qa_public_benchmark_ypf95p4bs4_stage2.py'
      - 'data/public-benchmark-results/ypf95p4bs4-stage1.json'
      - '.github/workflows/public-benchmark-ypf95p4bs4-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbook-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate evidence boundary
        run: python qa_public_benchmark_ypf95p4bs4_stage2.py
      - name: Profile exact publisher XLSX files
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_ypf95p4bs4_stage2.py \
            --output benchmark-results/ypf95p4bs4-stage2.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate workbook profile
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/ypf95p4bs4-stage2.json'))
          assert x['status']=='retrieved-operational-workbooks-needs-semantic-decision'
          assert x['source']['datasetDoi']=='10.17632/ypf95p4bs4.1'
          assert x['source']['license']=='CC BY 4.0'
          assert len(x['files'])==2
          assert all(f['publisherSha256Matched'] is True for f in x['files'])
          assert x['retrieval']['doeFilesDownloaded'] is False
          assert x['retrieval']['rawPublisherFilesCommitted'] is False
          assert x['retrieval']['rawNumericValuesUploadedAsArtifact'] is False
          assert x['profile']['rawNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['acceptance']['acceptedRecordLevelMeasuredValues']==0
          print(json.dumps({'files':x['files'],'profile':x['profile']},indent=2))
          PY
      - name: Upload aggregate workbook profile only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-public-measured-benchmark-ypf95p4bs4-stage2
          path: benchmark-results/ypf95p4bs4-stage2.json
          if-no-files-found: error
          retention-days: 30
