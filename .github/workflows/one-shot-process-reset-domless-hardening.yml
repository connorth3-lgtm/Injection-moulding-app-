name: One-shot process reset DOM-less hardening

on:
  push:
    branches:
      - audit/process-reset-domless-hardening
    paths:
      - .github/workflows/one-shot-process-reset-domless-hardening.yml
      - .github/scripts/tmp_domless_reset_patch.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/process-reset-domless-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply DOM-less reset hardening
        run: python .github/scripts/tmp_domless_reset_patch.py
      - name: Bump governed web release
        run: python tools/bump_web_release.py --release 2026.09.12.6
      - name: Validate process-data and DOM-less bridge contracts
        shell: bash
        run: |
          node --check training-qa-fix.js
          node --check qa_process_data_integrity.cjs
          node qa_process_data_integrity.cjs
          node qa_data_integration_statistics.cjs
          node qa_process_data_followup.cjs
          python qa_data_integration.py
          python qa_process_data_local_intake.py
          python tools/sync_web_release.py --check
          python qa_release.py
          python qa_release_docs.py
          python tools/verify_release_external_validation.py
          git diff --check
      - name: Commit validated product change and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-process-reset-domless-hardening.yml
          rm -f .github/scripts/tmp_domless_reset_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden learner reset relabeling outside browser DOMs'
          git push origin HEAD:audit/process-reset-domless-hardening
