name: Apply CSP Runtime Transform

on:
  push:
    branches:
      - refactor/csp-unsafe-inline-v1
    paths:
      - .github/workflows/apply-csp-runtime-transform.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/csp-unsafe-inline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Regenerate hardened core runtime
        run: python tools/externalize_core_scripts.py
      - name: Validate generated JavaScript
        run: find src/core-runtime -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Validate migration state
        run: python tools/externalize_core_scripts.py --check
      - name: Validate architecture debt
        run: python qa_architecture_debt.py
      - name: Commit generated runtime transform
        run: |
          if git diff --quiet src/core-runtime; then
            echo "No generated runtime changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core-runtime
          git commit -m "Harden certificate print runtime without document.write"
          git push origin HEAD:refactor/csp-unsafe-inline-v1
