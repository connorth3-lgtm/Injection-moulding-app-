name: MouldMaster Public Measured Benchmark — Nylon-12 gamma stage 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_nylon12_gamma_stage2.py'
      - 'qa_public_benchmark_nylon12_gamma_stage2.py'
      - 'data/public-benchmark-contracts/nylon12-gamma-8c8fjwcw86-v1.json'
      - '.github/workflows/public-benchmark-nylon12-gamma-stage2.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_nylon12_gamma_stage2.py'
      - 'qa_public_benchmark_nylon12_gamma_stage2.py'
      - 'data/public-benchmark-contracts/nylon12-gamma-8c8fjwcw86-v1.json'
      - '.github/workflows/public-benchmark-nylon12-gamma-stage2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ooxml-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate OOXML evidence boundary
        run: python qa_public_benchmark_nylon12_gamma_stage2.py
      - name: Profile exact publisher OOXML packages
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_nylon12_gamma_stage2.py --output benchmark-results/nylon12-gamma-stage2.json --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only OOXML result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/nylon12-gamma-stage2.json'))
          assert x['status'] in {'ooxml-profile-needs-semantic-review','ooxml-no-machine-readable-measurement-payload'}
          assert x['source']['datasetDoi']=='10.17632/8c8fjwcw86.1'
          assert x['profile']['rawNumericValuesEmitted'] is False
          assert x['profile']['rawImagesEmitted'] is False
          assert x['profile']['rawThirdPartyFilesCommittedOrUploaded'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedInjectionProcessTimeSeriesSamples']==0
          print(json.dumps({'status':x['status'],'embeddedWorkbookCount':x['profile']['embeddedWorkbookCount'],'chartXmlCount':x['profile']['chartXmlCount'],'chartCachedPointElements':x['profile']['chartCachedPointElements'],'routeMarkerTotals':x['profile']['routeMarkerTotals']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-nylon12-gamma-stage2-profile
          path: benchmark-results/nylon12-gamma-stage2.json
          if-no-files-found: error
          retention-days: 30
