name: MouldMaster ProBayes B2SHARE measured benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile_probayes_b2share.py'
      - 'tools/profile_probayes_b2share_fast.py'
      - '.github/workflows/probayes-b2share-benchmark.yml'

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset_id: probayes-main-v2
            output: probayes-main-v2.json
            rows: 564
            md5: f04efe419e63db5fb4a392e1569ea417
          - dataset_id: probayes-doptimal-v1
            output: probayes-doptimal-v1.json
            rows: 303
            md5: 913cb30061ba35b78cc7715799674783
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet profiler dependency
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Profile ${{ matrix.dataset_id }}
        run: python tools/profile_probayes_b2share_fast.py --dataset-id '${{ matrix.dataset_id }}' --output '${{ matrix.output }}'
      - name: Enforce exact source and non-promotion boundary
        env:
          PROFILE: ${{ matrix.output }}
          EXPECTED_ID: ${{ matrix.dataset_id }}
          EXPECTED_ROWS: ${{ matrix.rows }}
          EXPECTED_MD5: ${{ matrix.md5 }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROFILE'],encoding='utf-8'))
          assert p['datasetId']==os.environ['EXPECTED_ID']
          assert p['file']['parquetRows']==int(os.environ['EXPECTED_ROWS'])
          assert p['file']['md5']==os.environ['EXPECTED_MD5']
          assert p['file']['sha256'] and p['file']['sizeBytes']>50_000_000
          assert p['file']['arrowTopLevelFields']>100
          assert p['schemaSummary']['listFields']>0
          assert p['acceptedMeasuredTimeSeriesSamples']==0
          assert p['acceptedMeasuredCycles']==0
          assert p['rawSourceRowsCommitted'] is False
          assert p['rawSourceRedistributed'] is False
          print('ProBayes exact-file discovery profile passed:',p['datasetId'],p['file'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-${{ matrix.dataset_id }}-profile
          path: ${{ matrix.output }}
          retention-days: 90
