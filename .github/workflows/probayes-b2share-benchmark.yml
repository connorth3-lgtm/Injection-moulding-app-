name: MouldMaster ProBayes B2SHARE measured benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile_probayes_b2share.py'
      - '.github/workflows/probayes-b2share-benchmark.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet profiler dependency
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Profile both ProBayes B2SHARE datasets
        run: python tools/profile_probayes_b2share.py --output probayes-b2share-profile.json
      - name: Enforce discovery boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('probayes-b2share-profile.json',encoding='utf-8'))
          assert p['datasetPackages']==2
          ids={x['datasetId'] for x in p['profiles']}
          assert ids=={'probayes-main-v2','probayes-doptimal-v1'}
          expected={
            'probayes-main-v2':(564,334,'f04efe419e63db5fb4a392e1569ea417'),
            'probayes-doptimal-v1':(303,396,'913cb30061ba35b78cc7715799674783'),
          }
          for x in p['profiles']:
            rows,features,md5=expected[x['datasetId']]
            assert x['file']['parquetRows']==rows
            assert x['file']['md5']==md5
            assert x['reconciliation']['rowsMatchPublished'] is True
            assert x['file']['arrowTopLevelFields']>100
            assert x['schemaSummary']['listFields']>0
            assert x['schemaSummary']['totalFiniteNumericElementsInsideAllListFields']>0
            assert x['acceptedMeasuredTimeSeriesSamples']==0
            assert x['acceptedMeasuredCycles']==0
            assert x['rawSourceRowsCommitted'] is False
            assert x['redistributionAllowed'] is False
            assert x['source']['license'] is None
          print('ProBayes discovery profiles passed strict non-promotion boundary')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-probayes-b2share-profile
          path: probayes-b2share-profile.json
          retention-days: 90
