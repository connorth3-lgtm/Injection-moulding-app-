name: One-shot learner import cap hardening

on:
  push:
    branches:
      - audit/standalone-learner-import-cap-hardening
    paths:
      - .github/workflows/one-shot-learner-import-cap-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/standalone-learner-import-cap-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply fail-closed learner registry cap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          targets=[Path('src/core-runtime/core-inline-007.js'),Path('MouldMaster_Core_App.html')]
          old='  const users={};\n  for(const [id,u] of Object.entries(x.users).slice(0,500)){'
          new='  const users={},entries=Object.entries(x.users);\n  if(entries.length>500)throw new Error("Too many learners in backup");\n  for(const [id,u] of entries){'
          for path in targets:
              text=path.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: learner registry patch target count was {text.count(old)}, expected 1')
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          qa_path=Path('qa_standalone_learner_ids.cjs')
          qa=qa_path.read_text(encoding='utf-8')
          anchor="assert.deepEqual(registry.users['learner-1'].examPassStatus,{},'standalone import must strip imported pass assertions');"
          insertion=anchor+"\nconst overCapUsers={};for(let i=0;i<501;i++)overCapUsers[`learner-${i+1}`]={name:`Learner ${i+1}`};\nassert.throws(()=>api.pvBuildImportedUsers({activeUser:'learner-1',users:overCapUsers}),/Too many learners in backup/,'oversized learner registries must fail closed rather than silently truncating valid profiles');"
          if qa.count(anchor)!=1:
              raise SystemExit(f'learner-cap regression anchor count was {qa.count(anchor)}, expected 1')
          qa_path.write_text(qa.replace(anchor,insertion,1),encoding='utf-8')
          release_path=Path('qa_release.py')
          release=release_path.read_text(encoding='utf-8')
          old_hash='4bb28931116c9ad74597aec1c0a57ff5c522e0879d41f4db8984f5648632f855'
          new_hash=hashlib.sha256(Path('MouldMaster_Core_App.html').read_bytes()).hexdigest()
          if release.count(old_hash)!=1:
              raise SystemExit(f'current standalone hash-lock target count was {release.count(old_hash)}, expected 1')
          release_path.write_text(release.replace(old_hash,new_hash,1),encoding='utf-8')
          print(f'Updated current standalone SHA-256 lock to {new_hash}')
          PY
      - name: Synchronize governed web release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old='2026.09.12.14';new='2026.09.12.15'
          files=[
            'README.md','data/release-external-validation-v1.json','index.html','pwa-shell.js',
            'qa_release.py','qa_release_docs.py','service-worker.js','support.html','version.json'
          ]
          total=0
          for name in files:
              path=Path(name);text=path.read_text(encoding='utf-8');count=text.count(old)
              if count<1:
                  raise SystemExit(f'{name}: expected governed release marker {old} was missing')
              path.write_text(text.replace(old,new),encoding='utf-8');total+=count
          print(f'Synchronized {total} governed web release markers: {old} -> {new}')
          PY
      - name: Validate standalone hardening and governed release
        shell: bash
        run: |
          node --check src/core-runtime/core-inline-007.js
          node --check qa_standalone_learner_ids.cjs
          node qa_standalone_learner_ids.cjs
          node qa_final_audit_lifecycle.cjs
          python qa_release.py
          python qa_release_docs.py
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          release='2026.09.12.15'
          version=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert version['web_release']==release
          assert version['published']=='2026-09-12'
          index=Path('index.html').read_text(encoding='utf-8')
          worker=Path('service-worker.js').read_text(encoding='utf-8')
          shell=Path('pwa-shell.js').read_text(encoding='utf-8')
          evidence=json.loads(Path('data/release-external-validation-v1.json').read_text(encoding='utf-8'))
          release_qa=Path('qa_release.py').read_text(encoding='utf-8')
          core_hash=hashlib.sha256(Path('MouldMaster_Core_App.html').read_bytes()).hexdigest()
          match=re.search(r'^CURRENT_CORE_SHA256 = "([0-9a-f]{64})"$',release_qa,re.M)
          assert match and match.group(1)==core_hash
          assert f'const SHELL_RELEASE="{release}"' in index
          assert f"const CACHE_VERSION='{release}'" in worker
          assert release in shell
          assert release in json.dumps(evidence)
          PY
          git diff --check
      - name: Commit validated product change and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-learner-import-cap-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fail closed on oversized learner backup registries'
          git push origin HEAD:audit/standalone-learner-import-cap-hardening
