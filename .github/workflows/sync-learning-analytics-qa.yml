name: Sync Learning Analytics QA

on:
  push:
    branches: [audit-consolidation-2026-09-10]
    paths:
      - '.learning-analytics-qa-sync'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-consolidation-2026-09-10
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reconcile learning analytics QA version pin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa_learning_analytics.py')
          s=p.read_text(encoding='utf-8')
          old='"const VERSION=\'2026.09.05.2\'"'
          new='"const VERSION=\'2026.09.10.1\'"'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one stale learning analytics version pin, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python qa_learning_analytics.py
      - name: Commit reconciled learning analytics QA
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa_learning_analytics.py
          git commit -m 'qa: align learning analytics release contract'
          git push origin HEAD:audit-consolidation-2026-09-10
