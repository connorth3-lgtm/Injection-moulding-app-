name: One-shot Book integrity sync

on:
  push:
    branches: [ fix/learner-backup-integrity-v3 ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-backup-integrity-v3
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebind Book SME and authorization runtime integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          auth_paths = [
              Path('data/book-publication-authorization-v1.json'),
              Path('src/domains/learning/book-data/book-publication-authorization-v1.json'),
          ]
          expected_old = '2d203ada0a7e9c0eb793a55e6ec2d39f16dbd255'
          expected_new = '9a198b0b16ddb998a6dea2ac70dbb524b88a7380'
          for path in auth_paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              hashes = data['runtimeIntegrity']['gitBlobSha1ByFile']
              if hashes.get('book-sme-review-v1.json') != expected_old:
                  raise SystemExit(f'{path}: Book SME integrity source drifted')
              hashes['book-sme-review-v1.json'] = expected_new
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          if auth_paths[0].read_bytes() != auth_paths[1].read_bytes():
              raise SystemExit('Book publication authorization mirrors diverged')

          auth_bytes = auth_paths[0].read_bytes()
          auth_blob = hashlib.sha1(f'blob {len(auth_bytes)}\0'.encode() + auth_bytes).hexdigest()
          runtime = Path('src/domains/learning/book-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          text, n1 = re.subn(r"const VERSION='[^']+';", "const VERSION='2026.09.18.1';", text, count=1)
          text, n2 = re.subn(r"const AUTH_GIT_BLOB_SHA1='[0-9a-f]{40}';", f"const AUTH_GIT_BLOB_SHA1='{auth_blob}';", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Book runtime release/integrity markers drifted')
          runtime.write_text(text, encoding='utf-8')
          print(f'Authorization git blob SHA-1: {auth_blob}')
          PY
          node --check src/domains/learning/book-runtime.js
          python qa_book_release_integration.py
      - name: Commit synchronized authorization/runtime and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-book-integrity-sync.yml
          git add data/book-publication-authorization-v1.json src/domains/learning/book-data/book-publication-authorization-v1.json src/domains/learning/book-runtime.js
          git diff --cached --check
          git commit -m "Rebind Book runtime integrity for 2026.09.18.1"
          git push origin HEAD:fix/learner-backup-integrity-v3
