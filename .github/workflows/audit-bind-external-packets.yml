name: Audit Bind External Packets

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bind exact 2026.09.15.6 external-validation packets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          release='2026.09.15.6'
          old_release='2026.09.15.5'
          source_sha='f5055cf8b156f1887dcd37aa214d37587be97493'
          fingerprint='sha256:5ba0738492ee3e9747150f4638ad327f91786a7a972d68162e08af276543045f'
          run_id=35000457285
          artifact_id=10408649380
          artifact_name=f'physical-pwa-candidate-{source_sha}'
          artifact_digest='sha256:ea15435c02bec91fa12c39d6e786ff6bca6e57baf79214cb146abbd756fa422e'
          artifact_expires='2026-10-15T17:18:48Z'

          replacements={
            old_release:release,
            '7fe353beb0f54b5b8f53851221738bb5c1a9bcfe':source_sha,
            'sha256:b6fca9536f77247e1e778639a7b24228e4fe43ef413fa6e6d025e8a788006f2e':fingerprint,
            '34931583556':str(run_id),
            '10381573337':str(artifact_id),
            'physical-pwa-candidate-7fe353beb0f54b5b8f53851221738bb5c1a9bcfe':artifact_name,
            'sha256:1d036a472946a2425daff02019e5f99893968bee91da5fb108a0b86c5a1a8448':artifact_digest,
            '2026-10-15T05:09:15Z':artifact_expires,
          }
          packet_pairs=[
            ('qa/EXTERNAL_VALIDATION_2026.09.15.5.md','qa/EXTERNAL_VALIDATION_2026.09.15.6.md'),
            ('qa/ACCESSIBILITY_REAL_AT_2026.09.15.5.md','qa/ACCESSIBILITY_REAL_AT_2026.09.15.6.md'),
            ('qa/PWA_PHYSICAL_DEVICE_2026.09.15.5.md','qa/PWA_PHYSICAL_DEVICE_2026.09.15.6.md'),
            ('qa/BOOK_SME_REVIEW_2026.09.15.5.md','qa/BOOK_SME_REVIEW_2026.09.15.6.md'),
            ('qa/CURRICULUM_SME_REVIEW_2026.09.15.5.md','qa/CURRICULUM_SME_REVIEW_2026.09.15.6.md'),
            ('qa/LEARNER_PILOT_2026.09.15.5.md','qa/LEARNER_PILOT_2026.09.15.6.md'),
            ('certification/WINDOWS_SIGNING_READINESS_2026.09.15.5.md','certification/WINDOWS_SIGNING_READINESS_2026.09.15.6.md'),
          ]
          for src,dst in packet_pairs:
            text=Path(src).read_text(encoding='utf-8')
            for old,new in replacements.items(): text=text.replace(old,new)
            Path(dst).write_text(text,encoding='utf-8')

          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path,value): Path(path).write_text(json.dumps(value,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ledger=load('data/release-external-validation-v1.json')
          ledger['release']=release
          ledger['validationIndex']=f'qa/EXTERNAL_VALIDATION_{release}.md'
          ledger['accessibility']['reviewPacket']=f'qa/ACCESSIBILITY_REAL_AT_{release}.md'
          ledger['accessibility']['candidate']={'release':release,'sourceSha':source_sha,'runtimeFingerprint':fingerprint}
          ledger['pwaPhysicalDevices']['reviewPacket']=f'qa/PWA_PHYSICAL_DEVICE_{release}.md'
          ledger['pwaPhysicalDevices']['currentCandidate']={
            'release':release,
            'sourceSha':source_sha,
            'runtimeFingerprint':fingerprint,
            'candidateRunId':run_id,
            'candidateWorkflow':'one-shot exact public candidate build; not production publication',
            'artifactId':artifact_id,
            'artifactName':artifact_name,
            'artifactDigest':artifact_digest,
            'artifactExpiresAt':artifact_expires,
          }
          ledger['windowsDistribution']['readinessPacket']=f'certification/WINDOWS_SIGNING_READINESS_{release}.md'
          ledger['windowsDistribution']['sourceSha']=source_sha
          ledger['bookSme']['reviewPacket']=f'qa/BOOK_SME_REVIEW_{release}.md'
          ledger['curriculumSme']['reviewPacket']=f'qa/CURRICULUM_SME_REVIEW_{release}.md'
          ledger['learnerOutcomes']['pilotPacket']=f'qa/LEARNER_PILOT_{release}.md'
          save('data/release-external-validation-v1.json',ledger)

          at=load('data/accessibility-real-at-validation-v1.json')
          at['release']=release; at['packet']=f'qa/ACCESSIBILITY_REAL_AT_{release}.md'; at['sourceSha']=source_sha; at['runtimeFingerprint']=fingerprint
          save('data/accessibility-real-at-validation-v1.json',at)

          curriculum=load('qa/curriculum-semantic-review.json')
          curriculum['release']=release; curriculum['packet']=f'qa/CURRICULUM_SME_REVIEW_{release}.md'
          save('qa/curriculum-semantic-review.json',curriculum)

          pilot=load('data/learner-pilot-v1.json')
          pilot['release']=release
          save('data/learner-pilot-v1.json',pilot)
          PY
          git diff --check
      - name: Validate packet/runtime binding and HOLD boundaries
        run: |
          python qa_release_validation_packets.py
          python tools/verify_release_external_validation.py
          python qa_book_release_integration.py
          python qa_release.py
          python qa_release_docs.py
          python qa_audit_remediation_20260915_6.py
      - name: Commit exact release packet binding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/release-external-validation-v1.json data/accessibility-real-at-validation-v1.json data/learner-pilot-v1.json qa/curriculum-semantic-review.json qa/EXTERNAL_VALIDATION_2026.09.15.6.md qa/ACCESSIBILITY_REAL_AT_2026.09.15.6.md qa/PWA_PHYSICAL_DEVICE_2026.09.15.6.md qa/BOOK_SME_REVIEW_2026.09.15.6.md qa/CURRICULUM_SME_REVIEW_2026.09.15.6.md qa/LEARNER_PILOT_2026.09.15.6.md certification/WINDOWS_SIGNING_READINESS_2026.09.15.6.md
          git diff --cached --check
          git commit -m '[audit-remediation-generated] Bind 2026.09.15.6 external validation packets'
          git push origin HEAD:fix/audit-remediation-2026-09-16
