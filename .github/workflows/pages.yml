name: MouldMaster Pages Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job receives only the token capabilities it actually uses.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-source:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate production-source guard and live API contract on PRs
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/verify_production_source.py --self-test
          python3 tools/verify_production_source.py \
            --repository "${{ github.repository }}" \
            --source-sha "${{ github.event.pull_request.base.sha }}"
      - name: Require merged-PR provenance before publication (native protection mandatory)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
          --require-native-protection

  publisher-guard:
    permissions:
      contents: read
      actions: write
      pages: write
    needs: production-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Contain competing legacy branch Pages publisher
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/quarantine_legacy_pages.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
      - name: PRs validate release readiness but never publish
        if: github.event_name == 'pull_request'
        run: echo "PR validation checks production provenance, the physical-device contract and exact build behavior without claiming device evidence, mutating Pages settings or publishing."

  build:
    permissions:
      contents: read
    needs: publisher-guard
    runs-on: ubuntu-latest
    outputs:
      production_ready: ${{ steps.physical-readiness.outputs.production_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pages single-publisher QA
        run: python3 qa_pages_single_publisher.py
      - name: Validate physical PWA evidence contract on PRs
        if: github.event_name == 'pull_request'
        run: python3 tools/verify_pwa_physical_evidence.py --contract-only
      - name: Build production-only Pages artifact
        run: python3 tools/build_pages_artifact.py
      - name: Evaluate physical-device production readiness
        id: physical-readiness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # Invalid/malformed evidence is still a hard CI failure.
          python3 tools/verify_pwa_physical_evidence.py --contract-only
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/pwa-physical-device-validation-v1.json').read_text(encoding='utf-8'))
          print(data['status'])
          PY
          )"
          if [[ "$status" == "validated" ]]; then
            # Validated evidence must also match the exact built public runtime.
            python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --require-validated
            echo "production_ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Pages release ready"
              echo "Validated physical iOS/iPadOS and Android evidence matches the exact production artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # A structurally valid pending contract is a release-readiness state, not a CI defect.
            # Still compute/report the exact runtime fingerprint and fail to publish by output gating.
            python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist
            echo "production_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages release not ready::Validated physical iOS/iPadOS and Android evidence is pending; no Pages artifact will be uploaded or deployed."
            {
              echo "### Pages release not ready"
              echo "Physical iOS/iPadOS and Android validation is still pending."
              echo "This is an expected readiness state, not a CI error; publication remains fail-closed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'pull_request' || steps.physical-readiness.outputs.production_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && needs.build.outputs.production_ready == 'true'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    permissions:
      contents: read
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rebuild expected production artifact
        run: python3 tools/build_pages_artifact.py
      - name: Reconfirm validated physical PWA evidence against rebuilt runtime
        run: python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --require-validated
      - name: Verify exact live deployment
        run: >-
          python3 tools/verify_pages_deployment.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --source-sha "${{ github.sha }}"
      - name: Verify deployment remains stable after race window
        run: |
          sleep 15
          python3 tools/verify_pages_deployment.py \
            --base-url "${{ needs.deploy.outputs.page_url }}" \
            --source-sha "${{ github.sha }}" \
            --convergence-attempts 6 \
            --convergence-delay 2
