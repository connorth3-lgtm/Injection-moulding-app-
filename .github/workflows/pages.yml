name: MouldMaster Pages Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job receives only the token capabilities it actually uses.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-source:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production-source guard and live API contract on PRs
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/verify_production_source.py --self-test
          python3 tools/verify_production_source.py \
            --repository "${{ github.repository }}" \
            --source-sha "${{ github.event.pull_request.base.sha }}"
      - name: Require merged-PR provenance before publication (native protection mandatory)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
          --require-native-protection

  # Start independently of production-source so a competing GitHub-managed legacy
  # Pages run gets the earliest possible cancellation attempt. This remains damage
  # limitation only: if workflow mode cannot be confirmed, the guard fails closed.
  publisher-guard:
    permissions:
      contents: read
      actions: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block competing legacy branch Pages publisher
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/quarantine_legacy_pages.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
      - name: PRs validate release readiness but never publish
        if: github.event_name == 'pull_request'
        run: echo "PR validation checks production provenance, the physical-device contract and exact build behavior without claiming device evidence, mutating Pages settings or publishing."
      - name: Confirm protected-main preview-only publication path
        if: github.event_name == 'push'
        run: echo "Protected main pushes always publish the release-hold artifact with the complete governed learner candidate under /preview/. Production-root publication is disabled in this workflow."

  build:
    permissions:
      contents: read
    needs: [production-source, publisher-guard]
    runs-on: ubuntu-latest
    outputs:
      production_ready: ${{ steps.physical-readiness.outputs.production_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pages single-publisher QA
        run: |
          python3 qa_pages_single_publisher.py
          python3 qa_pages_candidate_handoff.py
          python3 qa_release_supply_chain.py
      - name: Validate physical PWA evidence contract on PRs
        if: github.event_name == 'pull_request'
        run: python3 tools/verify_pwa_physical_evidence.py --contract-only
      - name: Build production-only Pages artifact
        run: python3 tools/build_pages_artifact.py
      - name: Report exact public-runtime fingerprint for physical-device validation
        run: python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint
      - name: Evaluate physical-device production readiness
        id: physical-readiness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # Invalid, malformed or stale evidence is still a hard CI failure.
          python3 tools/verify_pwa_physical_evidence.py --contract-only
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/pwa-physical-device-validation-v1.json').read_text(encoding='utf-8'))
          print(data['status'])
          PY
          )"
          if [[ "$status" == "validated" || "$status" == "released-with-accepted-ios-risk" ]]; then
            # Existing authorization may describe the previous production release. A
            # fingerprint mismatch is therefore a governed candidate state, not a
            # reason to relabel old device evidence. Production remains fail-closed.
            if python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --require-release-authorized; then
              echo "production_ready=true" >> "$GITHUB_OUTPUT"
              {
                echo "### Pages release ready"
                echo "Physical-device evidence or an explicit governed platform-risk waiver matches the exact production artifact."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "production_ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Pages candidate requires exact-runtime physical authorization::Existing governed evidence applies to a different public runtime; the current build will be staged for physical validation and production remains held."
              {
                echo "### Pages candidate awaiting exact-runtime physical authorization"
                echo "Existing physical-device evidence remains attached to its previously governed runtime and is not rewritten for this candidate."
                echo "The current build is retained as the protected-main physical-device candidate and exposed only under the non-production /preview/ path."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # Pending evidence keeps the production root fail-closed. The already-built
            # governed public artifact may still be exposed under /preview/ as an
            # explicitly non-production usability path while the root remains held.
            python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist
            echo "production_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages production release not ready::Validated physical iOS/iPadOS and Android evidence is pending; the production root remains held while the current governed learner build is available only under /preview/."
            {
              echo "### Pages production release not ready"
              echo "Physical iOS/iPadOS and Android validation is still pending."
              echo "The production root remains release-held. A clearly separated non-production /preview/ path serves the current governed learner artifact for normal use and device validation without changing production readiness."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage protected-main physical-device test candidate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf physical-pwa-candidate
          mkdir -p physical-pwa-candidate
          cp -a .pages-dist/. physical-pwa-candidate/
          source_fp="$(python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)"
          staged_fp="$(python3 tools/verify_pwa_physical_evidence.py --artifact physical-pwa-candidate --print-fingerprint)"
          test "$source_fp" = "$staged_fp"
      - name: Retain protected-main physical-device test candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-pwa-candidate-${{ github.sha }}
          path: physical-pwa-candidate
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Build release-hold Pages artifact
        if: github.event_name != 'pull_request'
        run: python3 tools/build_pages_hold.py --preview-source .pages-dist
      - name: Upload PR validation Pages artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-dist
      - name: Upload preview-only release-hold Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-hold

  deploy:
    permissions:
      contents: read
      pull-requests: read
      actions: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: mouldmaster-pages-site-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main source before deployment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Recheck current protected-main provenance before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
          --require-native-protection
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy selected Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Recheck current protected-main provenance after deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
          --require-native-protection
      - name: Verify preview-only release-hold deployment
        run: >-
          python3 tools/verify_pages_hold.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --expected-source-sha "${{ github.sha }}"
          --convergence-attempts 12
          --convergence-delay 2
      - name: Verify preview-only release-hold remains stable after race window
        run: |
          sleep 15
          python3 tools/verify_pages_hold.py \
            --base-url "${{ needs.deploy.outputs.page_url }}" \
            --expected-source-sha "${{ github.sha }}" \
            --convergence-attempts 6 \
            --convergence-delay 2
      - name: Reconfirm main is still on the deployed SHA after race window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
          --require-native-protection
