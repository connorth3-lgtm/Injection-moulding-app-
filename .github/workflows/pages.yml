name: Deploy MouldMaster to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate production-source guard code on PRs
        if: github.event_name == 'pull_request'
        run: python3 tools/verify_production_source.py --self-test
      - name: Require merged-PR provenance before publication
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_production_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"

  publisher-guard:
    needs: production-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Contain competing legacy branch Pages publisher
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/quarantine_legacy_pages.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
      - name: PRs build but never publish
        if: github.event_name == 'pull_request'
        run: echo "PR validation does not mutate Pages settings or cancel deployment runs."

  build:
    needs: publisher-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pages single-publisher QA
        run: python3 qa_pages_single_publisher.py
      - name: Build production-only Pages artifact
        run: python3 tools/build_pages_artifact.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rebuild expected production artifact
        run: python3 tools/build_pages_artifact.py
      - name: Verify exact live deployment
        run: >-
          python3 tools/verify_pages_deployment.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --source-sha "${{ github.sha }}"
      - name: Verify deployment remains stable after race window
        run: |
          sleep 15
          python3 tools/verify_pages_deployment.py \
            --base-url "${{ needs.deploy.outputs.page_url }}" \
            --source-sha "${{ github.sha }}" \
            --convergence-attempts 6 \
            --convergence-delay 2
