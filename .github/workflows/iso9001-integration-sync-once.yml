name: One-shot ISO 9001 QMS integration sync

on:
  push:
    branches:
      - feature/iso9001-qms-integration-20260915

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/iso9001-qms-integration-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Integrate governed QMS layer and release identity
        run: |
          python .github/scripts/iso9001_integration_once.py
          sed -i 's/2026\.09\.15\.1/2026.09.15.2/g' qa_book_release_integration.py
          python tools/sync_web_release.py
          node --check quality-management.js
          python qa_iso9001_qms.py
          python qa_book_release_integration.py
          python qa_external_validation_wave1.py
          python tools/verify_release_external_validation.py
          python qa_release_docs.py
          rm .github/workflows/iso9001-integration-sync-once.yml
          rm .github/scripts/iso9001_integration_once.py
      - name: Commit governed ISO 9001 integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate ISO 9001 QMS support and synchronize 2026.09.15.2"
          git push origin HEAD:feature/iso9001-qms-integration-20260915
