name: Temporary residual audit remediation

on:
  push:
    branches:
      - fix-residual-audit-integrity-2026-09-15-4

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-residual-audit-integrity-2026-09-15-4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply residual audit remediation
        run: |
          python tools/_tmp_fix_residual_audit.py
          python tools/build_runtime_packs.py
      - name: Run focused correctness contracts
        run: |
          node --check data-integration-runtime.js
          node --check process-data-intelligence-ui.js
          node --check training-qa-fix.js
          node --check src/domains/process/process-data-integrity.js
          node qa_process_statistics_integrity.cjs
          node qa_import_identity_integrity.cjs
          node qa_process_data_integrity.cjs
          node qa_final_audit_lifecycle.cjs
          python qa_data_integration.py
          python qa_architecture_debt.py
          python qa_release.py
          python qa_release_docs.py
          python qa_book_release_integration.py
          python tools/verify_release_external_validation.py
          python tools/verify_frozen_recovery.py
      - name: Commit permanent remediation
        run: |
          git add -A
          git reset .github/workflows/_tmp-fix-residual-audit.yml tools/_tmp_fix_residual_audit.py
          if git diff --cached --quiet; then
            echo 'No permanent remediation changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix residual data integrity and privacy defects'
          git push origin HEAD:fix-residual-audit-integrity-2026-09-15-4
