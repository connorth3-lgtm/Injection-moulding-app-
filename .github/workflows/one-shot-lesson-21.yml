name: One-shot lesson .21 release synchronizer

on:
  push:
    branches:
      - fix/tighter-mobile-lesson-flow
    paths:
      - .github/workflows/one-shot-lesson-21.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tighter-mobile-lesson-flow
      - name: Synchronize governed web release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='2026.09.06.20'
          new='2026.09.06.21'
          files=['index.html','service-worker.js','pwa-shell.js','version.json','qa_release.py']
          for name in files:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              count=text.count(old)
              if count < 1:
                  raise SystemExit(f'{name}: expected at least one {old} release marker')
              path.write_text(text.replace(old,new),encoding='utf-8')
              print(f'{name}: replaced {count} release marker(s)')
          PY
      - name: Regenerate deterministic style CSP
        run: node tools/generate_style_csp.cjs
      - name: Check generated CSP and release identity
        run: |
          node tools/generate_style_csp.cjs --check
          python3 qa_web_release_identity.py
      - name: Commit synchronized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js pwa-shell.js version.json qa_release.py
          git diff --cached --check
          git commit -m 'Synchronize web release 2026.09.06.21'
          git push origin HEAD:fix/tighter-mobile-lesson-flow
