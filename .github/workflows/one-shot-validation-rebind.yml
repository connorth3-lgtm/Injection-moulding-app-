name: One-shot validation packet rebind

on:
  push:
    branches: [ fix/learner-backup-integrity-v3 ]

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-backup-integrity-v3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materialize release-specific HOLD contracts and packets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old='2026.09.16.2'
          new='2026.09.18.1'
          root=Path('.')
          candidate=json.loads((root/f'qa/PREMERGE_CANDIDATE_{new}.json').read_text())
          old_sha='e20d789464f65f411afb3e508722644f59867436'
          old_fp='sha256:df173158dae2b63da7b764cc8a7a7dd1ab20e99387279d3162800ccd2d14a1ef'
          old_run='35182050411'
          old_artifact='10480573719'
          old_digest='sha256:88ce4f47209e81610347088bb8035b16fe574e61bde142e5cecfe4214216fafc'
          old_expiry='2026-10-17T04:28:37Z'
          replacements={
              old:new,
              old_sha:candidate['sourceSha'],
              old_fp:candidate['runtimeFingerprint'],
              old_run:str(candidate['candidateRunId']),
              old_artifact:str(candidate['artifactId']),
              old_digest:candidate['artifactDigest'],
              old_expiry:candidate['artifactExpiresAt'],
          }
          packet_pairs=[
              (f'qa/EXTERNAL_VALIDATION_{old}.md',f'qa/EXTERNAL_VALIDATION_{new}.md'),
              (f'qa/ACCESSIBILITY_REAL_AT_{old}.md',f'qa/ACCESSIBILITY_REAL_AT_{new}.md'),
              (f'qa/PWA_PHYSICAL_DEVICE_{old}.md',f'qa/PWA_PHYSICAL_DEVICE_{new}.md'),
              (f'certification/WINDOWS_SIGNING_READINESS_{old}.md',f'certification/WINDOWS_SIGNING_READINESS_{new}.md'),
              (f'qa/BOOK_SME_REVIEW_{old}.md',f'qa/BOOK_SME_REVIEW_{new}.md'),
              (f'qa/CURRICULUM_SME_REVIEW_{old}.md',f'qa/CURRICULUM_SME_REVIEW_{new}.md'),
              (f'qa/LEARNER_PILOT_{old}.md',f'qa/LEARNER_PILOT_{new}.md'),
          ]
          for src,dst in packet_pairs:
              text=(root/src).read_text(encoding='utf-8')
              for before,after in replacements.items(): text=text.replace(before,after)
              (root/dst).write_text(text,encoding='utf-8')

          external=root/f'qa/EXTERNAL_VALIDATION_{new}.md'
          text=external.read_text(encoding='utf-8')
          stale=(
              f'This is a candidate **rebind**, not external evidence. The Academy/Book learner runtime remains release `{new}`. '
              'The public fingerprint changed because the frozen legacy Windows recovery metadata in `latest.json` was hardened so both the recovery app and launcher URLs are immutable-commit pinned and SHA-256 locked. '
              'The Book content, Academy learner runtime and existing human/device evidence states were not promoted or relabelled.'
          )
          fresh=(
              f'This is a candidate **rebind**, not external evidence. The learner-facing runtime deliberately advanced to release `{new}` to add runtime-verified SHA-256 learner-backup integrity before restore. '
              'The Book teaching content and existing human/device/SME/learner/Windows evidence states were not promoted or relabelled. '
              'All six external workstreams remain HOLD until genuine release-specific evidence exists.'
          )
          if stale not in text: raise SystemExit('external validation rebind paragraph drifted')
          external.write_text(text.replace(stale,fresh),encoding='utf-8')

          access=root/f'qa/ACCESSIBILITY_REAL_AT_{new}.md'
          text=access.read_text(encoding='utf-8')
          stale=(
              f'This is a candidate **rebind**, not new AT evidence. The learner-facing Academy/Book runtime remains release `{new}`; '
              'the public artifact fingerprint changed because `latest.json` was hardened so the frozen legacy Windows recovery launcher URL is commit-pinned as well as SHA-256 locked. '
              'No earlier human/device evidence is relabelled. If learner-facing runtime bytes change again, this packet must be rebound before new validation is recorded.'
          )
          fresh=(
              f'This is a candidate **rebind**, not new AT evidence. The learner-facing runtime deliberately advanced to release `{new}` for the learner-backup integrity change. '
              'No earlier human/device evidence is relabelled. If learner-facing runtime bytes change again, this packet must be rebound before new validation is recorded.'
          )
          if stale not in text: raise SystemExit('accessibility rebind paragraph drifted')
          access.write_text(text.replace(stale,fresh),encoding='utf-8')

          pwa=root/f'qa/PWA_PHYSICAL_DEVICE_{new}.md'
          text=pwa.read_text(encoding='utf-8')
          stale=(
              f'The retained candidate was built from the exact PR head with the repository\'s production Pages artifact builder and public-runtime fingerprint verifier. It is a **candidate rebind**, not physical-device evidence. '
              f'The Academy/Book learner runtime remains release `{new}`; the public byte set changed because `latest.json` was hardened so the frozen legacy Windows recovery launcher URL is commit-pinned as well as SHA-256 locked. '
              'No earlier device evidence is relabelled. Governance-only commits after the retained source do not change the public runtime fingerprint and must remain byte-equivalent under `qa_release_validation_packets.py`.'
          )
          fresh=(
              'The retained candidate was built from the exact PR head with the repository\'s production Pages artifact builder and public-runtime fingerprint verifier. It is a **candidate rebind**, not physical-device evidence. '
              f'The learner-facing runtime deliberately advanced to release `{new}` for runtime-verified learner-backup integrity. No earlier device evidence is relabelled. '
              'Governance-only commits after the retained source do not change the public runtime fingerprint and must remain byte-equivalent under `qa_release_validation_packets.py`.'
          )
          if stale not in text: raise SystemExit('PWA rebind paragraph drifted')
          text=text.replace(stale,fresh)
          text=text.replace(
              'a normal learner backup still imports, an oversized or malformed backup fails closed without replacing existing state,',
              'a valid v3 learner backup imports, SHA-256 tampering plus oversized/malformed backups fail closed without replacing existing state, and legacy unverified backups disclose that boundary before import,'
          )
          pwa.write_text(text,encoding='utf-8')

          windows=root/f'certification/WINDOWS_SIGNING_READINESS_{new}.md'
          text=windows.read_text(encoding='utf-8')
          first=(
              f'This packet governs the external Windows distribution work associated with MouldMaster web release `{new}` at polished pre-merge candidate source commit `5c4e5f303cc1835157fb53869e93ca94b66810c4`. '
              'The separately governed desktop release identity remains `2026.08.26.9` unless deliberately advanced through its own release process.'
          )
          replacement=(
              f'This packet governs the external Windows distribution work associated with MouldMaster web release `{new}`. '
              'The separately governed desktop release identity remains `2026.08.26.9` at its existing governed source/package lineage unless deliberately advanced through its own release process. '
              'The web backup-integrity release does not create new Windows signing, Store, reputation, WACK or physical-machine evidence.'
          )
          if first not in text: raise SystemExit('Windows packet introduction drifted')
          windows.write_text(text.replace(first,replacement),encoding='utf-8')

          access_json=json.loads((root/'data/accessibility-real-at-validation-v1.json').read_text())
          access_json.update({
              'release':new,
              'packet':f'qa/ACCESSIBILITY_REAL_AT_{new}.md',
              'sourceSha':candidate['sourceSha'],
              'runtimeFingerprint':candidate['runtimeFingerprint'],
              'status':'pending-real-at-validation',
              'boundary':'Automated browser/accessibility regressions and the learner-backup integrity release do not substitute for real assistive-technology interaction by a human reviewer. This current-release candidate rebind records exact public bytes only; it does not relabel or manufacture AT evidence.'
          })
          (root/'data/accessibility-real-at-validation-v1.json').write_text(json.dumps(access_json,indent=2)+'\n')

          book=json.loads((root/'data/book-sme-review-v1.json').read_text())
          book['release']=new
          book['status']='hold'
          (root/'data/book-sme-review-v1.json').write_text(json.dumps(book,indent=2)+'\n')

          curriculum=json.loads((root/'qa/curriculum-semantic-review.json').read_text())
          curriculum['release']=new
          curriculum['packet']=f'qa/CURRICULUM_SME_REVIEW_{new}.md'
          (root/'qa/curriculum-semantic-review.json').write_text(json.dumps(curriculum,indent=2)+'\n')

          learner=json.loads((root/'data/learner-pilot-v1.json').read_text())
          learner['release']=new
          learner['status']='prepared'
          learner['evidence']=None
          (root/'data/learner-pilot-v1.json').write_text(json.dumps(learner,indent=2)+'\n')

          ledger=json.loads((root/'data/release-external-validation-v1.json').read_text())
          ledger['release']=new
          ledger['validationIndex']=f'qa/EXTERNAL_VALIDATION_{new}.md'
          ledger['accessibility']['status']='hold'
          ledger['accessibility']['reviewPacket']=f'qa/ACCESSIBILITY_REAL_AT_{new}.md'
          ledger['accessibility']['candidate']={'release':new,'sourceSha':candidate['sourceSha'],'runtimeFingerprint':candidate['runtimeFingerprint']}
          ledger['pwaPhysicalDevices']['status']='hold'
          ledger['pwaPhysicalDevices']['reviewPacket']=f'qa/PWA_PHYSICAL_DEVICE_{new}.md'
          ledger['pwaPhysicalDevices']['currentCandidate']={
              'release':new,'sourceSha':candidate['sourceSha'],'runtimeFingerprint':candidate['runtimeFingerprint'],
              'candidateRunId':candidate['candidateRunId'],'candidateWorkflow':candidate['candidateWorkflow'],
              'artifactId':candidate['artifactId'],'artifactName':candidate['artifactName'],
              'artifactDigest':candidate['artifactDigest'],'artifactExpiresAt':candidate['artifactExpiresAt']
          }
          ledger['windowsDistribution']['status']='hold'
          ledger['windowsDistribution']['readinessPacket']=f'certification/WINDOWS_SIGNING_READINESS_{new}.md'
          ledger['windowsDistribution']['evidence']=None
          ledger['bookSme']['status']='hold'
          ledger['bookSme']['reviewPacket']=f'qa/BOOK_SME_REVIEW_{new}.md'
          ledger['curriculumSme']['status']='hold'
          ledger['curriculumSme']['reviewPacket']=f'qa/CURRICULUM_SME_REVIEW_{new}.md'
          ledger['learnerOutcomes']['status']='hold'
          ledger['learnerOutcomes']['pilotPacket']=f'qa/LEARNER_PILOT_{new}.md'
          ledger['learnerOutcomes']['evidence']=None
          for key in ['fullyExternallyValidated','accreditationAuthorized','learnerEfficacyEstablished','productionRecipeValidated','automaticMachineControlAuthorized']:
              ledger['claims'][key]=False
          (root/'data/release-external-validation-v1.json').write_text(json.dumps(ledger,indent=2)+'\n')
          PY
      - name: Verify release-specific HOLD contract before commit
        run: |
          python tools/verify_release_external_validation.py
          python qa_accessibility_real_at_contract.py
          python qa_curriculum_semantic_review.py
          python qa_release_validation_packets.py
      - name: Commit rebind and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-validation-rebind.yml
          git add data/release-external-validation-v1.json data/accessibility-real-at-validation-v1.json data/book-sme-review-v1.json data/learner-pilot-v1.json qa/curriculum-semantic-review.json qa/EXTERNAL_VALIDATION_2026.09.18.1.md qa/ACCESSIBILITY_REAL_AT_2026.09.18.1.md qa/PWA_PHYSICAL_DEVICE_2026.09.18.1.md certification/WINDOWS_SIGNING_READINESS_2026.09.18.1.md qa/BOOK_SME_REVIEW_2026.09.18.1.md qa/CURRICULUM_SME_REVIEW_2026.09.18.1.md qa/LEARNER_PILOT_2026.09.18.1.md
          git diff --cached --check
          git commit -m "Rebind 2026.09.18.1 external validation HOLD packets"
          git push origin HEAD:fix/learner-backup-integrity-v3
