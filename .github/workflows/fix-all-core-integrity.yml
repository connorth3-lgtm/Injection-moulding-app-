name: Fix-all core integrity split

on:
  push:
    branches: [ audit/fix-all-deep-dive-20260915 ]
    paths:
      - .github/workflows/fix-all-core-integrity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/fix-all-deep-dive-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'

      - name: Split immutable recovery and current standalone core locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('qa_release.py')
          text = path.read_text(encoding='utf-8')
          current = hashlib.sha256(Path('MouldMaster_Core_App.html').read_bytes()).hexdigest()
          recovery_commit = '3e7144b68c5dfe79232cf2ba0180060f1395ffcc'
          recovery_hash = '96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754'

          old = f'CORE_SHA256 = "{recovery_hash}"'
          new = (
              f'WINDOWS_RECOVERY_SOURCE_COMMIT = "{recovery_commit}"\n'
              f'WINDOWS_RECOVERY_CORE_SHA256 = "{recovery_hash}"\n'
              f'CURRENT_CORE_SHA256 = "{current}"'
          )
          if old not in text:
              raise SystemExit('expected legacy CORE_SHA256 lock not found')
          text = text.replace(old, new, 1)

          old_block = '''assert latest["sha256"] == CORE_SHA256, "Windows recovery feed must use audited core SHA-256"\nassert latest["app_url"].endswith("/MouldMaster_Core_App.html"), "Windows recovery feed must point to audited full core"\nassert sha256("MouldMaster_Core_App.html") == latest["sha256"], "Windows recovery content hash mismatch"'''
          new_block = '''assert latest["sha256"] == WINDOWS_RECOVERY_CORE_SHA256, "Windows recovery feed must use audited recovery SHA-256"\nexpected_recovery_url = f"https://raw.githubusercontent.com/connorth3-lgtm/Injection-moulding-app-/{WINDOWS_RECOVERY_SOURCE_COMMIT}/MouldMaster_Core_App.html"\nassert latest["app_url"] == expected_recovery_url, "Windows recovery feed must pin the audited immutable source commit"'''
          if old_block not in text:
              raise SystemExit('expected coupled recovery/core assertion block not found')
          text = text.replace(old_block, new_block, 1)

          old_current = 'assert sha256("MouldMaster_Core_App.html") == CORE_SHA256, "audited core bytes changed"'
          new_current = 'assert sha256("MouldMaster_Core_App.html") == CURRENT_CORE_SHA256, "current standalone core bytes changed without updating its audited hash lock"'
          if old_current not in text:
              raise SystemExit('expected current core assertion not found')
          text = text.replace(old_current, new_current, 1)

          anchor = 'assert len(core) > 500000, "audited core unexpectedly small"\n'
          extra = (
              'assert "function pvBuildImportedUsers(x)" in core and "if(entries.length>500)" in core, "standalone backup import must reject oversized learner registries instead of truncating"\n'
              'assert "function pvCanonicalLearnerId(v)" in core and "Learner identifier mismatch" in core, "standalone learner identity validation is missing"\n'
              'assert "data-mm-switch-user" in core and "function pvWireInstructorSwitches(users)" in core, "standalone instructor switching must not interpolate learner IDs into inline handlers"\n'
          )
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('core assertion anchor not found')
              text = text.replace(anchor, anchor + extra, 1)

          path.write_text(text, encoding='utf-8')
          print(f'Current standalone core SHA-256: {current}')
          PY

      - name: Run release integrity end to end
        run: |
          python qa_release.py
          git diff --check

      - name: Commit integrity split and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-core-integrity.yml
          git add qa_release.py
          git commit -m 'Separate legacy recovery and current core integrity locks'
          git push origin HEAD:audit/fix-all-deep-dive-20260915
