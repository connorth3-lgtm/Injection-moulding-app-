name: One-shot integrated CSP synchronization

on:
  push:
    branches:
      - audit/integrated-remediation-20260912
    paths:
      - .github/workflows/one-shot-integrated-csp-sync.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/integrated-remediation-20260912
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Regenerate strict style CSP allowlist
        run: |
          node tools/generate_style_csp.cjs
          node tools/generate_style_csp.cjs --check
      - name: Bump governed web release
        run: python tools/bump_web_release.py --release 2026.09.12.18
      - name: Validate integrated release without bypassing evidence review
        shell: bash
        run: |
          node tools/generate_style_csp.cjs --check
          node --check training-qa-fix.js
          node --check data-integration-runtime.js
          node --check process-data-intelligence-ui.js
          node --check process-data-local-intake.js
          node qa_standalone_learner_ids.cjs
          node qa_final_audit_lifecycle.cjs
          node qa_data_integration_statistics.cjs
          node qa_process_data_integrity.cjs
          node qa_process_data_followup.cjs
          python qa_data_integration.py
          python qa_process_data_local_intake.py
          python tools/sync_web_release.py --check
          python qa_release.py
          python qa_release_docs.py
          python qa_release_supply_chain.py
          python qa_store_submission.py
          python tools/verify_release_external_validation.py
          git diff --check
      - name: Commit validated CSP sync and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-integrated-csp-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Synchronize integrated style CSP allowlist'
          git push origin HEAD:audit/integrated-remediation-20260912
