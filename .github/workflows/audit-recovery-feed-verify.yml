name: One-shot Recovery Feed Repair Verify

on:
  push:
    branches:
      - 'audit/repair-frozen-recovery-feed'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/repair-frozen-recovery-feed
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Harden release QA recovery contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          replacements=[
            (
              'CORE_SHA256 = "96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754"',
              'WINDOWS_RECOVERY_SOURCE_COMMIT = "19ef75781e3a782b234db313a5265ff0f3518ee4"\nWINDOWS_RECOVERY_CORE_SHA256 = "96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754"\nCURRENT_CORE_SHA256 = "96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754"',
            ),
            (
              'assert latest["sha256"] == CORE_SHA256, "Windows recovery feed must use audited core SHA-256"\nassert latest["app_url"].endswith("/MouldMaster_Core_App.html"), "Windows recovery feed must point to audited full core"\nassert sha256("MouldMaster_Core_App.html") == latest["sha256"], "Windows recovery content hash mismatch"',
              'assert latest["sha256"] == WINDOWS_RECOVERY_CORE_SHA256, "Windows recovery feed must use audited recovery SHA-256"\nexpected_recovery_url = f"https://raw.githubusercontent.com/connorth3-lgtm/Injection-moulding-app-/{WINDOWS_RECOVERY_SOURCE_COMMIT}/MouldMaster_Core_App.html"\nassert latest["app_url"] == expected_recovery_url, "Windows recovery feed must pin the audited immutable source commit"',
            ),
            (
              'assert sha256("MouldMaster_Core_App.html") == CORE_SHA256, "audited core bytes changed"',
              'assert sha256("MouldMaster_Core_App.html") == CURRENT_CORE_SHA256, "current standalone core bytes changed without updating its audited hash lock"',
            ),
          ]
          for old,new in replacements:
              if text.count(old)!=1:
                  raise SystemExit(f'recovery QA patch expected one match, found {text.count(old)}: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify repaired frozen feed and release QA
        run: |
          set -euo pipefail
          python qa_release.py
          python qa_release_docs.py
          python - <<'PY'
          import hashlib,json,re,urllib.request
          manifest=json.load(open('latest.json',encoding='utf-8'))
          url=manifest['app_url']
          assert re.fullmatch(r'https://raw\.githubusercontent\.com/connorth3-lgtm/Injection-moulding-app-/[0-9a-f]{40}/MouldMaster_Core_App\.html',url),url
          req=urllib.request.Request(url,headers={'User-Agent':'MouldMaster-recovery-feed-repair'})
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=response.read()
          actual=hashlib.sha256(payload).hexdigest()
          assert actual==manifest['sha256'],f'repaired recovery payload hash mismatch: {actual}'
          print(f"Repaired recovery URL hash-valid: {manifest['version']} {actual}")
          PY
          git diff --check
      - name: Commit validated QA split
        run: |
          set -euo pipefail
          git add qa_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate frozen recovery and current standalone hash locks'
          git push origin HEAD:audit/repair-frozen-recovery-feed
