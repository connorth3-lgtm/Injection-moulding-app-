name: MouldMaster Primary Measured Evidence

on:
  push:
    branches: [main, evidence-coverage-hardening]
    paths:
      - 'data/primary-measured-evidence-registry-v1.json'
      - 'data/primary-measured-evidence/**'
      - 'data/measured-dataset-inventory-v1.json'
      - 'data/measured-dataset-rights-review-*.json'
      - 'data/public-benchmark-contracts/**'
      - 'data/public-benchmark-results/**'
      - 'data/measured-data-discovery-queue-v1.json'
      - 'data/measured-data-collection-closeout-2026-08-30.json'
      - 'data/evidence-coverage-v1.json'
      - 'qa_primary_measured_evidence.py'
      - 'qa_measured_dataset_inventory.py'
      - 'qa_blocked_dataset_contracts.py'
      - 'qa_remaining_dataset_terminal_states.py'
      - 'qa_measured_data_discovery_queue.py'
      - 'qa_measured_data_collection_closeout.py'
      - 'sources/PRIMARY_MEASURED_EVIDENCE_REGISTRY.md'
      - '.github/workflows/primary-measured-evidence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/primary-measured-evidence-registry-v1.json'
      - 'data/primary-measured-evidence/**'
      - 'data/measured-dataset-inventory-v1.json'
      - 'data/measured-dataset-rights-review-*.json'
      - 'data/public-benchmark-contracts/**'
      - 'data/public-benchmark-results/**'
      - 'data/measured-data-discovery-queue-v1.json'
      - 'data/measured-data-collection-closeout-2026-08-30.json'
      - 'data/evidence-coverage-v1.json'
      - 'qa_primary_measured_evidence.py'
      - 'qa_measured_dataset_inventory.py'
      - 'qa_blocked_dataset_contracts.py'
      - 'qa_remaining_dataset_terminal_states.py'
      - 'qa_measured_data_discovery_queue.py'
      - 'qa_measured_data_collection_closeout.py'
      - 'sources/PRIMARY_MEASURED_EVIDENCE_REGISTRY.md'
      - '.github/workflows/primary-measured-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-primary-measured-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary-measured-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate deduplicated peer-reviewed primary measured registry
        run: python qa_primary_measured_evidence.py
      - name: Validate governed measured dataset inventory
        run: python qa_measured_dataset_inventory.py
      - name: Validate fail-closed blocked dataset contracts
        run: python qa_blocked_dataset_contracts.py
      - name: Validate all remaining dataset terminal states
        run: python qa_remaining_dataset_terminal_states.py
      - name: Validate new measured-data discovery queue
        run: python qa_measured_data_discovery_queue.py
      - name: Validate measured-data collection closeout
        run: python qa_measured_data_collection_closeout.py
      - name: Upload aggregate primary measured registry QA report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-primary-measured-evidence
          path: primary-measured-evidence-report.json
          if-no-files-found: error
      - name: Upload aggregate measured dataset inventory QA report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-measured-dataset-inventory
          path: measured-dataset-inventory-report.json
          if-no-files-found: error
      - name: Upload aggregate blocked dataset contracts QA report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-blocked-dataset-contracts
          path: blocked-dataset-contracts-report.json
          if-no-files-found: error
      - name: Upload aggregate remaining dataset terminal-state report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-remaining-dataset-terminal-states
          path: remaining-dataset-terminal-states-report.json
          if-no-files-found: error
      - name: Upload aggregate measured-data discovery report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-measured-data-discovery-queue
          path: measured-data-discovery-queue-report.json
          if-no-files-found: error
      - name: Upload measured-data collection closeout report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-measured-data-collection-closeout
          path: measured-data-collection-closeout-report.json
          if-no-files-found: error
