name: MouldMaster Real Process Data Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/real-process-data-pilot-template.csv'
      - 'data/real-process-data-dictionary-template.csv'
      - 'data/real-process-trace-template.csv'
      - 'data/real-process-sensor-calibration-template.csv'
      - 'data/real-process-event-template.csv'
      - 'sources/REAL_PROCESS_DATA_CAPTURE_CONTRACT.md'
      - 'qa_real_process_data_contract.py'
      - '.github/workflows/real-process-data-contract.yml'
  push:
    branches: [main]
    paths:
      - 'data/real-process-data-pilot-template.csv'
      - 'data/real-process-data-dictionary-template.csv'
      - 'data/real-process-trace-template.csv'
      - 'data/real-process-sensor-calibration-template.csv'
      - 'data/real-process-event-template.csv'
      - 'sources/REAL_PROCESS_DATA_CAPTURE_CONTRACT.md'
      - 'qa_real_process_data_contract.py'
      - '.github/workflows/real-process-data-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile qa_real_process_data_contract.py
      - name: Validate public capture schemas and evidence boundaries
        run: python qa_real_process_data_contract.py