name: MouldMaster cross-process-chain measured benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile_cross_process_chain.py'
      - '.github/workflows/cross-process-chain-benchmark.yml'
      - 'data/public-benchmark-results/cross-process-chain-v1.json'
      - 'data/profiled-measured-dataset-registry-v1.json'
      - 'data/content-scale-targets.json'
      - 'qa_content_scale_targets.py'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile exact cross-process-chain Zenodo archive
        run: python tools/profile_cross_process_chain.py --output cross-process-chain-v1.json
      - name: Enforce injection-only discovery boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('cross-process-chain-v1.json',encoding='utf-8'))
          assert p['source']['doi']=='10.5281/zenodo.17240390'
          assert p['archive']['md5']=='069e190338b2ca29f736b21fabf407ba'
          assert len(p['archive']['sha256'])==64
          assert p['memberInventory']['files']>0
          assert p['memberInventory']['categoryCounts'].get('screw-driving-json',0)>0
          assert p['acceptedMeasuredCycles']==0
          assert p['acceptedMeasuredTimeSeriesSamples']==0
          assert p['rawSourceRowsCommitted'] is False
          print('Cross-process-chain exact-archive discovery profile passed; downstream screw-driving remains non-counting')
          print('license:',p['source']['licenseMetadata'])
          print('inventory:',p['memberInventory'])
          print('sampled members:',[(x['path'],x['classification'],x.get('header')) for x in p['sampledMembers']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-cross-process-chain-profile
          path: cross-process-chain-v1.json
          retention-days: 90
