name: Temporary update PWA hardening contract

on:
  push:
    branches: [post-25/pwa-release-consistency]
    paths:
      - '.github/workflows/tmp-update-pwa-hardening-contract.yml'

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: post-25/pwa-release-consistency
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Replace stale service-worker hardening assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('qa_runtime_hardening.py')
          s=p.read_text(encoding='utf-8')

          old_comment='''# Service-worker install remains atomic for CORE and best-effort for optional packs.\n# After installation the validated release cache is immutable: normal network fetches\n# may serve fresher online bytes, but they must never write those bytes into STATIC_CACHE.'''
          new_comment='''# Service-worker installation remains atomic across the governed release assets.\n# Once active, governed bytes are pinned to that worker's own immutable named cache;\n# a newer complete cache may wait in parallel but cannot leak bytes into old clients.'''
          assert old_comment in s
          s=s.replace(old_comment,new_comment,1)

          old_needles='''    "${CACHE_VERSION}-${CACHE_REVISION}", "'./repair.html'", "runtimeCritical=url.pathname.endsWith('.js')||url.pathname.endsWith('.json')",\n    "async function fetchNetwork(event)", "fetch(event.request,{cache:'no-store'})", "const network=await fetchNetwork(event)", "if(network&&network.ok)return network", "'./reference-data.html'", "'./reference-2026-expansion.js'", "'./diagnostic-learning-labs.js'",'''
          new_needles='''    "${CACHE_VERSION}-${CACHE_REVISION}", "'./repair.html'", "runtimeCritical=url.pathname.endsWith('.js')||url.pathname.endsWith('.json')",\n    "const RELEASE_PATHS=new Set(", "async function releaseCacheMatch(request)", "const cache=await caches.open(STATIC_CACHE)", "RELEASE_PATHS.has(url.pathname)",\n    "async function fetchNetwork(event)", "fetch(event.request,{cache:'no-store'})", "await fetchNetwork(event)||criticalOfflineResponse(url)", "'./reference-data.html'", "'./reference-2026-expansion.js'", "'./diagnostic-learning-labs.js'",'''
          assert old_needles in s
          s=s.replace(old_needles,new_needles,1)

          old_install='''require("throw new Error" in install and "skipWaiting" in install, "service-worker install must fail closed before activation when any core asset is incomplete")\nruntime_fetch = service_worker[service_worker.index("self.addEventListener('fetch'"):]\nrequire(".put(" not in runtime_fetch, "service-worker runtime fetches must never mutate the validated release cache")'''
          new_install='''require("throw new Error" in install, "service-worker install must fail closed when any governed release asset is incomplete")\nrequire(".skipWaiting(" not in install, "service-worker update must wait for old controlled clients before activation")\nactivate = service_worker[service_worker.index("self.addEventListener('activate'"):service_worker.index("// Governed release bytes")]\nrequire(".clients.claim(" not in activate, "service-worker activation must not replace the controller of an already-open document")\nruntime_fetch = service_worker[service_worker.index("self.addEventListener('fetch'"):]\nrequire("caches.match(" not in runtime_fetch, "service-worker runtime must never search across release generations")\nrequire(".put(" not in runtime_fetch, "service-worker runtime fetches must never mutate the validated release cache")'''
          assert old_install in s
          s=s.replace(old_install,new_install,1)

          p.write_text(s,encoding='utf-8')
          PY
          python qa_runtime_hardening.py
      - name: Commit hardening contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa_runtime_hardening.py
          git diff --cached --check
          git commit -m 'Align PWA hardening QA with release-pinned updates'
          git push origin HEAD:post-25/pwa-release-consistency
