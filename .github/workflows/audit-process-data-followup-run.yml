name: One-shot Process Data Follow-up Runner

on:
  push:
    branches:
      - 'audit/process-data-followup-hardening'

permissions:
  contents: write

concurrency:
  group: audit-process-data-followup-runner
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/process-data-followup-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply deterministic remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_process_data_followup_temp.py')
          text=p.read_text(encoding='utf-8')
          replacements=[
            (
              '    "<span>${fmt(x.normalizedShift,2)}σ · ${esc(x.level)}</span>",',
              '    "<span class=\\"pi-${esc(x.level)}\\">${fmt(x.normalizedShift,2)}σ · ${esc(x.level)}</span>",',
            ),
            (
              '    "<span>${x.normalizedShift==null?\'Unscored · insufficient spread/sample\':`${fmt(x.normalizedShift,2)}σ · ${esc(x.level)}`}</span>",',
              '    "<span class=\\"pi-${esc(x.level)}\\">${x.normalizedShift==null?\'Unscored · insufficient spread/sample\':`${fmt(x.normalizedShift,2)}σ · ${esc(x.level)}`}</span>",',
            ),
          ]
          for old,new in replacements:
            if text.count(old)!=1:
              raise SystemExit(f'helper drift selector expected one match, found {text.count(old)}: {old}')
            text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          python tools/apply_process_data_followup_temp.py
          python tools/bump_web_release.py --release 2026.09.12.2 --published 2026-09-12
          python tools/sync_web_release.py --check
      - name: Validate remediation
        run: |
          set -euo pipefail
          node --check data-integration-runtime.js
          node --check process-data-intelligence-ui.js
          node --check process-data-local-intake.js
          node --check qa_process_data_followup.cjs
          node qa_data_integration_statistics.cjs
          node qa_process_data_integrity.cjs
          node qa_process_data_followup.cjs
          python qa_process_data_local_intake.py
          python qa_release.py
          python qa_release_docs.py
          python tools/verify_release_external_validation.py
          git diff --check
      - name: Commit only validated generated changes
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fail closed on ambiguous process-data evidence'
          git push origin HEAD:audit/process-data-followup-hardening
