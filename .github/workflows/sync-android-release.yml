name: Sync Android release label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-android-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync visible Android release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const ANDROID_RELEASE = "2026.08.22.1";', 'const ANDROID_RELEASE = "2026.08.22.2";')
          p.write_text(s, encoding='utf-8')

          p = Path('ANDROID_INSTALL_README.txt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Android shell: 2026.08.22.1', 'Android shell: 2026.08.22.2')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ANDROID_INSTALL_README.txt
          if ! git diff --cached --quiet; then
            git commit -m "Sync Android release label to 2026.08.22.2"
            git push
          fi
