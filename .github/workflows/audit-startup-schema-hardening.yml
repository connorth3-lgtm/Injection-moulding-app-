name: One-shot Persisted Learner Schema Hardening

on:
  push:
    branches:
      - audit/standalone-learner-id-hardening-clean
    paths:
      - .github/workflows/audit-startup-schema-hardening.yml
      - tools/apply_startup_schema_hardening_temp.py

permissions:
  contents: write

concurrency:
  group: audit-startup-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.ref == 'refs/heads/audit/standalone-learner-id-hardening-clean' && github.actor == 'connorth3-lgtm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Apply, validate, and commit exact permanent patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/apply_startup_schema_hardening_temp.py ]]; then
            echo 'Temporary helper already removed; cleanup event requires no action.'
            exit 0
          fi
          python3 tools/apply_startup_schema_hardening_temp.py
          python3 tools/sync_web_release.py
          python3 tools/externalize_core_scripts.py --check
          node qa_standalone_learner_ids.cjs
          node qa_final_audit_lifecycle.cjs
          python3 qa_runtime_release_bump.py
          python3 qa_runtime_hardening.py
          python3 qa_release.py
          python3 qa_release_docs.py
          python3 qa_app_wide_audit.py
          python3 qa_webkit_regression.py
          python3 tools/verify_release_external_validation.py
          python3 tools/build_pages_artifact.py
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          url=latest['app_url']
          if '/main/' in url or '/master/' in url: raise SystemExit('Frozen recovery URL is not commit-pinned')
          with urllib.request.urlopen(url,timeout=30) as r: data=r.read()
          actual=hashlib.sha256(data).hexdigest();expected=latest['sha256']
          if actual!=expected: raise SystemExit(f'Frozen recovery hash mismatch: {actual} != {expected}')
          print(f'Frozen recovery URL/hash verified: {actual}')
          PY
          git diff --check
          python3 - <<'PY'
          import subprocess
          permanent={
            'MouldMaster_Core_App.html','src/core-runtime/core-inline-004.js','qa_standalone_learner_ids.cjs',
            'version.json','README.md','support.html','data/release-external-validation-v1.json',
            'qa_release.py','qa_release_docs.py','index.html','pwa-shell.js','service-worker.js'
          }
          allowed=permanent|{'tools/apply_startup_schema_hardening_temp.py','.github/workflows/audit-startup-schema-hardening.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          if changed-allowed: raise SystemExit('Unexpected tracked changes: '+', '.join(sorted(changed-allowed)))
          if permanent-changed: raise SystemExit('Expected permanent changes missing: '+', '.join(sorted(permanent-changed)))
          print('Permanent diff boundary verified: '+', '.join(sorted(permanent)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MouldMaster_Core_App.html src/core-runtime/core-inline-004.js qa_standalone_learner_ids.cjs version.json README.md support.html data/release-external-validation-v1.json qa_release.py qa_release_docs.py index.html pwa-shell.js service-worker.js
          git diff --cached --check
          git commit -m 'Validate persisted learner schema before startup render'
          git push origin HEAD:audit/standalone-learner-id-hardening-clean
