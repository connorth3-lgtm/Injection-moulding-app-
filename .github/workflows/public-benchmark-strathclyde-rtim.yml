name: MouldMaster Public Measured Benchmark — Strathclyde RTIM tablets

on:
  push:
    branches: [data/real-dataset-profiling-wave2-batch3]
    paths:
      - 'tools/run_public_benchmark_strathclyde_rtim.py'
      - 'qa_public_benchmark_strathclyde_rtim.py'
      - 'data/public-benchmark-contracts/strathclyde-rtim-tablets-v1.json'
      - '.github/workflows/public-benchmark-strathclyde-rtim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate evidence boundary
        run: python qa_public_benchmark_strathclyde_rtim.py
      - name: Retrieve and aggregate-profile exact publisher workbook
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_strathclyde_rtim.py \
            --output benchmark-results/strathclyde-rtim-tablets-v1.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/strathclyde-rtim-tablets-v1.json'))
          assert x['status']=='retrieved-profile-needs-semantic-review'
          assert x['source']['datasetDoi']=='10.15129/e1a516b3-41ad-4b38-81e1-6ebec17b8e7d'
          assert x['source']['license']=='CC BY 4.0'
          assert x['source']['publisherFileName']=='doi.org_10.1016_j.ijpharm.2022.121956_AllData.xlsx'
          assert len(x['source']['sha256'])==64
          assert x['profile']['sheetCount']>=1
          assert x['profile']['rawRowsOrNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['retrieval']['rawPublisherFileCommitted'] is False
          assert x['retrieval']['rawNumericValuesUploadedAsArtifact'] is False
          print(json.dumps({'source':x['source'],'profile':x['profile']},indent=2))
          PY
      - name: Upload aggregate workbook profile only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-public-measured-benchmark-strathclyde-rtim
          path: benchmark-results/strathclyde-rtim-tablets-v1.json
          if-no-files-found: error
          retention-days: 30
