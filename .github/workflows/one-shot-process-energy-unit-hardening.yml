name: One-shot process energy unit hardening

on:
  push:
    branches:
      - audit/process-energy-unit-hardening
    paths:
      - .github/workflows/one-shot-process-energy-unit-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/process-energy-unit-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply narrow energy-unit correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ui_path=Path('process-data-intelligence-ui.js')
          ui=ui_path.read_text(encoding='utf-8')
          replacements=[
              ("  const candidates=resolvedNumeric(dataset).filter(s=>/(energy|power.*energy|kwh|watt.?hour)/i.test(`${s.column} ${s.meaning||''}`)&&/^(?:kWh|Wh|J|kJ|MJ)$/i.test(String(s.unit||''))&&String(s.sampling_basis||s.samplingBasis||'').trim().toLowerCase()==='per-cycle');", "  const candidates=resolvedNumeric(dataset).filter(s=>/(energy|power.*energy|kwh|watt.?hour)/i.test(`${s.column} ${s.meaning||''}`)&&/^(?:kWh|Wh|J|kJ|MJ)$/i.test(String(s.unit||'').trim())&&String(s.sampling_basis||s.samplingBasis||'').trim().toLowerCase()==='per-cycle');"),
              ("  let total=vals.reduce((a,b)=>a+b,0),unit=s.unit;", "  let total=vals.reduce((a,b)=>a+b,0),unit=String(s.unit||'').trim();"),
              ("  if(/^wh$/i.test(unit)){total/=1000;unit='kWh'}else if(/^j$/i.test(unit)){total/=3.6e6;unit='kWh'}else if(/^kj$/i.test(unit)){total/=3600;unit='kWh'}else if(/^mj$/i.test(unit)){total/=3.6;unit='kWh'}", "  if(/^kwh$/i.test(unit)){unit='kWh'}else if(/^wh$/i.test(unit)){total/=1000;unit='kWh'}else if(/^j$/i.test(unit)){total/=3.6e6;unit='kWh'}else if(/^kj$/i.test(unit)){total/=3600;unit='kWh'}else if(/^mj$/i.test(unit)){total/=3.6;unit='kWh'}"),
          ]
          for old,new in replacements:
              if ui.count(old)!=1:
                  raise SystemExit(f'process intelligence patch target count was {ui.count(old)}, expected 1: {old[:80]}')
              ui=ui.replace(old,new,1)
          ui_path.write_text(ui,encoding='utf-8')
          qa_path=Path('qa_process_data_followup.cjs')
          qa=qa_path.read_text(encoding='utf-8')
          anchor="assert.equal(energy.energyPerGoodPart,0.2,'complete per-cycle coverage should preserve valid energy/good-part calculation');\nconst eventEnergy={semantics:{energy:{column:'cycle_energy_wh',role:'actual',blockers:[],unit:'Wh',meaning:'Energy meter',sampling_basis:'event'}}};"
          insertion="assert.equal(energy.energyPerGoodPart,0.2,'complete per-cycle coverage should preserve valid energy/good-part calculation');\nconst mixedCaseKwhEnergy={semantics:{energy:{column:'cycle_energy_kwh',role:'actual',blockers:[],unit:' KWH ',meaning:'Cycle energy',sampling_basis:'per-cycle'}}};\nenergy=helpers.energySummary([{cycle_energy_kwh:'0.1',quality_result:'pass'},{cycle_energy_kwh:'0.2',quality_result:'pass'}],mixedCaseKwhEnergy);\nassert.equal(energy.totalKwh,0.3,'supported kWh spelling/case must normalize before aggregation');\nassert.equal(energy.energyPerGoodPart,0.15,'normalized kWh input must preserve energy/good-part calculation');\nconst eventEnergy={semantics:{energy:{column:'cycle_energy_wh',role:'actual',blockers:[],unit:'Wh',meaning:'Energy meter',sampling_basis:'event'}}};"
          if qa.count(anchor)!=1:
              raise SystemExit(f'energy regression insertion target count was {qa.count(anchor)}, expected 1')
          qa_path.write_text(qa.replace(anchor,insertion,1),encoding='utf-8')
          PY
      - name: Bump governed web release
        run: python tools/bump_web_release.py --release 2026.09.12.4
      - name: Validate correction and governed release
        shell: bash
        run: |
          node --check process-data-intelligence-ui.js
          node --check qa_process_data_followup.cjs
          node qa_data_integration_statistics.cjs
          node qa_process_data_integrity.cjs
          node qa_process_data_followup.cjs
          python qa_process_data_local_intake.py
          python qa_data_integration.py
          python tools/sync_web_release.py --check
          python qa_release.py
          python qa_release_docs.py
          python tools/verify_release_external_validation.py
          git diff --check
      - name: Commit validated product change and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-process-energy-unit-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize per-cycle energy unit handling'
          git push origin HEAD:audit/process-energy-unit-hardening
