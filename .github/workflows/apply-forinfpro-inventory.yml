name: MouldMaster Apply FORinFPRO Inventory Acceptance

on:
  push:
    branches: [data/resolve-forinfpro-semantics]
    paths:
      - 'tools/apply_forinfpro_inventory_acceptance.py'
      - '.github/workflows/apply-forinfpro-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mouldmaster-apply-forinfpro-inventory
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/resolve-forinfpro-semantics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed FORinFPRO acceptance
        run: python tools/apply_forinfpro_inventory_acceptance.py
      - name: Validate terminal-state contract
        run: python qa_remaining_dataset_terminal_states.py
      - name: Commit canonical inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/measured-dataset-inventory-v1.json
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = "data/measured-dataset-inventory-v1.json"
          git commit -m "Apply FORinFPRO semantic acceptance to inventory"
          git push origin HEAD:data/resolve-forinfpro-semantics
