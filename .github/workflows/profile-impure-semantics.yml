name: MouldMaster ImPure Semantic Probe

on:
  pull_request:
    branches: [main, data/resolve-impure-semantics]
    paths:
      - 'tools/profile_impure_semantics.py'
      - 'qa_impure_pascoe_semantics.py'
      - 'qa_impure_remaining_clarification.py'
      - '.github/workflows/profile-impure-semantics.yml'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/impure-pascoe-semantic-review-2026-08-30.json'
      - 'data/impure-pascoe-remaining-clarification-2026-08-30.json'
      - 'data/public-benchmark-contracts/impure-pascoe-2022-v1.json'
      - 'data/measured-dataset-inventory-v1.json'
  push:
    branches: [data/resolve-impure-semantics, data/impure-remaining-clarification]
    paths:
      - 'tools/profile_impure_semantics.py'
      - 'qa_impure_pascoe_semantics.py'
      - 'qa_impure_remaining_clarification.py'
      - '.github/workflows/profile-impure-semantics.yml'
      - 'data/impure-pascoe-channel-dictionary-v1.json'
      - 'data/impure-pascoe-semantic-review-2026-08-30.json'
      - 'data/impure-pascoe-remaining-clarification-2026-08-30.json'
      - 'data/public-benchmark-contracts/impure-pascoe-2022-v1.json'
      - 'data/measured-dataset-inventory-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-impure-semantic-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate committed semantic acceptance boundary
        run: python qa_impure_pascoe_semantics.py
      - name: Validate remaining-channel clarification boundary
        run: python qa_impure_remaining_clarification.py
      - name: Retrieve licensed ImPure cycles and compute aggregate semantic statistics
        run: |
          mkdir -p benchmark-results
          python tools/profile_impure_semantics.py --output benchmark-results/impure-semantics-probe.json
      - name: Validate privacy and source-profile boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/impure-semantics-probe.json'))
          assert x['status']=='aggregate-semantic-probe-complete'
          assert x['source']['datasetId']=='impure-pascoe-2022'
          assert x['source']['license']=='CC BY 4.0'
          assert x['source']['cycleFilesVerified']==307
          assert x['source']['supportFilesVerified']==2
          assert x['source']['publisherFilesVerifiedInProbe']==309
          assert x['profile']['cycleRows']==297087
          assert x['profile']['numericSensorValues']==2376696
          assert x['profile']['sensorColumns']==8
          assert len(x['profile']['supportFiles'])==2
          assert len(x['profile']['cycleNumberBands']) >= 10
          assert x['profile']['rawRowsOrCellValuesEmitted'] is False
          assert x['profile']['absoluteTimestampsEmitted'] is False
          assert x['profile']['perCycleRawValuesEmitted'] is False
          assert x['interpretationBoundary']['automaticPromotion'] is False
          assert x['interpretationBoundary']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['retrieval']['rawPublisherFilesCommitted'] is False
          assert x['retrieval']['rawPublisherFilesUploadedAsArtifact'] is False
          assert x['retrieval']['rawRowsOrArraysUploadedAsArtifact'] is False
          assert set(x['profile']['channels']) == {
              'HydPressure[IRT/Pascoe]', 'ScrewPosition[IRT/Pascoe]',
              'Analog Input[1]', 'Analog Input[2]',
              'TempMold1[IRT/Pascoe]', 'TempMold2[IRT/Pascoe]',
              'Pressure1[IRT/Pascoe]', 'Pressure2[IRT/Pascoe]'
          }
          notes=[]
          for f in x['profile']['supportFiles']:
              for entries in (f.get('lowCardinalityTextCategories') or {}).values():
                  notes.extend(str(e.get('category','')).lower() for e in entries)
          joined=' '.join(notes)
          assert 'flow of core water' in joined
          assert 'nozzle temperature' in joined
          PY
      - name: Upload aggregate semantic profile only
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-impure-semantic-probe
          path: benchmark-results/impure-semantics-probe.json
          if-no-files-found: error
          retention-days: 30
