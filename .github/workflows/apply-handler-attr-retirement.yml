name: Apply Handler Attribute Retirement

on:
  push:
    branches:
      - refactor/csp-handler-attrs-v1
    paths:
      - .github/workflows/apply-handler-attr-retirement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/csp-handler-attrs-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Regenerate handler-free core runtime
        run: python tools/externalize_core_scripts.py
      - name: Rewrite active legacy handler markup
        run: python tools/retire_inline_handler_attrs.py
      - name: Validate JavaScript syntax
        run: |
          find src/core-runtime -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          for f in assessment-analytics-ui.js assessment-quality-suite.js curriculum-integration.js learning-experience.js specialist-curriculum.js specialist-evidence-gap-extension.js training-upgrade.js; do node --check "$f"; done
      - name: Validate CSP generation and source migration
        run: |
          python tools/externalize_core_scripts.py --check
          python tools/retire_inline_handler_attrs.py --check
          python tools/audit_inline_handlers.py --check
          python qa_architecture_debt.py
      - name: Validate Pages boundary
        run: python tools/build_pages_artifact.py
      - name: Commit migration output
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js src/core-runtime/core-inline-*.js assessment-analytics-ui.js assessment-quality-suite.js curriculum-integration.js learning-experience.js specialist-curriculum.js specialist-evidence-gap-extension.js training-upgrade.js
          git commit -m "Retire active inline handler attributes"
          git push origin HEAD:refactor/csp-handler-attrs-v1
