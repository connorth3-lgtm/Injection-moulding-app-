name: One-shot release QA alignment

on:
  push:
    branches:
      - fix/restore-listen-compact-lesson
    paths:
      - .github/workflows/tmp-release-qa-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-listen-compact-lesson
      - name: Align release QA with .20
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          old='WEB_RELEASE = "2026.09.06.19"'
          new='WEB_RELEASE = "2026.09.06.20"'
          if text.count(old)!=1:
              raise SystemExit('expected exactly one stale WEB_RELEASE marker')
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          grep -q 'WEB_RELEASE = "2026.09.06.20"' qa_release.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa_release.py
          git commit -m 'Align release QA with .20 runtime'
          git push origin HEAD:fix/restore-listen-compact-lesson
