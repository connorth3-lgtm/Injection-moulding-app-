name: Fast feedback

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: fast-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Synchronise governed web release files
        run: |
          python tools/sync_web_release.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add service-worker.js index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html
            git commit -m "Synchronise governed web release files"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run change-aware checks
        run: python qa_fast_feedback.py --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Governance boundary
        if: always()
        run: |
          echo "Fast feedback is an iteration aid only."
          echo "It does not replace the repository's full release QA, exact-release PWA evidence, real assistive-technology validation, or physical Windows validation."
