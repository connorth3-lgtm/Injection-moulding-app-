name: MouldMaster Research Registry Harvest

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/harvest_openalex_injection_moulding.py'
      - '.github/workflows/research-registry-harvest.yml'
      - 'data/content-scale-targets.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mouldmaster-research-harvest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate harvester code path
        run: |
          python -m py_compile tools/harvest_openalex_injection_moulding.py
          python tools/harvest_openalex_injection_moulding.py --help >/dev/null
      - name: Restore approved harvested snapshot for PR gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ARTIFACT_ID: '10944828709'
          SNAPSHOT_SHA256: '5fa3490c3e124290c6d760d7c584366cef62dafa80264984ad25406f02af548b'
        run: |
          mkdir -p data
          curl -fL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SNAPSHOT_ARTIFACT_ID/zip" \
            -o /tmp/research-master-candidates.zip
          echo "$SNAPSHOT_SHA256  /tmp/research-master-candidates.zip" | sha256sum -c -
          unzip -q /tmp/research-master-candidates.zip -d data
      - name: Harvest deduplicated OpenAlex candidates
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/harvest_openalex_injection_moulding.py \
            --output data/research-master-candidates.json \
            --target 2000 \
            --per-query-pages 5
      - name: Validate candidate registry boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/research-master-candidates.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='candidate-registry-not-counted-as-verified'
          assert x['candidateCount']==len(x['records'])
          assert all(not r['verification']['primaryMeasuredReviewed'] for r in x['records'])
          assert all(not r['verification']['peerReviewedConfirmed'] for r in x['records'])
          ids=[(r.get('doi') or r.get('id') or r.get('title')) for r in x['records']]
          assert len(ids)==len(set(ids))
          print({'candidates':x['candidateCount'],'primaryMeasuredCandidates':x['primaryMeasuredCandidateCount']})
          PY
      - name: Upload research candidate registry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouldmaster-research-master-candidates
          path: data/research-master-candidates.json
          if-no-files-found: error