name: Publish Open Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-open-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release-version: ${{ steps.release-meta.outputs.version }}
      release-tag: ${{ steps.release-meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: desktop/electron/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require protected fully validated production source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_production_source.py --evidence-out desktop/electron/generated/production-source-evidence.json
      - name: Application JavaScript syntax
        run: |
          node --check service-worker.js
          node --check reading-patch.js
          node --check training-upgrade.js
          node --check training-qa-fix.js
          node --check assessment-100-pass.js
          node --check assessment-deep-dive.js
          node --check assessment-answer-cue-fix.js
          node --check assessment-storage-scope.js
          node --check assessment-quality-suite.js
          node --check assessment-stable-review-bridge.js
          node --check assessment-analytics-ui.js
          node --check assessment-final-hardening.js
          node --check runtime-v2.js
          node --check assessment-runtime-v2.js
          node --check assessment-ux.js
          node --check assessment-evidence-sources.js
          node --check evidence-maturity-deep-dive.js
          node --check evidence-maturity-formal-bridge.js
          node --check assessment-psychometric-hardening.js
          node --check assessment-evidence-integrity-upgrade.js
          node --check lesson-evidence-depth.js
          node --check lesson-deep-authoring-v2.js
          node --check assessment-evidence-approval.js
          node --check assessment-psychometric-approval.js
          node --check source-library.js
          node --check reference-data.js
          node --check reference-deep-dive.js
          node --check reference-research-extension.js
          node --check reference-20x-extension.js
          node --check reference-2026-expansion.js
          node --check reference-sources.js
          node --check reference-browser-ui.js
          node --check diagnostic-learning-labs.js
          node --check material-behaviour-labs.js
          node --check app-shell-registry.js
          node --check assessment-multimodal.js
          node --check pwa-shell.js
          node --check learning-experience.js
          node --check process-data-diagnostics.js
          node --check process-data-deep-dive-machine.js
          node --check process-data-deep-dive-tooling.js
          node --check process-data-deep-dive-material.js
          node --check process-data-deep-dive-scientific.js
          node --check process-data-deep-dive-quality.js
          node --check process-data-deep-dive-50.js
          node --check process-data-20-pass-01-05.js
          node --check process-data-20-pass-06-10.js
          node --check process-data-20-pass-11-15.js
          node --check process-data-20-pass-16-20.js
          node --check process-data-20-pass-atlas.js
          node --check process-data-local-intake.js
          node --check curriculum-integration.js
          node --check specialist-curriculum.js
          node --check specialist-evidence-gap-extension.js
          node --check mould-master-workspace.js
          node --check app-shell-finalize.js
          node --check app-integration-v3.js
          node --check assessment-bank-expansion.js
          node --check learning-analytics.js
          node --check accessibility-hardening.js
          node --check desktop/electron/src/main.cjs
          node --check desktop/electron/scripts/generate-integrity.cjs
          node --check desktop/electron/scripts/generate-licenses.cjs
          node --check desktop/electron/scripts/generate-sbom.cjs
          node --check desktop/electron/scripts/signing-status.cjs
          node --check desktop/electron/scripts/qa.cjs
      - name: Install exact locked dependencies
        working-directory: desktop/electron
        run: npm ci --no-audit --fund=false
      - name: Generate integrity, licence and SBOM evidence
        working-directory: desktop/electron
        run: |
          npm run integrity
          npm run licenses
          npm run sbom
      - name: Require production signing credentials
        working-directory: desktop/electron
        env:
          MM_REQUIRE_WINDOWS_SIGNING: '1'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run signing
      - name: Desktop package QA without signing secrets
        working-directory: desktop/electron
        run: npm run qa
      - name: Full release QA gates
        run: |
          python qa_release.py
          python qa_runtime_hardening.py
          python qa_runtime_v2.py
          python qa_assessment_runtime_v2.py
          python qa_release_docs.py
          python qa_diagnostic_learning.py
          python qa_material_behaviour.py
          python qa_100_pass.py
          python qa_question_deep_dive.py
          python qa_assessment_quality.py
          python qa_assessment_evidence.py
          python qa_assessment_multimodal.py
          python qa_evidence_maturity.py
          python qa_lesson_deep_authoring_v2.py
          python qa_process_data_diagnostics.py
          python qa_process_data_deep_dive_50.py
          python qa_process_data_20_pass.py
          python qa_process_data_sweep.py
          python qa_measured_evidence_50_pass.py
          python qa_process_data_local_intake.py
          python qa_real_process_data_pilot.py
          python qa_authorised_site_pilot_framework.py
          python qa_learning_experience.py
          python qa_app_shell_registry.py
          python qa_mould_master_workspace.py
          python qa_curriculum_integration.py
          python qa_specialist_curriculum.py
          python qa_learning_analytics.py
          python qa_assessment_storage_scope.py
          python qa_stable_review_bridge.py
          python qa_assessment_final_hardening.py
          python qa_assessment_ux.py
          python qa_accessibility_hardening.py
          python qa_release_immutability.py
          python qa_source_freshness.py
          python qa_research_source_freshness.py
          python qa_reference.py
          python qa_reference_expansion.py
          python qa_research.py
          python qa_open_desktop.py
          python qa_store_submission.py
          python qa_nzqa_readiness.py
          python qa_iacet_readiness.py
      - name: Build signed portable Windows package
        working-directory: desktop/electron
        env:
          MM_REQUIRE_WINDOWS_SIGNING: '1'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win portable
      - name: Verify valid timestamped Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'desktop/electron/dist' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Portable Windows executable was not produced.' }
          $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) { throw 'Authenticode signer certificate is missing.' }
          if (-not $signature.TimeStamperCertificate) { throw 'Authenticode timestamp certificate is missing.' }
          $evidence = [ordered]@{
            schema = 1
            file = $exe.Name
            sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            status = [string]$signature.Status
            signer_subject = $signature.SignerCertificate.Subject
            signer_thumbprint = $signature.SignerCertificate.Thumbprint
            signer_not_after = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
            timestamp_subject = $signature.TimeStamperCertificate.Subject
            timestamp_thumbprint = $signature.TimeStamperCertificate.Thumbprint
            source_commit = $env:GITHUB_SHA
            verified_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content 'desktop/electron/generated/authenticode-status.json'
          Write-Host "Verified timestamped Authenticode signature: $($signature.SignerCertificate.Thumbprint)"
      - name: Stage release evidence
        id: release-meta
        shell: pwsh
        run: |
          $version = (Get-Content 'version.json' -Raw | ConvertFrom-Json).desktop_release
          $tag = "desktop-v$version"
          $releaseDir = 'desktop/electron/release-assets'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $exe = Get-ChildItem 'desktop/electron/dist' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Portable Windows executable was not produced.' }
          Copy-Item $exe.FullName $releaseDir
          Copy-Item 'desktop/electron/generated/integrity.json' $releaseDir
          Copy-Item 'desktop/electron/generated/dependency-licenses.json' $releaseDir
          Copy-Item 'desktop/electron/generated/sbom.cdx.json' $releaseDir
          Copy-Item 'desktop/electron/generated/signing-status.json' $releaseDir
          Copy-Item 'desktop/electron/generated/authenticode-status.json' $releaseDir
          Copy-Item 'desktop/electron/generated/production-source-evidence.json' $releaseDir
          Copy-Item 'assessment-quality-report.json' $releaseDir
          Copy-Item 'evidence-maturity-report.json' $releaseDir
          Copy-Item 'process-data-sweep-report.json' $releaseDir
          Copy-Item 'measured-evidence-50-pass-report.json' $releaseDir
          Copy-Item 'source-freshness-report.json' $releaseDir
          Copy-Item 'research-source-freshness-report.json' $releaseDir
          git rev-parse HEAD | Set-Content "$releaseDir/SOURCE_COMMIT.txt"
          Get-ChildItem $releaseDir -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "$releaseDir/SHA256SUMS.txt"
          @"
          # MouldMaster Academy Desktop $version

          Signed Windows desktop release built from the protected, fully validated `main` source.

          Included evidence:
          - Authenticode-signed portable Windows executable with timestamp
          - Authenticode signer/timestamp verification record
          - production-source protection and merged-PR workflow evidence
          - SHA-256 release hashes
          - source commit record
          - bundled-asset integrity manifest
          - signing-readiness record
          - dependency licence inventory
          - CycloneDX SBOM
          - assessment, evidence-maturity, process-data-sweep, measured-evidence and source-freshness QA reports

          Release publication is one-shot: an existing tag/release is never overwritten. Repository-level GitHub immutable releases should be enabled when available so the published tag/assets and GitHub release attestation are platform-enforced as immutable.

          The GitHub production release is not published unless native main protection, exact merged-PR validation, signing credentials, a valid Authenticode signature and a timestamp certificate are all verified in the release workflow.
          "@ | Set-Content "$releaseDir/RELEASE_NOTES.md"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-open-desktop-release-${{ github.sha }}
          path: desktop/electron/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-signed-windows
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      MM_RELEASE_VERSION: ${{ needs.build-signed-windows.outputs.release-version }}
      MM_RELEASE_TAG: ${{ needs.build-signed-windows.outputs.release-tag }}
      MM_RELEASE_DIR: release-assets
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mouldmaster-open-desktop-release-${{ github.sha }}
          path: release-assets
      - name: Re-verify transferred signed release evidence
        shell: pwsh
        run: |
          if (-not $env:MM_RELEASE_VERSION -or -not $env:MM_RELEASE_TAG) { throw 'Release metadata outputs are missing.' }
          $sourceCommit = (Get-Content "$env:MM_RELEASE_DIR/SOURCE_COMMIT.txt" -Raw).Trim()
          if ($sourceCommit -ne $env:GITHUB_SHA) { throw "Transferred release source mismatch: $sourceCommit" }
          $sourceEvidence = Get-Content "$env:MM_RELEASE_DIR/production-source-evidence.json" -Raw | ConvertFrom-Json
          if ($sourceEvidence.main_sha -ne $env:GITHUB_SHA) { throw 'Production-source evidence does not match the publishing source SHA.' }
          $signing = Get-Content "$env:MM_RELEASE_DIR/signing-status.json" -Raw | ConvertFrom-Json
          if (-not $signing.required -or -not $signing.configured) { throw 'Transferred signing-readiness evidence is not production-ready.' }
          $authEvidence = Get-Content "$env:MM_RELEASE_DIR/authenticode-status.json" -Raw | ConvertFrom-Json
          if ($authEvidence.status -ne 'Valid' -or $authEvidence.source_commit -ne $env:GITHUB_SHA) { throw 'Transferred Authenticode evidence is invalid or belongs to another source.' }
          $exe = Get-ChildItem $env:MM_RELEASE_DIR -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Signed Windows executable is missing from transferred release assets.' }
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($authEvidence.sha256 -ne $exeHash) { throw 'Transferred executable hash does not match Authenticode evidence.' }
          $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw "Transferred executable failed independent Authenticode verification: $($signature.Status)"
          }
          foreach ($line in (Get-Content "$env:MM_RELEASE_DIR/SHA256SUMS.txt")) {
            if ($line -notmatch '^([a-f0-9]{64})\s\s(.+)$') { throw "Malformed staged SHA256SUMS entry: $line" }
            $expectedHash = $Matches[1]
            $name = $Matches[2]
            $file = Join-Path $env:MM_RELEASE_DIR $name
            if (-not (Test-Path $file)) { throw "Staged release asset missing: $name" }
            $actualHash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $expectedHash) { throw "Staged release hash mismatch: $name" }
          }
          Write-Host 'Transferred signed release evidence independently verified.'
      - name: Publish one-shot release without asset replacement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tagSha = $null
          $tagResult = gh api "repos/$repo/git/ref/tags/$env:MM_RELEASE_TAG" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) { $tagSha = ($tagResult | Select-Object -First 1).Trim() }
          if ($tagSha -and $tagSha -ne $env:GITHUB_SHA) {
            throw "Release tag $env:MM_RELEASE_TAG already points to $tagSha. Bump desktop_release before publishing different source."
          }
          $localAssets = Get-ChildItem $env:MM_RELEASE_DIR -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' }
          gh release view $env:MM_RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            if (-not $tagSha) { throw "Release $env:MM_RELEASE_TAG exists but its tag could not be resolved." }
            $verifyDir = Join-Path $env:RUNNER_TEMP "mouldmaster-existing-release-$env:MM_RELEASE_VERSION"
            if (Test-Path $verifyDir) { Remove-Item -Recurse -Force $verifyDir }
            New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
            gh release download $env:MM_RELEASE_TAG --dir $verifyDir
            if ($LASTEXITCODE -ne 0) { throw 'Existing release could not be downloaded for immutability verification.' }
            $expectedNames = @($localAssets | ForEach-Object Name | Sort-Object)
            $publishedNames = @(Get-ChildItem $verifyDir -File | ForEach-Object Name | Sort-Object)
            if (($expectedNames -join "`n") -ne ($publishedNames -join "`n")) {
              throw 'Existing release asset set differs from the locally staged immutable asset set. Bump desktop_release; never replace published assets.'
            }
            $localSums = (Get-Content (Join-Path $env:MM_RELEASE_DIR 'SHA256SUMS.txt') -Raw).Trim()
            $publishedSums = (Get-Content (Join-Path $verifyDir 'SHA256SUMS.txt') -Raw).Trim()
            if ($localSums -ne $publishedSums) {
              throw 'Existing release SHA256SUMS differs from this source build. Bump desktop_release; never clobber a published release.'
            }
            foreach ($line in (Get-Content (Join-Path $verifyDir 'SHA256SUMS.txt'))) {
              if ($line -notmatch '^([a-f0-9]{64})\s\s(.+)$') { throw "Malformed published SHA256SUMS entry: $line" }
              $expectedHash = $Matches[1]
              $name = $Matches[2]
              $file = Join-Path $verifyDir $name
              if (-not (Test-Path $file)) { throw "Published release asset missing: $name" }
              $actualHash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              if ($actualHash -ne $expectedHash) { throw "Published release hash mismatch: $name" }
            }
            Write-Host 'Existing release is byte-identical to the staged build. No upload or replacement performed.'
          } else {
            gh release create $env:MM_RELEASE_TAG --draft --target $env:GITHUB_SHA --title "MouldMaster Academy Desktop $env:MM_RELEASE_VERSION" --notes-file "$env:MM_RELEASE_DIR/RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
            $paths = @($localAssets | ForEach-Object FullName)
            gh release upload $env:MM_RELEASE_TAG @paths
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the complete draft release asset set.' }
            gh release edit $env:MM_RELEASE_TAG --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the complete draft release.' }
          }
