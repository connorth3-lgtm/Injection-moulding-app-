name: MouldMaster Measured Dataset Wave 2 Ledger

on:
  pull_request:
    paths:
      - 'data/content-scale-targets.json'
      - 'data/measured-dataset-inventory-v1.json'
      - 'data/measured-dataset-execution-ledger-v1.json'
      - 'data/measured-dataset-wave2-ledger-v1.json'
      - 'data/public-benchmark-contracts/**'
      - 'data/public-benchmark-results/**'
      - 'qa_measured_dataset_inventory.py'
      - 'qa_content_scale_targets.py'
      - 'qa_measured_dataset_wave2_ledger.py'
      - 'qa_master_data_compile.py'
      - 'tools/compile_master_data.py'
      - '.github/workflows/measured-dataset-wave2-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate measured dataset inventory
        run: python qa_measured_dataset_inventory.py
      - name: Validate content-scale targets
        run: python qa_content_scale_targets.py
      - name: Validate Wave 2 family ledger
        run: python qa_measured_dataset_wave2_ledger.py
      - name: Validate master data compilation
        run: python qa_master_data_compile.py
