name: Research Utilisation QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'research-evidence-*.js'
      - 'research-data-context.js'
      - 'adaptive-learning.js'
      - 'learning-effectiveness.js'
      - 'specialist-learning-quality.js'
      - 'app-integration-v3.js'
      - 'assessment-bank-expansion.js'
      - 'assessment-runtime-v2.js'
      - 'privacy.html'
      - 'research-utilisation-analytics.js'
      - 'research-gap-feedback.js'
      - 'research-claim-freshness.js'
      - 'research-utilisation-manifest.json'
      - 'research-evidence-data-contract.md'
      - 'data/research-utilisation-manifest-v1.json'
      - 'current-data-manifest.json'
      - 'tools/generate_current_data_manifest.py'
      - 'index.html'
      - 'app-shell-finalize.js'
      - 'service-worker.js'
      - 'desktop/electron/package.json'
      - 'desktop/electron/scripts/generate-integrity.cjs'
      - 'desktop/electron/scripts/signing-status.cjs'
      - 'qa_research_evidence_engine.py'
      - 'qa_adaptive_learning.py'
      - 'qa_learning_effectiveness.py'
      - 'qa_learning_effectiveness_runtime.cjs'
      - 'qa_contextual_learning_runtime.cjs'
      - 'qa_research_utilisation_manifest.py'
      - 'qa_research_runtime_wiring.py'
      - 'qa_app_wide_integration.py'
      - 'qa_formal_bank_expansion.cjs'
      - '.github/workflows/research-utilisation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-utilisation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Research and integration JavaScript syntax
        run: |
          node --check research-evidence-engine.js
          node --check research-evidence-adapter.js
          node --check research-evidence-workspace.js
          node --check research-evidence-microlearning.js
          node --check adaptive-learning.js
          node --check learning-effectiveness.js
          node --check specialist-learning-quality.js
          node --check app-integration-v3.js
          node --check assessment-bank-expansion.js
          node --check assessment-runtime-v2.js
          node --check research-utilisation-analytics.js
          node --check research-gap-feedback.js
          node --check research-claim-freshness.js
          node --check research-evidence-ui.js
          node --check research-data-context.js
          node --check research-evidence-runtime-health.js
          node --check qa_contextual_learning_runtime.cjs
          node --check qa_learning_effectiveness_runtime.cjs
          node --check qa_formal_bank_expansion.cjs
          node --check desktop/electron/scripts/generate-integrity.cjs
          node --check desktop/electron/scripts/signing-status.cjs
      - name: Contextual evidence model
        run: python qa_research_evidence_engine.py
      - name: Adaptive learning quality
        run: python qa_adaptive_learning.py
      - name: Empirical learning effectiveness contract
        run: python qa_learning_effectiveness.py
      - name: Empirical learning effectiveness runtime
        run: node qa_learning_effectiveness_runtime.cjs
      - name: Generated contextual question matrix
        run: node qa_contextual_learning_runtime.cjs
      - name: Formal bank expansion
        run: node qa_formal_bank_expansion.cjs
      - name: App-wide integration
        run: python qa_app_wide_integration.py
      - name: Research utilisation manifest
        run: python qa_research_utilisation_manifest.py
      - name: Runtime wiring
        run: python qa_research_runtime_wiring.py
      - name: Generated current-data manifest
        run: python tools/generate_current_data_manifest.py --check
      - name: Existing connected-data regression
        run: python qa_data_integration.py
      - name: Public Pages boundary
        run: |
          python tools/build_pages_artifact.py
          test -f .pages-dist/research-evidence-engine.js
          test -f .pages-dist/research-evidence-ui.js
          test -f .pages-dist/research-data-context.js
          test -f .pages-dist/adaptive-learning.js
          test -f .pages-dist/learning-effectiveness.js
          test -f .pages-dist/specialist-learning-quality.js
          test -f .pages-dist/app-integration-v3.js
          test -f .pages-dist/assessment-bank-expansion.js
          test -f .pages-dist/research-utilisation-manifest.json
          test -f .pages-dist/data-integration-runtime.js
          test -f .pages-dist/current-data-manifest.json
          test ! -e .pages-dist/data
