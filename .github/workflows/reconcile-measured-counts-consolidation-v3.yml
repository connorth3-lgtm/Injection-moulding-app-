name: Reconcile measured counts on consolidation branch v3

on:
  push:
    branches: [data/measured-data-consolidation-20260830]
    paths:
      - '.github/workflows/reconcile-measured-counts-consolidation-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/measured-data-consolidation-20260830
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse validated v2 reconciliation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/reconcile-measured-counts-consolidation-v2.yml').read_text(encoding='utf-8')
          start = text.index("          from pathlib import Path\n", text.index("python - <<'PY'"))
          end = text.index("\n          PY\n", start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          exec(compile(code, '<reconciler-v2>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate reconciled guards
        run: |
          python qa_measured_dataset_inventory.py
          python qa_content_scale_targets.py
          python qa_remaining_dataset_terminal_states.py
          python qa_master_data_compile.py
      - name: Commit non-workflow reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/content-scale-targets.json qa_content_scale_targets.py qa_master_data_compile.py tools/compile_master_data.py
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile measured sample ledger to 66,521,519"
          git push origin HEAD:data/measured-data-consolidation-20260830
