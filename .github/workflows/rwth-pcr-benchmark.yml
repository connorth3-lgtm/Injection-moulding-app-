name: MouldMaster RWTH PCR measured benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile_rwth_pcr.py'
      - '.github/workflows/rwth-pcr-benchmark.yml'
      - 'data/public-benchmark-results/rwth-pcr-v1.json'
      - 'data/profiled-measured-dataset-registry-v1.json'
      - 'data/content-scale-targets.json'
      - 'qa_content_scale_targets.py'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive inspection dependencies
        run: python -m pip install --disable-pip-version-check scipy==1.16.1 h5py==3.14.0
      - name: Profile exact RWTH publisher archive
        run: python tools/profile_rwth_pcr.py --output rwth-pcr-v1.json
      - name: Enforce evidence boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('rwth-pcr-v1.json',encoding='utf-8'))
          assert p['source']['doi']=='10.18154/RWTH-2025-06809'
          assert p['source']['license']=='CC BY 4.0'
          assert p['source']['openAccess'] is True
          assert p['source']['fileVersion']==1
          assert p['source']['peerReviewedCompanion']=='10.1016/j.jprocont.2026.103725'
          assert p['status'] in {'profile-generated-review-required','source-access-blocked-not-profiled'}
          if p['status']=='profile-generated-review-required':
              assert p['archive']['members']>0 and len(p['archive']['sha256'])==64
          else:
              assert len(p['fetchDiagnostics'])>=1
              assert all(d.get('bytes')==248 for d in p['fetchDiagnostics'] if 'bytes' in d)
          assert p['acceptedMeasuredCycles']==0
          assert p['acceptedMeasuredTimeSeriesSamples']==0
          assert p['rawSourceRowsCommitted'] is False
          print('RWTH PCR evidence-boundary check passed:',p['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-rwth-pcr-profile
          path: rwth-pcr-v1.json
          retention-days: 90
