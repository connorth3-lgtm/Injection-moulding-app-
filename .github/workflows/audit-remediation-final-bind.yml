name: Finalize 2026.09.15.6 Candidate Provenance

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: write

concurrency:
  group: finalize-2026-09-15-6-candidate-provenance
  cancel-in-progress: false

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bind exact retained candidate while preserving HOLDs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          RELEASE='2026.09.15.6'
          SHA='dd39a2351edf74622d67ccf79737bbcbfc96dc58'
          FP='sha256:5ba0738492ee3e9747150f4638ad327f91786a7a972d68162e08af276543045f'
          RUN=35036847825
          ARTIFACT_ID=10423740874
          ARTIFACT_NAME=f'physical-pwa-candidate-{SHA}'
          DIGEST='sha256:55bba4551d89505874f72381d756924444a532586b237efb067dccac0b179b17'
          EXPIRES='2026-10-15T23:42:28Z'
          OLD_SHA='7fe353beb0f54b5b8f53851221738bb5c1a9bcfe'
          OLD_FP='sha256:b6fca9536f77247e1e778639a7b24228e4fe43ef413fa6e6d025e8a788006f2e'
          OLD_RUN='34931583556'; OLD_ID='10381573337'
          OLD_NAME=f'physical-pwa-candidate-{OLD_SHA}'
          OLD_DIGEST='sha256:1d036a472946a2425daff02019e5f99893968bee91da5fb108a0b86c5a1a8448'
          OLD_EXPIRES='2026-10-15T05:09:15Z'
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path,obj): Path(path).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ledger=load('data/release-external-validation-v1.json')
          if ledger.get('release')!=RELEASE: raise SystemExit('release ledger is not on .6')
          ledger['accessibility']['candidate']={'release':RELEASE,'sourceSha':SHA,'runtimeFingerprint':FP}
          ledger['pwaPhysicalDevices']['currentCandidate']={
            'release':RELEASE,'sourceSha':SHA,'runtimeFingerprint':FP,
            'candidateRunId':RUN,
            'candidateWorkflow':'Build Settled 2026.09.15.6 Candidate; exact public candidate build, not production publication',
            'artifactId':ARTIFACT_ID,'artifactName':ARTIFACT_NAME,'artifactDigest':DIGEST,'artifactExpiresAt':EXPIRES,
          }
          ledger['windowsDistribution']['sourceSha']=SHA
          for key in ('accessibility','pwaPhysicalDevices','windowsDistribution','bookSme','curriculumSme','learnerOutcomes'):
              ledger[key]['status']='hold'
          for key in ('fullyExternallyValidated','accreditationAuthorized','learnerEfficacyEstablished','productionRecipeValidated','automaticMachineControlAuthorized'):
              ledger['claims'][key]=False
          dump('data/release-external-validation-v1.json',ledger)

          at=load('data/accessibility-real-at-validation-v1.json')
          if at.get('status')=='validated': raise SystemExit('refusing to carry validated AT evidence')
          at['release']=RELEASE; at['packet']=f'qa/ACCESSIBILITY_REAL_AT_{RELEASE}.md'; at['sourceSha']=SHA; at['runtimeFingerprint']=FP
          dump('data/accessibility-real-at-validation-v1.json',at)

          replacements={OLD_SHA:SHA,OLD_FP:FP,OLD_RUN:str(RUN),OLD_ID:str(ARTIFACT_ID),OLD_NAME:ARTIFACT_NAME,OLD_DIGEST:DIGEST,OLD_EXPIRES:EXPIRES}
          for path in [
            f'qa/EXTERNAL_VALIDATION_{RELEASE}.md',
            f'qa/ACCESSIBILITY_REAL_AT_{RELEASE}.md',
            f'qa/PWA_PHYSICAL_DEVICE_{RELEASE}.md',
            f'certification/WINDOWS_SIGNING_READINESS_{RELEASE}.md',
          ]:
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in replacements.items(): s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact release binding and unchanged public runtime
        run: |
          python qa_release_validation_packets.py
          python tools/verify_release_external_validation.py
          python qa_book_release_integration.py
          python qa_audit_remediation_20260915_6.py
          python tools/build_pages_artifact.py
          test "$(python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)" = "sha256:5ba0738492ee3e9747150f4638ad327f91786a7a972d68162e08af276543045f"
          git diff --check
      - name: Commit final provenance binding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/release-external-validation-v1.json data/accessibility-real-at-validation-v1.json qa/EXTERNAL_VALIDATION_2026.09.15.6.md qa/ACCESSIBILITY_REAL_AT_2026.09.15.6.md qa/PWA_PHYSICAL_DEVICE_2026.09.15.6.md certification/WINDOWS_SIGNING_READINESS_2026.09.15.6.md
          git diff --cached --check
          git commit -m '[audit-remediation-generated] Bind exact 2026.09.15.6 candidate provenance'
          git push origin HEAD:fix/audit-remediation-2026-09-16
