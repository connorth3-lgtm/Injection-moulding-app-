name: MouldMaster Public Measured Benchmark — Mendeley Wave 2 batch 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2-batch2]
    paths:
      - 'tools/run_public_benchmark_mendeley_wave2_batch2.py'
      - 'qa_public_benchmark_mendeley_wave2_batch2.py'
      - 'data/public-benchmark-contracts/mendeley-wave2-batch2-v1.json'
      - '.github/workflows/public-benchmark-mendeley-wave2-batch2.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave2, data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_mendeley_wave2_batch2.py'
      - 'qa_public_benchmark_mendeley_wave2_batch2.py'
      - 'data/public-benchmark-contracts/mendeley-wave2-batch2-v1.json'
      - '.github/workflows/public-benchmark-mendeley-wave2-batch2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate metadata-only boundaries
        run: python qa_public_benchmark_mendeley_wave2_batch2.py
      - name: Profile publisher manifests without payload downloads
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_mendeley_wave2_batch2.py \
            --output benchmark-results/mendeley-wave2-batch2-stage1.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate fail-closed batch result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/mendeley-wave2-batch2-stage1.json'))
          assert x['status']=='publisher-metadata-batch-profiled'
          assert x['summary']['sourcesReviewed']==3
          assert x['summary']['fullyProfiledAccepted']==0
          assert x['summary']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['summary']['rawPayloadsDownloaded'] is False
          assert len(x['sources'])==3
          for s in x['sources']:
              assert s['state'] in {'publisher-file-manifest-exposed','publisher-record-no-files-exposed'}
              assert s['rawPayloadsDownloaded'] is False
              assert s['countsAsFullyProfiledMeasuredDataset'] is False
              assert s['acceptedMeasuredTimeSeriesSamples']==0
          print(json.dumps(x['summary'], indent=2))
          PY
      - name: Upload aggregate metadata manifest only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-mendeley-wave2-batch2-stage1
          path: benchmark-results/mendeley-wave2-batch2-stage1.json
          if-no-files-found: error
          retention-days: 30
