name: MouldMaster Public Measured Benchmark — ABS PLA injection tests stage 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_yxz2w7ctnh_stage2.py'
      - 'qa_public_benchmark_yxz2w7ctnh_stage2.py'
      - 'data/public-benchmark-contracts/yxz2w7ctnh-v1.json'
      - '.github/workflows/public-benchmark-yxz2w7ctnh-stage2.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_yxz2w7ctnh_stage2.py'
      - 'qa_public_benchmark_yxz2w7ctnh_stage2.py'
      - 'data/public-benchmark-contracts/yxz2w7ctnh-v1.json'
      - '.github/workflows/public-benchmark-yxz2w7ctnh-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate stage-two evidence boundary
        run: python qa_public_benchmark_yxz2w7ctnh_stage2.py
      - name: Retrieve three mechanical workbooks and profile schema only
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_yxz2w7ctnh_stage2.py \
            --output benchmark-results/yxz2w7ctnh-stage2.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate schema result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/yxz2w7ctnh-stage2.json'))
          assert x['status']=='mechanical-workbook-schema-profiled'
          assert x['source']['datasetDoi']=='10.17632/yxz2w7ctnh.1'
          assert x['source']['license']=='CC BY 4.0'
          assert x['profile']['mechanicalFilesProfiled']==3
          assert x['profile']['allPublisherHashesMatched'] is True
          assert x['profile']['energyWorkbookRetrieved'] is False
          assert x['profile']['rawNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMaterialTestTraceValues']==0
          assert x['acceptance']['acceptedInjectionProcessTimeSeriesSamples']==0
          print(json.dumps({'status':x['status'],'files':x['profile']['files']},indent=2))
          PY
      - name: Upload aggregate schema only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-yxz2w7ctnh-stage2-schema
          path: benchmark-results/yxz2w7ctnh-stage2.json
          if-no-files-found: error
          retention-days: 30
