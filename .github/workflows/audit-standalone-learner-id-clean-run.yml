name: One-shot Clean Standalone Learner ID Runner

on:
  push:
    branches:
      - 'audit/standalone-learner-id-hardening-clean'

permissions:
  contents: write

concurrency:
  group: audit-standalone-learner-id-clean-runner
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/standalone-learner-id-hardening-clean
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply isolated standalone hardening
        run: |
          set -euo pipefail
          python tools/apply_standalone_learner_id_temp.py
          python tools/bump_web_release.py --release 2026.09.12.4 --published 2026-09-12
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          current=hashlib.sha256(Path('MouldMaster_Core_App.html').read_bytes()).hexdigest()
          text,n=re.subn(r'CURRENT_CORE_SHA256 = "[0-9a-f]{64}"',f'CURRENT_CORE_SHA256 = "{current}"',text,count=1)
          if n!=1: raise SystemExit(f'current core hash lock: expected one match, found {n}')
          p.write_text(text,encoding='utf-8')
          print('Current standalone core SHA-256:',current)
          PY
          python - <<'PY'
          from tools.externalize_core_scripts import CORE,OUT_DIR,expected_assets
          expected=expected_assets(CORE.read_text(encoding='utf-8'))
          changed=[]
          OUT_DIR.mkdir(parents=True,exist_ok=True)
          for name,body in expected.items():
              path=OUT_DIR/name
              if not path.is_file() or path.read_text(encoding='utf-8')!=body:
                  path.write_text(body,encoding='utf-8'); changed.append(name)
          for path in OUT_DIR.glob('core-inline-*.js'):
              if path.name not in expected:
                  path.unlink(); changed.append(path.name+' (removed)')
          print('Regenerated runtime slots:',', '.join(changed) if changed else 'none')
          PY
          python tools/sync_web_release.py --check
      - name: Validate standalone security and release coherence
        run: |
          set -euo pipefail
          node --check qa_standalone_learner_ids.cjs
          node qa_standalone_learner_ids.cjs
          python tools/externalize_core_scripts.py --check
          python qa_architecture_debt.py
          python qa_release.py
          python qa_release_docs.py
          python qa_app_wide_audit.py
          python qa_webkit_regression.py
          python tools/build_pages_artifact.py
          python tools/verify_release_external_validation.py
          python - <<'PY'
          import hashlib,json,re,urllib.request
          manifest=json.load(open('latest.json',encoding='utf-8'))
          url=manifest['app_url']
          assert re.fullmatch(r'https://raw\.githubusercontent\.com/connorth3-lgtm/Injection-moulding-app-/[0-9a-f]{40}/MouldMaster_Core_App\.html',url),url
          req=urllib.request.Request(url,headers={'User-Agent':'MouldMaster-clean-standalone-hardening-check'})
          with urllib.request.urlopen(req,timeout=30) as response: payload=response.read()
          actual=hashlib.sha256(payload).hexdigest()
          assert actual==manifest['sha256'],f'frozen recovery payload hash mismatch: {actual}'
          print('Frozen recovery feed remains hash-valid:',manifest['version'])
          PY
          git diff --check
      - name: Commit only validated source and generated runtime changes
        run: |
          set -euo pipefail
          rm -rf .pages-dist tools/__pycache__
          git add -A
          git restore --staged .github/workflows/audit-standalone-learner-id-clean-run.yml tools/apply_standalone_learner_id_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden standalone learner identifiers on clean recovery base'
          git push origin HEAD:audit/standalone-learner-id-hardening-clean
