name: Fix-all candidate evidence

on:
  push:
    branches: [ audit/fix-all-deep-dive-20260915 ]
    paths:
      - .github/workflows/fix-all-candidate.yml

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/fix-all-deep-dive-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build exact public candidate and metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_pages_artifact.py
          rm -rf physical-pwa-candidate candidate-metadata
          mkdir -p physical-pwa-candidate candidate-metadata
          cp -a .pages-dist/. physical-pwa-candidate/
          fingerprint="$(python tools/verify_pwa_physical_evidence.py --artifact physical-pwa-candidate --print-fingerprint)"
          python - "$fingerprint" "${GITHUB_SHA}" <<'PY'
          import json,sys
          from pathlib import Path
          fp,sha=sys.argv[1:3]
          Path('candidate-metadata/candidate-metadata.json').write_text(json.dumps({
              'release':'2026.09.15.5',
              'sourceSha':sha,
              'runtimeFingerprint':fp,
              'artifactName':f'physical-pwa-candidate-{sha}'
          },indent=2)+'\n',encoding='utf-8')
          PY
          cat candidate-metadata/candidate-metadata.json

      - name: Upload physical candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-pwa-candidate-${{ github.sha }}
          path: physical-pwa-candidate
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Upload candidate metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-all-candidate-metadata-${{ github.sha }}
          path: candidate-metadata
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          overwrite: false

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-candidate.yml
          git commit -m 'Remove one-shot audit candidate workflow'
          git push origin HEAD:audit/fix-all-deep-dive-20260915
