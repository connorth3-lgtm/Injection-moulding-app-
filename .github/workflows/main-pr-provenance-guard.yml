name: Main PR Provenance Guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  enforce-pr-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit merged-PR provenance, native protection and required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          fail_audit() {
            echo "::error::$1"
            exit 1
          }

          # This workflow is deliberately read-only. Native GitHub branch/ruleset
          # protection must prevent invalid writes before they reach main. A
          # post-push audit must never rewrite branch history in response to
          # eventual-consistency or long-running CI state.
          branch_json=$(gh api -H "Accept: application/vnd.github+json" "repos/$GH_REPO/branches/main")
          protected=$(jq -r '.protected // false' <<<"$branch_json")
          if [[ "$protected" != "true" ]]; then
            fail_audit "GitHub reports main protected=false. Native main protection is required; this audit will not mutate or roll back main."
          fi
          python3 tools/verify_main_ruleset.py --repository "$GH_REPO"

          # GitHub's commit-to-PR association can lag immediately after a merge.
          # Cross-check the exact merge SHA through two read-only indexes.
          merged_pr_json="null"
          for attempt in {1..20}; do
            associated_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/commits/$HEAD_SHA/pulls")
            recent_main_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")
            matches_json=$(
              { printf '%s\n' "$associated_json"; printf '%s\n' "$recent_main_json"; } |
                jq -s --arg sha "$HEAD_SHA" \
                  'add | map(select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)) | unique_by(.number)'
            )
            match_count=$(jq 'length' <<<"$matches_json")

            if [[ "$match_count" -gt 1 ]]; then
              fail_audit "Push to main is ambiguously attributable to multiple merged pull requests."
            fi
            if [[ "$match_count" -eq 1 ]]; then
              merged_pr_json=$(jq '.[0]' <<<"$matches_json")
              break
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Exact merged-PR provenance is not visible through either GitHub index yet; retrying ($attempt/20)."
              sleep 3
            fi
          done

          if [[ -z "$merged_pr_json" || "$merged_pr_json" == "null" ]]; then
            fail_audit "Push to main is not uniquely attributable to a merged pull request. Native protection should have prevented this write."
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$merged_pr_json")
          PR_HEAD_SHA=$(jq -r '.head.sha' <<<"$merged_pr_json")
          PR_HEAD_REF=$(jq -r '.head.ref' <<<"$merged_pr_json")
          PR_HEAD_REPO_ID=$(jq -r '.head.repo.id' <<<"$merged_pr_json")
          PR_AUTHOR=$(jq -r '.user.login' <<<"$merged_pr_json")
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail_audit "Merged PR #$PR_NUMBER returned a non-canonical exact head SHA."
          fi
          echo "Main commit is merged PR #$PR_NUMBER with source head $PR_HEAD_SHA."

          # Solo-maintainer authority is a genuine manual GitHub merge by the
          # named repository owner. No second-human APPROVED review is claimed.
          policy_owner=$(jq -r '.soloMaintainer.ownerLogin // empty' data/main-governance-policy-v1.json)
          if [[ -z "$policy_owner" || "$policy_owner" != "${GH_REPO%%/*}" ]]; then
            fail_audit "Solo-maintainer policy must name the repository owner."
          fi
          merged_detail=$(gh api -H "Accept: application/vnd.github+json" "repos/$GH_REPO/pulls/$PR_NUMBER")
          merged_by=$(jq -r '.merged_by.login // empty' <<<"$merged_detail")
          merged_type=$(jq -r '.merged_by.type // empty' <<<"$merged_detail")
          merged_sha=$(jq -r '.merge_commit_sha // empty' <<<"$merged_detail")
          merged_at=$(jq -r '.merged_at // empty' <<<"$merged_detail")
          if [[ "$merged_by" != "$policy_owner" || "$merged_type" != "User" || "$merged_sha" != "$HEAD_SHA" || -z "$merged_at" ]]; then
            fail_audit "Merged PR #$PR_NUMBER lacks the repository owner's explicit GitHub squash-merge decision bound to exact main head $HEAD_SHA."
          fi
          echo "Solo-maintainer manual merge decision verified: owner=$merged_by PR #$PR_NUMBER head=$PR_HEAD_SHA."

          required_workflows=(
            "MouldMaster Release QA"
            "Mobile Browser QA"
            "Open Desktop Build"
            "Question Quality 50-Pass"
            "Release External Validation Boundary"
            "Exact-head CI Risk Coverage"
          )
          workflow_path_for() {
            case "$1" in
              "MouldMaster Release QA") echo ".github/workflows/qa.yml" ;;
              "Mobile Browser QA") echo ".github/workflows/mobile-browser-qa.yml" ;;
              "Open Desktop Build") echo ".github/workflows/open-desktop-build.yml" ;;
              "Question Quality 50-Pass") echo ".github/workflows/question-quality-50-pass.yml" ;;
              "Release External Validation Boundary") echo ".github/workflows/release-external-validation.yml" ;;
              "Exact-head CI Risk Coverage") echo ".github/workflows/ci-risk-coverage.yml" ;;
              *) fail_audit "No canonical workflow path registered for '$1'." ;;
            esac
          }

          all_required_success=false
          for attempt in {1..60}; do
            runs_pages=$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs?head_sha=$PR_HEAD_SHA&event=pull_request&per_page=100")
            runs_json=$(jq '{workflow_runs: [.[].workflow_runs[]]}' <<<"$runs_pages")
            all_seen=true

            for workflow in "${required_workflows[@]}"; do
              workflow_path="$(workflow_path_for "$workflow")"
              status=$(jq -r --arg workflow "$workflow" --arg workflow_path "$workflow_path" --argjson pr "$PR_NUMBER" --arg head_ref "$PR_HEAD_REF" --argjson head_repo "$PR_HEAD_REPO_ID" \
                '[.workflow_runs[] | select(.name == $workflow and .path == $workflow_path and ((any(.pull_requests[]?; (.number == $pr and .base.ref == "main"))) or (((.pull_requests // []) | length) == 0 and .head_branch == $head_ref and (.head_repository.id // 0) == $head_repo)))] | sort_by([(.updated_at // .created_at // ""), (.id // 0)]) | reverse | (.[0].status // "missing")' \
                <<<"$runs_json")
              conclusion=$(jq -r --arg workflow "$workflow" --arg workflow_path "$workflow_path" --argjson pr "$PR_NUMBER" --arg head_ref "$PR_HEAD_REF" --argjson head_repo "$PR_HEAD_REPO_ID" \
                '[.workflow_runs[] | select(.name == $workflow and .path == $workflow_path and ((any(.pull_requests[]?; (.number == $pr and .base.ref == "main"))) or (((.pull_requests // []) | length) == 0 and .head_branch == $head_ref and (.head_repository.id // 0) == $head_repo)))] | sort_by([(.updated_at // .created_at // ""), (.id // 0)]) | reverse | (.[0].conclusion // "missing")' \
                <<<"$runs_json")

              echo "$workflow: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                fail_audit "Required PR workflow '$workflow' did not succeed on $PR_HEAD_SHA (conclusion=$conclusion)."
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_seen=false
              fi
            done

            if [[ "$all_seen" == "true" ]]; then
              all_required_success=true
              break
            fi
            if [[ "$attempt" -lt 60 ]]; then
              echo "Required PR workflow state is not fully green yet; read-only audit retrying ($attempt/60)."
              sleep 5
            fi
          done

          if [[ "$all_required_success" != "true" ]]; then
            fail_audit "Required PR workflows are not all successful for merged PR #$PR_NUMBER. No rollback was attempted; native protection is authoritative."
          fi

          echo "Exact native main ruleset, merged PR provenance and all required pre-merge workflows are verified."