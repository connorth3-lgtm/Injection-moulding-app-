name: Main PR Provenance Guard

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  enforce-pr-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Require merged-PR provenance and successful required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          rollback_main() {
            local reason="$1"
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "::error::$reason Previous main SHA is unavailable, so automatic rollback cannot run safely."
              exit 1
            fi
            echo "::error::$reason Restoring main to $BEFORE_SHA."
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$BEFORE_SHA" -F force=true
            exit 1
          }

          # GitHub's commit-to-PR association can lag immediately after a squash merge.
          # Cross-check it with the recent closed-main PR collection, where the exact
          # merge_commit_sha is an independent provenance identifier. The same PR may
          # appear through both endpoints, so deduplicate by PR number. Multiple distinct
          # exact matches remain a fail-closed ambiguity.
          merged_pr_json="null"
          for attempt in {1..20}; do
            associated_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/commits/$HEAD_SHA/pulls")
            recent_main_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")
            matches_json=$(
              { printf '%s\n' "$associated_json"; printf '%s\n' "$recent_main_json"; } |
                jq -s --arg sha "$HEAD_SHA" \
                  'add | map(select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)) | unique_by(.number)'
            )
            match_count=$(jq 'length' <<<"$matches_json")

            if [[ "$match_count" -gt 1 ]]; then
              rollback_main "Push to main is ambiguously attributable to multiple merged pull requests."
            fi

            if [[ "$match_count" -eq 1 ]]; then
              merged_pr_json=$(jq '.[0]' <<<"$matches_json")
              break
            fi

            if [[ "$attempt" -lt 20 ]]; then
              echo "Exact merged-PR provenance is not visible through either GitHub index yet; retrying ($attempt/20)."
              sleep 3
            fi
          done

          if [[ -z "$merged_pr_json" || "$merged_pr_json" == "null" ]]; then
            rollback_main "Push to main did not originate from a uniquely attributable merged pull request after cross-index provenance retries."
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$merged_pr_json")
          PR_HEAD_SHA=$(jq -r '.head.sha' <<<"$merged_pr_json")
          echo "Main commit is merged PR #$PR_NUMBER with source head $PR_HEAD_SHA."

          required_workflows=(
            "MouldMaster Release QA"
            "Mobile Browser QA"
            "Open Desktop Build"
            "Question Quality 50-Pass"
          )

          all_required_success=false
          for attempt in {1..10}; do
            runs_json=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$PR_HEAD_SHA&event=pull_request&per_page=100")
            all_seen=true

            for workflow in "${required_workflows[@]}"; do
              status=$(jq -r --arg workflow "$workflow" \
                '[.workflow_runs[] | select(.name == $workflow)] | sort_by(.updated_at) | reverse | (.[0].status // "missing")' \
                <<<"$runs_json")
              conclusion=$(jq -r --arg workflow "$workflow" \
                '[.workflow_runs[] | select(.name == $workflow)] | sort_by(.updated_at) | reverse | (.[0].conclusion // "missing")' \
                <<<"$runs_json")

              echo "$workflow: status=$status conclusion=$conclusion"

              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                rollback_main "Required PR workflow '$workflow' did not succeed on $PR_HEAD_SHA (conclusion=$conclusion)."
              fi

              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_seen=false
              fi
            done

            if [[ "$all_seen" == "true" ]]; then
              all_required_success=true
              break
            fi

            echo "Required PR workflow state is not fully visible yet; retrying ($attempt/10)."
            sleep 3
          done

          if [[ "$all_required_success" != "true" ]]; then
            rollback_main "Required PR workflows are missing, pending, or not successful for merged PR #$PR_NUMBER."
          fi

          echo "Merged PR provenance and all required pre-merge workflows are verified."
