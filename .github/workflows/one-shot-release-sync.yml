name: One-shot web release sync

on:
  push:
    branches: [ fix/learner-backup-integrity-v3 ]

permissions:
  contents: write

concurrency:
  group: one-shot-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-backup-integrity-v3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize authoritative web release identity
        run: python tools/sync_web_release.py
      - name: Verify generated release identity
        run: python tools/sync_web_release.py --check
      - name: Commit synchronized outputs and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-release-sync.yml
          git add version.json service-worker.js index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html
          git diff --cached --check
          git commit -m "Synchronize web release 2026.09.18.1"
          git push origin HEAD:fix/learner-backup-integrity-v3
