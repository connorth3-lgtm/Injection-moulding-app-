name: Export runtime-pack CI cleanup

on:
  push:
    branches: [refactor/runtime-packs-v1]
    paths:
      - '.github/workflows/export-runtime-pack-ci-cleanup.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/runtime-packs-v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Produce reviewed workflow replacements as ordinary text files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          out = Path('.runtime-pack-ci')
          out.mkdir(exist_ok=True)

          domain_path = Path('.github/workflows/domain-foundation-qa.yml')
          domain = domain_path.read_text(encoding='utf-8')
          needle = "      - 'tools/generate_runtime_manifest.py'\n"
          if domain.count(needle) != 2:
              raise SystemExit(f'unexpected domain manifest path count: {domain.count(needle)}')
          domain = domain.replace(needle, needle + "      - 'tools/build_runtime_packs.py'\n")
          anchor = "      - name: Architecture debt ceiling\n        run: python qa_architecture_debt.py\n"
          if domain.count(anchor) != 1:
              raise SystemExit('domain architecture step anchor drift')
          domain = domain.replace(
              anchor,
              "      - name: Runtime pack determinism\n        run: python tools/build_runtime_packs.py --check\n" + anchor,
              1,
          )
          (out / 'domain-foundation-qa.yml').write_text(domain, encoding='utf-8')

          desktop_path = Path('.github/workflows/open-desktop-build.yml')
          desktop = desktop_path.read_text(encoding='utf-8')
          anchor = "      - 'desktop/electron/**'\n"
          if desktop.count(anchor) != 1:
              raise SystemExit(f'unexpected desktop path anchor count: {desktop.count(anchor)}')
          desktop = desktop.replace(
              anchor,
              anchor + "      - 'src/domains/**'\n      - 'tools/build_runtime_packs.py'\n",
              1,
          )
          (out / 'open-desktop-build.yml').write_text(desktop, encoding='utf-8')
          PY
      - name: Commit exported replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .runtime-pack-ci
          git diff --cached --quiet && exit 0
          git commit -m 'Export runtime pack CI workflow replacements'
          git push origin HEAD:refactor/runtime-packs-v1
