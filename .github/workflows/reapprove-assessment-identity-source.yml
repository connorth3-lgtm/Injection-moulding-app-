name: Reapprove assessment identity source
on:
  push:
    branches: [audit-quality-followup-2026-09-10]
permissions:
  contents: write
jobs:
  repin-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Re-pin reviewed assessment source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assessment-evidence-approval.js')
          s=p.read_text(encoding='utf-8')
          old="'assessment-quality-suite.js':'8783fa70b89a1bcb49bb9c86c6aef6ed2947a801'"
          new="'assessment-quality-suite.js':'747e58c26b851f2234172597a87c372d5d2b3388'"
          if s.count(old)!=1:
              raise SystemExit('assessment-quality-suite approval pin drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify evidence and assessment contracts
        run: |
          node --check assessment-evidence-approval.js
          python qa_assessment_evidence.py
          python qa_assessment_quality.py
          python qa_stable_review_bridge.py
          python qa_question_quality_50_pass_immutable.py
          python qa_release.py
      - name: Commit reviewed pin and remove workflow
        run: |
          rm -f .github/workflows/reapprove-assessment-identity-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment-evidence-approval.js
          git add -u .github/workflows/reapprove-assessment-identity-source.yml
          git diff --cached --check
          git commit -m 'chore(evidence): reapprove assessment identity-lock source'
          git push origin HEAD:audit-quality-followup-2026-09-10
