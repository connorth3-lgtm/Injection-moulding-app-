name: Audit Remediation Stage

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: write

concurrency:
  group: audit-remediation-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize .6 release identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if old not in s:
                  if new in s:return
                  raise SystemExit(f'{path}: expected marker not found: {old}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          replace('index.html','const SHELL_RELEASE="2026.09.15.5";','const SHELL_RELEASE="2026.09.15.6";')
          replace('index.html','mouldmaster-static-2026.09.15.5-engineer-simulator-ui-r1-20260911','mouldmaster-static-2026.09.15.6-engineer-simulator-ui-r1-20260911')
          replace('pwa-shell.js',"const RELEASE='2026.09.15.5';","const RELEASE='2026.09.15.6';")
          replace('qa_release.py','WEB_RELEASE = "2026.09.15.5"','WEB_RELEASE = "2026.09.15.6"')
          replace('qa_release_docs.py',"'web_release':'2026.09.15.5'","'web_release':'2026.09.15.6'")
          replace('README.md','- PWA / browser shell: `2026.09.15.5`','- PWA / browser shell: `2026.09.15.6`')
          replace('support.html','id="mmPwa">2026.09.15.5','id="mmPwa">2026.09.15.6')
          replace('book-runtime.js',"const VERSION='2026.09.15.5';","const VERSION='2026.09.15.6';")
          replace('src/domains/learning/book-runtime.js',"const VERSION='2026.09.15.5';","const VERSION='2026.09.15.6';")
          PY
      - name: Focused release validation
        run: |
          node --check service-worker.js
          node --check src/domains/learning/book-claim-trace.js
          node --check src/domains/learning/backup-authority-notice.js
          python tools/generate_runtime_manifest.py --check
          python qa_release_docs.py
          python qa_audit_remediation_20260915_6.py
          python tools/build_pages_artifact.py
          python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint
      - name: Commit coherent staged runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pwa-shell.js qa_release.py qa_release_docs.py README.md support.html book-runtime.js src/domains/learning/book-runtime.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No staged release synchronization changes required.'
            exit 0
          fi
          git commit -m '[audit-remediation-generated] Synchronize 2026.09.15.6 runtime candidate'
          git push origin HEAD:fix/audit-remediation-2026-09-16
