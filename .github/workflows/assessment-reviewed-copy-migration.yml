name: Assessment reviewed-copy migration

on:
  push:
    branches:
      - audit-followup-2026-09-10
    paths:
      - tools/migrate_reviewed_assessment_copy.py
      - .github/workflows/assessment-reviewed-copy-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v7
        with:
          ref: audit-followup-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Promote reviewed keyed wording into authored banks
        run: python tools/migrate_reviewed_assessment_copy.py

      - name: Syntax-check changed assessment runtime
        run: |
          node --check assessment-deep-dive.js
          node --check assessment-answer-cue-fix.js
          node --check training-upgrade.js
          node --check assessment-quality-suite.js
          node --check assessment-stable-review-bridge.js
          node --check assessment-evidence-approval.js

      - name: Commit migration locally for blob-pinned evidence QA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MouldMaster_Core_App.html training-upgrade.js assessment-deep-dive.js assessment-answer-cue-fix.js assessment-quality-suite.js assessment-stable-review-bridge.js assessment-evidence-approval.js qa*.py
          git diff --cached --check
          git commit -m "fix(assessment): author reviewed keyed wording at source"

      - name: Protected assessment quality contract
        run: |
          python qa_audit_consolidation.py
          python qa_assessment_ux.py
          python qa_question_quality_50_pass_immutable.py
          python qa_question_quality_extreme_runtime_v2.py
          python qa_assessment_evidence_integrity.py

      - name: Reviewed-answer and approval gates
        run: |
          python qa_assessment_evidence.py
          python qa_psychometric_integration.py

      - name: App regression gates
        run: |
          python qa_runtime_hardening.py
          python qa_release.py

      - name: Push only the verified source commit
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd
          git push origin HEAD:audit-followup-2026-09-10
