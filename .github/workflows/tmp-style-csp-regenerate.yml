name: One-shot style CSP regeneration

on:
  push:
    branches:
      - fix/restore-listen-compact-lesson
    paths:
      - .github/workflows/tmp-style-csp-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-listen-compact-lesson
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate deterministic style CSP
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate_style_csp.cjs
          node tools/generate_style_csp.cjs --check
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Regenerate style CSP for compact lesson and Listen UI'
          git push origin HEAD:fix/restore-listen-compact-lesson
