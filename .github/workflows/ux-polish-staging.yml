name: UX Polish 2026.09.16.2 Staging
on:
  push:
    branches: [fix/ux-polish-20260916-2]
permissions:
  contents: write
concurrency:
  group: ux-polish-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply 2026.09.16.2 UX polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ux-polish-20260916-2
      - name: Apply governed UX patch
        run: python3 tools/apply_ux_polish_20260916_2.py
      - name: Static syntax and release checks
        run: |
          node --check book-runtime.js
          node --check src/domains/learning/book-runtime.js
          python3 tools/sync_web_release.py --check
          python3 qa_premium_ui.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply 2026.09.16.2 UX polish"
          git push origin HEAD:fix/ux-polish-20260916-2
