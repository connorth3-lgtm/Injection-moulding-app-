name: UX Polish 2026.09.16.2 Staging
on:
  push:
    branches: [fix/ux-polish-20260916-2]
permissions:
  contents: write
concurrency:
  group: ux-polish-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebind:
    if: ${{ !contains(github.event.head_commit.message, 'Rebind 2026.09.16.2 external validation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ux-polish-20260916-2
      - name: Rebind exact candidate without manufacturing evidence
        run: python3 tools/rebind_external_validation_20260916_2.py
      - name: Verify release-bound external validation remains fail closed
        run: |
          python3 tools/verify_release_external_validation.py
          python3 tools/sync_web_release.py --check
          git diff --check
      - name: Commit governance rebind
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebind 2026.09.16.2 external validation"
          git push origin HEAD:fix/ux-polish-20260916-2
