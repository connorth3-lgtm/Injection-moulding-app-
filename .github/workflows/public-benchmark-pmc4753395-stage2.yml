name: MouldMaster Public Measured Benchmark — PMC4753395 stage 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_pmc4753395_stage2.py'
      - 'qa_public_benchmark_pmc4753395_stage2.py'
      - 'data/public-benchmark-contracts/pmc4753395-hdpe-cenosphere-v1.json'
      - '.github/workflows/public-benchmark-pmc4753395-stage2.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_pmc4753395_stage2.py'
      - 'qa_public_benchmark_pmc4753395_stage2.py'
      - 'data/public-benchmark-contracts/pmc4753395-hdpe-cenosphere-v1.json'
      - '.github/workflows/public-benchmark-pmc4753395-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  semantic-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Install semantic profiling dependencies
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Validate stage-two evidence boundary
        run: python qa_public_benchmark_pmc4753395_stage2.py
      - name: Profile measured workbook semantics without values
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_pmc4753395_stage2.py --output benchmark-results/pmc4753395-stage2.json --retrieved-date "$(date -u +%F)"
      - name: Validate semantic profile
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/pmc4753395-stage2.json'))
          assert x['status'] in {'semantic-profile-complete-needs-acceptance','semantic-profile-needs-review'}
          assert x['source']['datasetDoi']=='10.1016/j.dib.2016.01.058'
          assert x['semanticProfile']['theoreticalWorkbookValuesAccepted']==0
          assert x['semanticProfile']['injectionMachineTimeSeriesSamplesAdded']==0
          assert x['semanticProfile']['rawNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          if x['status']=='semantic-profile-complete-needs-acceptance':
              assert x['semanticProfile']['pairedHeaderPatternValidated'] is True
              assert x['semanticProfile']['sourceDeliveredStressStrainTraceValues'] == x['semanticProfile']['sourceDeliveredStressTraceValues'] + x['semanticProfile']['sourceDeliveredStrainTraceValues']
              assert x['semanticProfile']['sourceDeliveredStressStrainTraceValues'] > 0
          print(json.dumps({'status':x['status'],'stressValues':x['semanticProfile']['sourceDeliveredStressTraceValues'],'strainValues':x['semanticProfile']['sourceDeliveredStrainTraceValues'],'traceValues':x['semanticProfile']['sourceDeliveredStressStrainTraceValues'],'plotNumericExcluded':x['semanticProfile']['excludedPlotSheet']['numericCells']},indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouldmaster-pmc4753395-stage2-profile
          path: benchmark-results/pmc4753395-stage2.json
          if-no-files-found: error
          retention-days: 30