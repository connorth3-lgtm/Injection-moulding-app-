name: MouldMaster Public Measured Benchmark — PET preform v2

on:
  push:
    branches: [main, data/real-dataset-profiling-wave1, data/pet-preform-semantic-terminal]
    paths:
      - 'tools/run_public_benchmark_pet_preform.py'
      - 'qa_public_benchmark_pet_preform.py'
      - 'data/public-benchmark-contracts/pet-preform-v2.json'
      - 'data/public-benchmark-results/pet-preform-v2.json'
      - 'data/pet-preform-semantic-review-2026-08-30.json'
      - '.github/workflows/public-benchmark-pet-preform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/run_public_benchmark_pet_preform.py'
      - 'qa_public_benchmark_pet_preform.py'
      - 'data/public-benchmark-contracts/pet-preform-v2.json'
      - 'data/public-benchmark-results/pet-preform-v2.json'
      - 'data/pet-preform-semantic-review-2026-08-30.json'
      - '.github/workflows/public-benchmark-pet-preform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-public-benchmark-pet-preform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl xlrd
      - run: python qa_public_benchmark_pet_preform.py

  public-measured-benchmark:
    if: github.event_name != 'pull_request'
    needs: runner-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl xlrd
      - name: Retrieve and profile version-pinned PET preform files
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_pet_preform.py \
            --output benchmark-results/pet-preform-v2-profile.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only structural result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/pet-preform-v2-profile.json'))
          assert x['source']['datasetDoi']=='10.17632/vc3k9tt5zj.2'
          assert x['source']['version']==2
          assert x['profile']['publicFilesRetrieved'] == 1
          assert x['profile']['readableTables'] == 1
          assert x['profile']['totalTabularRowsAcrossTables'] == 27
          assert all(len(f['sha256'])==64 for f in x['files'])
          assert x['files'][0]['sha256']=='20f6704a93df7638d682b692ae4cb7432ca7d94bbc950ef2bdd0cfc17db124dc'
          assert x['tables'][0]['rows']==27 and x['tables'][0]['columns']==26
          assert x['tables'][0]['semantics']['headerNames']==json.load(open('data/pet-preform-semantic-review-2026-08-30.json'))['deliveredTable']['headerNames']
          assert x['profile']['rawRowsOrCellValuesEmitted'] is False
          assert x['retrieval']['rawPublisherFilesCommitted'] is False
          assert x['retrieval']['rawRowsUploadedAsArtifact'] is False
          print(x['status'], x['profile']['publicFilesRetrieved'], x['profile']['readableTables'], x['profile']['totalTabularRowsAcrossTables'])
          PY
      - name: Upload aggregate PET preform evidence only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-public-measured-benchmark-pet-preform-v2
          path: benchmark-results/pet-preform-v2-profile.json
          if-no-files-found: error
          retention-days: 30
