name: Migrate Locked MSIX Toolchain v1

on:
  push:
    branches:
      - build/lock-msix-toolchain-v1
    paths:
      - .github/workflows/migrate-locked-msix-toolchain-v1.yml
      - .github/scripts/migrate_locked_msix_toolchain_v1.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/lock-msix-toolchain-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare permanent migration
        shell: bash
        run: python .github/scripts/migrate_locked_msix_toolchain_v1.py
      - name: Generate exact MSIX toolchain lock
        shell: bash
        working-directory: desktop/electron/msix-toolchain
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Install stable desktop dependencies
        shell: bash
        working-directory: desktop/electron
        run: npm ci --no-audit --fund=false
      - name: Install isolated MSIX dependencies
        shell: bash
        working-directory: desktop/electron/msix-toolchain
        run: npm ci --no-audit --fund=false
      - name: Verify isolated builder versions and QAs
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./desktop/electron/node_modules/electron-builder/package.json'); if(p.version!=='26.15.7') throw new Error('root electron-builder drift: '+p.version)"
          node desktop/electron/scripts/run-msix-builder.cjs --version
          python qa_store_submission.py
          python qa_release.py
      - name: Build locked x64 MSIX smoke package
        shell: pwsh
        working-directory: desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run integrity
          npm run licenses
          npm run sbom
          npm run qa
          ./scripts/generate-msix-assets.ps1
          node scripts/run-msix-builder.cjs --win msix --x64 `
            --config.directories.output='dist-msix-smoke' `
            --config.msix.applicationId='MouldMasterAcademy' `
            --config.msix.identityName='MouldMasterAcademy.Test' `
            --config.msix.publisher='CN=MouldMaster Test' `
            --config.msix.publisherDisplayName='MouldMaster Test' `
            --config.msix.displayName='MouldMaster Academy Test' `
            --config.msix.setBuildNumber=true `
            --config.msix.minVersion='10.0.19041.0' `
            --config.msix.enforcePackageIntegrity=true
          $packages = @(Get-ChildItem 'dist-msix-smoke' -Recurse -File -Filter '*.msix')
          if ($packages.Count -lt 1) { throw 'Locked MSIX smoke build produced no .msix package.' }
          $packages | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - name: Commit permanent locked toolchain changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/package.json
          git add desktop/electron/msix-toolchain/package.json
          git add desktop/electron/msix-toolchain/package-lock.json
          git add desktop/electron/scripts/run-msix-builder.cjs
          git add .github/workflows/microsoft-store-msix.yml
          git add .github/workflows/desktop-dependency-lock.yml
          git add qa_store_submission.py
          git commit -m "Lock and isolate MSIX packaging toolchain"
          git push origin HEAD:build/lock-msix-toolchain-v1
