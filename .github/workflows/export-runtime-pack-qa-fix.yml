name: Export runtime-pack QA fix

on:
  push:
    branches: [refactor/runtime-packs-v1]
    paths:
      - '.github/workflows/export-runtime-pack-qa-fix.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/runtime-packs-v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Export pack-aware app-wide audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('qa_app_wide_audit.py').read_text(encoding='utf-8')
          old = 'need(len(body_scripts) >= 40, f"runtime BODY_SCRIPTS extraction unexpectedly small: {len(body_scripts)}")\n'
          if src.count(old) != 1:
              raise SystemExit('BODY_SCRIPTS floor anchor drift')
          new = (
              'need(len(body_scripts) >= 39, f"runtime BODY_SCRIPTS extraction unexpectedly small: {len(body_scripts)}")\n'
              'runtime_packs = {\n'
              '    "./src/domains/runtime-packs/evidence-runtime-pack.js",\n'
              '    "./src/domains/runtime-packs/process-data-runtime-pack.js",\n'
              '}\n'
              'need(runtime_packs <= body_scripts, f"required deterministic runtime packs missing from BODY_SCRIPTS: {sorted(runtime_packs - body_scripts)}")\n'
          )
          src = src.replace(old, new, 1)
          out = Path('.runtime-pack-ci')
          out.mkdir(exist_ok=True)
          (out / 'qa_app_wide_audit.py').write_text(src, encoding='utf-8')
          PY
      - name: Validate and commit exported audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .runtime-pack-ci/qa_app_wide_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .runtime-pack-ci/qa_app_wide_audit.py
          git commit -m 'Export pack-aware app-wide audit'
          git push origin HEAD:refactor/runtime-packs-v1
