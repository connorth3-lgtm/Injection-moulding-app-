name: Audit Inline Styles v1

on:
  push:
    branches:
      - refactor/csp-style-self-v1
    paths:
      - tools/audit_inline_styles.py
      - .github/workflows/audit-inline-styles-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/csp-style-self-v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit active inline styles
        run: python tools/audit_inline_styles.py
      - uses: actions/upload-artifact@v7
        with:
          name: inline-style-audit-v1
          path: inline-style-audit-report.json
          if-no-files-found: error
