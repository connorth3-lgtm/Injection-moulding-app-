name: Read Aloud QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-aloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-aloud-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check read-aloud.js
          node --check reading-patch.js
          node --check service-worker.js
      - name: Read Aloud privacy, accessibility and packaging integrity
        run: python qa_read_aloud.py
      - name: Install pinned Chromium speech-interaction test dependencies
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps chromium
      - name: Start local candidate server for Book and Listening interactions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-book-audio-http.log 2>&1 &
      - name: Verify actual Book and Listening speech interactions in Chromium
        run: npx playwright test qa/read-aloud.spec.js --config=playwright.config.cjs
      - name: Production Pages allowlist still resolves
        run: python tools/build_pages_artifact.py