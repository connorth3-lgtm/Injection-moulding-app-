name: Follow-up assessment quality contract

on:
  push:
    branches:
      - audit-followup-2026-09-10
    paths:
      - .github/workflows/assessment-quality-contract-followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-followup-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Align assessment quality assertion with reviewed authored answer
        shell: python
        run: |
          from pathlib import Path
          p=Path('qa_assessment_quality.py')
          s=p.read_text(encoding='utf-8')
          old="Match validated fill, pressure/transfer, thermal and part-quality outputs"
          new="Match validated physical process outputs on a capable receiving machine"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one stale transfer assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify focused and release contracts
        run: |
          python qa_assessment_quality.py
          python qa_question_deep_dive.py
          python qa_assessment_evidence.py
          python qa_psychometric_integration.py
          python qa_release.py
      - name: Commit verified QA alignment and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa_assessment_quality.py
          git rm .github/workflows/assessment-quality-contract-followup.yml
          git diff --cached --check
          git commit -m "test: align assessment quality with reviewed answer contract"
          git push origin HEAD:audit-followup-2026-09-10
