name: One-shot health status regeneration

on:
  push:
    branches: [ fix/learner-backup-integrity-v3 ]

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/learner-backup-integrity-v3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Render generated health surface
        run: |
          python tools/render_health_status.py
          python tools/render_health_status.py --check
      - name: Commit generated status and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-health-status.yml
          git add HEALTH_STATUS.md
          git diff --cached --check
          git commit -m "Regenerate health status for backup integrity v3"
          git push origin HEAD:fix/learner-backup-integrity-v3
