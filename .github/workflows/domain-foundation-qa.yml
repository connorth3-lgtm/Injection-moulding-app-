name: MouldMaster Domain Foundation QA

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'MouldMaster_Core_App.html'
      - 'src/domains/**'
      - 'data/materials/**'
      - 'runtime-domain-manifest.json'
      - 'material-catalog-v1.json'
      - 'tools/material_catalog.py'
      - 'tools/generate_runtime_manifest.py'
      - 'tools/build_runtime_packs.py'
      - 'tools/verify_production_source.py'
      - 'qa_material_catalog.py'
      - 'qa_material_identity.py'
      - 'qa_app_remediation.py'
      - 'qa_architecture_debt.py'
      - 'docs/DOMAIN_ARCHITECTURE_V1.md'
      - 'index.html'
      - 'pwa-shell.js'
      - 'accessibility-hardening.js'
      - 'service-worker.js'
      - 'desktop/electron/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/mobile-browser-qa.yml'
      - 'qa/**'
      - 'playwright*.cjs'
      - '.github/workflows/domain-foundation-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'MouldMaster_Core_App.html'
      - 'src/domains/**'
      - 'data/materials/**'
      - 'runtime-domain-manifest.json'
      - 'material-catalog-v1.json'
      - 'tools/material_catalog.py'
      - 'tools/generate_runtime_manifest.py'
      - 'tools/build_runtime_packs.py'
      - 'tools/verify_production_source.py'
      - 'qa_material_catalog.py'
      - 'qa_material_identity.py'
      - 'qa_app_remediation.py'
      - 'qa_architecture_debt.py'
      - 'docs/DOMAIN_ARCHITECTURE_V1.md'
      - 'index.html'
      - 'pwa-shell.js'
      - 'accessibility-hardening.js'
      - 'service-worker.js'
      - 'desktop/electron/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/mobile-browser-qa.yml'
      - 'qa/**'
      - 'playwright*.cjs'
      - '.github/workflows/domain-foundation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Domain JavaScript syntax
        run: |
          node --check src/domains/domain-bootstrap.js
          find src/domains -mindepth 2 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Runtime pack determinism
        run: python tools/build_runtime_packs.py --check
      - name: Architecture debt ceiling
        run: python qa_architecture_debt.py
      - name: Material staging semantics
        run: python tools/material_catalog.py validate
      - name: Material identity behaviour
        run: python qa_material_identity.py
      - name: Generated domain manifest
        run: python tools/generate_runtime_manifest.py --check
      - name: Material and domain foundation QA
        run: python qa_material_catalog.py
      - name: App-wide remediation invariants
        run: python qa_app_remediation.py
      - name: Public Pages boundary still resolves
        run: python tools/build_pages_artifact.py
      - name: App-wide runtime/offline reconciliation
        run: python qa_app_wide_audit.py
