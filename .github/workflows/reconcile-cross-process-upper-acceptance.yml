name: MouldMaster Cross-Process Inventory State Patch

on:
  push:
    branches: [data/cross-process-specialist-parser]
    paths:
      - '.github/workflows/reconcile-cross-process-upper-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/cross-process-specialist-parser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add governed partial-acceptance state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa_measured_dataset_inventory.py')
          text = path.read_text(encoding='utf-8')
          marker = "    'public-open-profiled-scope-limited',\n"
          insertion = marker + "    'public-open-partially-accepted-lower-upper-pressure-state-unresolved',\n"
          if "'public-open-partially-accepted-lower-upper-pressure-state-unresolved'" not in text:
              if text.count(marker) != 2:
                  raise AssertionError(f'expected governed state marker twice, found {text.count(marker)}')
              text = text.replace(marker, insertion)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate governed measured dataset inventory
        run: python qa_measured_dataset_inventory.py
      - name: Validate terminal and blocker contracts
        run: |
          python qa_remaining_dataset_terminal_states.py
          python qa_measured_data_blocker_contracts.py
      - name: Commit governed state vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- qa_measured_dataset_inventory.py
          git diff --cached --quiet && exit 0
          git commit -m "Govern cross-process partial acceptance state"
          git push origin HEAD:data/cross-process-specialist-parser
