name: Mobile Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'MouldMaster_Core_App.html'
      - '*.css'
      - 'app-shell-registry.js'
      - 'app-shell-finalize.js'
      - 'mould-master-workspace.js'
      - 'learning-experience.js'
      - 'curriculum-integration.js'
      - 'specialist-curriculum.js'
      - 'process-data-diagnostics.js'
      - 'diagnostic-learning-labs.js'
      - 'material-behaviour-labs.js'
      - 'src/domains/**'
      - 'src/core-runtime/**'
      - 'material-catalog-v1.json'
      - 'data/accessibility-real-at-validation-v1.json'
      - 'qa_accessibility_real_at_contract.py'
      - 'measured-evidence-integration.js'
      - 'measured-evidence-decision.js'
      - 'data/measured-evidence-decision-scenarios-v1.json'
      - 'qa_measured_evidence_integration.py'
      - 'qa_measured_evidence_decision_workflows.py'
      - 'learning-analytics.js'
      - 'pwa-shell.js'
      - 'reading-patch.js'
      - 'read-aloud.js'
      - 'qa_read_aloud.py'
      - 'service-worker.js'
      - 'tools/generate_style_csp.cjs'
      - 'qa_app_shell_registry.py'
      - 'qa_mould_master_workspace.py'
      - 'qa_delayed_transfer_reviews.py'
      - 'qa_webkit_regression.py'
      - 'qa/mobile-viewport.spec.js'
      - 'qa/visual-regression.spec.js'
      - 'qa/visual-regression-baseline.json'
      - 'qa/learner-ux-repair.spec.js'
      - 'qa/learn-practice-mobile-style.spec.js'
      - 'qa/material-grade-detail.spec.js'
      - 'qa/material-search-scale.spec.js'
      - 'qa/measured-evidence-decision.spec.js'
      - 'qa/read-aloud.spec.js'
      - 'qa/pwa-lifecycle.spec.js'
      - 'qa/engineering-case-store.spec.js'
      - 'qa/inline-handler-bridge.spec.js'
      - 'qa/inline-style-csp.spec.js'
      - 'qa/cross-browser-smoke.spec.js'
      - 'qa/**/*.spec.js'
      - 'playwright.config.cjs'
      - 'playwright.webkit-full.config.cjs'
      - 'playwright.cross-browser.config.cjs'
      - '.github/workflows/mobile-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Static shell, workspace and measured-evidence QA
        run: |
          python qa_app_shell_registry.py
          python qa_mould_master_workspace.py
          python qa_measured_evidence_integration.py
          python qa_measured_evidence_decision_workflows.py
          python qa_read_aloud.py
          python qa_delayed_transfer_reviews.py
          python qa_webkit_regression.py
          python qa_accessibility_real_at_contract.py
      - name: Install pinned Playwright browser matrix
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Prepare approved visual baseline
        run: |
          BASELINE_SHA="$(python - <<'PY'
          import json
          print(json.load(open('qa/visual-regression-baseline.json', encoding='utf-8'))['commit'])
          PY
          )"
          test "$BASELINE_SHA" = "948d69c16e5354b8fccd374fd70d2ff9d7164ce3"
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          rm -rf /tmp/mm-visual-baseline
          git worktree add --detach /tmp/mm-visual-baseline "$BASELINE_SHA"
      - name: Start candidate and baseline MouldMaster servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mouldmaster-http.log 2>&1 &
          echo $! > /tmp/mouldmaster-http.pid
          python -m http.server 4174 --bind 127.0.0.1 --directory /tmp/mm-visual-baseline > /tmp/mouldmaster-baseline-http.log 2>&1 &
          echo $! > /tmp/mouldmaster-baseline-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null && curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mouldmaster-http.log
          cat /tmp/mouldmaster-baseline-http.log
          exit 1
      - name: Chromium mobile density contract
        run: npx playwright test qa/learn-practice-mobile-style.spec.js --config=playwright.config.cjs
      - name: WebKit mobile density contract
        run: npx playwright test qa/learn-practice-mobile-style.spec.js --config=playwright.webkit-full.config.cjs
      - name: Chromium approved visual regression lock
        id: visual_lock
        continue-on-error: true
        run: npx playwright test qa/visual-regression.spec.js --config=playwright.config.cjs
      - name: Chromium mobile, material, evidence, engineering-store and PWA regression tests
        id: chromium_regression
        continue-on-error: true
        run: npx playwright test --config=playwright.config.cjs --grep-invert "matches immutable \.25 baseline across learner surfaces"
      - name: WebKit substantive learner regression tests
        id: webkit_regression
        continue-on-error: true
        run: npx playwright test --config=playwright.webkit-full.config.cjs
      - name: Cross-browser desktop and tablet smoke tests
        id: cross_browser_smoke
        continue-on-error: true
        run: npx playwright test --config=playwright.cross-browser.config.cjs
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce browser and visual approval gates
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual_lock.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium_regression.outcome }}
          WEBKIT_OUTCOME: ${{ steps.webkit_regression.outcome }}
          CROSS_BROWSER_OUTCOME: ${{ steps.cross_browser_smoke.outcome }}
        run: |
          failed=0
          check_gate() {
            label="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::$label did not pass (outcome=$outcome)."
              failed=1
            fi
          }
          check_gate "Approved visual baseline" "$VISUAL_OUTCOME"
          check_gate "Chromium substantive regression suite" "$CHROMIUM_OUTCOME"
          check_gate "WebKit substantive learner suite" "$WEBKIT_OUTCOME"
          check_gate "Cross-browser desktop/tablet smoke suite" "$CROSS_BROWSER_OUTCOME"
          if [ "$failed" -ne 0 ]; then
            echo "Browser evidence is complete for the executed suites; unresolved gates remain fail-closed."
            exit 1
          fi
          echo "All browser and visual approval gates passed."
