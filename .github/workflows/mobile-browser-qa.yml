name: Mobile Browser QA

on:
  pull_request:
    branches: [main, preview]
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: mobile-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.classify.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify browser impact
        id: classify
        run: python3 tools/ci_impact.py --governed-candidate

  browser-chromium:
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [visual, reachability, substantive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.task == 'substantive'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Static shell, workspace and measured-evidence QA
        if: matrix.task == 'substantive'
        run: |
          python qa_app_shell_registry.py
          python qa_mould_master_workspace.py
          python qa_measured_evidence_integration.py
          python qa_measured_evidence_decision_workflows.py
          python qa_read_aloud.py
          python qa_delayed_transfer_reviews.py
          python qa_webkit_regression.py
          python qa_accessibility_real_at_contract.py
      - name: Install pinned Chromium
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps chromium
      - name: Prepare approved visual baseline
        if: matrix.task == 'visual'
        run: |
          readarray -t BASELINE_META < <(python - <<'PY'
          import json
          data=json.load(open('qa/visual-regression-baseline.json', encoding='utf-8'))
          print(data['commit'])
          print(data['ref'])
          PY
          )
          BASELINE_SHA="${BASELINE_META[0]}"
          BASELINE_REF="${BASELINE_META[1]}"
          test -n "$BASELINE_SHA"
          test -n "$BASELINE_REF"
          test "$BASELINE_SHA" != "${{ github.sha }}"
          git fetch --no-tags --depth=1 origin "refs/heads/$BASELINE_REF"
          FETCHED_BASELINE_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$FETCHED_BASELINE_SHA" != "$BASELINE_SHA" ]; then
            echo "::error::Visual baseline ref drifted: $BASELINE_REF expected $BASELINE_SHA but resolved $FETCHED_BASELINE_SHA"
            exit 1
          fi
          rm -rf /tmp/mm-visual-baseline
          git worktree add --detach /tmp/mm-visual-baseline "$BASELINE_SHA"
      - name: Start Chromium candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start visual baseline server
        if: matrix.task == 'visual'
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/mm-visual-baseline > /tmp/mm-baseline.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium approved visual regression lock
        if: matrix.task == 'visual'
        run: npx playwright test qa/visual-regression.spec.js --config=playwright.config.cjs
      - name: UI-only feature reachability audit
        if: matrix.task == 'reachability'
        run: npx playwright test --config=playwright.reachability.config.cjs
      - name: Chromium mobile density contract
        if: matrix.task == 'substantive'
        run: npx playwright test qa/learn-practice-mobile-style.spec.js --config=playwright.config.cjs
      - name: Chromium substantive regression suite
        if: matrix.task == 'substantive'
        run: npx playwright test --config=playwright.config.cjs --grep-invert "matches approved .* baseline across learner surfaces"
      - name: Upload Chromium QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-browser-chromium-${{ matrix.task }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

  browser-webkit:
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned WebKit
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps webkit
      - name: Start WebKit candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: WebKit mobile density contract
        run: npx playwright test qa/learn-practice-mobile-style.spec.js --config=playwright.webkit-full.config.cjs
      - name: WebKit substantive learner regression tests
        run: npx playwright test --config=playwright.webkit-full.config.cjs
      - name: Upload WebKit QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-browser-webkit
          path: qa-artifacts/webkit-full-report/
          if-no-files-found: warn
          retention-days: 14

  browser-cross:
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned cross-browser matrix
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps chromium firefox webkit
      - name: Start cross-browser candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Cross-browser desktop and tablet smoke tests
        run: npx playwright test --config=playwright.cross-browser.config.cjs
      - name: Upload cross-browser QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-browser-cross
          path: qa-artifacts/cross-browser-report/
          if-no-files-found: warn
          retention-days: 14

  app-500-reliability:
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned Chromium
        run: |
          npm ci --no-audit --fund=false
          npx playwright install --with-deps chromium
      - name: Start reliability candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: 100-run reliability shard ${{ matrix.shard }}/5
        run: npx playwright test --config=playwright.app-500.config.cjs --shard=${{ matrix.shard }}/5
      - name: Upload reliability shard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-browser-app-500-shard-${{ matrix.shard }}
          path: qa-artifacts/app-500-report/
          if-no-files-found: warn
          retention-days: 14

  mobile-browser:
    if: always()
    needs: [browser-chromium, browser-webkit, browser-cross, app-500-reliability]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce complete mobile browser evidence
        env:
          CHROMIUM: ${{ needs.browser-chromium.result }}
          WEBKIT: ${{ needs.browser-webkit.result }}
          CROSS_BROWSER: ${{ needs.browser-cross.result }}
          APP_500: ${{ needs.app-500-reliability.result }}
        run: |
          if [ "$CHROMIUM" = "skipped" ] && [ "$WEBKIT" = "skipped" ] && [ "$CROSS_BROWSER" = "skipped" ] && [ "$APP_500" = "skipped" ]; then
            echo "Mobile Browser QA passed without expensive browser execution: the impact classifier skipped all browser groups."
            exit 0
          fi
          test "$CHROMIUM" = "success" || { echo "::error::Chromium QA did not pass: $CHROMIUM"; exit 1; }
          test "$WEBKIT" = "success" || { echo "::error::WebKit QA did not pass: $WEBKIT"; exit 1; }
          test "$CROSS_BROWSER" = "success" || { echo "::error::Cross-browser QA did not pass: $CROSS_BROWSER"; exit 1; }
          test "$APP_500" = "success" || { echo "::error::All five reliability shards did not pass: $APP_500"; exit 1; }
          echo "Mobile Browser QA passed: Chromium, WebKit, cross-browser, and all 500 reliability runs succeeded."
