name: Premium Candidate Bind Stage

on:
  push:
    branches: [design/premium-polish-20260916]

permissions:
  contents: write

jobs:
  candidate:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-bound]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build exact public runtime candidate
        id: build
        run: |
          python3 tools/build_pages_artifact.py
          fp="$(python3 tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          rm -rf physical-pwa-candidate
          mkdir -p physical-pwa-candidate
          cp -a .pages-dist/. physical-pwa-candidate/
          staged="$(python3 tools/verify_pwa_physical_evidence.py --artifact physical-pwa-candidate --print-fingerprint)"
          test "$fp" = "$staged"
      - name: Retain exact physical-device candidate
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: physical-pwa-candidate-${{ github.sha }}
          path: physical-pwa-candidate
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Rebind current-release external validation packets without manufacturing evidence
        env:
          RELEASE: '2026.09.16.1'
          OLD_RELEASE: '2026.09.15.6'
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          import json, os

          release=os.environ['RELEASE']
          old_release=os.environ['OLD_RELEASE']
          source=os.environ['SOURCE_SHA']
          run_id=int(os.environ['RUN_ID'])
          fp=os.environ['FINGERPRINT'].strip()
          artifact_id=int(os.environ['ARTIFACT_ID'])
          digest=os.environ['ARTIFACT_DIGEST'].strip()
          if not digest.startswith('sha256:'): digest='sha256:'+digest
          artifact_name=f'physical-pwa-candidate-{source}'
          expires=(datetime.now(timezone.utc)+timedelta(days=30)).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path,obj): Path(path).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ledger=load('data/release-external-validation-v1.json')
          ledger['release']=release
          ledger['validationIndex']=f'qa/EXTERNAL_VALIDATION_{release}.md'
          ledger['accessibility']['reviewPacket']=f'qa/ACCESSIBILITY_REAL_AT_{release}.md'
          ledger['accessibility']['candidate']={'release':release,'sourceSha':source,'runtimeFingerprint':fp}
          ledger['pwaPhysicalDevices']['reviewPacket']=f'qa/PWA_PHYSICAL_DEVICE_{release}.md'
          ledger['pwaPhysicalDevices']['currentCandidate']={
            'release':release,
            'sourceSha':source,
            'runtimeFingerprint':fp,
            'candidateRunId':run_id,
            'candidateWorkflow':'one-shot exact public candidate build; not production publication',
            'artifactId':artifact_id,
            'artifactName':artifact_name,
            'artifactDigest':digest,
            'artifactExpiresAt':expires,
          }
          ledger['windowsDistribution']['readinessPacket']=f'certification/WINDOWS_SIGNING_READINESS_{release}.md'
          ledger['windowsDistribution']['sourceSha']=source
          ledger['bookSme']['reviewPacket']=f'qa/BOOK_SME_REVIEW_{release}.md'
          ledger['curriculumSme']['reviewPacket']=f'qa/CURRICULUM_SME_REVIEW_{release}.md'
          ledger['learnerOutcomes']['pilotPacket']=f'qa/LEARNER_PILOT_{release}.md'
          for key in ('accessibility','pwaPhysicalDevices','windowsDistribution','bookSme','curriculumSme','learnerOutcomes'):
            if ledger[key].get('status')!='hold':
              raise SystemExit(f'{key} must remain hold during packet rebinding')
          dump('data/release-external-validation-v1.json',ledger)

          a11y=load('data/accessibility-real-at-validation-v1.json')
          a11y.update(release=release,packet=f'qa/ACCESSIBILITY_REAL_AT_{release}.md',sourceSha=source,runtimeFingerprint=fp)
          if a11y.get('status')=='validated': raise SystemExit('real AT evidence must not be synthesized')
          dump('data/accessibility-real-at-validation-v1.json',a11y)

          curriculum=load('qa/curriculum-semantic-review.json')
          curriculum['release']=release
          curriculum['packet']=f'qa/CURRICULUM_SME_REVIEW_{release}.md'
          dump('qa/curriculum-semantic-review.json',curriculum)

          for path in ('data/book-sme-review-v1.json','src/domains/learning/book-data/book-sme-review-v1.json'):
            obj=load(path); obj['release']=release
            if obj.get('reviews') not in ([],None): raise SystemExit(f'{path}: existing human reviews require manual review before rebinding')
            dump(path,obj)

          pilot=load('data/learner-pilot-v1.json')
          pilot['release']=release
          if 'packet' in pilot: pilot['packet']=f'qa/LEARNER_PILOT_{release}.md'
          dump('data/learner-pilot-v1.json',pilot)

          old_source='f5055cf8b156f1887dcd37aa214d37587be97493'
          old_fp='sha256:5ba0738492ee3e9747150f4638ad327f91786a7a972d68162e08af276543045f'
          old_run='35000457285'
          old_artifact_id='10408649380'
          old_artifact_name=f'physical-pwa-candidate-{old_source}'
          old_digest='sha256:ea15435c02bec91fa12c39d6e786ff6bca6e57baf79214cb146abbd756fa422e'
          old_expiry='2026-10-15T17:18:48Z'
          packet_pairs=[
            (f'qa/EXTERNAL_VALIDATION_{old_release}.md',f'qa/EXTERNAL_VALIDATION_{release}.md'),
            (f'qa/ACCESSIBILITY_REAL_AT_{old_release}.md',f'qa/ACCESSIBILITY_REAL_AT_{release}.md'),
            (f'qa/PWA_PHYSICAL_DEVICE_{old_release}.md',f'qa/PWA_PHYSICAL_DEVICE_{release}.md'),
            (f'certification/WINDOWS_SIGNING_READINESS_{old_release}.md',f'certification/WINDOWS_SIGNING_READINESS_{release}.md'),
            (f'qa/BOOK_SME_REVIEW_{old_release}.md',f'qa/BOOK_SME_REVIEW_{release}.md'),
            (f'qa/CURRICULUM_SME_REVIEW_{old_release}.md',f'qa/CURRICULUM_SME_REVIEW_{release}.md'),
            (f'qa/LEARNER_PILOT_{old_release}.md',f'qa/LEARNER_PILOT_{release}.md'),
          ]
          replacements={
            old_release:release,
            old_source:source,
            old_fp:fp,
            old_run:str(run_id),
            old_artifact_id:str(artifact_id),
            old_artifact_name:artifact_name,
            old_digest:digest,
            old_expiry:expires,
          }
          for src,dst in packet_pairs:
            text=Path(src).read_text(encoding='utf-8')
            for old,new in replacements.items(): text=text.replace(old,new)
            Path(dst).write_text(text,encoding='utf-8')

          print(json.dumps({'release':release,'sourceSha':source,'runtimeFingerprint':fp,'candidateRunId':run_id,'artifactId':artifact_id,'artifactName':artifact_name,'artifactDigest':digest,'artifactExpiresAt':expires},indent=2))
          PY
      - name: Verify truthful release-specific HOLD boundaries
        run: |
          python3 tools/verify_release_external_validation.py
          python3 qa_release_validation_packets.py
          python3 qa_accessibility_real_at_contract.py
      - name: Commit current-release packet bindings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/release-external-validation-v1.json data/accessibility-real-at-validation-v1.json data/book-sme-review-v1.json data/learner-pilot-v1.json src/domains/learning/book-data/book-sme-review-v1.json qa/curriculum-semantic-review.json "qa/EXTERNAL_VALIDATION_2026.09.16.1.md" "qa/ACCESSIBILITY_REAL_AT_2026.09.16.1.md" "qa/PWA_PHYSICAL_DEVICE_2026.09.16.1.md" "certification/WINDOWS_SIGNING_READINESS_2026.09.16.1.md" "qa/BOOK_SME_REVIEW_2026.09.16.1.md" "qa/CURRICULUM_SME_REVIEW_2026.09.16.1.md" "qa/LEARNER_PILOT_2026.09.16.1.md"
          git commit -m '[candidate-bound] Bind 2026.09.16.1 external HOLD packets to exact candidate'
          git push
