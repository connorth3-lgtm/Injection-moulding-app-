name: Apply Single Lesson Ending Cleanup

on:
  push:
    branches:
      - fix/single-lesson-ending
    paths:
      - .github/workflows/tmp-single-lesson-ending.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/single-lesson-ending
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply lesson cleanup migration
        run: python tools/tmp_single_lesson_ending.py
      - name: Regenerate and verify deterministic style CSP
        run: |
          node tools/generate_style_csp.cjs
          node tools/generate_style_csp.cjs --check
      - name: Run focused release contracts
        run: |
          python qa_runtime_hardening.py
          python qa_release.py
      - name: Commit migrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson-deep-authoring-v2.js lesson-simple-experience.js read-aloud.js qa/lesson-detail-simplicity.spec.js version.json pwa-shell.js service-worker.js index.html qa_release.py
          git commit -m "Simplify lesson completion to one clear ending"
          git push origin HEAD:fix/single-lesson-ending
