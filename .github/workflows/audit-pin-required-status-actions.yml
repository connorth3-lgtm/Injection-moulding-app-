name: One-shot Required Status Action Pinning

on:
  push:
    branches:
      - 'audit/pin-required-status-actions'

permissions:
  contents: write

concurrency:
  group: audit-pin-required-status-actions
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/pin-required-status-actions
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply deterministic action pinning
        run: python tools/apply_required_action_pinning_temp.py
      - name: Validate required-check supply chain
        run: |
          set -euo pipefail
          python qa_critical_actions_versions.py
          python qa_release_supply_chain.py
          python qa_repo_governance.py
          python qa_audit_governance.py
          git diff --check
      - name: Commit only validated permanent changes
        run: |
          set -euo pipefail
          rm -rf tools/__pycache__
          git add -A
          git restore --staged .github/workflows/audit-pin-required-status-actions.yml tools/apply_required_action_pinning_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pin required status-check Actions to reviewed SHAs'
          git push origin HEAD:audit/pin-required-status-actions
