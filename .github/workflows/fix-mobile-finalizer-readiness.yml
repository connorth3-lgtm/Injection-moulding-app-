name: Fix mobile finalizer readiness
on:
  push:
    branches: [audit-quality-followup-2026-09-10]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Replace obsolete Playwright finalizer pin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/learn-practice-mobile-style.spec.js')
          s=p.read_text(encoding='utf-8')
          old="await page.waitForFunction(()=>window.MM_APP_SHELL_FINALIZED==='2026.08.26.4'&&window.MM_PRIMARY_HUBS);"
          new="await page.waitForFunction(()=>typeof window.MM_APP_SHELL_FINALIZED==='string'&&/^\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d+$/.test(window.MM_APP_SHELL_FINALIZED)&&window.MM_PRIMARY_HUBS);"
          if s.count(old)!=1:
              raise SystemExit('obsolete mobile finalizer readiness marker drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify test syntax and readiness contract
        run: |
          node --check qa/learn-practice-mobile-style.spec.js
          python - <<'PY'
          from pathlib import Path
          s=Path('qa/learn-practice-mobile-style.spec.js').read_text(encoding='utf-8')
          assert "MM_APP_SHELL_FINALIZED==='2026.08.26.4'" not in s
          assert "typeof window.MM_APP_SHELL_FINALIZED==='string'" in s
          assert 'window.MM_PRIMARY_HUBS' in s
          PY
      - name: Commit permanent QA correction and remove workflow
        run: |
          rm -f .github/workflows/fix-mobile-finalizer-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/learn-practice-mobile-style.spec.js
          git add -u .github/workflows/fix-mobile-finalizer-readiness.yml
          git diff --cached --check
          git commit -m 'test(mobile): follow current shell finalizer readiness'
          git push origin HEAD:audit-quality-followup-2026-09-10
