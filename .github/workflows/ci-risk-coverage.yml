name: Exact-head CI Risk Coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-risk-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-risk-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify cross-workflow coverage on exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RISK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RISK_ATTEMPTS: '180'
          CI_RISK_SLEEP_SECONDS: '20'
        run: python tools/verify_ci_risk_coverage.py
