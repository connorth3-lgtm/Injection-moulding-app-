name: MouldMaster Public Measured Benchmark — Mendeley Wave 2 batch 2 stage 2

on:
  push:
    branches: [data/real-dataset-profiling-wave2-batch2]
    paths:
      - 'tools/run_public_benchmark_mendeley_wave2_batch2_stage2.py'
      - 'qa_public_benchmark_mendeley_wave2_batch2_stage2.py'
      - 'data/public-benchmark-results/mendeley-wave2-batch2-stage1.json'
      - '.github/workflows/public-benchmark-mendeley-wave2-batch2-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbook-layout-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate stage-two evidence boundaries
        run: python qa_public_benchmark_mendeley_wave2_batch2_stage2.py
      - name: Retrieve exact publisher workbooks and emit aggregate layout only
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_mendeley_wave2_batch2_stage2.py \
            --output benchmark-results/mendeley-wave2-batch2-stage2.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only workbook profile
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/mendeley-wave2-batch2-stage2.json'))
          assert x['status']=='retrieved-workbook-layouts-needing-semantic-review'
          assert x['summary']['sourcesRetrieved']==2
          assert x['summary']['filesRetrieved']==5
          assert x['summary']['fullyProfiledAccepted']==0
          assert x['summary']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['summary']['rawPublisherFilesCommitted'] is False
          assert x['summary']['rawRowsOrNumericValuesEmitted'] is False
          for s in x['sources']:
              assert s['status']=='retrieved-profile-needs-semantic-review'
              assert s['countsAsFullyProfiledMeasuredDataset'] is False
              assert s['acceptedMeasuredTimeSeriesSamples']==0
              for f in s['files']:
                  assert f['publisherSha256Matched'] is True
                  assert f['rawPublisherFileCommitted'] is False
                  assert f['rawRowsOrNumericValuesEmitted'] is False
                  assert len(f['workbook']) >= 1
          print(json.dumps(x['summary'], indent=2))
          PY
      - name: Upload aggregate workbook layouts only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-mendeley-wave2-batch2-stage2
          path: benchmark-results/mendeley-wave2-batch2-stage2.json
          if-no-files-found: error
          retention-days: 30
