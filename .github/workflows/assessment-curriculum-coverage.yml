name: Assessment and Curriculum Coverage Audit

on:
  push:
    branches: [main]
    paths:
      - 'MouldMaster_Core_App.html'
      - 'assessment-*.js'
      - 'lesson-*.js'
      - 'curriculum-*.js'
      - 'specialist-*.js'
      - 'qa_assessment_curriculum_coverage.py'
      - 'qa_assessment_curriculum_ratchet.py'
      - 'qa_assessment_outcome_review.py'
      - 'qa_curriculum_semantic_review.py'
      - 'qa/assessment-curriculum-coverage-floor.json'
      - 'qa/assessment-outcome-review.json'
      - 'qa/curriculum-semantic-review.json'
      - '.github/workflows/assessment-curriculum-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MouldMaster_Core_App.html'
      - 'assessment-*.js'
      - 'lesson-*.js'
      - 'curriculum-*.js'
      - 'specialist-*.js'
      - 'qa_assessment_curriculum_coverage.py'
      - 'qa_assessment_curriculum_ratchet.py'
      - 'qa_assessment_outcome_review.py'
      - 'qa_curriculum_semantic_review.py'
      - 'qa/assessment-curriculum-coverage-floor.json'
      - 'qa/assessment-outcome-review.json'
      - 'qa/curriculum-semantic-review.json'
      - '.github/workflows/assessment-curriculum-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-curriculum-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Quantify assessment breadth and curriculum semantic coverage
        run: python qa_assessment_curriculum_coverage.py
      - name: Exercise assessment outcome-review fail-closed contract
        run: python qa_assessment_outcome_review.py --self-test
      - name: Validate assessment outcome-review contract
        run: python qa_assessment_outcome_review.py
      - name: Exercise curriculum semantic-review fail-closed contract
        run: python qa_curriculum_semantic_review.py --self-test
      - name: Validate curriculum semantic-review contract
        run: python qa_curriculum_semantic_review.py
      - name: Exercise fail-closed ratchet contract
        run: python qa_assessment_curriculum_ratchet.py --self-test
      - name: Prepare base coverage floor for monotonic comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e "origin/$BASE_REF:qa/assessment-curriculum-coverage-floor.json" 2>/dev/null; then
            git show "origin/$BASE_REF:qa/assessment-curriculum-coverage-floor.json" > /tmp/assessment-curriculum-base-floor.json
          fi
      - name: Enforce quantified coverage debt ratchet
        run: |
          if [ -f /tmp/assessment-curriculum-base-floor.json ]; then
            python qa_assessment_curriculum_ratchet.py --base-floor /tmp/assessment-curriculum-base-floor.json
          else
            python qa_assessment_curriculum_ratchet.py
          fi
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assessment-curriculum-coverage
          path: |
            assessment-curriculum-coverage-report.json
            assessment-outcome-review-report.json
            curriculum-semantic-review-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve human-review boundary
        run: |
          echo 'Coverage audit is automated evidence only.'
          echo 'Pending or proposed assessment outcome mappings never count toward breadth.'
          echo 'Generated curriculum specificity signals and omitted semantic review records never count as SME approval.'
          echo 'Assessment outcome mapping and curriculum SME semantic approval remain human HOLD states until explicitly reviewed.'