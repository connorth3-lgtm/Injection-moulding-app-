name: MouldMaster Public Measured Benchmark — Sustainability 8102 supplement

on:
  push:
    branches: [main, data/real-dataset-profiling-wave1]
    paths:
      - 'tools/run_public_benchmark_su13148102.py'
      - 'qa_public_benchmark_su13148102.py'
      - 'data/public-benchmark-contracts/su13148102-supplement-v1.json'
      - '.github/workflows/public-benchmark-su13148102.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/run_public_benchmark_su13148102.py'
      - 'qa_public_benchmark_su13148102.py'
      - 'data/public-benchmark-contracts/su13148102-supplement-v1.json'
      - '.github/workflows/public-benchmark-su13148102.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-public-benchmark-su13148102-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==3.0.6 openpyxl==3.1.5
      - run: python qa_public_benchmark_su13148102.py

  public-measured-benchmark:
    if: github.event_name != 'pull_request'
    needs: runner-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==3.0.6 openpyxl==3.1.5
      - name: Retrieve and profile publisher supplement
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_su13148102.py \
            --output benchmark-results/su13148102-supplement-profile.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/su13148102-supplement-profile.json'))
          assert len(x['source']['sha256']) == 64
          assert x['profile']['rawRowsOrCellValuesEmitted'] is False
          assert x['retrieval']['rawSupplementCommitted'] is False
          assert x['retrieval']['rawRowsUploadedAsArtifact'] is False
          print(x['status'], x['profile']['rows'], x['profile']['columns'], x['profile']['materialGrouping'])
          PY
      - name: Upload aggregate supplement evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouldmaster-public-measured-benchmark-su13148102
          path: benchmark-results/su13148102-supplement-profile.json
          if-no-files-found: error
          retention-days: 30