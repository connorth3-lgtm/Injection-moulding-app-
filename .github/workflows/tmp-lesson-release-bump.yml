name: One-shot lesson release bump

on:
  push:
    branches:
      - fix/restore-listen-compact-lesson
    paths:
      - .github/workflows/tmp-lesson-release-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-listen-compact-lesson
      - name: Advance exact learner runtime to .20
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('2026.09.06.19', '2026.09.06.20'),
              ],
              'pwa-shell.js': [
                  ('2026.09.06.19', '2026.09.06.20'),
              ],
              'service-worker.js': [
                  ('2026.09.06.19', '2026.09.06.20'),
              ],
              'version.json': [
                  ('"web_release": "2026.09.06.19"', '"web_release": "2026.09.06.20"'),
                  ('"read_aloud_version": "2026.09.01.1"', '"read_aloud_version": "2026.09.07.1"'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'{name}: expected release marker not found: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(grep -c '2026.09.06.20' index.html)" -eq 2
          grep -q "const RELEASE='2026.09.06.20'" pwa-shell.js
          grep -q "const CACHE_VERSION='2026.09.06.20'" service-worker.js
          grep -q '"web_release": "2026.09.06.20"' version.json
          grep -q '"read_aloud_version": "2026.09.07.1"' version.json
          ! grep -q '2026.09.06.19' index.html pwa-shell.js service-worker.js version.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html pwa-shell.js service-worker.js version.json
          git commit -m 'Advance lesson and Listen runtime to .20'
          git push origin HEAD:fix/restore-listen-compact-lesson
