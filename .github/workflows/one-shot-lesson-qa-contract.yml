name: One-shot lesson QA contract aligner

on:
  push:
    branches:
      - fix/tighter-mobile-lesson-flow
    paths:
      - .github/workflows/one-shot-lesson-qa-contract.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tighter-mobile-lesson-flow
      - name: Align lesson hardening contract with collapsed UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('qa_runtime_hardening.py')
          text=path.read_text(encoding='utf-8')
          old='must(lesson_v2, ["D.lessons.length!==120", "duplicate lesson records", "Mechanism → evidence → decision", "Teach-back", "R.after(\'renderLesson\'", "R.registerModule(\'lesson-deep-authoring-v2\'"], "lesson deep authoring v2")'
          new='must(lesson_v2, ["D.lessons.length!==120", "duplicate lesson records", "Key takeaway", "More detail", "Mechanism", "Evidence chain", "Plant decision", "Misconception check", "Teach-back", "R.after(\'renderLesson\'", "R.registerModule(\'lesson-deep-authoring-v2\'"], "lesson deep authoring v2")\nrequire("secondaryLabel=safety?\'Watch out\':\'Apply\'" in lesson_v2, "lesson deep authoring v2: default secondary signal must remain safety-sensitive")'
          if old not in text:
              raise SystemExit('expected stale lesson hardening assertion not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 qa_runtime_hardening.py
      - name: Commit aligned contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa_runtime_hardening.py
          git diff --cached --check
          git commit -m 'Align lesson hardening with compact disclosure'
          git push origin HEAD:fix/tighter-mobile-lesson-flow
