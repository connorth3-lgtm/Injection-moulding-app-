name: Temporary Assessment Decision Manifest Build

on:
  push:
    branches:
      - feature/assessment-decision-manifest-v1

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'Generate canonical assessment decision manifest artifact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/assessment-decision-manifest-v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate deterministic manifest
        run: |
          python tools/generate_assessment_decision_manifest.py
          python tools/generate_assessment_decision_manifest.py --check
      - name: Commit generated artifact if changed
        run: |
          if [ -z "$(git status --porcelain -- data/assessment-decision-manifest-v1.json)" ]; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/assessment-decision-manifest-v1.json
          git commit -m 'Generate canonical assessment decision manifest artifact'
          git push origin HEAD:feature/assessment-decision-manifest-v1
