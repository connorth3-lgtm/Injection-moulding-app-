name: MouldMaster Android dedicated app

on:
  push:
    paths:
      - "android/**"
      - "qa_android_dedicated_app.py"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - "qa_android_dedicated_app.py"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - name: Run dedicated Android contract QA
        run: python3 qa_android_dedicated_app.py
      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouldmaster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
