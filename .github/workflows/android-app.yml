name: MouldMaster Android dedicated app

on:
  push:
    paths:
      - "android/**"
      - "qa_android_dedicated_app.py"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - "qa_android_dedicated_app.py"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: "8.7"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Run dedicated Android contract QA
        run: python3 qa_android_dedicated_app.py
      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouldmaster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
