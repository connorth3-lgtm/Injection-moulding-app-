name: Premium Visible Surfaces Stage

on:
  push:
    branches: [design/premium-polish-20260916]

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[premium-visible-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Add premium treatment to actual visible dashboard and lesson surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('premium-ui.css')
          s=p.read_text(encoding='utf-8')
          marker='/* Premium dynamic learner surfaces — governed migration layer. */'
          if marker in s:
              raise SystemExit(0)
          block=r'''

/* Premium dynamic learner surfaces — governed migration layer. */
body #dashboard .mm-today-focus{
  position:relative;
  overflow:hidden;
  padding:25px 26px;
  margin-bottom:18px;
  border:1px solid rgba(95,224,198,.28);
  border-radius:20px;
  background:linear-gradient(120deg,rgba(18,52,64,.98),rgba(13,32,50,.99) 58%,rgba(14,28,46,.99));
  box-shadow:0 18px 44px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.04);
}
body #dashboard .mm-today-focus::after{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  right:-110px;
  top:-150px;
  pointer-events:none;
  border-radius:50%;
  background:radial-gradient(circle,rgba(95,224,198,.15),rgba(122,181,255,.055) 44%,transparent 70%);
}
body #dashboard .mm-today-focus>div,
body #dashboard .mm-today-focus>button{position:relative;z-index:1}
body #dashboard .mm-today-focus h2{
  margin:5px 0 7px;
  font-size:clamp(25px,3vw,32px);
  line-height:1.1;
  letter-spacing:-.035em;
  color:var(--mm-text-strong);
}
body #dashboard .mm-today-focus p{color:#b5c6d6;line-height:1.58;max-width:760px}
body #dashboard .mm-today-meta{gap:8px;margin-top:12px}
body #dashboard .mm-today-meta .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
body #dashboard .mm-today-focus>button{min-width:154px;box-shadow:0 10px 26px rgba(0,0,0,.18)}

body #dashboard .mm-curriculum-focus,
body #dashboard .mm-specialist-strip{
  border:1px solid rgba(128,172,208,.18);
  border-radius:17px;
  background:linear-gradient(180deg,rgba(15,32,50,.98),rgba(10,24,39,.99));
  box-shadow:0 10px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.025);
}
body #dashboard .mm-curriculum-focus{padding:18px 20px;margin:0 0 14px}
body #dashboard .mm-curriculum-focus b{display:block;margin-top:4px;color:#f0f7fd;letter-spacing:-.012em}
body #dashboard .mm-curriculum-focus p{color:#9fb2c5;line-height:1.5}
body #dashboard .mm-specialist-strip{padding:18px 20px}

body #lesson .mm-learning-progress{
  padding:15px 17px;
  margin:-4px 0 18px;
  border:1px solid rgba(126,171,208,.22);
  border-radius:15px;
  background:linear-gradient(180deg,rgba(14,31,49,.99),rgba(10,24,39,.99));
  box-shadow:0 8px 22px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.02);
}
body #lesson .mm-learning-progress strong{letter-spacing:-.012em;color:#f2f8fd}
body #lesson .mm-learning-progress small{color:#98adc2}
body #lesson .mm-learning-jumps{gap:8px;margin-bottom:19px}
body #lesson .mm-learning-jumps button{
  min-height:40px;
  padding:8px 12px;
  border:1px solid rgba(128,174,211,.22);
  border-radius:999px;
  background:#10263b;
  color:#c9d9e8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  transition:background .16s var(--mm-ease),border-color .16s var(--mm-ease),color .16s var(--mm-ease),transform .16s var(--mm-ease);
}
body #lesson .mm-learning-jumps button:hover,
body #lesson .mm-learning-jumps button:focus-visible{
  border-color:rgba(95,224,198,.5);
  background:#17344b;
  color:#f5fffd;
  transform:translateY(-1px);
}
body #lesson .mm-next-card{
  margin-top:22px;
  padding:20px;
  border:1px solid rgba(95,224,198,.22);
  border-radius:17px;
  background:linear-gradient(125deg,rgba(16,47,58,.98),rgba(13,31,49,.99) 62%,rgba(15,28,46,.99));
  box-shadow:0 12px 32px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.03);
}
body #lesson .mm-next-card h3{letter-spacing:-.02em;color:#f4f9fd}
body #lesson .mm-next-card p{color:#aebfd0;line-height:1.56}
body #lesson .mm-note-status{color:#8fa5ba}

@media(max-width:760px){
  body #dashboard .mm-today-focus{padding:18px;border-radius:17px;gap:12px}
  body #dashboard .mm-today-focus h2{font-size:24px}
  body #dashboard .mm-today-focus>button{width:100%;min-width:0}
  body #dashboard .mm-curriculum-focus{align-items:flex-start;padding:15px;gap:12px}
  body #lesson .mm-learning-progress{padding:13px 14px;border-radius:13px}
  body #lesson .mm-next-card{padding:16px;border-radius:14px}
}

@media(prefers-reduced-motion:reduce){
  body #lesson .mm-learning-jumps button:hover,
  body #lesson .mm-learning-jumps button:focus-visible{transform:none}
}
'''
          p.write_text(s+block,encoding='utf-8')
          PY
      - name: Verify presentation governance remains bounded
        run: python qa_premium_ui.py
      - name: Commit visible-surface polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-ui.css
          git diff --cached --quiet && exit 0
          git commit -m '[premium-visible-generated] Polish actual dashboard and lesson surfaces'
          git push
