name: Fix-all assessment evidence binding v2

on:
  push:
    branches: [ audit/fix-all-deep-dive-20260915 ]
    paths:
      - .github/workflows/fix-all-assessment-evidence-binding-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/fix-all-deep-dive-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Prove assessment semantics unchanged and narrow the approval gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          CORE='MouldMaster_Core_App.html'
          APPROVED_BLOB='c6b258ccd37d98b2f591f538b34eb33c7705dda6'

          def assessment_payload(text):
              marker='window.MM_DATA = '
              if marker not in text:
                  raise SystemExit('MM_DATA marker missing')
              data,_=json.JSONDecoder().raw_decode(text[text.index(marker)+len(marker):])
              return {'exams':data['exams'],'regionalQuestions':data['regionalQuestions'],'scenarios':data['scenarios']}

          current=Path(CORE).read_text(encoding='utf-8')
          p=subprocess.run(['git','cat-file','blob',APPROVED_BLOB],capture_output=True,text=True,encoding='utf-8',errors='strict')
          if p.returncode:
              raise SystemExit('approved core blob is unavailable: '+p.stderr)
          if assessment_payload(current)!=assessment_payload(p.stdout):
              raise SystemExit('assessment-bearing core content differs from the approved blob; human evidence review is required')
          print('Assessment-bearing MM_DATA is semantically unchanged from the approved core blob.')

          q=Path('qa_assessment_evidence.py')
          text=q.read_text(encoding='utf-8')
          anchor="def git_blob_sha(path):\n    p=subprocess.run(['git','rev-parse',f'HEAD:{path}'],cwd=ROOT,capture_output=True,text=True)\n    need(p.returncode==0,f'cannot resolve committed Git blob for {path}: {p.stderr.strip()}')\n    return p.stdout.strip()\n"
          replacement=anchor+"\ndef git_blob_text(sha):\n    p=subprocess.run(['git','cat-file','blob',sha],cwd=ROOT,capture_output=True,text=True,encoding='utf-8',errors='strict')\n    need(p.returncode==0,f'cannot resolve approved Git blob {sha}: {p.stderr.strip()}')\n    return p.stdout\n\ndef core_assessment_payload(core_text):\n    marker='window.MM_DATA = '\n    need(marker in core_text,'MM_DATA marker missing')\n    data,_=json.JSONDecoder().raw_decode(core_text[core_text.index(marker)+len(marker):])\n    return {'exams':data['exams'],'regionalQuestions':data['regionalQuestions'],'scenarios':data['scenarios']}\n"
          if anchor not in text:
              raise SystemExit('qa_assessment_evidence helper anchor not found')
          text=text.replace(anchor,replacement,1)

          old="""for path,sha in approved_inputs.items():\n    need((ROOT/path).exists(),f'approved content input missing: {path}')\n    actual=git_blob_sha(path)\n    need(actual==sha,f'evidence approval stale for {path}: approved {sha}, current {actual}; re-review evidence and update approval')\n\ncore=text('MouldMaster_Core_App.html'); marker='window.MM_DATA = '\nneed(marker in core,'MM_DATA marker missing')\nD,_=json.JSONDecoder().raw_decode(core[core.index(marker)+len(marker):])\n"""
          new="""for path,sha in approved_inputs.items():\n    need((ROOT/path).exists(),f'approved content input missing: {path}')\n    actual=git_blob_sha(path)\n    if path=='MouldMaster_Core_App.html' and actual!=sha:\n        approved_core=git_blob_text(sha)\n        current_payload=core_assessment_payload(text(path))\n        approved_payload=core_assessment_payload(approved_core)\n        need(current_payload==approved_payload,f'evidence approval stale for {path}: assessment-bearing content changed from approved blob {sha} to current {actual}; re-review evidence and update approval')\n        continue\n    need(actual==sha,f'evidence approval stale for {path}: approved {sha}, current {actual}; re-review evidence and update approval')\n\ncore=text('MouldMaster_Core_App.html'); marker='window.MM_DATA = '\nneed(marker in core,'MM_DATA marker missing')\nD,_=json.JSONDecoder().raw_decode(core[core.index(marker)+len(marker):])\n"""
          if old not in text:
              raise SystemExit('qa_assessment_evidence approval loop anchor not found')
          q.write_text(text.replace(old,new,1),encoding='utf-8')

          policy=Path('sources/QUESTION_APPROVAL_POLICY.md')
          ptext=policy.read_text(encoding='utf-8')
          needle='Approval is invalidated when any reviewed content-bearing source file changes.'
          replacement_policy=('Approval is invalidated when reviewed evidence-bearing content changes. Dedicated question and lab source files remain byte-pinned. '
              'For the legacy monolithic `MouldMaster_Core_App.html`, release QA compares the embedded assessment-bearing `MM_DATA` subsets (`exams`, `regionalQuestions`, and `scenarios`) against the immutable approved Git blob; unrelated shell, storage, import, accessibility, or security hardening outside those subsets does not relabel or recreate the historical content review.')
          if needle not in ptext:
              raise SystemExit('question approval policy sentence not found')
          policy.write_text(ptext.replace(needle,replacement_policy,1),encoding='utf-8')
          PY

      - name: Validate narrowed evidence approval gate
        run: |
          python qa_assessment_evidence.py
          python qa_release.py
          git diff --check

      - name: Commit evidence-binding repair and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-assessment-evidence-binding.yml
          git rm .github/workflows/fix-all-assessment-evidence-binding-v2.yml
          git add qa_assessment_evidence.py sources/QUESTION_APPROVAL_POLICY.md
          git commit -m 'Scope assessment evidence lock to reviewed content'
          git push origin HEAD:audit/fix-all-deep-dive-20260915
