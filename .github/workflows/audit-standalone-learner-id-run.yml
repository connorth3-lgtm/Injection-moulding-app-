name: One-shot Standalone Learner ID Runner

on:
  push:
    branches:
      - 'audit/standalone-learner-id-hardening'

permissions:
  contents: write

concurrency:
  group: audit-standalone-learner-id-runner
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'connorth3-lgtm/Injection-moulding-app-' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/standalone-learner-id-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply deterministic standalone hardening
        run: |
          python tools/apply_standalone_learner_id_temp.py
          python tools/bump_web_release.py --release 2026.09.12.4 --published 2026-09-12
          python tools/sync_web_release.py --check
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          current=hashlib.sha256(Path('MouldMaster_Core_App.html').read_bytes()).hexdigest()
          replacements=[
            (
              'CORE_SHA256 = "96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754"',
              'WINDOWS_RECOVERY_CORE_SHA256 = "96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754"\nCURRENT_CORE_SHA256 = "'+current+'"',
            ),
            (
              'assert latest["sha256"] == CORE_SHA256, "Windows recovery feed must use audited core SHA-256"',
              'assert latest["sha256"] == WINDOWS_RECOVERY_CORE_SHA256, "Windows recovery feed must use audited recovery SHA-256"',
            ),
            (
              'assert sha256("MouldMaster_Core_App.html") == latest["sha256"], "Windows recovery content hash mismatch"',
              'assert re.fullmatch(r"https://raw\\.githubusercontent\\.com/connorth3-lgtm/Injection-moulding-app-/[0-9a-f]{40}/MouldMaster_Core_App\\.html", latest["app_url"]), "Windows recovery feed must pin immutable standalone source bytes"',
            ),
            (
              'assert sha256("MouldMaster_Core_App.html") == CORE_SHA256, "audited core bytes changed"',
              'assert sha256("MouldMaster_Core_App.html") == CURRENT_CORE_SHA256, "current standalone core bytes changed without updating the audited current-core hash"',
            ),
          ]
          for old,new in replacements:
              if text.count(old)!=1:
                  raise SystemExit(f'qa_release standalone/recovery split expected one match, found {text.count(old)}: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          print(f'Locked hardened current standalone core SHA-256: {current}')
          PY
      - name: Validate standalone and governed web release
        env:
          BASE_SHA: 58b94233f5e382a06a344660eda85fab8d4ded64
        run: |
          set -euo pipefail
          node --check qa_standalone_learner_ids.cjs
          node qa_standalone_learner_ids.cjs
          python qa_release.py
          python qa_release_docs.py
          python qa_app_wide_audit.py
          python qa_webkit_regression.py
          python tools/build_pages_artifact.py
          python tools/verify_release_external_validation.py
          git diff --exit-code "$BASE_SHA" -- latest.json
          python - <<'PY'
          import hashlib,json,re,urllib.request
          manifest=json.load(open('latest.json',encoding='utf-8'))
          url=manifest['app_url']
          assert re.fullmatch(r'https://raw\.githubusercontent\.com/connorth3-lgtm/Injection-moulding-app-/[0-9a-f]{40}/MouldMaster_Core_App\.html',url),url
          req=urllib.request.Request(url,headers={'User-Agent':'MouldMaster-recovery-integrity-check'})
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=response.read()
          actual=hashlib.sha256(payload).hexdigest()
          assert actual==manifest['sha256'],f'frozen recovery payload hash mismatch: {actual}'
          print(f"Frozen recovery feed unchanged and hash-valid: {manifest['version']} @ {url.split('/')[-2][:12]}")
          PY
          git diff --check
      - name: Commit only validated generated changes
        run: |
          set -euo pipefail
          rm -rf tools/__pycache__
          git add -A
          git restore --staged .github/workflows/audit-standalone-learner-id-run.yml tools/apply_standalone_learner_id_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden standalone learner identifiers'
          git push origin HEAD:audit/standalone-learner-id-hardening
