name: Full MouldMaster Book — Natural Voice MP3 (non-publishing)

on:
  push:
    branches:
      - 'audiobook/natural-voice-20261019'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout original governed Book content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install MP3 encoder and offline neural TTS engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check 'piper-tts==1.3.0'
      - name: Download British English high-quality neural voice locally
        run: |
          mkdir -p "${RUNNER_TEMP}/mouldmaster-piper-voices"
          python3 -m piper.download_voices --data-dir "${RUNNER_TEMP}/mouldmaster-piper-voices" en_GB-cori-high
      - name: Narrate and verify source-bound chapters
        env:
          MM_AUDIO_ENGINE: piper
          MM_AUDIO_SHARD: ${{ matrix.shard }}
          MM_PIPER_VOICE: en_GB-cori-high
          MM_PIPER_DATA: ${{ runner.temp }}/mouldmaster-piper-voices
        run: |
          python3 tools/build_book_audio_bundle.py qa-artifacts/natural-book-chapters
          python3 - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('qa-artifacts/natural-book-chapters')
          index=json.loads((root/'AUDIOBOOK_MANIFEST.json').read_text())
          tracks=list(root.glob('*.mp3'))
          assert len(tracks)==len(index['chapters'])==4, 'Shard must contain four complete, verifiable audio tracks'
          assert len(set(x['readerId'] for x in index['chapters']))==4
          assert all(x['sizeBytes']>250000 and x['minutes']>3 for x in index['chapters'])
          print('Shard voice verified:', [(x['number'],x['title'],x['minutes']) for x in index['chapters']])
          PY
      - name: Retain four phone-playable chapters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MouldMaster_Natural_Book_Shard_${{ matrix.shard }}
          path: |
            qa-artifacts/natural-book-chapters/*.mp3
            qa-artifacts/natural-book-chapters/*.txt
            qa-artifacts/natural-book-chapters/AUDIOBOOK_MANIFEST.json
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
