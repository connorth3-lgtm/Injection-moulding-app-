name: External Evidence Execution QA

on:
  push:
    branches: [main]
    paths:
      - 'data/cross-process-upper-author-response-template-v1.json'
      - 'data/impure-pascoe-author-response-template-v1.json'
      - 'data/real-pilot-public-candidate-review-2026-09-05.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'data/warwick-origin-viewer-extraction-contract-v1.json'
      - 'tools/validate_cross_process_upper_clarification.py'
      - 'tools/validate_impure_pascoe_clarification.py'
      - 'tools/evaluate_public_pilot_candidate.py'
      - 'tools/export_warwick_origin.py'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_external_evidence_execution.py'
      - 'qa_warwick_origin_viewer_contract.py'
      - '.github/workflows/external-evidence-execution.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/cross-process-upper-author-response-template-v1.json'
      - 'data/impure-pascoe-author-response-template-v1.json'
      - 'data/real-pilot-public-candidate-review-2026-09-05.json'
      - 'data/warwick-origin-export-manifest-template-v1.json'
      - 'data/warwick-origin-viewer-extraction-contract-v1.json'
      - 'tools/validate_cross_process_upper_clarification.py'
      - 'tools/validate_impure_pascoe_clarification.py'
      - 'tools/evaluate_public_pilot_candidate.py'
      - 'tools/export_warwick_origin.py'
      - 'tools/validate_warwick_origin_export.py'
      - 'qa_external_evidence_execution.py'
      - 'qa_warwick_origin_viewer_contract.py'
      - '.github/workflows/external-evidence-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-evidence-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            tools/validate_cross_process_upper_clarification.py \
            tools/validate_impure_pascoe_clarification.py \
            tools/evaluate_public_pilot_candidate.py \
            tools/export_warwick_origin.py \
            qa_external_evidence_execution.py \
            qa_warwick_origin_viewer_contract.py
      - name: External evidence execution contracts
        run: |
          python qa_external_evidence_execution.py
          python qa_warwick_origin_viewer_contract.py
      - name: Pending source responses remain non-promoting
        run: |
          python tools/validate_cross_process_upper_clarification.py
          python tools/validate_impure_pascoe_clarification.py
          python tools/evaluate_public_pilot_candidate.py
          python tools/validate_warwick_origin_export.py --manifest data/warwick-origin-export-manifest-template-v1.json
