name: Audit Inline Handler Debt

on:
  push:
    branches:
      - refactor/csp-handler-attrs-v1
    paths:
      - tools/audit_inline_handlers.py
      - .github/workflows/audit-inline-handlers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inventory inline handlers
        run: python tools/audit_inline_handlers.py
