name: Authoritative and Research Source Freshness

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'qa_source_freshness.py'
      - 'qa_research_source_freshness.py'
      - '.github/workflows/source-freshness.yml'

permissions:
  contents: read

jobs:
  source-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check authoritative source review dates and live markers
        run: python qa_source_freshness.py --network
      - name: Check research DOI resolver freshness
        if: always()
        run: python qa_research_source_freshness.py --network
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mouldmaster-source-freshness-reports
          path: |
            source-freshness-report.json
            research-source-freshness-report.json
          if-no-files-found: warn
