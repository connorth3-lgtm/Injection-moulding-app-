name: Synchronise UI Polish Release Assets

on:
  push:
    branches:
      - fix/ux-polish-20260916-2

permissions:
  contents: write

concurrency:
  group: ui-polish-sync-once
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add UI polish to atomic offline release and bump cache revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('service-worker.js')
          text=path.read_text(encoding='utf-8')
          old="const CACHE_REVISION='premium-ui-r1-20260916';"
          new="const CACHE_REVISION='learner-ui-r2-20260917';"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('unexpected service-worker cache revision')
          anchor="  './src/domains/shell/product-areas.js',\n"
          additions="  './src/domains/shell/learner-ui-polish.js',\n  './src/domains/shell/learner-ui-polish.css',\n"
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('service-worker shell asset anchor missing')
              text=text.replace(anchor,anchor+additions,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Regenerate runtime manifest and synchronise web cache identity
        run: |
          python3 tools/generate_runtime_manifest.py
          python3 tools/sync_web_release.py
          python3 tools/generate_runtime_manifest.py --check
          python3 tools/sync_web_release.py --check
          python3 qa_web_release_identity.py

      - name: Commit synchronized release assets and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-polish-sync-once.yml
          git add service-worker.js index.html runtime-domain-manifest.json pwa-shell.js qa_release.py qa_release_docs.py README.md support.html
          git diff --cached --check
          git commit -m "Synchronise learner UI polish release assets"
          git push origin HEAD:fix/ux-polish-20260916-2
