name: Refresh Electron 44 Lock

on:
  push:
    branches:
      - upgrade/electron-44-1-1
    paths:
      - desktop/electron/package.json
      - .github/workflows/refresh-electron-44-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/electron-44-1-1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Regenerate exact desktop lock
        working-directory: desktop/electron
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Prove Electron 44 lock
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --fund=false
          node -e "const p=require('./node_modules/electron/package.json'); if(p.version!=='44.1.1') throw new Error('electron lock drift: '+p.version); console.log('Electron '+p.version+' lock verified')"
          node -e "const p=require('./node_modules/electron-builder/package.json'); if(p.version!=='26.15.7') throw new Error('electron-builder drift: '+p.version)"
      - name: Commit generated lock only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Lock Electron 44.1.1 desktop runtime"
          git push origin HEAD:upgrade/electron-44-1-1
