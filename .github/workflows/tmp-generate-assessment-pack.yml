name: Temporary assessment runtime pack generator

on:
  push:
    branches:
      - pack-assessment-foundation-runtime-2026-09-15

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pack-assessment-foundation-runtime-2026-09-15
      - name: Generate exact runtime packs
        run: |
          python tools/build_runtime_packs.py
          git add src/domains/runtime-packs/assessment-foundation-runtime-pack.js
          if git diff --cached --quiet; then
            echo "Assessment runtime pack is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate assessment foundation runtime pack"
          git push origin HEAD:pack-assessment-foundation-runtime-2026-09-15
