name: Question Quality 50-Pass

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'MouldMaster_Core_App.html'
      - 'training-upgrade.js'
      - 'assessment-deep-dive.js'
      - 'assessment-answer-cue-fix.js'
      - 'assessment-quality-suite.js'
      - 'assessment-stable-review-bridge.js'
      - 'assessment-ux.js'
      - 'diagnostic-learning-labs.js'
      - 'material-behaviour-labs.js'
      - 'evidence-maturity-deep-dive.js'
      - 'evidence-maturity-formal-bridge.js'
      - 'assessment-psychometric-hardening.js'
      - 'assessment-psychometric-approval.js'
      - 'assessment-evidence-integrity-upgrade.js'
      - 'real-measured-data-assessment.js'
      - 'runtime-v2.js'
      - 'app-shell-finalize.js'
      - 'learning-analytics.js'
      - 'assessment-evidence-approval.js'
      - 'accessibility-hardening.js'
      - 'src/domains/process/evidence-granularity.js'
      - 'desktop/electron/package.json'
      - 'desktop/electron/scripts/generate-integrity.cjs'
      - 'desktop/electron/scripts/qa.cjs'
      - 'qa_audit_consolidation.py'
      - 'qa_assessment_ux.py'
      - 'qa_question_quality_50_pass.py'
      - 'qa_question_quality_50_pass_runtime.py'
      - 'qa_question_quality_50_pass_immutable.py'
      - 'qa_question_quality_extreme_50_pass.py'
      - 'qa_question_quality_extreme_runtime.py'
      - 'qa_question_quality_extreme_runtime_v2.py'
      - 'qa_assessment_evidence_integrity.py'
      - '.github/workflows/question-quality-50-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-quality-50-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  question-quality-50-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Syntax-check evidence integrity assets
        run: |
          node --check assessment-psychometric-hardening.js
          node --check assessment-psychometric-approval.js
          node --check assessment-evidence-integrity-upgrade.js
          node --check real-measured-data-assessment.js
          python -m py_compile qa_assessment_evidence_integrity.py qa_audit_consolidation.py qa_question_quality_50_pass_immutable.py
      - name: Run whole-app audit consolidation guard
        run: python qa_audit_consolidation.py
      - name: Run assessment UX regression checks
        run: python qa_assessment_ux.py
      - name: Run 50-pass quality audit across formal and optional learner-visible questions
        run: python qa_question_quality_50_pass_immutable.py
      - name: Run extreme 50-pass psychometric and evidence audit
        run: python qa_question_quality_extreme_runtime_v2.py
      - name: Run proposition/source relevance and real measured-data contract audit
        run: python qa_assessment_evidence_integrity.py
      - name: Upload question quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouldmaster-question-quality-50-pass
          path: |
            question-quality-50-pass-report.json
            question-quality-extreme-50-pass-report.json
            assessment-evidence-integrity-report.json
            audit-consolidation-report.json
          if-no-files-found: warn
          retention-days: 30
