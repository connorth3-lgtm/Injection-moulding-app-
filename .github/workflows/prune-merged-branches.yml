name: Prune Fully Merged Branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches with no commits ahead of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          kept=0
          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            ahead=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq '.ahead_by')
            if [[ "$ahead" == "0" ]]; then
              echo "Deleting fully merged branch: $branch"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              deleted=$((deleted+1))
            else
              echo "Keeping branch with $ahead unique commit(s): $branch"
              kept=$((kept+1))
            fi
          done < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv')
          echo "Deleted $deleted fully merged branch(es); kept $kept branch(es) with unique commits." >> "$GITHUB_STEP_SUMMARY"
