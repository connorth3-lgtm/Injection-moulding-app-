name: Prune Fully Merged Branches

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Main PR Provenance Guard"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-fully-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GH_REPO%%/*}"
          deleted=0
          kept=0

          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue

            ahead=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq '.ahead_by')
            reason=""

            if [[ "$ahead" == "0" ]]; then
              reason="no commits ahead of main"
            else
              merged_same_head=$(gh api --method GET "repos/$GH_REPO/pulls" \
                -f state=closed \
                -f base=main \
                -f head="$owner:$branch" \
                -f per_page=100 \
                --jq "[.[] | select(.merged_at != null and .head.sha == \"$sha\")] | length")
              if [[ "$merged_same_head" != "0" ]]; then
                reason="current head exactly matches a merged PR into main"
              fi
            fi

            if [[ -n "$reason" ]]; then
              echo "Deleting merged branch: $branch ($reason)"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              deleted=$((deleted+1))
            else
              echo "Keeping branch with $ahead unique commit(s) and no merged PR at its current head: $branch"
              kept=$((kept+1))
            fi
          done < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv')

          echo "Deleted $deleted proven merged branch(es); kept $kept branch(es) whose current head is not proven safe to remove." >> "$GITHUB_STEP_SUMMARY"
