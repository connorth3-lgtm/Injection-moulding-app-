name: Prune Fully Merged Branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and explicitly superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GH_REPO%%/*}"
          deleted=0
          kept=0

          # Historical branches deliberately closed/superseded after their work was
          # replaced by later validated changes. Exact head-SHA matching prevents
          # deletion if any of these branch names are ever updated or reused.
          declare -A superseded=(
            ["codex/source-freshness-coherence-20260826"]="7dd8b9e605b5366fd1887cdf58328fb8ee9035d7"
            ["feature/lesson-evidence-expansion"]="f19aca01d427e5f9dbb5640a7867f2e74aabe29b"
            ["feature/question-two-source-evidence"]="72d048f1c48852254248c95b11860174b1996bb8"
            ["qa/reference-question-500-pass-20260824"]="394652c4d519936dea68ea27ae3cb15d6f266439"
          )

          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue

            ahead=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq '.ahead_by')
            reason=""

            if [[ "$ahead" == "0" ]]; then
              reason="no commits ahead of main"
            elif [[ -n "${superseded[$branch]:-}" && "${superseded[$branch]}" == "$sha" ]]; then
              reason="exact head matches an explicitly superseded historical branch"
            else
              merged_same_head=$(gh api --method GET "repos/$GH_REPO/pulls" \
                -f state=closed \
                -f base=main \
                -f head="$owner:$branch" \
                -f per_page=100 \
                --jq "[.[] | select(.merged_at != null and .head.sha == \"$sha\")] | length")
              if [[ "$merged_same_head" != "0" ]]; then
                reason="current head exactly matches a merged PR into main"
              fi
            fi

            if [[ -n "$reason" ]]; then
              echo "Deleting branch: $branch ($reason)"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              deleted=$((deleted+1))
            else
              echo "Keeping branch with $ahead unique commit(s) and no merge/supersession proof at its current head: $branch"
              kept=$((kept+1))
            fi
          done < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv')

          echo "Deleted $deleted proven merged/superseded branch(es); kept $kept branch(es) whose current head is not proven safe to remove." >> "$GITHUB_STEP_SUMMARY"
