name: MouldMaster HDPE GNP measured benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile_mendeley_4h98rz9f92.py'
      - '.github/workflows/hdpe-gnp-mendeley-benchmark.yml'
      - 'data/public-benchmark-results/hdpe-gnp-v3.json'
      - 'data/profiled-measured-dataset-registry-v1.json'
      - 'data/content-scale-targets.json'
      - 'qa_content_scale_targets.py'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Profile exact Mendeley v3 files
        run: python tools/profile_mendeley_4h98rz9f92.py --output hdpe-gnp-v3.json
      - name: Enforce discovery boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('hdpe-gnp-v3.json',encoding='utf-8'))
          assert p['source']['doi']=='10.17632/4h98rz9f92.3'
          assert p['source']['license']=='CC BY 4.0'
          assert p['source']['peerReviewedCompanion']=='10.1016/j.dib.2024.110987'
          assert p['files'] and all(f['sizeBytes']>0 and len(f['sha256'])==64 for f in p['files'])
          assert p['tableCount']>0
          assert p['largestTable']['rows']>0
          assert p['acceptedMeasuredRecords']==0
          assert p['acceptedMeasuredTimeSeriesSamples']==0
          assert p['rawSourceRowsCommitted'] is False
          print('HDPE/GNP exact-file discovery profile passed')
          print('largest table:',p['largestTable'])
          print('semantic markers:',p['semanticHeaderMarkers'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-hdpe-gnp-profile
          path: hdpe-gnp-v3.json
          retention-days: 90
