name: One-shot 2026.09.18.3 generated state
on:
  push:
    branches:
      - feature/release-2026-09-18-3-governed-readiness
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/release-2026-09-18-3-governed-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate governed derived state
        run: |
          node tools/generate_style_csp.cjs
          python tools/render_health_status.py
          python tools/generate_runtime_manifest.py --check
          python tools/sync_web_release.py --check
      - name: Commit generated state and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html HEALTH_STATUS.md
          git rm .github/workflows/one-shot-183-generated-state.yml
          git commit -m "Regenerate 2026.09.18.3 derived release state"
          git push
