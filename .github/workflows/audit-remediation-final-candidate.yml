name: Audit Remediation Final Candidate

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: read

concurrency:
  group: audit-remediation-final-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate final remediated runtime
        run: |
          python qa_release.py
          python qa_release_docs.py
          python qa_audit_remediation_20260915_6.py
          python tools/externalize_core_scripts.py --check
          python tools/generate_runtime_manifest.py --check
      - name: Build exact public candidate
        run: |
          python tools/build_pages_artifact.py
          python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint | tee candidate-fingerprint.txt
          test ! -e .pages-dist/MouldMaster_Core_App.html
          test -f .pages-dist/src/core-runtime/core-source.txt
          cmp -s MouldMaster_Core_App.html .pages-dist/src/core-runtime/core-source.txt
      - name: Stage candidate
        run: |
          rm -rf physical-pwa-candidate
          mkdir physical-pwa-candidate
          cp -a .pages-dist/. physical-pwa-candidate/
          source_fp="$(python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)"
          staged_fp="$(python tools/verify_pwa_physical_evidence.py --artifact physical-pwa-candidate --print-fingerprint)"
          test "$source_fp" = "$staged_fp"
      - name: Upload exact candidate
        uses: actions/upload-artifact@v7
        with:
          name: physical-pwa-candidate-${{ github.sha }}
          path: physical-pwa-candidate
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Publish candidate summary
        run: |
          {
            echo '### Audit remediation 2026.09.15.6 candidate'
            echo "Source SHA: ${{ github.sha }}"
            echo "Fingerprint: $(cat candidate-fingerprint.txt)"
            echo 'This is a retained validation candidate, not production authorization.'
          } >> "$GITHUB_STEP_SUMMARY"
