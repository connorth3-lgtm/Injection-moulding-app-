name: Main Branch Protection Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify live reviewed main protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/verify_production_source.py --protection-only
