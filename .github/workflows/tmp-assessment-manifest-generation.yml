name: Temporary Assessment Manifest Generation

on:
  push:
    branches:
      - fix/deep-postmerge-hardening-2026-10-04

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Generate canonical assessment decision manifest
        run: python tools/generate_assessment_decision_manifest.py --output /tmp/assessment-decision-manifest-v1.json
      - name: Upload generated manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assessment-decision-manifest-209
          path: /tmp/assessment-decision-manifest-v1.json
          if-no-files-found: error
