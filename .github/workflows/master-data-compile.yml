name: MouldMaster Master Data Compilation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/compile_master_data.py'
      - 'tools/harvest_openalex_injection_moulding.py'
      - 'tools/materialize_evidence_overlays.py'
      - 'qa_master_data_compile.py'
      - 'qa_content_scale_targets.py'
      - 'qa_sensor_machine_health.py'
      - 'data/content-scale-targets.json'
      - 'data/content-scale-targets-overlay-v2.json'
      - 'data/sensor-machine-health-registry-v1.json'
      - 'data/sensor-machine-health-registry-v2.json'
      - 'data/sensor-machine-health/**'
      - 'data/machine-health-supporting-evidence-v1.json'
      - 'data/sensor-machine-health-candidate-resolution-v2.json'
      - 'data/measured-dataset-inventory-v1.json'
      - 'data/profiled-measured-dataset-registry-v1.json'
      - 'data/public-benchmark-results/**'
      - 'data/primary-measured-evidence-registry-v1.json'
      - 'data/primary-measured-evidence/**'
      - 'data/deep-dive-v2-*.json'
      - '.github/workflows/master-data-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-master-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve accepted evidence overlays
        run: python tools/materialize_evidence_overlays.py
      - name: Validate resolved sensor and machine-health evidence
        run: python qa_sensor_machine_health.py
      - name: Validate reconciled content counts
        run: python qa_content_scale_targets.py
      - name: Compile repository data and validate core boundaries
        run: python qa_master_data_compile.py
      - name: Harvest 2,000 deduplicated research candidates
        run: |
          mkdir -p compiled-input
          python tools/harvest_openalex_injection_moulding.py \
            --output compiled-input/research-master-candidates.json \
            --target 2000 \
            --per-query-pages 5
      - name: Compile complete master data package
        run: |
          python tools/compile_master_data.py \
            --output-dir compiled-data \
            --research-candidates compiled-input/research-master-candidates.json
      - name: Validate complete compilation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          manifest=load('compiled-data/manifest.json')
          measured=load('compiled-data/measured-data.json')
          source_inventory=load('data/measured-dataset-inventory-v1.json')
          source_profiled=load('data/profiled-measured-dataset-registry-v1.json')
          source_primary=load('data/primary-measured-evidence-registry-v1.json')
          source_sensor=load('data/sensor-machine-health-registry-v1.json')
          source_targets=load('data/content-scale-targets.json')
          counts=manifest['counts']

          expected_inventory=len(source_inventory['datasets'])
          expected_automated=sum(1 for row in source_inventory['datasets'] if row.get('automatedIngestionAllowed') is True)
          expected_profiled=len(source_profiled['datasets'])
          expected_samples=source_profiled['summary']['acceptedMeasuredTimeSeriesSamples']
          expected_primary=source_primary['summary']['publisherVerifiedPeerReviewedPrimaryMeasured']
          expected_sensor=source_sensor['summary']['acceptedConcepts']
          expected_peer=source_targets['targets']['peer_reviewed_research_records']['currentAccepted']

          assert manifest['candidateRegistryEmbedded'] is True
          assert counts['measuredDatasetInventory']==expected_inventory
          assert counts['automatedIngestionAllowedDatasets']==expected_automated
          assert counts['fullyProfiledMeasuredDatasets']==expected_profiled
          assert counts['measuredTimeSeriesSamplesAccepted']==expected_samples
          assert counts['publisherVerifiedPrimaryMeasuredStudies']==expected_primary
          assert counts['verifiedPeerReviewedResearchRecords']==expected_peer
          assert counts['acceptedSensorMachineHealthConcepts']==expected_sensor==81
          assert counts['measuredEvidencePasses']==50
          assert counts['deepDiveEvidencePasses']==600
          assert counts['researchCandidates']==2000
          assert counts['heuristicPrimaryMeasuredCandidates']>=1000
          assert counts['syntheticProcessCases']==264
          assert counts['syntheticGeneratedCycles']==19008
          assert counts['approvedAssessmentItems']==157
          assert counts['coreLessons']==120
          assert counts['specialistLessons']==20
          assert counts['draftMaterialProfiles']==260
          assert counts['draftDefectMechanisms']==320
          assert counts['draftSensorMachineHealthConcepts']==220
          assert counts['draftAssessmentItems']==1200

          assert measured['datasetInventory']['summary']['datasets']==expected_inventory
          assert measured['profiledMeasuredDatasetRegistry']['summary']['fullyProfiledDatasetPackages']==expected_profiled
          assert measured['profiledMeasuredDatasetRegistry']['summary']['acceptedMeasuredTimeSeriesSamples']==expected_samples
          assert measured['sensorMachineHealthRegistry']['summary']['acceptedConcepts']==81
          assert len(measured['sensorMachineHealthRegistry']['concepts'])==81
          assert {x['datasetId'] for x in measured['profiledMeasuredDatasetRegistry']['datasets']} == {x['datasetId'] for x in source_profiled['datasets']}
          for profile in [
              'skz-loki-v1.json','iguzzini-road-lenses-v1.json','impure-pascoe-2022-v1.json',
              'forinfpro-himd-v1.json','cross-process-chain-v1.json','hdpe-gnp-v3.json'
          ]:
              assert profile in measured['publicBenchmarkResults']
          print(json.dumps(counts, indent=2, sort_keys=True))
          PY
      - name: Upload complete master data package
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-master-data
          path: compiled-data/
          if-no-files-found: error
          retention-days: 90
