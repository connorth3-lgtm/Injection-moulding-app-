name: Audit PWA Candidate Stage

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  candidate-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 2026.09.15.6 technical candidate
        uses: actions/checkout@v7
        with:
          ref: 55f316d1bb3135da0407ce158eb108dda7e9d9d1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and validate exact public candidate
        id: candidate
        shell: bash
        run: |
          python tools/build_pages_artifact.py
          fingerprint="$(python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)"
          test ! -e .pages-dist/MouldMaster_Core_App.html
          test -f .pages-dist/src/core-runtime/core-source.txt
          cmp -s MouldMaster_Core_App.html .pages-dist/src/core-runtime/core-source.txt
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Publish exact candidate fingerprint to remediation PR
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.candidate.outputs.fingerprint }}
        shell: bash
        run: |
          body="Exact 2026.09.15.6 technical candidate metadata: sourceSha=\`55f316d1bb3135da0407ce158eb108dda7e9d9d1\`; runtimeFingerprint=\`$FINGERPRINT\`. This is build metadata only; external device/human validation remains HOLD."
          gh api "repos/${GITHUB_REPOSITORY}/issues/364/comments" -f body="$body"
