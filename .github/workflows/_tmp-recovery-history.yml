name: Temporary recovery history trace

on:
  push:
    branches:
      - fix-residual-audit-integrity-2026-09-15-4

permissions:
  contents: read

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Hash historical recovery core revisions
        shell: bash
        run: |
          set -euo pipefail
          echo 'Historical MouldMaster_Core_App.html revisions:'
          git log --format='%H %cI %s' -- MouldMaster_Core_App.html | head -40
          echo 'Hashes:'
          while read -r sha _; do
            git show "${sha}:MouldMaster_Core_App.html" > /tmp/mm-core.html
            printf '%s  %s\n' "$(sha256sum /tmp/mm-core.html | awk '{print $1}')" "$sha"
          done < <(git log --format='%H %cI %s' -- MouldMaster_Core_App.html | head -40)
