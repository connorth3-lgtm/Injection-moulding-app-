name: Bind 2026.09.15.6 Validation Packets

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: write

concurrency:
  group: audit-remediation-bind-validation
  cancel-in-progress: false

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bind exact 2026.09.15.6 candidate without creating external evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          OLD='2026.09.15.5'
          NEW='2026.09.15.6'
          OLD_SHA='7fe353beb0f54b5b8f53851221738bb5c1a9bcfe'
          SHA='045a4d3091b8481bfc996524d3c3d18191f6f5c8'
          OLD_FP='sha256:b6fca9536f77247e1e778639a7b24228e4fe43ef413fa6e6d025e8a788006f2e'
          FP='sha256:2f3792657a843ce686fa89c6354795a3e9782336df298f6cec9f86384da312c2'
          RUN=35036409122
          ARTIFACT_ID=10422369905
          ARTIFACT_NAME=f'physical-pwa-candidate-{SHA}'
          DIGEST='sha256:256dc8179c41e2031aa941c0d3dacf811997069fea3f014e1f8dd778fd1fdd3f'
          EXPIRES='2026-10-15T23:36:27Z'

          def load(path):
              p=Path(path); return json.loads(p.read_text(encoding='utf-8'))
          def dump(path,obj):
              Path(path).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def copy_packet(src,dst):
              s=Path(src).read_text(encoding='utf-8')
              replacements={
                  OLD:NEW,
                  OLD_SHA:SHA,
                  OLD_FP:FP,
                  '34931583556':str(RUN),
                  '10381573337':str(ARTIFACT_ID),
                  f'physical-pwa-candidate-{OLD_SHA}':ARTIFACT_NAME,
                  'sha256:1d036a472946a2425daff02019e5f99893968bee91da5fb108a0b86c5a1a8448':DIGEST,
                  '2026-10-15T05:09:15Z':EXPIRES,
              }
              for old,new in replacements.items(): s=s.replace(old,new)
              Path(dst).write_text(s,encoding='utf-8')

          ledger=load('data/release-external-validation-v1.json')
          ledger['release']=NEW
          ledger['validationIndex']=f'qa/EXTERNAL_VALIDATION_{NEW}.md'
          a=ledger['accessibility']
          a['reviewPacket']=f'qa/ACCESSIBILITY_REAL_AT_{NEW}.md'
          a['candidate']={'release':NEW,'sourceSha':SHA,'runtimeFingerprint':FP}
          p=ledger['pwaPhysicalDevices']
          p['reviewPacket']=f'qa/PWA_PHYSICAL_DEVICE_{NEW}.md'
          p['currentCandidate']={
              'release':NEW,
              'sourceSha':SHA,
              'runtimeFingerprint':FP,
              'candidateRunId':RUN,
              'candidateWorkflow':'Audit Remediation Final Candidate; exact public candidate build, not production publication',
              'artifactId':ARTIFACT_ID,
              'artifactName':ARTIFACT_NAME,
              'artifactDigest':DIGEST,
              'artifactExpiresAt':EXPIRES,
          }
          w=ledger['windowsDistribution']
          w['readinessPacket']=f'certification/WINDOWS_SIGNING_READINESS_{NEW}.md'
          w['sourceSha']=SHA
          ledger['bookSme']['reviewPacket']=f'qa/BOOK_SME_REVIEW_{NEW}.md'
          ledger['curriculumSme']['reviewPacket']=f'qa/CURRICULUM_SME_REVIEW_{NEW}.md'
          ledger['learnerOutcomes']['pilotPacket']=f'qa/LEARNER_PILOT_{NEW}.md'
          # Preserve every external workstream as HOLD and every restricted claim as false.
          for key in ('accessibility','pwaPhysicalDevices','windowsDistribution','bookSme','curriculumSme','learnerOutcomes'):
              ledger[key]['status']='hold'
          for key in ('fullyExternallyValidated','accreditationAuthorized','learnerEfficacyEstablished','productionRecipeValidated','automaticMachineControlAuthorized'):
              ledger['claims'][key]=False
          dump('data/release-external-validation-v1.json',ledger)

          at=load('data/accessibility-real-at-validation-v1.json')
          at['release']=NEW; at['packet']=f'qa/ACCESSIBILITY_REAL_AT_{NEW}.md'; at['sourceSha']=SHA; at['runtimeFingerprint']=FP
          if at.get('status')=='validated': raise SystemExit('refusing to carry validated AT status onto a new runtime')
          dump('data/accessibility-real-at-validation-v1.json',at)

          curriculum=load('qa/curriculum-semantic-review.json')
          curriculum['release']=NEW; curriculum['packet']=f'qa/CURRICULUM_SME_REVIEW_{NEW}.md'
          dump('qa/curriculum-semantic-review.json',curriculum)

          book=load('data/book-sme-review-v1.json')
          book['release']=NEW
          if book.get('status')=='validated' or book.get('reviews'): raise SystemExit('refusing to synthesize or carry Book SME approval')
          dump('data/book-sme-review-v1.json',book)
          dump('src/domains/learning/book-data/book-sme-review-v1.json',book)

          learner=load('data/learner-pilot-v1.json')
          learner['release']=NEW
          dump('data/learner-pilot-v1.json',learner)

          packets=[
              ('qa/EXTERNAL_VALIDATION_'+OLD+'.md','qa/EXTERNAL_VALIDATION_'+NEW+'.md'),
              ('qa/ACCESSIBILITY_REAL_AT_'+OLD+'.md','qa/ACCESSIBILITY_REAL_AT_'+NEW+'.md'),
              ('qa/PWA_PHYSICAL_DEVICE_'+OLD+'.md','qa/PWA_PHYSICAL_DEVICE_'+NEW+'.md'),
              ('certification/WINDOWS_SIGNING_READINESS_'+OLD+'.md','certification/WINDOWS_SIGNING_READINESS_'+NEW+'.md'),
              ('qa/BOOK_SME_REVIEW_'+OLD+'.md','qa/BOOK_SME_REVIEW_'+NEW+'.md'),
              ('qa/CURRICULUM_SME_REVIEW_'+OLD+'.md','qa/CURRICULUM_SME_REVIEW_'+NEW+'.md'),
              ('qa/LEARNER_PILOT_'+OLD+'.md','qa/LEARNER_PILOT_'+NEW+'.md'),
          ]
          for src,dst in packets: copy_packet(src,dst)
          PY
      - name: Validate release-bound HOLD packets
        run: |
          python qa_release_validation_packets.py
          python tools/verify_release_external_validation.py
          python qa_book_release_integration.py
          python qa_audit_remediation_20260915_6.py
          python tools/build_pages_artifact.py
          test "$(python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint)" = "sha256:2f3792657a843ce686fa89c6354795a3e9782336df298f6cec9f86384da312c2"
          git diff --check
      - name: Commit release-specific HOLD bindings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/release-external-validation-v1.json data/accessibility-real-at-validation-v1.json qa/curriculum-semantic-review.json data/book-sme-review-v1.json src/domains/learning/book-data/book-sme-review-v1.json data/learner-pilot-v1.json qa/EXTERNAL_VALIDATION_2026.09.15.6.md qa/ACCESSIBILITY_REAL_AT_2026.09.15.6.md qa/PWA_PHYSICAL_DEVICE_2026.09.15.6.md certification/WINDOWS_SIGNING_READINESS_2026.09.15.6.md qa/BOOK_SME_REVIEW_2026.09.15.6.md qa/CURRICULUM_SME_REVIEW_2026.09.15.6.md qa/LEARNER_PILOT_2026.09.15.6.md
          git diff --cached --check
          git commit -m '[audit-remediation-generated] Bind 2026.09.15.6 external validation HOLD packets'
          git push origin HEAD:fix/audit-remediation-2026-09-16
