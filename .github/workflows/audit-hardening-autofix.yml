name: Audit hardening migration

on:
  push:
    branches:
      - audit-hardening-2026-09-10
    paths:
      - tools/apply_audit_hardening.py
      - .github/workflows/audit-hardening-autofix.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: audit-hardening-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic hardening migration
        run: python tools/apply_audit_hardening.py

      - name: Verify generated packs and diff hygiene
        run: |
          python tools/build_runtime_packs.py --check
          git diff --check

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence-maturity-deep-dive.js evidence-maturity-formal-bridge.js data-integration-runtime.js data/assessment-inventory-v1.json src/domains/runtime-packs/evidence-runtime-pack.js
          git commit -m "fix(assessment): make optional answer semantics immutable"
          git push origin HEAD:audit-hardening-2026-09-10
