name: Audit hardening migration

on:
  push:
    branches:
      - audit-hardening-2026-09-10
    paths:
      - tools/repair_hardening_sources.py
      - tools/apply_audit_hardening.py
      - tools/apply_runtime_analytics_hardening.py
      - tools/finalize_assessment_hardening_v2.py
      - tools/finalize_shell_desktop_hardening.py
      - .github/workflows/audit-hardening-autofix.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: audit-hardening-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair transitional hardening sources
        run: python tools/repair_hardening_sources.py

      - name: Apply assessment and data hardening
        run: python tools/apply_audit_hardening.py

      - name: Apply runtime ownership and structured analytics hardening
        run: python tools/apply_runtime_analytics_hardening.py

      - name: Freeze exact audited learner-visible assessment bank
        run: python tools/finalize_assessment_hardening_v2.py

      - name: Apply shell desktop and learner-scoping hardening
        run: python tools/finalize_shell_desktop_hardening.py

      - name: Verify generated packs and diff hygiene
        run: |
          python tools/build_runtime_packs.py --check
          python qa_audit_hardening.py
          git diff --check

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(shell): enforce evidence truth runtime ownership and desktop parity"
          git push origin HEAD:audit-hardening-2026-09-10
