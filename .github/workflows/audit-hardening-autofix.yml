name: Audit hardening migration

on:
  push:
    branches:
      - audit-hardening-2026-09-10
    paths:
      - tools/apply_audit_hardening.py
      - tools/apply_runtime_analytics_hardening.py
      - tools/finalize_assessment_hardening.py
      - .github/workflows/audit-hardening-autofix.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: audit-hardening-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair assessment freeze migration source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_assessment_hardening.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace("    new_optional=r'''def load_optional_runtime():", '    new_optional=r"""def load_optional_runtime():', 1)
          t=t.replace("    return items'''\n    replace_section", '    return items"""\n    replace_section', 1)
          p.write_text(t,encoding='utf-8')
          PY
          python -m py_compile tools/finalize_assessment_hardening.py

      - name: Apply assessment and data hardening
        run: python tools/apply_audit_hardening.py

      - name: Apply runtime ownership and structured analytics hardening
        run: python tools/apply_runtime_analytics_hardening.py

      - name: Freeze reviewed psychometric bank and retire runtime answer heuristics
        run: python tools/finalize_assessment_hardening.py

      - name: Verify generated packs and diff hygiene
        run: |
          python tools/build_runtime_packs.py --check
          python qa_audit_hardening.py
          git diff --check

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(assessment): freeze reviewed learner-visible bank"
          git push origin HEAD:audit-hardening-2026-09-10
