name: Wire Web Release Identity QA v1

on:
  push:
    branches:
      - release/web-identity-v1
    paths:
      - .github/workflows/wire-web-release-qa-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/web-identity-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Wire focused web identity QA into release QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa_release.py')
          text=p.read_text(encoding='utf-8')
          anchor='assert version["android_release"] == ANDROID_RELEASE\n'
          addition=anchor+'subprocess.run(["python", "qa_web_release_identity.py"], check=True)\n'
          if anchor not in text:
              raise SystemExit('qa_release web identity hook point missing')
          if 'qa_web_release_identity.py' not in text:
              text=text.replace(anchor,addition,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Validate permanent release hook
        run: |
          python qa_release.py
          python tools/sync_web_release.py --check
          python qa_architecture_debt.py
      - name: Commit release QA hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa_release.py
          git commit -m "Enforce web release identity in release QA"
          git push origin HEAD:release/web-identity-v1
