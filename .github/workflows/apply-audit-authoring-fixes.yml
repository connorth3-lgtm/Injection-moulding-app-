name: Apply Audit Authoring Fixes

on:
  push:
    branches: [audit-consolidation-2026-09-10]
    paths:
      - '.audit-authoring-fix-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-consolidation-2026-09-10
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply reviewed source-authoring corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {n}: {old!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Deduplicate optional-practice stems while preserving keyed propositions and evidence.
          replace_once('evidence-maturity-deep-dive.js',
              "['Explain','What is the learning point?','Polyester chemistry and grade formulation affect hydrolysis and crystallisation, so family names are not production recipes'",
              "['Explain','What is the learning point about polyester family labels?','Polyester chemistry and grade formulation affect hydrolysis and crystallisation, so family names are not production recipes'")
          replace_once('evidence-maturity-deep-dive.js',
              "['Explain','What is the core lesson?','Transparent parts can expose several mechanisms at once; optical appearance and structural stress need separate validation'",
              "['Explain','What is the core lesson about clear PMMA failures?','Transparent parts can expose several mechanisms at once; optical appearance and structural stress need separate validation'")
          replace_once('evidence-maturity-deep-dive.js',
              "['Explain','What is the core lesson?','Polymer-blend family names do not guarantee equivalent flow, drying or end-use properties'",
              "['Explain','What is the core lesson about PC/ABS grade changes?','Polymer-blend family names do not guarantee equivalent flow, drying or end-use properties'")
          replace_once('evidence-maturity-deep-dive.js',
              "['Explain','What is the learning point?','Low moisture uptake does not remove crystallinity, rheology and cooling effects on dimensional behaviour'",
              "['Explain','What is the learning point about HDPE lot changes?','Low moisture uptake does not remove crystallinity, rheology and cooling effects on dimensional behaviour'")

          # Correct two answer-length cues in the reviewed authoring overlay; answer indexes/propositions stay unchanged.
          replace_once('assessment-stable-review-bridge.js',
              " 'scenario:02':'Inspect end-of-fill venting and test fill-speed sensitivity',\n 'scenario:04':",
              " 'scenario:02':'Inspect end-of-fill venting and test fill-speed sensitivity',\n 'scenario:03':'Inspect local parting-line/insert seating',\n 'scenario:04':")
          replace_once('assessment-stable-review-bridge.js',
              "'scenario:30':'Map interface thermal and flow history first'",
              "'scenario:30':'Map interface thermal/flow history'")
          replace_once('assessment-stable-review-bridge.js',
              "if(applied>93||requireFull&&applied!==93)throw new Error(`Strict answer-balance coverage mismatch: ${applied}/93`);",
              "if(applied>94||requireFull&&applied!==94)throw new Error(`Strict answer-balance coverage mismatch: ${applied}/94`);")
          replace_once('assessment-stable-review-bridge.js',
              "strictAnswerBalance:{applied:0,required:93,policy:",
              "strictAnswerBalance:{applied:0,required:94,policy:")

          replace_once('qa_question_quality_50_pass.py',
              "get('applied')==93,'strict answer-balance bridge did not reach 93/93 before audit'",
              "get('applied')==94,'strict answer-balance bridge did not reach 94/94 before audit'")
          replace_once('qa_assessment_evidence.py',
              "get('applied')==93,'strict answer-balance bridge must be active before evidence snapshot'",
              "get('applied')==94,'strict answer-balance bridge must be active before evidence snapshot'")
          PY
          python tools/build_runtime_packs.py
          node --check assessment-stable-review-bridge.js
          node --check evidence-maturity-deep-dive.js
          python qa_question_quality_50_pass_immutable.py
          python qa_question_quality_extreme_runtime_v2.py
      - name: Commit deterministic authoring and runtime-pack updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence-maturity-deep-dive.js assessment-stable-review-bridge.js src/domains/runtime-packs/evidence-runtime-pack.js qa_question_quality_50_pass.py qa_assessment_evidence.py
          git commit -m 'content: fix remaining extreme assessment authoring defects'
          git push origin HEAD:audit-consolidation-2026-09-10
