name: MouldMaster Public Measured Benchmark — PMC4753395 stage 1

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_pmc4753395_stage1.py'
      - 'qa_public_benchmark_pmc4753395_stage1.py'
      - 'data/public-benchmark-contracts/pmc4753395-hdpe-cenosphere-v1.json'
      - '.github/workflows/public-benchmark-pmc4753395-stage1.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_pmc4753395_stage1.py'
      - 'qa_public_benchmark_pmc4753395_stage1.py'
      - 'data/public-benchmark-contracts/pmc4753395-hdpe-cenosphere-v1.json'
      - '.github/workflows/public-benchmark-pmc4753395-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl
      - name: Validate stage-one evidence boundary
        run: python qa_public_benchmark_pmc4753395_stage1.py
      - name: Retrieve and aggregate-profile CC BY supplementary archive
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_pmc4753395_stage1.py \
            --output benchmark-results/pmc4753395-stage1.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate-only stage-one result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/pmc4753395-stage1.json'))
          assert x['status'] in {'retrieved-profile-needs-semantic-review','retrieval-or-structure-blocked'}
          assert x['source']['datasetDoi']=='10.1016/j.dib.2016.01.058'
          assert x['source']['license']=='CC BY 4.0'
          assert len(x['source']['sha256'])==64
          assert x['archiveProfile']['rawArchiveCommitted'] is False
          assert x['archiveProfile']['rawMembersUploadedAsArtifact'] is False
          assert x['archiveProfile']['rawRowsOrNumericValuesEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          if x['status']=='retrieved-profile-needs-semantic-review':
              assert x['source']['zipStructureValid'] is True
              assert x['archiveProfile']['measuredWorkbookPresent'] is True
              assert x['archiveProfile']['memberCount'] >= 1
          print(json.dumps({
            'status':x['status'],
            'sizeBytes':x['source']['retrievedSizeBytes'],
            'sha256':x['source']['sha256'],
            'memberCount':x['archiveProfile']['memberCount'],
            'measuredWorkbookPresent':x['archiveProfile']['measuredWorkbookPresent'],
            'theoreticalWorkbookPresent':x['archiveProfile']['theoreticalWorkbookPresent']
          },indent=2))
          PY
      - name: Upload aggregate profile only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-pmc4753395-stage1-profile
          path: benchmark-results/pmc4753395-stage1.json
          if-no-files-found: error
          retention-days: 30
