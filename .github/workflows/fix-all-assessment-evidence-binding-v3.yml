name: Fix-all assessment evidence binding v3

on:
  push:
    branches: [ audit/fix-all-deep-dive-20260915 ]
    paths:
      - .github/workflows/fix-all-assessment-evidence-binding-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/fix-all-deep-dive-20260915
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Derive immutable semantic lock and make QA shallow-checkout safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          APPROVED_BLOB='c6b258ccd37d98b2f591f538b34eb33c7705dda6'
          def payload(text):
              marker='window.MM_DATA = '
              data,_=json.JSONDecoder().raw_decode(text[text.index(marker)+len(marker):])
              return {'exams':data['exams'],'regionalQuestions':data['regionalQuestions'],'scenarios':data['scenarios']}
          def fp(obj):
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()
          current=Path('MouldMaster_Core_App.html').read_text(encoding='utf-8')
          p=subprocess.run(['git','cat-file','blob',APPROVED_BLOB],capture_output=True,text=True,encoding='utf-8',errors='strict',check=True)
          approved=p.stdout
          approved_fp=fp(payload(approved)); current_fp=fp(payload(current))
          if current_fp!=approved_fp:
              raise SystemExit(f'assessment payload changed: approved {approved_fp} current {current_fp}')
          print('Approved/current assessment semantic SHA-256:',approved_fp)

          q=Path('qa_assessment_evidence.py'); text=q.read_text(encoding='utf-8')
          text=text.replace('import ast, json, re, subprocess, tempfile','import ast, hashlib, json, re, subprocess, tempfile',1)
          text=text.replace('ROOT=Path(__file__).resolve().parent\n','ROOT=Path(__file__).resolve().parent\nAPPROVED_CORE_ASSESSMENT_BLOB="'+APPROVED_BLOB+'"\nAPPROVED_CORE_ASSESSMENT_SHA256="'+approved_fp+'"\n',1)
          old="""def git_blob_text(sha):
    p=subprocess.run(['git','cat-file','blob',sha],cwd=ROOT,capture_output=True,text=True,encoding='utf-8',errors='strict')
    need(p.returncode==0,f'cannot resolve approved Git blob {sha}: {p.stderr.strip()}')
    return p.stdout

"""
          if old not in text: raise SystemExit('git_blob_text helper not found')
          text=text.replace(old,'',1)
          anchor="""def core_assessment_payload(core_text):
    marker='window.MM_DATA = '
    need(marker in core_text,'MM_DATA marker missing')
    data,_=json.JSONDecoder().raw_decode(core_text[core_text.index(marker)+len(marker):])
    return {'exams':data['exams'],'regionalQuestions':data['regionalQuestions'],'scenarios':data['scenarios']}
"""
          replacement=anchor+"""
def core_assessment_sha256(core_text):
    raw=json.dumps(core_assessment_payload(core_text),ensure_ascii=False,separators=(',',':')).encode('utf-8')
    return hashlib.sha256(raw).hexdigest()
"""
          if anchor not in text: raise SystemExit('payload helper not found')
          text=text.replace(anchor,replacement,1)
          old_loop="""    if path=='MouldMaster_Core_App.html' and actual!=sha:
        approved_core=git_blob_text(sha)
        current_payload=core_assessment_payload(text(path))
        approved_payload=core_assessment_payload(approved_core)
        need(current_payload==approved_payload,f'evidence approval stale for {path}: assessment-bearing content changed from approved blob {sha} to current {actual}; re-review evidence and update approval')
        continue
"""
          new_loop="""    if path=='MouldMaster_Core_App.html' and actual!=sha:
        need(sha==APPROVED_CORE_ASSESSMENT_BLOB,'core approval blob drifted from the governed semantic lock source')
        current_fp=core_assessment_sha256(text(path))
        need(current_fp==APPROVED_CORE_ASSESSMENT_SHA256,f'evidence approval stale for {path}: assessment-bearing content changed from approved semantic lock {APPROVED_CORE_ASSESSMENT_SHA256} to {current_fp}; re-review evidence and update approval')
        need(APPROVED_CORE_ASSESSMENT_SHA256 in text('sources/QUESTION_APPROVAL_POLICY.md'),'question approval policy must record the governed core assessment semantic lock')
        continue
"""
          if old_loop not in text: raise SystemExit('semantic comparison loop not found')
          text=text.replace(old_loop,new_loop,1)
          q.write_text(text,encoding='utf-8')

          policy=Path('sources/QUESTION_APPROVAL_POLICY.md'); ptext=policy.read_text(encoding='utf-8')
          note=f"\nThe governed semantic lock for the legacy core assessment payload is SHA-256 `{approved_fp}`, derived from immutable approved Git blob `{APPROVED_BLOB}`. This lock covers only `exams`, `regionalQuestions`, and `scenarios`; it is not a substitute for a fresh review when those fields change.\n"
          if approved_fp not in ptext: ptext=ptext.rstrip()+"\n"+note
          policy.write_text(ptext,encoding='utf-8')
          PY
      - name: Validate on full and synthetic shallow history boundaries
        shell: bash
        run: |
          set -euo pipefail
          python qa_assessment_evidence.py
          python qa_release.py
          git diff --check
      - name: Commit shallow-safe evidence lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-assessment-evidence-binding-v3.yml
          git add qa_assessment_evidence.py sources/QUESTION_APPROVAL_POLICY.md
          git commit -m 'Make assessment evidence lock checkout independent'
          git push origin HEAD:audit/fix-all-deep-dive-20260915
