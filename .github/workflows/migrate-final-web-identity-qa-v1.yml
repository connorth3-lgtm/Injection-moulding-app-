name: Migrate Final Web Identity QA v1

on:
  push:
    branches:
      - release/web-identity-v1
    paths:
      - .github/workflows/migrate-final-web-identity-qa-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/web-identity-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Migrate final stale web identity contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('qa_process_data_diagnostics.py')
          text=p.read_text(encoding='utf-8')
          old='''# Runtime coherence is structural. Runtime-only hardening may advance independently\n# of the audited shell release, while the runtime bundle and service-worker cache\n# retain one explicit feature family, date and exact expected cache identity.\nsw=text('service-worker.js')\nruntime_asset=js_const(idx,'RUNTIME_ASSET_VERSION')\nexpected_cache=js_const(idx,'EXPECTED_STATIC_CACHE')\ncache_version=js_const(sw,'CACHE_VERSION')\ncache_revision=js_const(sw,'CACHE_REVISION')\nneed(expected_cache==f'mouldmaster-static-{cache_version}-{cache_revision}','browser expected PWA cache must match the service-worker cache identity')\nneed(re.fullmatch(r'\\d{8}\\.\\d+-[a-z0-9-]+',runtime_asset) is not None,'guided data runtime token must retain dated revision + feature-family format')\nruntime_date=runtime_asset.split('.',1)[0]\nruntime_family=runtime_asset.split('-',1)[1]\nneed(cache_revision.startswith(runtime_family+'-'),'guided data cache revision must retain the active runtime feature family')\nneed(re.search(r'-\\d{8}$',cache_revision) is not None,'guided data cache revision must end with a dated revision token')\nneed(cache_revision.rsplit('-',1)[-1]==runtime_date,'guided data runtime and PWA cache revision dates must match')\n'''
          new='''# Runtime coherence is structural. Browser/runtime asset identity derives from the canonical\n# web release, while CACHE_REVISION remains an independent invalidation token.\nsw=text('service-worker.js')\nruntime_asset=js_const(idx,'SHELL_RELEASE')\nexpected_cache=js_const(idx,'EXPECTED_STATIC_CACHE')\ncache_version=js_const(sw,'CACHE_VERSION')\ncache_revision=js_const(sw,'CACHE_REVISION')\nneed('const RUNTIME_ASSET_VERSION=SHELL_RELEASE;' in idx,'guided data runtime identity must derive from canonical shell/web release')\nneed(re.fullmatch(r'\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d+',runtime_asset) is not None,'guided data web release must use YYYY.MM.DD.N')\nneed(cache_version==runtime_asset,'guided data service-worker cache version must equal canonical web release')\nneed(bool(cache_revision.strip()),'guided data cache revision must remain an explicit independent invalidation token')\nneed(expected_cache==f'mouldmaster-static-{cache_version}-{cache_revision}','browser expected PWA cache must match the service-worker cache identity')\n'''
          if old not in text:
              raise SystemExit('Guided process-data legacy runtime block not found exactly')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('qa_data_integration.py')
          text=p.read_text(encoding='utf-8')
          old='''    require(f"CACHE_VERSION='{version['android_release']}'" in worker, "service-worker cache version must stay aligned with the audited Android release")\n    cache_version = re.search(r"CACHE_VERSION='([^']+)'", worker)\n    cache_revision = re.search(r"CACHE_REVISION='([^']+)'", worker)\n    runtime_version = re.search(r'RUNTIME_ASSET_VERSION="([^\"]+)"', index)\n    require(cache_version is not None and cache_revision is not None and runtime_version is not None, "runtime/cache metadata missing")\n    expected_cache = f"mouldmaster-static-{cache_version.group(1)}-{cache_revision.group(1)}"\n    require(f'const EXPECTED_STATIC_CACHE="{expected_cache}"' in index, "bootstrap expected cache must match the service-worker cache exactly")\n    revision_date = re.search(r"(\\d{8})$", cache_revision.group(1))\n    require(revision_date is not None and runtime_version.group(1).startswith(revision_date.group(1)), "bootstrap/runtime and worker cache revision dates must match")\n    require(runtime_version.group(1).endswith("-maturity-hardening-v2"), "connected-data changes must retain the repository runtime family")\n    require(cache_revision.group(1).startswith("maturity-hardening-v2-"), "connected-data changes must retain the repository cache family")\n'''
          new='''    require(f"CACHE_VERSION='{version['web_release']}'" in worker, "service-worker cache version must stay aligned with the canonical web release")\n    cache_version = re.search(r"CACHE_VERSION='([^']+)'", worker)\n    cache_revision = re.search(r"CACHE_REVISION='([^']+)'", worker)\n    shell_release = re.search(r'SHELL_RELEASE="([^\"]+)"', index)\n    require(cache_version is not None and cache_revision is not None and shell_release is not None, "runtime/cache metadata missing")\n    require(re.fullmatch(r"\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d+", shell_release.group(1)) is not None, "canonical web release must use YYYY.MM.DD.N")\n    require(cache_version.group(1) == shell_release.group(1) == version['web_release'], "connected-data browser/cache identity must share web_release")\n    require('const RUNTIME_ASSET_VERSION=SHELL_RELEASE;' in index, "connected-data runtime asset identity must derive from canonical shell/web release")\n    require(bool(cache_revision.group(1).strip()), "connected-data cache revision must remain an explicit independent invalidation token")\n    expected_cache = f"mouldmaster-static-{cache_version.group(1)}-{cache_revision.group(1)}"\n    require(f'const EXPECTED_STATIC_CACHE="{expected_cache}"' in index, "bootstrap expected cache must match the service-worker cache exactly")\n'''
          if old not in text:
              raise SystemExit('Connected-data legacy Android/runtime identity block not found exactly')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Scan all root QA for retired release coupling
        run: |
          python - <<'PY'
          from pathlib import Path
          markers=(
              'js_const(index, "RUNTIME_ASSET_VERSION")',
              "js_const(idx,'RUNTIME_ASSET_VERSION')",
              "re.search(r'const RUNTIME_ASSET_VERSION=\"",
              "re.search(r'RUNTIME_ASSET_VERSION=\"",
              "CACHE_VERSION='{version['android_release']}'",
              'runtime token must retain dated',
              'runtime bundle must retain a dated',
              'runtime and PWA cache revision dates must match',
          )
          hits=[]
          for p in sorted(Path('.').glob('qa*.py')):
              text=p.read_text(encoding='utf-8')
              for marker in markers:
                  if marker in text:
                      hits.append(f'{p}: {marker}')
          if hits:
              raise SystemExit('Retired web release coupling remains:\n'+'\n'.join(hits))
          print('No retired web/Android or quoted runtime-token QA coupling remains')
          PY
      - name: Validate final identity-sensitive QA surface
        run: |
          python qa_process_data_diagnostics.py
          python qa_data_integration.py
          python qa_psychometric_integration.py
          python qa_assessment_ux.py
          python qa_production_observability.py
          python qa_runtime_hardening.py
          python qa_release.py
          python tools/sync_web_release.py --check
      - name: Commit final QA migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa_process_data_diagnostics.py qa_data_integration.py
          git commit -m "Complete canonical web identity QA migration"
          git push origin HEAD:release/web-identity-v1
