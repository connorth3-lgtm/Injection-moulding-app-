name: Temporary Recovery Hash Verification

on:
  push:
    branches:
      - 'audit/recovery-feed-coherence'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Locate immutable recovery bytes
        shell: bash
        run: |
          set -euo pipefail
          target='96ed07e1487633538359eb12073fe50bfe595d9d5aaa807173e0a764b9123754'
          echo "target=$target"
          found=0
          while read -r commit; do
            hash="$(git show "${commit}:MouldMaster_Core_App.html" | sha256sum | awk '{print $1}')"
            echo "$commit $hash"
            if [ "$hash" = "$target" ]; then
              echo "MATCH=$commit"
              found=1
            fi
          done < <(git log --format=%H -- MouldMaster_Core_App.html)
          test "$found" -eq 1
