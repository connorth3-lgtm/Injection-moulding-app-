name: Reconcile measured counts on consolidation branch

on:
  push:
    branches: [data/measured-data-consolidation-20260830]
    paths:
      - '.github/workflows/reconcile-measured-counts-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/measured-data-consolidation-20260830
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile target ledger and QA assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # Controlling target ledger.
          p = root / 'data/content-scale-targets.json'
          obj = json.loads(p.read_text(encoding='utf-8'))
          obj['version'] = '2026.08.30.1'
          obj['reviewed'] = '2026-08-30'
          fp = obj['targets']['fully_profiled_measured_datasets']
          fp['currentAccepted'] = 7
          fp['notes'] = (
              'Seven exact-source measured dataset families satisfy the full profiling acceptance definition. '
              'Cross-process remains partially accepted rather than an eighth fully profiled family because upper pressure/state semantics remain unresolved. '
              'ImPure now contributes 1,188,348 accepted cavity pressure/temperature values while four other fields remain clarification-blocked. '
              'FORinFPRO now contributes 162,112 accepted ENGEL heating-zone actual-temperature values while its other machine/cavity/ultrasound fields remain source-unit/role limited. '
              'Partial channel acceptance does not itself increase the fully profiled-family count. PET is terminalized at zero measured values; Warwick and RWTH retain their export/delivery blockers.'
          )
          ms = obj['targets']['measured_time_series_samples']
          ms['currentAccepted'] = 66_521_519
          ms['notes'] = (
              'Accepted real time-series evidence totals 66,521,519 values: AVAPS 13,631,488; OpenMMS-T4G 298,080; '
              'cross-process 51,241,491 (7,426,743 lower + 43,814,748 upper); ImPure 1,188,348 from four source-backed cavity channels; '
              'and FORinFPRO 162,112 from 16 source-backed ENGEL heating-zone actual-temperature channels. '
              'Commands, unresolved pressure/state fields, unresolved ImPure auxiliary fields, other unit-limited FORinFPRO fields, PET simulation/model outputs, '
              'and all synthetic learning cycles remain excluded.'
          )
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Content-scale QA: expand rights review and add partial accepted counts.
          p = root / 'qa_content_scale_targets.py'
          s = p.read_text(encoding='utf-8')
          repl = {
              'need((rights.get("summary") or {}).get("sourcesReviewed") == 5, "waveform rights-review source count drifted")':
              'need((rights.get("summary") or {}).get("sourcesReviewed") == 7, "waveform rights-review source count drifted")',
              'need((rights.get("summary") or {}).get("unblockedForAutomatedIngestion") == 4, "waveform rights-review unblocked count drifted")':
              'need((rights.get("summary") or {}).get("unblockedForAutomatedIngestion") == 4, "waveform rights-review unblocked count drifted")\nneed((rights.get("summary") or {}).get("remainBlockedForRights") == 3, "waveform rights-review blocked count drifted")',
              'for blocked_id in ["skz-loki-v1"]:\n    need(rights_by_id[blocked_id].get("decision") == "blocked-no-explicit-license", f"{blocked_id} rights decision drifted")\n    need(by_id[blocked_id].get("license") is None and by_id[blocked_id].get("automatedIngestionAllowed") is False, f"{blocked_id} must remain non-executable without explicit data licence")':
              'blocked_decisions = {\n    "probayes-main-v2": "blocked-no-v2-specific-license",\n    "probayes-doptimal-v1": "blocked-conflicting-official-license-metadata",\n    "skz-loki-v1": "blocked-no-explicit-license",\n}\nfor blocked_id, decision in blocked_decisions.items():\n    need(rights_by_id[blocked_id].get("decision") == decision, f"{blocked_id} rights decision drifted")\n    need(rights_by_id[blocked_id].get("license") is None and rights_by_id[blocked_id].get("automatedIngestionAllowed") is False, f"{blocked_id} rights review must remain fail-closed")\n    need(by_id[blocked_id].get("license") is None and by_id[blocked_id].get("automatedIngestionAllowed") is False, f"{blocked_id} must remain non-executable without explicit data licence")',
              'need("dataVolumeMB" not in impure_count, "ImPure must not mislabel cumulative download traffic as source-data size")':
              'need("dataVolumeMB" not in impure_count, "ImPure must not mislabel cumulative download traffic as source-data size")\nneed(impure_count.get("acceptedMeasuredChannels") == 4 and impure_count.get("acceptedMeasuredTimeSeriesSamples") == 1_188_348, "ImPure accepted partial-semantic count drifted")\nforinfpro_count = by_id["forinfpro-himd-v1"].get("count") or {}\nneed(forinfpro_count.get("acceptedMachineRows") == 10_132 and forinfpro_count.get("acceptedMeasuredChannels") == 16 and forinfpro_count.get("acceptedMeasuredTimeSeriesSamples") == 162_112, "FORinFPRO accepted partial-semantic count drifted")',
              'accepted_measured_total = av_profile["acceptedMeasuredTimeSeriesSamples"] + om_profile["acceptedMeasuredTimeSeriesSamples"] + cl_profile["acceptedMeasuredTimeSeriesSamples"] + cu_profile["acceptedMeasuredTimeSeriesSamples"]':
              'accepted_measured_total = av_profile["acceptedMeasuredTimeSeriesSamples"] + om_profile["acceptedMeasuredTimeSeriesSamples"] + cl_profile["acceptedMeasuredTimeSeriesSamples"] + cu_profile["acceptedMeasuredTimeSeriesSamples"] + impure_count["acceptedMeasuredTimeSeriesSamples"] + forinfpro_count["acceptedMeasuredTimeSeriesSamples"]',
              'need(accepted_measured_total == 65_171_059, "combined real measured-sample arithmetic drifted")':
              'need(accepted_measured_total == 66_521_519, "combined real measured-sample arithmetic drifted")',
              '{"path": "data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json", "accepted": cu_profile["acceptedMeasuredTimeSeriesSamples"]},':
              '{"path": "data/public-benchmark-results/cross-process-upper-workpiece-source-contract-v1.json", "accepted": cu_profile["acceptedMeasuredTimeSeriesSamples"]},\n            {"path": "data/impure-pascoe-semantic-review-2026-08-30.json", "accepted": impure_count["acceptedMeasuredTimeSeriesSamples"]},\n            {"path": "data/forinfpro-himd-semantic-review-2026-08-30.json", "accepted": forinfpro_count["acceptedMeasuredTimeSeriesSamples"]},',
              'print(f"MouldMaster content-scale target integrity QA passed ({len(datasets)} measured datasets inventoried; 7 fully profiled families including ImPure and 1 restricted research/education profile; {accepted_measured_total:,} accepted real measured time-series values; {verified} publisher-verified primary measured studies; {summary.get(\'automatedIngestionAllowed\')} sources legally executable)")':
              'print(f"MouldMaster content-scale target integrity QA passed ({len(datasets)} measured datasets inventoried; 7 fully profiled families plus partial ImPure/FORinFPRO channel acceptance and 1 restricted research/education profile; {accepted_measured_total:,} accepted real measured time-series values; {verified} publisher-verified primary measured studies; {summary.get(\'automatedIngestionAllowed\')} sources legally executable)")',
          }
          for old, new in repl.items():
              if old not in s:
                  raise SystemExit(f'missing expected qa_content_scale target: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Master compiler QA: new governing sample total and reconciliation.
          p = root / 'qa_master_data_compile.py'
          s = p.read_text(encoding='utf-8')
          repl = {
              'need(expected_samples == 65_171_059, "audited measured-sample baseline drifted")':
              'need(expected_samples == 66_521_519, "audited measured-sample baseline drifted")',
              'need(results["scatimdata-avaps"]["measurement_profile"]["acceptedMeasuredTimeSeriesSamples"] + results["openmms-t4g"]["measurement_profile"]["acceptedMeasuredTimeSeriesSamples"] + review_results["cross-process-lower-workpiece-source-contract"]["profile"]["acceptedMeasuredTimeSeriesSamples"] + review_results["cross-process-upper-workpiece-source-contract"]["profile"]["acceptedMeasuredTimeSeriesSamples"] == expected_samples, "compiled measured benchmark sample totals do not reconcile")':
              'need(results["scatimdata-avaps"]["measurement_profile"]["acceptedMeasuredTimeSeriesSamples"] + results["openmms-t4g"]["measurement_profile"]["acceptedMeasuredTimeSeriesSamples"] + review_results["cross-process-lower-workpiece-source-contract"]["profile"]["acceptedMeasuredTimeSeriesSamples"] + review_results["cross-process-upper-workpiece-source-contract"]["profile"]["acceptedMeasuredTimeSeriesSamples"] + 1_188_348 + 162_112 == expected_samples, "compiled measured benchmark plus partial semantic sample totals do not reconcile")',
              'need(impure.get("publisherBytes") == 18_708_850 and impure.get("publisherFiles") == 309 and impure.get("cycleFiles") == 307 and impure.get("zenodoCumulativeDownloadTrafficMB") == 605.2 and "dataVolumeMB" not in impure, "compiled ImPure source dimensions drifted")':
              'need(impure.get("publisherBytes") == 18_708_850 and impure.get("publisherFiles") == 309 and impure.get("cycleFiles") == 307 and impure.get("zenodoCumulativeDownloadTrafficMB") == 605.2 and "dataVolumeMB" not in impure, "compiled ImPure source dimensions drifted")\n    need(impure.get("acceptedMeasuredChannels") == 4 and impure.get("acceptedMeasuredTimeSeriesSamples") == 1_188_348, "compiled ImPure accepted values drifted")\n    forinfpro_inv = by_id["forinfpro-himd-v1"]["count"]\n    need(forinfpro_inv.get("acceptedMachineRows") == 10_132 and forinfpro_inv.get("acceptedMeasuredChannels") == 16 and forinfpro_inv.get("acceptedMeasuredTimeSeriesSamples") == 162_112, "compiled FORinFPRO accepted values drifted")',
          }
          for old, new in repl.items():
              if old not in s:
                  raise SystemExit(f'missing expected qa_master target: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Master-data workflow uses the same controlling total.
          p = root / '.github/workflows/master-data-compile.yml'
          s = p.read_text(encoding='utf-8')
          if "assert c['measuredTimeSeriesSamplesAccepted']==65171059" not in s:
              raise SystemExit('missing old master workflow sample assertion')
          s = s.replace("assert c['measuredTimeSeriesSamplesAccepted']==65171059", "assert c['measuredTimeSeriesSamplesAccepted']==66521519", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate reconciled local guards
        run: |
          python qa_measured_dataset_inventory.py
          python qa_content_scale_targets.py
          python qa_remaining_dataset_terminal_states.py
          python qa_master_data_compile.py
      - name: Commit reconciliation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/content-scale-targets.json qa_content_scale_targets.py qa_master_data_compile.py .github/workflows/master-data-compile.yml
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/master-data-compile.yml data/content-scale-targets.json qa_content_scale_targets.py qa_master_data_compile.py "
          git commit -m "Reconcile measured sample ledger to 66,521,519"
          git push origin HEAD:data/measured-data-consolidation-20260830
