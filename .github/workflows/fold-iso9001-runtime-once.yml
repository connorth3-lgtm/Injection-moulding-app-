name: One-shot ISO 9001 runtime consolidation

on:
  push:
    branches:
      - feature/iso9001-qms-integration-20260915

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/iso9001-qms-integration-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fold QMS renderer into governed source library
        run: |
          python .github/scripts/fold_iso9001_runtime_once.py
          node --check source-library.js
          python qa_architecture_debt.py
          python qa_iso9001_qms.py
          python qa_book_release_integration.py
          python qa_external_validation_wave1.py
          python tools/verify_release_external_validation.py
          python qa_release.py
          python qa_release_docs.py
          rm .github/workflows/fold-iso9001-runtime-once.yml
          rm .github/scripts/fold_iso9001_runtime_once.py
      - name: Commit consolidated runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Consolidate ISO 9001 runtime within architecture ceiling"
          git push origin HEAD:feature/iso9001-qms-integration-20260915
