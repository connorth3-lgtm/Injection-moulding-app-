name: One-shot Book source metadata sync

on:
  push:
    branches:
      - qa/book-evidence-integration-main-20260915

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: qa/book-evidence-integration-main-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Complete source metadata without reformatting authored chapters
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('data/book-authored-remaining-v1.json')
          runtime_path = Path('src/domains/learning/book-data/book-authored-remaining-v1.json')
          text = source_path.read_text(encoding='utf-8')

          states = {
              'jpe-2022-hotrunner-crosssection-pressure-control': 'published',
              'ewikon-2022-electric-valve-gate-observability': 'published-supplier-technical',
              'ipp-1998-multicavity-melt-control-quality': 'published',
              'pes-1997-multicavity-pressure-control-capability': 'published',
              'prc-2004-selfregulating-valve-consistency': 'published',
              'ieom-2023-black-spot-filter-mesh': 'published',
              'chula-2014-black-dot-dmaic': 'published-thesis',
              'mechanik-2018-cooling-channel-diagnosis-cleaning': 'published',
              'sanko-2025-cooling-pipe-cleaning-three-cases': 'published-practitioner-case',
              'fuso-2023-eight-cavity-cooling-cleaning': 'published-practitioner-case',
              'smartflow-2025-cooling-flow-balance-case': 'published-practitioner-case',
          }

          for sid, state in states.items():
              marker = f'      "id": "{sid}",'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing source record: {sid}')
              end = text.find('\n    }', start)
              if end < 0:
                  raise SystemExit(f'cannot find source record end: {sid}')
              block = text[start:end]
              if '"checked"' in block or '"currentState"' in block:
                  if '"checked": "2026-09-15"' not in block or f'"currentState": "{state}"' not in block:
                      raise SystemExit(f'inconsistent existing metadata: {sid}')
                  continue
              if not block.rstrip().endswith('"'):
                  raise SystemExit(f'unexpected source record shape: {sid}')
              insertion = f',\n      "checked": "2026-09-15",\n      "currentState": "{state}"'
              text = text[:end] + insertion + text[end:]

          source_path.write_text(text, encoding='utf-8')
          runtime_path.write_text(text, encoding='utf-8')
          PY
          python qa_book_complete_draft.py
          cmp -s data/book-authored-remaining-v1.json src/domains/learning/book-data/book-authored-remaining-v1.json
          rm .github/workflows/book-source-metadata-sync-once.yml
      - name: Commit source metadata completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Book evidence source metadata"
          git push origin HEAD:qa/book-evidence-integration-main-20260915
