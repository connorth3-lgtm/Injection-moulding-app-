name: MouldMaster Public Measured Benchmark — AD-STGN stage 1

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_ad_stgn_stage1.py'
      - 'qa_public_benchmark_ad_stgn_stage1.py'
      - 'data/public-benchmark-contracts/ad-stgn-injection-moulding-v1.json'
      - '.github/workflows/public-benchmark-ad-stgn-stage1.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_ad_stgn_stage1.py'
      - 'qa_public_benchmark_ad_stgn_stage1.py'
      - 'data/public-benchmark-contracts/ad-stgn-injection-moulding-v1.json'
      - '.github/workflows/public-benchmark-ad-stgn-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-ad-stgn-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stage-one evidence boundaries
        run: python qa_public_benchmark_ad_stgn_stage1.py
      - name: Enumerate Mendeley publisher file/folder manifest only
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_ad_stgn_stage1.py \
            --output benchmark-results/ad-stgn-stage1-manifest.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate manifest result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/ad-stgn-stage1-manifest.json'))
          assert x['status'] in {'publisher-file-manifest-profiled', 'publisher-folder-manifest-profiled-no-files-yet'}
          assert x['source']['datasetDoi']=='10.17632/6f9x8yg8nj.1'
          assert x['manifest']['fileCount'] >= 0
          assert x['manifest']['folderCount'] >= 0
          assert x['acceptance']['stage1ManifestComplete'] is (x['manifest']['fileCount'] > 0 or x['manifest']['folderCount'] > 0)
          assert x['manifest']['rawPayloadsDownloaded'] is False
          assert x['manifest']['rawRowsOrArraysEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          assert x['acceptance']['stage2Required'] is True
          print(json.dumps({
            'status': x['status'],
            'fileCount': x['manifest']['fileCount'],
            'folderCount': x['manifest']['folderCount'],
            'totalBytes': x['manifest']['totalBytes'],
            'likelyInjectionFilesByName': x['manifest']['likelyInjectionFilesByName'],
            'likelyInjectionFoldersByName': x['manifest']['likelyInjectionFoldersByName'],
            'explicitNonInjectionFilesByName': x['manifest']['explicitNonInjectionFilesByName'],
            'explicitNonInjectionFoldersByName': x['manifest']['explicitNonInjectionFoldersByName'],
          }, indent=2))
          PY
      - name: Upload aggregate publisher manifest only
        uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-ad-stgn-stage1-manifest
          path: benchmark-results/ad-stgn-stage1-manifest.json
          if-no-files-found: error
          retention-days: 30
