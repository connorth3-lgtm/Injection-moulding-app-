name: MouldMaster Measured Learning Library

on:
  pull_request:
    paths:
      - 'data/measured-learning/**'
      - 'data/measured-dataset-execution-ledger-v1.json'
      - 'data/public-benchmark-results/**'
      - 'measured-learning-library.js'
      - 'measured-learning-library.css'
      - 'tools/measured_learning_core.py'
      - 'tools/build_measured_learning_case.py'
      - 'tools/prove_*_measured_source.py'
      - 'tools/prove_mendeley_open_sources.py'
      - 'tests/test_measured_learning_v2.py'
      - 'qa_measured_learning_library.py'
      - 'sources/MEASURED_LEARNING_LIBRARY_V1.md'
      - 'sources/MEASURED_LEARNING_LIBRARY_V2.md'
      - '.github/workflows/measured-learning-library.yml'
  push:
    branches: [main]
    paths:
      - 'data/measured-learning/**'
      - 'data/measured-dataset-execution-ledger-v1.json'
      - 'data/public-benchmark-results/**'
      - 'measured-learning-library.js'
      - 'measured-learning-library.css'
      - 'tools/measured_learning_core.py'
      - 'tools/build_measured_learning_case.py'
      - 'tools/prove_*_measured_source.py'
      - 'tools/prove_mendeley_open_sources.py'
      - 'tests/test_measured_learning_v2.py'
      - 'qa_measured_learning_library.py'
      - 'sources/MEASURED_LEARNING_LIBRARY_V1.md'
      - 'sources/MEASURED_LEARNING_LIBRARY_V2.md'
      - '.github/workflows/measured-learning-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile V2 promotion and source-proof tooling
        run: python -m py_compile tools/measured_learning_core.py tools/build_measured_learning_case.py tools/prove_openmms_measured_source.py tools/prove_avaps_measured_source.py tools/prove_sustainability_measured_source.py tools/prove_mendeley_open_sources.py qa_measured_learning_library.py tests/test_measured_learning_v2.py
      - name: Check V2 learner runtime syntax
        run: node --check measured-learning-library.js
      - name: Validate governance JSON
        run: |
          python -m json.tool data/measured-learning/v2-policy.json >/dev/null
          python -m json.tool data/measured-learning/source-readiness-v2.json >/dev/null
          python -m json.tool data/measured-learning/source-artifacts-v2.json >/dev/null
          python -m json.tool data/measured-learning/source-channels-v2.json >/dev/null
          python -m json.tool data/measured-learning/case-requirements-v2.json >/dev/null
          python -m json.tool data/measured-learning/feature-methods-v1.json >/dev/null
          python -m json.tool data/measured-learning/binding-template-v2.json >/dev/null
          python -m json.tool data/measured-learning/expansion-manifest-v2.json >/dev/null
      - name: Run positive and negative V2 evidence tests
        run: python -m unittest -v tests.test_measured_learning_v2
      - name: Prove pinned public OpenMMS source and extract unreviewed compact candidate
        run: python tools/prove_openmms_measured_source.py
      - name: Prove pinned AVAPS dataset1 archive schema
        run: python tools/prove_avaps_measured_source.py
      - name: Prove pinned Sustainability publisher supplement
        run: python tools/prove_sustainability_measured_source.py
      - name: Prove benchmark-pinned open Mendeley workbook schemas
        run: python tools/prove_mendeley_open_sources.py
      - name: Upload compact source proofs only
        uses: actions/upload-artifact@v6
        with:
          name: measured-learning-source-proofs
          path: measured-source-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Validate release catalogue, promoted evidence and gated 100-case capacity
        run: python qa_measured_learning_library.py
      - name: Enforce learner payload boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('data/measured-learning/v2-policy.json').read_text())
          hard=policy['payloadBudget']['hardCaseBytes']
          aggregate=policy['payloadBudget']['aggregatePromotedBytes']
          root=Path('data/measured-learning')
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() != '.json']
          assert not bad, f'Unexpected learner-data file types: {bad}'
          cases=root/'cases'
          total=0
          if cases.exists():
              for p in cases.glob('MLM-*.json'):
                  size=p.stat().st_size
                  assert size <= hard, f'Individual measured learner asset exceeds {hard} bytes: {p}'
                  total += size
          assert total <= aggregate, f'Aggregate measured learner payload exceeds {aggregate} bytes: {total}'
          PY
