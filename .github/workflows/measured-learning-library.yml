name: MouldMaster Measured Learning Library

on:
  pull_request:
    paths:
      - 'data/measured-learning/**'
      - 'measured-learning-library.js'
      - 'measured-learning-library.css'
      - 'tools/build_measured_learning_case.py'
      - 'qa_measured_learning_library.py'
      - 'sources/MEASURED_LEARNING_LIBRARY_V1.md'
      - 'sources/MEASURED_LEARNING_LIBRARY_V2.md'
      - '.github/workflows/measured-learning-library.yml'
  push:
    branches: [main]
    paths:
      - 'data/measured-learning/**'
      - 'measured-learning-library.js'
      - 'measured-learning-library.css'
      - 'tools/build_measured_learning_case.py'
      - 'qa_measured_learning_library.py'
      - 'sources/MEASURED_LEARNING_LIBRARY_V1.md'
      - 'sources/MEASURED_LEARNING_LIBRARY_V2.md'
      - '.github/workflows/measured-learning-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile V2 promotion tooling
        run: python -m py_compile tools/build_measured_learning_case.py qa_measured_learning_library.py
      - name: Check V2 learner runtime syntax
        run: node --check measured-learning-library.js
      - name: Validate governance JSON
        run: |
          python -m json.tool data/measured-learning/v2-policy.json >/dev/null
          python -m json.tool data/measured-learning/source-readiness-v2.json >/dev/null
          python -m json.tool data/measured-learning/feature-methods-v1.json >/dev/null
          python -m json.tool data/measured-learning/binding-template-v2.json >/dev/null
      - name: Validate 70-case release catalogue and 100-case V2 capacity
        run: python qa_measured_learning_library.py
      - name: Enforce learner payload boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('data/measured-learning/v2-policy.json').read_text())
          hard=policy['payloadBudget']['hardCaseBytes']
          aggregate=policy['payloadBudget']['aggregatePromotedBytes']
          root=Path('data/measured-learning')
          allowed={'.json'}
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() not in allowed]
          assert not bad, f'Unexpected learner-data file types: {bad}'
          cases=root/'cases'
          total=0
          if cases.exists():
              for p in cases.glob('MLM-*.json'):
                  size=p.stat().st_size
                  assert size <= hard, f'Individual measured learner asset exceeds {hard} bytes: {p}'
                  total += size
          assert total <= aggregate, f'Aggregate measured learner payload exceeds {aggregate} bytes: {total}'
          PY
