name: Raw Core Containment Stage

on:
  push:
    branches: [fix/audit-remediation-2026-09-16]

permissions:
  contents: write

concurrency:
  group: raw-core-containment-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/audit-remediation-2026-09-16
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Move supported assembly to non-executable payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if old not in s:
                  if new in s:return
                  raise SystemExit(f'{path}: expected marker not found: {old!r}')
              p.write_text(s.replace(old,new) if count is None else s.replace(old,new,count),encoding='utf-8')

          core=Path('MouldMaster_Core_App.html')
          payload=Path('src/core-runtime/core-source.txt')
          if payload.read_bytes()!=core.read_bytes():raise SystemExit('core-source.txt must remain byte-identical to frozen core')

          replace('index.html','const CORE_URL="./MouldMaster_Core_App.html";','const CORE_URL="./src/core-runtime/core-source.txt";')
          replace('service-worker.js',"  './MouldMaster_Core_App.html',\n","  './src/core-runtime/core-source.txt',\n",1)

          package=Path('desktop/electron/package.json');s=package.read_text(encoding='utf-8')
          block='''      {\n        "from": "../../MouldMaster_Core_App.html",\n        "to": "mouldmaster/MouldMaster_Core_App.html"\n      },\n'''
          if block in s:s=s.replace(block,'',1)
          elif '"../../MouldMaster_Core_App.html"' in s:raise SystemExit('desktop raw-core package block shape changed')
          package.write_text(s,encoding='utf-8')

          integrity=Path('desktop/electron/scripts/generate-integrity.cjs');s=integrity.read_text(encoding='utf-8')
          old="  'index.html','MouldMaster_Core_App.html','manifest.webmanifest'"
          new="  'index.html','manifest.webmanifest'"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('desktop integrity base-file marker changed')
          integrity.write_text(s,encoding='utf-8')

          tool=Path('tools/externalize_core_scripts.py');s=tool.read_text(encoding='utf-8')
          old='OUT_DIR = ROOT / "src/core-runtime"\nSERVICE_WORKER = ROOT / "service-worker.js"'
          new='OUT_DIR = ROOT / "src/core-runtime"\nASSEMBLY_PAYLOAD = OUT_DIR / "core-source.txt"\nSERVICE_WORKER = ROOT / "service-worker.js"'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize payload constant marker changed')
          old='    marker = "  \'./MouldMaster_Core_App.html\',\\n"'
          new='    marker = "  \'./src/core-runtime/core-source.txt\',\\n"'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize worker insertion marker changed')
          old='''    core = CORE.read_text(encoding="utf-8")\n    index = INDEX.read_text(encoding="utf-8")\n    expected = expected_assets(core)\n'''
          new='''    core = CORE.read_text(encoding="utf-8")\n    index = INDEX.read_text(encoding="utf-8")\n    if not ASSEMBLY_PAYLOAD.is_file() or ASSEMBLY_PAYLOAD.read_bytes() != CORE.read_bytes():\n        fail("non-executable core assembly payload is missing or differs from the frozen core")\n    if 'const CORE_URL="./src/core-runtime/core-source.txt";' not in index:\n        fail("browser bootstrap must assemble from the non-executable core-source.txt payload")\n    expected = expected_assets(core)\n'''
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize check-state insertion marker changed')
          old='''    worker = SERVICE_WORKER.read_text(encoding="utf-8")\n    for name in expected_names:\n'''
          new='''    worker = SERVICE_WORKER.read_text(encoding="utf-8")\n    if "'./src/core-runtime/core-source.txt'" not in worker:\n        fail("service-worker CORE must cache the non-executable core assembly payload")\n    core_array = re.search(r"const\\s+CORE\\s*=\\s*\\[(.*?)\\]\\s*;", worker, re.S)\n    if not core_array or "'./MouldMaster_Core_App.html'" in core_array.group(1):\n        fail("supported web cache must not publish the executable raw core HTML")\n    for name in expected_names:\n'''
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize worker-check insertion marker changed')
          old='''    package = DESKTOP_PACKAGE.read_text(encoding="utf-8")\n    if '"../../src/core-runtime"' not in package:\n        fail("desktop package does not include src/core-runtime")\n    integrity = DESKTOP_INTEGRITY.read_text(encoding="utf-8")\n'''
          new='''    package = DESKTOP_PACKAGE.read_text(encoding="utf-8")\n    if '"../../src/core-runtime"' not in package:\n        fail("desktop package does not include src/core-runtime")\n    if '"../../MouldMaster_Core_App.html"' in package:\n        fail("desktop package must not expose the executable raw core HTML")\n    integrity = DESKTOP_INTEGRITY.read_text(encoding="utf-8")\n    if "'MouldMaster_Core_App.html'" in integrity:\n        fail("desktop integrity base files must not publish the executable raw core HTML")\n'''
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize desktop-check insertion marker changed')
          old='''    core = CORE.read_text(encoding="utf-8")\n    expected = expected_assets(core)\n    OUT_DIR.mkdir(parents=True, exist_ok=True)\n'''
          new='''    core = CORE.read_text(encoding="utf-8")\n    expected = expected_assets(core)\n    OUT_DIR.mkdir(parents=True, exist_ok=True)\n    ASSEMBLY_PAYLOAD.write_bytes(CORE.read_bytes())\n'''
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('externalize apply payload insertion marker changed')
          tool.write_text(s,encoding='utf-8')

          qa=Path('qa_audit_remediation_20260915_6.py');s=qa.read_text(encoding='utf-8')
          marker="sw=text('service-worker.js')\nneed(\"const CACHE_VERSION='2026.09.15.6';\" in sw,'service-worker release identity stale')\n"
          addition=marker+"core=ROOT/'MouldMaster_Core_App.html';payload=ROOT/'src/core-runtime/core-source.txt'\nneed(payload.is_file() and payload.read_bytes()==core.read_bytes(),'non-executable core assembly payload must be byte-identical to frozen core')\nindex=text('index.html');need('const CORE_URL=\"./src/core-runtime/core-source.txt\";' in index,'supported bootstrap must assemble from non-executable core source')\n"
          if 'non-executable core assembly payload must be byte-identical' not in s:
              if marker not in s:raise SystemExit('audit QA raw-core insertion marker missing')
              s=s.replace(marker,addition,1)
          old="for marker in [\"const LEGACY_CORE_PATH=new URL('./MouldMaster_Core_App.html',self.registration.scope).pathname;\",\"if(url.pathname===LEGACY_CORE_PATH)return index||offlineDocumentResponse();\",\"not a supported learner-facing web entry point\"]:\n need(marker in sw,f'legacy raw-core navigation containment missing: {marker}')\n"
          new=old+"core_match=__import__('re').search(r'const\\s+CORE\\s*=\\s*\\[(.*?)\\]\\s*;',sw,__import__('re').S)\nneed(core_match and \"'./src/core-runtime/core-source.txt'\" in core_match.group(1),'service-worker CORE must cache non-executable core source')\nneed(\"'./MouldMaster_Core_App.html'\" not in core_match.group(1),'service-worker CORE must not publish raw executable core HTML')\npackage=text('desktop/electron/package.json');need('../../MouldMaster_Core_App.html' not in package,'desktop package must not publish raw executable core HTML')\n"
          if 'desktop package must not publish raw executable core HTML' not in s:
              if old not in s:raise SystemExit('audit QA legacy-core marker block missing')
              s=s.replace(old,new,1)
          qa.write_text(s,encoding='utf-8')
          PY
      - name: Focused containment validation
        run: |
          python tools/externalize_core_scripts.py --check
          node --check service-worker.js
          python tools/generate_runtime_manifest.py --check
          python qa_release.py
          python qa_release_docs.py
          python qa_audit_remediation_20260915_6.py
          python tools/build_pages_artifact.py
          test ! -e .pages-dist/MouldMaster_Core_App.html
          test -f .pages-dist/src/core-runtime/core-source.txt
          cmp -s MouldMaster_Core_App.html .pages-dist/src/core-runtime/core-source.txt
          python tools/verify_pwa_physical_evidence.py --artifact .pages-dist --print-fingerprint
      - name: Commit supported-runtime containment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js desktop/electron/package.json desktop/electron/scripts/generate-integrity.cjs tools/externalize_core_scripts.py qa_audit_remediation_20260915_6.py src/core-runtime/core-source.txt
          git diff --cached --check
          git commit -m '[audit-remediation-generated] Remove executable raw core from supported distribution'
          git push origin HEAD:fix/audit-remediation-2026-09-16

# Re-run after release-QA assertions were migrated to the non-executable core source.
