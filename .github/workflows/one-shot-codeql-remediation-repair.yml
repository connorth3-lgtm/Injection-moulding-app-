name: Repair One-shot CodeQL Remediation

on:
  push:
    branches:
      - code-scanning-remediation-2026-09-11
    paths:
      - .github/workflows/one-shot-codeql-remediation-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Correct allowlist patch matcher and retrigger remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/one-shot-code-scanning-remediation.yml')
          text=path.read_text(encoding='utf-8')
          old="bridge = replace_once(bridge, '  \"openDefect\",\\n', '  \"openDefect\",\\n  \"openDefectCoach\",\\n', 'handler allowlist')"
          new='bridge = replace_once(bridge, "\'openCourse\',\'openDefect\',\'openMaterialChapter\'", "\'openCourse\',\'openDefect\',\'openDefectCoach\',\'openMaterialChapter\'", \'handler allowlist\')'
          if text.count(old) != 1:
              raise SystemExit(f'expected one broken allowlist matcher, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/one-shot-codeql-remediation-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair CodeQL remediation matcher'
          git push origin HEAD:code-scanning-remediation-2026-09-11
