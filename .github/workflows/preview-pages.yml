name: MouldMaster Preview Pages

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Require merged-PR preview provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/verify_preview_source.py --self-test
          python3 tools/verify_preview_source.py \
            --repository "${{ github.repository }}" \
            --source-sha "${{ github.sha }}"
      - name: Require exact-head preview quality gates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=(integrity mobile-browser question-quality-50-pass)
          for attempt in {1..90}; do
            checks="$(gh api -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?per_page=100")"
            pending=0
            failed=0
            for name in "${required[@]}"; do
              state="$(printf '%s' "$checks" | python3 -c 'import json,sys; d=json.load(sys.stdin); n=sys.argv[1]; xs=[x for x in d.get("check_runs",[]) if x.get("name")==n]; xs.sort(key=lambda x: (x.get("completed_at") or x.get("started_at") or x.get("created_at") or "", int(x.get("id") or 0)), reverse=True); print("missing" if not xs else (xs[0].get("conclusion") or xs[0].get("status") or "unknown"))' "$name")"
              case "$state" in
                success) echo "$name: success" ;;
                queued|in_progress|pending|requested|waiting|missing) echo "$name: $state"; pending=1 ;;
                *) echo "::error::$name failed or was not successful: $state"; failed=1 ;;
              esac
            done
            if [ "$failed" -ne 0 ]; then exit 1; fi
            if [ "$pending" -eq 0 ]; then
              echo "Exact-head preview gates passed for $SOURCE_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for exact-head preview quality gates."
          exit 1
      - name: Validate preview build contracts
        run: |
          python3 qa_pages_single_publisher.py
          python3 qa_pages_candidate_handoff.py
          python3 qa_release_supply_chain.py
          python3 tools/verify_pwa_physical_evidence.py --contract-only
      - name: Build governed preview candidate
        run: python3 tools/build_pages_artifact.py
      - name: Build release-hold shell with preview candidate
        run: python3 tools/build_pages_hold.py --preview-source .pages-dist
      - name: Upload preview Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-hold

  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    needs: build
    concurrency:
      group: mouldmaster-pages-site-publish
      cancel-in-progress: false
    environment:
      name: preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact preview source before deployment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recheck current merged preview provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_preview_source.py
          --repository "${{ github.repository }}"
          --source-sha "${{ github.sha }}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy preview branch artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    permissions:
      contents: read
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify preview deployment
        run: >-
          python3 tools/verify_pages_hold.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --expected-source-sha "${{ github.sha }}"
          --convergence-attempts 12
          --convergence-delay 2
