name: Release External Validation Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: release-external-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-external-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify release-specific external validation boundaries
        run: python tools/verify_release_external_validation.py
      - name: Verify exact release validation packets
        run: python qa_release_validation_packets.py
      - name: Verify live retained artifact and external tracker bindings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/verify_external_validation_live_bindings.py
          --repository "${{ github.repository }}"
      - name: Verify External Validation Wave 1 integrity
        run: python qa_external_validation_wave1.py
      - name: Exercise native ruleset verifier contract
        run: python tools/verify_main_ruleset.py --self-test
      - name: Verify live native main ruleset against canonical policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_main_ruleset.py --repository "${{ github.repository }}"
      - name: Preserve human and operational evidence boundary
        run: |
          echo 'PASS means unsupported external-validation claims are blocked.'
          echo 'PASS also means the live native main ruleset matches the canonical independent-review policy and release-bound execution packets are internally coherent.'
          echo 'It does not mean human AT, physical-device, Windows, SME, learner or site evidence has been performed.'