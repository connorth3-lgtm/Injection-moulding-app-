name: MouldMaster Public Measured Benchmark — polypropylene pvT stage 1

on:
  push:
    branches: [data/real-dataset-profiling-wave2]
    paths:
      - 'tools/run_public_benchmark_6k8fpbrd9s_stage1.py'
      - 'qa_public_benchmark_6k8fpbrd9s_stage1.py'
      - 'data/public-benchmark-contracts/6k8fpbrd9s-v1.json'
      - '.github/workflows/public-benchmark-6k8fpbrd9s-stage1.yml'
  pull_request:
    branches: [data/real-dataset-profiling-wave1, main]
    paths:
      - 'tools/run_public_benchmark_6k8fpbrd9s_stage1.py'
      - 'qa_public_benchmark_6k8fpbrd9s_stage1.py'
      - 'data/public-benchmark-contracts/6k8fpbrd9s-v1.json'
      - '.github/workflows/public-benchmark-6k8fpbrd9s-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate pvT evidence boundaries
        run: python qa_public_benchmark_6k8fpbrd9s_stage1.py
      - name: Enumerate publisher file manifest only
        run: |
          mkdir -p benchmark-results
          python tools/run_public_benchmark_6k8fpbrd9s_stage1.py \
            --output benchmark-results/6k8fpbrd9s-stage1.json \
            --retrieved-date "$(date -u +%F)"
      - name: Validate aggregate manifest
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark-results/6k8fpbrd9s-stage1.json'))
          assert x['status'] in {'publisher-file-manifest-profiled', 'publisher-record-no-files-exposed'}
          assert x['source']['datasetDoi']=='10.17632/6k8fpbrd9s.1'
          assert x['source']['license']=='CC BY 4.0'
          assert x['manifest']['rawPayloadsDownloaded'] is False
          assert x['manifest']['rawRowsOrArraysEmitted'] is False
          assert x['acceptance']['countsAsFullyProfiledMeasuredDataset'] is False
          assert x['acceptance']['acceptedMeasuredTimeSeriesSamples']==0
          print(json.dumps({
            'status': x['status'],
            'fileCount': x['manifest']['fileCount'],
            'totalBytes': x['manifest']['totalBytes'],
            'supportedStage2Files': x['manifest']['supportedStage2Files'],
            'files': x['manifest']['files'],
          }, indent=2))
          PY
      - name: Upload aggregate pvT manifest only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouldmaster-polypropylene-pvt-stage1
          path: benchmark-results/6k8fpbrd9s-stage1.json
          if-no-files-found: error
          retention-days: 30