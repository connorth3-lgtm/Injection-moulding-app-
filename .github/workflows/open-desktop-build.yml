  push:
    branches: [main]
    paths:
      - 'desktop/electron/**'
      - 'index.html'
      - 'MouldMaster_Core_App.html'
      - 'MouldMaster_Academy_App.html'
      - 'manifest.webmanifest'
      - 'mouldmaster-192.png'
      - 'mouldmaster-512.png'
      - 'version.json'
      - 'reading-patch.css'
      - 'reading-patch.js'
      - 'training-upgrade.js'
      - 'training-qa-fix.js'
      - 'assessment-100-pass.js'
      - 'assessment-deep-dive.js'
      - 'assessment-answer-cue-fix.js'
      - 'assessment-storage-scope.js'
      - 'assessment-quality-suite.js'
      - 'assessment-stable-review-bridge.js'
      - 'assessment-analytics-ui.js'
      - 'assessment-final-hardening.js'
      - 'assessment-ux.js'
      - 'assessment-evidence-sources.js'
      - 'evidence-maturity-deep-dive.js'
      - 'evidence-maturity-formal-bridge.js'
      - 'lesson-evidence-depth.js'
      - 'assessment-evidence-approval.js'
      - 'app-shell-registry.js'
      - 'pwa-shell.js'
      - 'learning-experience.js'
      - 'process-data-diagnostics.js'
      - 'process-data-deep-dive-machine.js'
      - 'process-data-deep-dive-tooling.js'
      - 'process-data-deep-dive-material.js'
      - 'process-data-deep-dive-scientific.js'
      - 'process-data-deep-dive-quality.js'
      - 'process-data-deep-dive-50.js'
      - 'curriculum-integration.js'
      - 'specialist-curriculum.js'
      - 'mould-master-workspace.js'
      - 'app-shell-finalize.js'
      - 'learning-analytics.js'
      - 'source-library.js'
      - 'reference-data.js'
      - 'reference-data.html'
      - 'reference-deep-dive.js'
      - 'reference-research-extension.js'
      - 'reference-20x-extension.js'
      - 'reference-2026-expansion.js'
      - 'reference-sources.js'
      - 'reference-browser-ui.js'
      - 'diagnostic-learning-labs.js'
      - 'material-behaviour-labs.js'
      - 'qa_release_docs.py'
      - 'qa_reference.py'
      - 'qa_reference_expansion.py'
      - 'qa_research.py'
      - 'qa_100_pass.py'
      - 'qa_question_deep_dive.py'
      - 'qa_assessment_quality.py'
      - 'qa_assessment_evidence.py'
      - 'qa_evidence_maturity.py'
      - 'qa_learning_experience.py'
      - 'qa_app_shell_registry.py'
      - 'qa_mould_master_workspace.py'
      - 'qa_process_data_diagnostics.py'
      - 'qa_process_data_deep_dive_50.py'
      - 'qa_curriculum_integration.py'
      - 'qa_specialist_curriculum.py'
      - 'qa_learning_analytics.py'
      - 'qa_material_behaviour.py'
      - 'qa_assessment_storage_scope.py'
      - 'qa_stable_review_bridge.py'
      - 'qa_assessment_final_hardening.py'
      - 'qa_assessment_ux.py'
      - 'qa_source_freshness.py'
      - 'qa_research_source_freshness.py'
      - 'README.md'
      - 'ANDROID_INSTALL_README.txt'
      - 'UPLOAD_README.txt'
      - 'sources/ASSESSMENT_AND_DATA_100_PASS_AUDIT.md'
      - 'sources/QUESTION_BANK_DEEP_DIVE.md'
      - 'sources/QUESTION_BANK_CHANGELOG.md'
      - 'sources/QUESTION_APPROVAL_POLICY.md'
      - 'sources/QUESTION_REVISION_INDEX.json'
      - 'sources/SOURCE_FRESHNESS.json'
      - 'sources/RESEARCH_SOURCE_FRESHNESS.json'
      - 'service-worker.js'
      - 'privacy.html'
      - 'support.html'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/open-desktop-build.yml'
      - '.github/workflows/source-freshness.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require committed dependency lock
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/electron/package-lock.json')) {
            Write-Error 'desktop/electron/package-lock.json is missing. Let Desktop Dependency Lock finish first.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: desktop/electron/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact locked dependencies
        working-directory: desktop/electron
        run: npm ci --no-audit --fund=false
      - name: Generate asset integrity manifest
        working-directory: desktop/electron
        run: npm run integrity
      - name: Generate dependency licence inventory
        working-directory: desktop/electron
        run: npm run licenses
      - name: Generate CycloneDX SBOM
        working-directory: desktop/electron
        run: npm run sbom
      - name: Desktop security QA
        working-directory: desktop/electron
        run: npm run qa
      - name: Release and documentation coherence
        working-directory: .
        run: python qa_release_docs.py
      - name: Material behaviour learning QA
        working-directory: .
        run: python qa_material_behaviour.py
      - name: 100-pass data and assessment audit
        working-directory: .
        run: python qa_100_pass.py
      - name: Deep question and answer QA
        working-directory: .
        run: python qa_question_deep_dive.py
      - name: Assessment quality, blueprint and analytics QA
        working-directory: .
        run: python qa_assessment_quality.py
      - name: Question evidence approval QA
        working-directory: .
        run: python qa_assessment_evidence.py
      - name: Evidence maturity seven-gap deep dive
        working-directory: .
        run: python qa_evidence_maturity.py
      - name: Guided process-data diagnostic QA
        working-directory: .
        run: python qa_process_data_diagnostics.py
      - name: 50-case process-data deep dive QA
        working-directory: .
        run: python qa_process_data_deep_dive_50.py
      - name: Learner experience progression and mobile QA
        working-directory: .
        run: python qa_learning_experience.py
      - name: Canonical app shell registry QA
        working-directory: .
        run: python qa_app_shell_registry.py
      - name: Mould Master evidence workspace QA
        working-directory: .
        run: python qa_mould_master_workspace.py
      - name: Curriculum theory-practice-evidence integration
        working-directory: .
        run: python qa_curriculum_integration.py
      - name: Specialist curriculum gap extensions
        working-directory: .
        run: python qa_specialist_curriculum.py
      - name: Privacy-preserving learner validation analytics
        working-directory: .
        run: python qa_learning_analytics.py
      - name: Learner-scoped assessment storage QA
        working-directory: .
        run: python qa_assessment_storage_scope.py
      - name: Stable spaced-review ID QA
        working-directory: .
        run: python qa_stable_review_bridge.py
      - name: Final assessment revision and timing hardening QA
        working-directory: .
        run: python qa_assessment_final_hardening.py
      - name: Assessment interaction and readability QA
        working-directory: .
        run: python qa_assessment_ux.py
      - name: Authoritative source freshness metadata
        working-directory: .
        run: python qa_source_freshness.py
      - name: Research DOI freshness metadata
        working-directory: .
        run: python qa_research_source_freshness.py
      - name: Reference data and source QA
        working-directory: .
        run: python qa_reference.py
      - name: Expanded reference library QA
        working-directory: .
        run: python qa_reference_expansion.py
      - name: Plugin-backed research QA
        working-directory: .
        run: python qa_research.py
      - name: Build unsigned portable Windows package
        working-directory: desktop/electron
        run: npm run dist:portable
      - name: Record release hashes
        shell: pwsh
        run: |
          Get-ChildItem 'desktop/electron/dist' -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content 'desktop/electron/dist/SHA256SUMS.txt'
          git rev-parse HEAD | Set-Content 'desktop/electron/dist/SOURCE_COMMIT.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: mouldmaster-open-desktop-windows
          path: |
            desktop/electron/dist/*.exe
            desktop/electron/dist/SHA256SUMS.txt
            desktop/electron/dist/SOURCE_COMMIT.txt
            desktop/electron/generated/integrity.json
            desktop/electron/generated/dependency-licenses.json
            desktop/electron/generated/sbom.cdx.json
            assessment-quality-report.json
            evidence-maturity-report.json
            source-freshness-report.json
            research-source-freshness-report.json
          if-no-files-found: error