name: MouldMaster Deep Dive v2 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-deep-dive-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-dive-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Deep Dive v2 target and seed integrity
        run: python qa_deep_dive_v2.py
      - name: Upload Deep Dive v2 programme report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouldmaster-deep-dive-v2
          path: deep-dive-v2-report.json
          if-no-files-found: error
