name: Premium UI Review Stage

on:
  push:
    branches: [design/premium-polish-20260916]

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply premium treatment to visible learner surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('premium-ui.css')
          s=p.read_text(encoding='utf-8')
          marker='/* Premium dynamic learner surfaces — governed migration layer. */'
          if marker not in s:
              s += r'''

/* Premium dynamic learner surfaces — governed migration layer. */
body #dashboard .mm-today-focus{
  position:relative;
  overflow:hidden;
  padding:25px 26px;
  margin-bottom:18px;
  border:1px solid rgba(95,224,198,.28);
  border-radius:20px;
  background:linear-gradient(120deg,rgba(18,52,64,.98),rgba(13,32,50,.99) 58%,rgba(14,28,46,.99));
  box-shadow:0 18px 44px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.04);
}
body #dashboard .mm-today-focus::after{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  right:-110px;
  top:-150px;
  pointer-events:none;
  border-radius:50%;
  background:radial-gradient(circle,rgba(95,224,198,.15),rgba(122,181,255,.055) 44%,transparent 70%);
}
body #dashboard .mm-today-focus>div,
body #dashboard .mm-today-focus>button{position:relative;z-index:1}
body #dashboard .mm-today-focus h2{
  margin:5px 0 7px;
  font-size:clamp(25px,3vw,32px);
  line-height:1.1;
  letter-spacing:-.035em;
  color:var(--mm-text-strong);
}
body #dashboard .mm-today-focus p{color:#b5c6d6;line-height:1.58;max-width:760px}
body #dashboard .mm-today-meta{gap:8px;margin-top:12px}
body #dashboard .mm-today-meta .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
body #dashboard .mm-today-focus>button{min-width:154px;box-shadow:0 10px 26px rgba(0,0,0,.18)}

body #dashboard .mm-curriculum-focus,
body #dashboard .mm-specialist-strip{
  border:1px solid rgba(128,172,208,.18);
  border-radius:17px;
  background:linear-gradient(180deg,rgba(15,32,50,.98),rgba(10,24,39,.99));
  box-shadow:0 10px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.025);
}
body #dashboard .mm-curriculum-focus{padding:18px 20px;margin:0 0 14px}
body #dashboard .mm-curriculum-focus b{display:block;margin-top:4px;color:#f0f7fd;letter-spacing:-.012em}
body #dashboard .mm-curriculum-focus p{color:#9fb2c5;line-height:1.5}
body #dashboard .mm-specialist-strip{padding:18px 20px}

body #lesson .mm-learning-progress{
  padding:15px 17px;
  margin:-4px 0 18px;
  border:1px solid rgba(126,171,208,.22);
  border-radius:15px;
  background:linear-gradient(180deg,rgba(14,31,49,.99),rgba(10,24,39,.99));
  box-shadow:0 8px 22px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.02);
}
body #lesson .mm-learning-progress strong{letter-spacing:-.012em;color:#f2f8fd}
body #lesson .mm-learning-progress small{color:#98adc2}
body #lesson .mm-learning-jumps{gap:8px;margin-bottom:19px}
body #lesson .mm-learning-jumps button{
  min-height:40px;
  padding:8px 12px;
  border:1px solid rgba(128,174,211,.22);
  border-radius:999px;
  background:#10263b;
  color:#c9d9e8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  transition:background .16s var(--mm-ease),border-color .16s var(--mm-ease),color .16s var(--mm-ease),transform .16s var(--mm-ease);
}
body #lesson .mm-learning-jumps button:hover,
body #lesson .mm-learning-jumps button:focus-visible{
  border-color:rgba(95,224,198,.5);
  background:#17344b;
  color:#f5fffd;
  transform:translateY(-1px);
}
body #lesson .mm-next-card{
  margin-top:22px;
  padding:20px;
  border:1px solid rgba(95,224,198,.22);
  border-radius:17px;
  background:linear-gradient(125deg,rgba(16,47,58,.98),rgba(13,31,49,.99) 62%,rgba(15,28,46,.99));
  box-shadow:0 12px 32px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.03);
}
body #lesson .mm-next-card h3{letter-spacing:-.02em;color:#f4f9fd}
body #lesson .mm-next-card p{color:#aebfd0;line-height:1.56}
body #lesson .mm-note-status{color:#8fa5ba}

@media(max-width:760px){
  body #dashboard .mm-today-focus{padding:18px;border-radius:17px;gap:12px}
  body #dashboard .mm-today-focus h2{font-size:24px}
  body #dashboard .mm-today-focus>button{width:100%;min-width:0}
  body #dashboard .mm-curriculum-focus{align-items:flex-start;padding:15px;gap:12px}
  body #lesson .mm-learning-progress{padding:13px 14px;border-radius:13px}
  body #lesson .mm-next-card{padding:16px;border-radius:14px}
}

@media(prefers-reduced-motion:reduce){
  body #lesson .mm-learning-jumps button:hover,
  body #lesson .mm-learning-jumps button:focus-visible{transform:none}
}
'''
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-ui.css
          if ! git diff --cached --quiet; then
            git commit -m '[premium-visible-generated] Polish actual dashboard and lesson surfaces'
            git push
          fi
      - name: Measure premium UI migration debt
        run: |
          printf 'premium-ui.css !important count: '
          grep -o '!important' premium-ui.css | wc -l
      - name: Premium UI static governance
        run: python qa_premium_ui.py
      - name: Install browser review matrix
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start review server
        run: |
          mkdir -p qa-artifacts/premium-review
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mm-premium-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mm-premium-http.log
          exit 1
      - name: Run Chromium premium interaction contract
        run: npx playwright test --config=playwright.premium.config.cjs --project=chromium-premium
      - name: Run WebKit premium interaction contract
        run: npx playwright test --config=playwright.premium.config.cjs --project=webkit-premium
      - name: Capture desktop and mobile design review screenshots
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const user={id:'premium-review',name:'Premium Review',role:'learner',completed:[1,2,3],bookmarks:[],notes:{},examScores:{},certificates:[],currentLesson:4,lastSeen:'2026-09-16T00:00:00.000Z',onboardingDone:true,experience:'Beginner',goal:'Learn the full process',dailyMinutes:15,region:'ALL'};
            for(const profile of [
              {name:'desktop',viewport:{width:1440,height:1100},scale:1},
              {name:'mobile',viewport:{width:390,height:844},scale:1}
            ]){
              const page=await browser.newPage({viewport:profile.viewport,deviceScaleFactor:profile.scale});
              await page.addInitScript(({user})=>{
                localStorage.clear();
                localStorage.setItem('mouldmasterProDB',JSON.stringify({activeUser:user.id,users:{[user.id]:user}}));
              },{user});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>Boolean(window.MM_APP_SHELL_FINALIZED)&&typeof window.switchView==='function');
              await page.waitForFunction(()=>!document.getElementById('mmBootstrap'));
              const shots=[
                ['home',async()=>page.evaluate(()=>switchView('dashboard'))],
                ['learn',async()=>page.evaluate(()=>switchView('path'))],
                ['practice',async()=>page.evaluate(()=>switchView('scenarios'))],
                ['lesson',async()=>page.evaluate(()=>{goLesson(4);switchView('lesson')})]
              ];
              for(const [surface,act] of shots){
                await act(); await page.waitForTimeout(300);
                await page.screenshot({path:`qa-artifacts/premium-review/${profile.name}-${surface}.png`,fullPage:true});
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload premium UI review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: premium-ui-review
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14
