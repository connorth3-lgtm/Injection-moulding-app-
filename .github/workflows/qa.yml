name: MouldMaster Release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check service-worker.js
          node --check reading-patch.js
          node --check training-upgrade.js
          node --check training-qa-fix.js
          node --check pwa-shell.js
      - name: Release and assessment integrity
        run: python qa_release.py
