name: MouldMaster Release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find src/domains -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find desktop/electron/src desktop/electron/scripts -type f -name '*.cjs' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Release and assessment integrity
        run: python qa_release.py
      - name: Runtime shell hardening
        run: python qa_runtime_hardening.py
      - name: Release and documentation coherence
        run: python qa_release_docs.py
      - name: Repository governance integrity
        run: python qa_repo_governance.py
      - name: Critical GitHub Actions version integrity
        run: python qa_critical_actions_versions.py
      - name: Architecture debt ceiling
        run: python qa_architecture_debt.py
      - name: App-wide data and runtime deep audit
        run: python qa_app_wide_audit.py
      - name: Canonical master-data reconciliation
        run: python qa_master_data_compile.py
      - name: Diagnostic learning integrity
        run: python qa_diagnostic_learning.py
      - name: Material behaviour integrity
        run: python qa_material_behaviour.py
      - name: 100-pass data and assessment audit
        run: python qa_100_pass.py
      - name: Deep question and answer integrity
        run: python qa_question_deep_dive.py
      - name: Assessment quality, blueprint and analytics integrity
        run: python qa_assessment_quality.py
      - name: Question evidence approval integrity
        run: python qa_assessment_evidence.py
      - name: Psychometric production integration integrity
        run: python qa_psychometric_integration.py
      - name: Evidence maturity seven-gap deep dive
        run: python qa_evidence_maturity.py
      - name: Guided process-data diagnostic integrity
        run: python qa_process_data_diagnostics.py
      - name: 50-case process-data deep dive
        run: python qa_process_data_deep_dive_50.py
      - name: 20-pass 200-case process-data atlas
        run: python qa_process_data_20_pass.py
      - name: Cross-library 264-case process-data sweep
        run: python qa_process_data_sweep.py
      - name: 50-pass real measured-evidence audit
        run: python qa_measured_evidence_50_pass.py
      - name: Canonical measured-evidence runtime integration
        run: python qa_measured_evidence_integration.py
      - name: Evidence-to-decision workflow integrity
        run: python qa_measured_evidence_decision_workflows.py
      - name: Content scale target integrity
        run: python qa_content_scale_targets.py
      - name: Full-scale draft bank integrity
        run: python qa_content_scale_drafts.py
      - name: Local real-data intake privacy integrity
        run: python qa_process_data_local_intake.py
      - name: Real process-data pilot readiness
        run: python qa_real_process_data_pilot.py
      - name: Real-site human feedback contract
        run: python qa_real_site_feedback_contract.py
      - name: Learner experience progression and mobile integrity
        run: python qa_learning_experience.py
      - name: Canonical app shell registry integrity
        run: python qa_app_shell_registry.py
      - name: Mould Master evidence workspace integrity
        run: python qa_mould_master_workspace.py
      - name: Curriculum theory-practice-evidence integration
        run: python qa_curriculum_integration.py
      - name: Specialist curriculum gap extensions
        run: python qa_specialist_curriculum.py
      - name: Privacy-preserving learner validation analytics
        run: python qa_learning_analytics.py
      - name: Learner-scoped assessment storage integrity
        run: python qa_assessment_storage_scope.py
      - name: Stable spaced-review ID integrity
        run: python qa_stable_review_bridge.py
      - name: Final assessment revision and timing hardening
        run: python qa_assessment_final_hardening.py
      - name: Assessment interaction and readability integrity
        run: python qa_assessment_ux.py
      - name: Authoritative source freshness metadata
        run: python qa_source_freshness.py
      - name: Research DOI freshness metadata
        run: python qa_research_source_freshness.py
      - name: Reference data and source integrity
        run: python qa_reference.py
      - name: Expanded reference library integrity
        run: python qa_reference_expansion.py
      - name: Plugin-backed research integrity
        run: python qa_research.py
      - name: Open desktop release integrity
        run: python qa_open_desktop.py
      - name: Microsoft Store submission integrity
        run: python qa_store_submission.py
      - name: NZQA 2026 readiness integrity
        run: python qa_nzqa_readiness.py
      - name: IACET 2026 readiness integrity
        run: python qa_iacet_readiness.py
      - name: Upload process-data sweep report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-process-data-sweep
          path: process-data-sweep-report.json
          if-no-files-found: error
      - name: Upload measured-evidence report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-measured-evidence-50-pass
          path: measured-evidence-50-pass-report.json
          if-no-files-found: error
      - name: Upload measured-evidence integration report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-measured-evidence-integration
          path: measured-evidence-integration-report.json
          if-no-files-found: error
      - name: Upload evidence-decision workflow report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-evidence-decision-workflows
          path: measured-evidence-decision-workflow-report.json
          if-no-files-found: error
      - name: Upload real-site feedback contract report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-real-site-feedback-contract
          path: real-site-feedback-contract-report.json
          if-no-files-found: error
      - name: Upload critical Actions version report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-critical-actions-versions
          path: critical-actions-versions-report.json
          if-no-files-found: error
      - name: Upload content-scale target report
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-content-scale-targets
          path: content-scale-targets-report.json
          if-no-files-found: error
      - name: Upload evidence maturity audit
        uses: actions/upload-artifact@v7
        with:
          name: mouldmaster-evidence-maturity-audit
          path: evidence-maturity-report.json
          if-no-files-found: error