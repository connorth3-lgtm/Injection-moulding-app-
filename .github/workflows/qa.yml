name: MouldMaster Release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouldmaster-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check service-worker.js
          node --check reading-patch.js
          node --check training-upgrade.js
          node --check training-qa-fix.js
          node --check assessment-100-pass.js
          node --check assessment-deep-dive.js
          node --check assessment-answer-cue-fix.js
          node --check assessment-storage-scope.js
          node --check assessment-quality-suite.js
          node --check assessment-stable-review-bridge.js
          node --check assessment-analytics-ui.js
          node --check assessment-final-hardening.js
          node --check source-library.js
          node --check reference-data.js
          node --check reference-deep-dive.js
          node --check reference-research-extension.js
          node --check reference-20x-extension.js
          node --check reference-sources.js
          node --check reference-browser-ui.js
          node --check pwa-shell.js
          node --check desktop/electron/src/main.cjs
          node --check desktop/electron/scripts/generate-integrity.cjs
          node --check desktop/electron/scripts/generate-licenses.cjs
          node --check desktop/electron/scripts/generate-sbom.cjs
          node --check desktop/electron/scripts/qa.cjs
      - name: Release and assessment integrity
        run: python qa_release.py
      - name: Runtime shell hardening
        run: python qa_runtime_hardening.py
      - name: Release and documentation coherence
        run: python qa_release_docs.py
      - name: 100-pass data and assessment audit
        run: python qa_100_pass.py
      - name: Deep question and answer integrity
        run: python qa_question_deep_dive.py
      - name: Assessment quality, blueprint and analytics integrity
        run: python qa_assessment_quality.py
      - name: Learner-scoped assessment storage integrity
        run: python qa_assessment_storage_scope.py
      - name: Stable spaced-review ID integrity
        run: python qa_stable_review_bridge.py
      - name: Final assessment revision and timing hardening
        run: python qa_assessment_final_hardening.py
      - name: Authoritative source freshness metadata
        run: python qa_source_freshness.py
      - name: Research DOI freshness metadata
        run: python qa_research_source_freshness.py
      - name: Reference data and source integrity
        run: python qa_reference.py
      - name: Plugin-backed research integrity
        run: python qa_research.py
      - name: Open desktop release integrity
        run: python qa_open_desktop.py
