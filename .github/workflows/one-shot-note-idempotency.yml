name: One-shot note disclosure idempotency fix

on:
  push:
    branches:
      - fix/tighter-mobile-lesson-flow
    paths:
      - .github/workflows/one-shot-note-idempotency.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tighter-mobile-lesson-flow
      - name: Make note disclosure observer-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('lesson-simple-experience.js')
          text=path.read_text(encoding='utf-8')
          old="""  const label=details.querySelector('[data-mm-simple-note-label]');
  const syncLabel=()=>{if(label)label.textContent=area.value.trim()?'Edit note':'Add note'};
  syncLabel();
  if(area.dataset.mmSimpleNoteBound!=='1'){
    area.dataset.mmSimpleNoteBound='1';
    area.addEventListener('input',syncLabel);
  }
  const explicitSave=details.querySelector('button[onclick*=\"saveLessonNote\"]');
  const autosave=details.querySelector('.mm-note-status');
  if(explicitSave){explicitSave.textContent='Save now';explicitSave.hidden=!!autosave}
"""
          new="""  const label=details.querySelector('[data-mm-simple-note-label]');
  const syncLabel=()=>{
    if(!label)return;
    const next=area.value.trim()?'Edit note':'Add note';
    if(label.textContent!==next)label.textContent=next;
  };
  syncLabel();
  if(area.dataset.mmSimpleNoteBound!=='1'){
    area.dataset.mmSimpleNoteBound='1';
    area.addEventListener('input',syncLabel);
  }
  const explicitSave=details.querySelector('button[onclick*=\"saveLessonNote\"]');
  const autosave=details.querySelector('.mm-note-status');
  if(explicitSave){
    if(explicitSave.textContent!=='Save now')explicitSave.textContent='Save now';
    const shouldHide=!!autosave;
    if(explicitSave.hidden!==shouldHide)explicitSave.hidden=shouldHide;
  }
"""
          if text.count(old)!=1:
              raise SystemExit('expected compactNotes observer-sensitive block not found exactly once')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check lesson-simple-experience.js
          node tools/generate_style_csp.cjs --check
          python3 qa_runtime_hardening.py
      - name: Commit observer-safe note disclosure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lesson-simple-experience.js
          git diff --cached --check
          git commit -m 'Make note disclosure observer-safe'
          git push origin HEAD:fix/tighter-mobile-lesson-flow
