<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101d">
  <meta name="description" content="MouldMaster Academy — guided injection moulding learning from beginner to expert.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./mouldmaster-192.png">
  <link rel="apple-touch-icon" href="./mouldmaster-192.png">
  <title>MouldMaster Academy</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08101d;color:#edf5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.boot{width:min(560px,92vw);padding:28px;border:1px solid #283b59;border-radius:18px;background:#101c2f;box-shadow:0 18px 46px rgba(0,0,0,.28)}.boot b{font-size:22px}.boot p{color:#a9bdd6;line-height:1.6}.bar{height:7px;background:#21324a;border-radius:99px;overflow:hidden}.bar i{display:block;width:45%;height:100%;background:#55d6be;border-radius:99px;animation:move 1.15s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
  </style>
</head>
<body>
  <main class="boot" id="mmBootstrap" aria-live="polite">
    <b>MouldMaster Academy</b>
    <p>Loading the current training content…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <script>
  (async function(){
    "use strict";
    const SHELL_RELEASE="2026.08.24.1";
    const CORE_URL="./MouldMaster_Core_App.html";
    const headAdd=[
      '<link rel="manifest" href="./manifest.webmanifest">',
      '<link rel="icon" type="image/png" sizes="192x192" href="./mouldmaster-192.png">',
      '<link rel="apple-touch-icon" href="./mouldmaster-192.png">',
      '<link rel="stylesheet" href="./reading-patch.css">',
      '<meta name="mm-shell-release" content="'+SHELL_RELEASE+'">'
    ].join("\n");
    const closeScript='</scr'+'ipt>';
    const bodyAdd=[
      '<script src="./reading-patch.js">'+closeScript,
      '<script src="./training-upgrade.js">'+closeScript,
      '<script src="./training-qa-fix.js">'+closeScript,
      '<script src="./assessment-100-pass.js">'+closeScript,
      '<script src="./assessment-deep-dive.js">'+closeScript,
      '<script src="./assessment-quality-suite.js">'+closeScript,
      '<script src="./assessment-stable-review-bridge.js">'+closeScript,
      '<script src="./assessment-analytics-ui.js">'+closeScript,
      '<script src="./source-library.js">'+closeScript,
      '<script src="./reference-data.js">'+closeScript,
      '<script src="./reference-deep-dive.js">'+closeScript,
      '<script src="./reference-research-extension.js">'+closeScript,
      '<script src="./reference-20x-extension.js">'+closeScript,
      '<script src="./reference-sources.js">'+closeScript,
      '<script src="./reference-browser-ui.js">'+closeScript,
      '<script src="./pwa-shell.js">'+closeScript
    ].join("\n");
    function assemble(html){
      let out=String(html||"");
      if(!out.includes('reading-patch.css')) out=out.replace(/<\/head>/i,headAdd+'\n</head>');
      if(!out.includes('training-upgrade.js')) out=out.replace(/<\/body>/i,bodyAdd+'\n</body>');
      return out;
    }
    async function getCore(){
      try{
        const r=await fetch(CORE_URL,{cache:"no-store"});
        if(r&&r.ok)return await r.text();
      }catch(_){ }
      if("caches" in window){
        const c=await caches.match(CORE_URL,{ignoreSearch:true});
        if(c)return await c.text();
      }
      throw new Error("Core training content is unavailable");
    }
    try{
      const html=assemble(await getCore());
      document.open();document.write(html);document.close();
    }catch(err){
      const box=document.getElementById("mmBootstrap");
      if(box)box.innerHTML='<b>MouldMaster could not finish loading</b><p>Connect to the internet once to install the current offline copy, then reopen the app.</p><button onclick="location.reload()" style="padding:10px 14px;border-radius:10px;border:1px solid #41658d;background:#1a2b45;color:#fff">Try again</button>';
      console.error("MouldMaster bootstrap failed",err);
    }
  })();
  </script>
</body>
</html>
