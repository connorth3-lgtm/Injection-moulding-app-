<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101d">
  <meta name="description" content="MouldMaster Academy — guided injection moulding learning from beginner to expert.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./mouldmaster-192.png">
  <link rel="apple-touch-icon" href="./mouldmaster-192.png">
  <title>MouldMaster Academy</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08101d;color:#edf5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.boot{width:min(560px,92vw);padding:28px;border:1px solid #283b59;border-radius:18px;background:#101c2f;box-shadow:0 18px 46px rgba(0,0,0,.28)}.boot b{font-size:22px}.boot p{color:#a9bdd6;line-height:1.6}.bar{height:7px;background:#21324a;border-radius:99px;overflow:hidden}.bar i{display:block;width:45%;height:100%;background:#55d6be;border-radius:99px;animation:move 1.15s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(120%)}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
  </style>
</head>
<body>
  <main class="boot" id="mmBootstrap" aria-live="polite">
    <b>MouldMaster Academy</b>
    <p>Loading the current training content…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <script>
  (async function(){
    "use strict";
    const SHELL_RELEASE="2026.08.24.1";
    const CORE_URL="./MouldMaster_Core_App.html";
    const HEAD_ASSETS=[
      ['manifest.webmanifest','<link rel="manifest" href="./manifest.webmanifest">'],
      ['rel="icon" type="image/png" sizes="192x192"','<link rel="icon" type="image/png" sizes="192x192" href="./mouldmaster-192.png">'],
      ['rel="apple-touch-icon"','<link rel="apple-touch-icon" href="./mouldmaster-192.png">'],
      ['reading-patch.css','<link rel="stylesheet" href="./reading-patch.css">'],
      ['mm-shell-release','<meta name="mm-shell-release" content="'+SHELL_RELEASE+'">']
    ];
    const BODY_SCRIPTS=[
      ['./reading-patch.js','<script src="./reading-patch.js">'],
      ['./training-upgrade.js','<script src="./training-upgrade.js">'],
      ['./training-qa-fix.js','<script src="./training-qa-fix.js">'],
      ['./assessment-100-pass.js','<script src="./assessment-100-pass.js">'],
      ['./assessment-deep-dive.js','<script src="./assessment-deep-dive.js">'],
      ['./assessment-answer-cue-fix.js','<script src="./assessment-answer-cue-fix.js">'],
      ['./assessment-storage-scope.js','<script src="./assessment-storage-scope.js">'],
      ['./assessment-quality-suite.js','<script src="./assessment-quality-suite.js">'],
      ['./assessment-stable-review-bridge.js','<script src="./assessment-stable-review-bridge.js">'],
      ['./assessment-analytics-ui.js','<script src="./assessment-analytics-ui.js">'],
      ['./assessment-final-hardening.js','<script src="./assessment-final-hardening.js">'],
      ['./assessment-ux.js','<script src="./assessment-ux.js">'],
      ['./source-library.js','<script src="./source-library.js">'],
      ['./reference-data.js','<script src="./reference-data.js">'],
      ['./reference-deep-dive.js','<script src="./reference-deep-dive.js">'],
      ['./reference-research-extension.js','<script src="./reference-research-extension.js">'],
      ['./reference-20x-extension.js','<script src="./reference-20x-extension.js">'],
      ['./reference-2026-expansion.js','<script src="./reference-2026-expansion.js">'],
      ['./reference-sources.js','<script src="./reference-sources.js">'],
      ['./reference-browser-ui.js','<script src="./reference-browser-ui.js">'],
      ['./diagnostic-learning-labs.js','<script src="./diagnostic-learning-labs.js">'],
      ['./pwa-shell.js','<script src="./pwa-shell.js">']
    ];
    const closeScript='</scr'+'ipt>';
    function ensureViewportFit(out){
      let found=false;
      out=out.replace(/<meta\b[^>]*\bname=["']viewport["'][^>]*>/i,tag=>{
        found=true;
        if(/viewport-fit\s*=\s*cover/i.test(tag))return tag;
        if(/\bcontent=["']/i.test(tag))return tag.replace(/\bcontent=(["'])(.*?)\1/i,(_m,q,value)=>`content=${q}${value},viewport-fit=cover${q}`);
        return tag.replace(/>$/, ' content="width=device-width,initial-scale=1,viewport-fit=cover">');
      });
      if(!found)out=out.replace(/<\/head>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n</head>');
      return out;
    }
    function assemble(html){
      let out=String(html||"");
      if(!/<\/head>/i.test(out)||!/<\/body>/i.test(out))throw new Error("Core training content is incomplete");
      out=ensureViewportFit(out);
      for(const [needle,markup] of HEAD_ASSETS){
        if(!out.includes(needle))out=out.replace(/<\/head>/i,markup+'\n</head>');
      }
      for(const [src,tag] of BODY_SCRIPTS){
        if(!out.includes(src))out=out.replace(/<\/body>/i,tag+closeScript+'\n</body>');
      }
      return out;
    }
    async function getCore(){
      try{
        const r=await fetch(CORE_URL,{cache:"no-store"});
        if(r&&r.ok)return await r.text();
      }catch(_){ }
      if("caches" in window){
        const c=await caches.match(CORE_URL,{ignoreSearch:true});
        if(c)return await c.text();
      }
      throw new Error("Core training content is unavailable");
    }
    try{
      const html=assemble(await getCore());
      document.open();document.write(html);document.close();
    }catch(err){
      const box=document.getElementById("mmBootstrap");
      if(box)box.innerHTML='<b>MouldMaster could not finish loading</b><p>Connect to the internet once to install the current offline copy, then reopen the app.</p><button onclick="location.reload()" style="padding:10px 14px;border-radius:10px;border:1px solid #41658d;background:#1a2b45;color:#fff">Try again</button>';
      console.error("MouldMaster bootstrap failed",err);
    }
  })();
  </script>
</body>
</html>
