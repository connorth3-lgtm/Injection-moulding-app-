<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Feed system pressure-loss locations</title><desc id="d">Conceptual flow path from machine nozzle through sprue, runner and gate to cavity, with potential restriction zones.</desc><rect width="900" height="430" fill="#fff"/><rect x="45" y="150" width="130" height="90" rx="12" fill="none" stroke="#111" stroke-width="4"/><text x="70" y="205" font-family="system-ui" font-size="21">Nozzle</text><path d="M175 195 H310" stroke="#111" stroke-width="22"/><path d="M310 195 H520" stroke="#111" stroke-width="12"/><path d="M520 195 H610" stroke="#111" stroke-width="6"/><rect x="610" y="115" width="235" height="160" rx="28" fill="none" stroke="#111" stroke-width="4"/><text x="345" y="170" font-family="system-ui" font-size="19">sprue / runner</text><text x="525" y="175" font-family="system-ui" font-size="18">gate</text><text x="690" y="200" font-family="system-ui" font-size="24">cavity</text><g font-family="system-ui" font-size="16"><text x="65" y="305">Compare controlled pressure observations by location.</text><text x="65" y="332">A high upstream demand does not identify the local cause by itself.</text><text x="65" y="359">Geometry, viscosity, temperature, shear history and flow rate interact.</text></g></svg>