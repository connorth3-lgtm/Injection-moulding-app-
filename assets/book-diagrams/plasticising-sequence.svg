<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Plasticising and shot preparation</title><desc id="d">Conceptual reciprocating screw sequence showing material feed, screw rotation and recovery, shot accumulation ahead of the screw, then forward injection.</desc><rect x="70" y="110" width="680" height="80" fill="none" stroke="currentColor"/><path d="M120 150h520" stroke="currentColor" stroke-width="12" stroke-dasharray="24 14"/><polygon points="750,110 840,150 750,190" fill="none" stroke="currentColor"/><text x="180" y="85" font-family="sans-serif">Feed / plasticise</text><text x="475" y="85" font-family="sans-serif">Screw rotates and recovers</text><text x="715" y="235" font-family="sans-serif">Prepared shot</text><path d="M650 230h-180" stroke="currentColor" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="currentColor"/></marker></defs></svg>