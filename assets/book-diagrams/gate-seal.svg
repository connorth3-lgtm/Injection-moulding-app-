<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Gate seal study</title><desc id="d">Conceptual plot of part response versus hold duration approaching a plateau.</desc><rect width="900" height="430" fill="#fff"/><line x1="90" y1="340" x2="835" y2="340" stroke="#111" stroke-width="2"/><line x1="90" y1="70" x2="90" y2="340" stroke="#111" stroke-width="2"/><path d="M105 310 C210 285 305 230 390 165 C480 110 570 105 810 104" fill="none" stroke="#111" stroke-width="6"/><line x1="540" y1="90" x2="540" y2="340" stroke="#777" stroke-dasharray="8 7"/><text x="560" y="130" font-family="system-ui" font-size="20">response plateau region</text><text x="340" y="392" font-family="system-ui" font-size="19">Hold duration</text><text x="18" y="55" font-family="system-ui" font-size="17">measured response</text><text x="125" y="365" font-family="system-ui" font-size="15">Use repeated measurements and critical-quality evidence; a plateau is system-specific, not a universal hold time.</text></svg>