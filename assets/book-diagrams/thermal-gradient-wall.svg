<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Thermal gradient through a moulded wall</title><desc id="d">Conceptual part cross-section showing cooler wall-adjacent layers and a hotter core, illustrating why wall thickness and heat-removal balance matter.</desc><rect x="190" y="70" width="520" height="150" fill="none" stroke="currentColor" stroke-width="3"/><rect x="210" y="90" width="480" height="110" fill="none" stroke="currentColor"/><rect x="285" y="110" width="330" height="70" fill="none" stroke="currentColor" stroke-dasharray="8 8"/><text x="450" y="145" text-anchor="middle" font-family="sans-serif">hotter core</text><text x="450" y="245" text-anchor="middle" font-family="sans-serif">cooler wall-adjacent regions</text><path d="M450 60v-35M450 230v35" stroke="currentColor"/><text x="450" y="290" text-anchor="middle" font-family="sans-serif">Heat leaves through both mould surfaces</text></svg>