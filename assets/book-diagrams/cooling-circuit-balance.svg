<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Cooling circuit balance</title><desc id="d">Conceptual mould section with two cooling circuits, inlet and outlet temperatures and an asymmetric hot region.</desc><rect width="900" height="460" fill="#fff"/><rect x="150" y="80" width="600" height="270" rx="18" fill="none" stroke="#111" stroke-width="4"/><path d="M210 150 H690 M690 150 Q730 150 730 190 V240 Q730 280 690 280 H210 Q170 280 170 240 V190 Q170 150 210 150" fill="none" stroke="#555" stroke-width="10"/><ellipse cx="585" cy="215" rx="95" ry="62" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="8 6"/><text x="520" y="220" font-family="system-ui" font-size="19">hotter region</text><text x="90" y="155" font-family="system-ui" font-size="18">inlet T, flow</text><text x="690" y="315" font-family="system-ui" font-size="18">outlet T</text><text x="160" y="395" font-family="system-ui" font-size="18">Interpret supply/return temperature, flow, pressure drop and cavity-side evidence together.</text><text x="160" y="420" font-family="system-ui" font-size="16">Equal controller setpoints do not prove equal local mould-surface temperature.</text></svg>