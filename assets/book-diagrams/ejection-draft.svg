<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d"><title id="t">Draft and ejection evidence</title><desc id="d">Conceptual moulded wall with draft angle and ejector force direction.</desc><rect width="900" height="450" fill="#fff"/><path d="M335 90 L300 315 H600 L565 90 Z" fill="none" stroke="#111" stroke-width="5"/><line x1="450" y1="315" x2="450" y2="390" stroke="#111" stroke-width="8"/><polygon points="450,405 430,375 470,375" fill="#111"/><path d="M335 110 L370 110" stroke="#777" stroke-width="3"/><path d="M335 110 Q348 145 345 175" fill="none" stroke="#777" stroke-width="3"/><text x="360" y="160" font-family="system-ui" font-size="18">draft angle</text><text x="475" y="385" font-family="system-ui" font-size="18">ejection force / motion</text><text x="145" y="55" font-family="system-ui" font-size="18">Use force/current trends, surface condition, cooling state and part damage together.</text><text x="150" y="430" font-family="system-ui" font-size="16">A rising ejector signal is evidence to investigate; it does not by itself prove inadequate draft.</text></svg>