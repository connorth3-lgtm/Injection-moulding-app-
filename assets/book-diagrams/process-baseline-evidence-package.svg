</g>
<g font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">
<text x="187" y="105">Identity + context</text><text x="187" y="132">material · machine · mould</text>
<text x="487" y="105">Commands</text><text x="487" y="132">documented requested state</text>
<text x="787" y="105">Actual signals</text><text x="787" y="132">what the process did</text>
