<rect x="70" y="70" width="235" height="80" rx="12"/><rect x="370" y="70" width="235" height="80" rx="12"/><rect x="670" y="70" width="235" height="80" rx="12"/>
<rect x="220" y="220" width="235" height="80" rx="12"/><rect x="525" y="220" width="235" height="80" rx="12"/>
