<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Uniform shrinkage versus differential warpage</title><desc id="d">Conceptual comparison between an evenly contracted flat part and a part bent by unequal shrinkage, orientation or cooling.</desc><rect x="90" y="90" width="260" height="100" fill="none" stroke="currentColor"/><rect x="120" y="110" width="200" height="60" fill="none" stroke="currentColor" stroke-dasharray="7 6"/><text x="220" y="225" text-anchor="middle" font-family="sans-serif">more uniform contraction</text><path d="M520 170 Q650 55 810 170" fill="none" stroke="currentColor" stroke-width="4"/><path d="M520 185 Q650 85 810 185" fill="none" stroke="currentColor" stroke-dasharray="7 6"/><text x="665" y="225" text-anchor="middle" font-family="sans-serif">differential deformation / warpage</text></svg>