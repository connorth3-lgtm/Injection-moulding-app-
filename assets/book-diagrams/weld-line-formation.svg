<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">Weld-line formation around an obstacle</title><desc id="d">Two conceptual melt fronts separate around an obstacle and meet downstream, forming an interface whose condition depends on local flow, temperature, gas and material history.</desc><rect x="70" y="70" width="760" height="180" fill="none" stroke="currentColor"/><circle cx="450" cy="160" r="48" fill="none" stroke="currentColor"/><path d="M100 160 C240 160 300 95 390 110" fill="none" stroke="currentColor" stroke-width="4"/><path d="M100 160 C240 160 300 225 390 210" fill="none" stroke="currentColor" stroke-width="4"/><path d="M505 112 C600 105 660 130 735 160" fill="none" stroke="currentColor" stroke-width="4"/><path d="M505 208 C600 215 660 190 735 160" fill="none" stroke="currentColor" stroke-width="4"/><line x1="735" y1="120" x2="735" y2="205" stroke="currentColor" stroke-dasharray="7 6"/><text x="760" y="220" font-family="sans-serif">meeting interface</text></svg>