<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">DOE interaction concept</title><desc id="d">Two non-parallel response lines across low and high levels of one factor, showing that the effect of one factor can depend on the level of another.</desc><line x1="120" y1="235" x2="790" y2="235" stroke="currentColor"/><line x1="120" y1="235" x2="120" y2="55" stroke="currentColor"/><path d="M220 190 L690 105" fill="none" stroke="currentColor" stroke-width="4"/><path d="M220 95 L690 165" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="9 6"/><text x="215" y="265" font-family="sans-serif">Factor A low</text><text x="640" y="265" font-family="sans-serif">Factor A high</text><text x="470" y="45" text-anchor="middle" font-family="sans-serif">Non-parallel lines indicate interaction</text></svg>